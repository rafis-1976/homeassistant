<!DOCTYPE html>
<html lang="es" data-theme="claro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TallerPro — Gestión de Herramientas (SQLite)</title>
<style>
/* ============ RESET & VARIABLES ============ */
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f4f6f9; --surface:#ffffff; --surface-2:#eef1f6; --border:#e2e6ee;
  --text:#151922; --text-2:#6b7280; --primary:#2563eb; --primary-h:#1d4ed8;
  --primary-soft:#e8f0fe; --success:#0f9d63; --success-soft:#e3f8ee;
  --warning:#d97706; --warning-soft:#fef4e3; --danger:#dc2626; --danger-soft:#fdeaea;
  --info:#0891b2; --info-soft:#e2f6fa;
  --radius:14px; --radius-sm:9px;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.05);
  --shadow-md:0 4px 14px rgba(16,24,40,.08);
  --shadow-lg:0 20px 50px rgba(16,24,40,.22);
}
[data-theme="oscuro"]{
  --bg:#0e1117; --surface:#171b23; --surface-2:#1f242e; --border:#2a313d;
  --text:#e8ebf0; --text-2:#9aa3b2; --primary:#4d84ff; --primary-h:#3b74f0;
  --primary-soft:#1c2740; --success:#2ecc8b; --success-soft:#123326;
  --warning:#f0a742; --warning-soft:#332512; --danger:#ff6b6b; --danger-soft:#3a1c1c;
  --info:#38bcd8; --info-soft:#123038;
  --shadow:0 1px 2px rgba(0,0,0,.5); --shadow-md:0 4px 14px rgba(0,0,0,.4);
  --shadow-lg:0 20px 50px rgba(0,0,0,.6);
}
html,body{height:100%}
body{
  font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg); color:var(--text); font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased; transition:background .25s,color .25s;
}
input,select,textarea,button{font-family:inherit;font-size:14px;color:inherit}
button{cursor:pointer;border:none;background:none}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:20px}
::-webkit-scrollbar-track{background:transparent}

/* ============ LOADER ============ */
#loader{
  position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:18px;z-index:1000;
}
.spinner{
  width:48px;height:48px;border:4px solid var(--border);border-top-color:var(--primary);
  border-radius:50%;animation:spin .9s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
#loader h2{font-size:18px;font-weight:700;letter-spacing:-.3px}
#loader p{font-size:13px;color:var(--text-2);max-width:320px;text-align:center}
#loader.err .spinner{border-top-color:var(--danger);animation:none;border-color:var(--danger-soft)}
#loader.err h2{color:var(--danger)}

/* ============ LAYOUT ============ */
.app{display:flex;min-height:100vh}
.sidebar{
  width:252px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);
  display:flex;flex-direction:column;padding:18px 14px;gap:4px;
  position:sticky;top:0;height:100vh;z-index:60;transition:transform .25s;
}
.brand{display:flex;align-items:center;gap:11px;padding:6px 8px 18px;border-bottom:1px solid var(--border);margin-bottom:12px}
.brand-icon{
  width:40px;height:40px;border-radius:11px;display:grid;place-items:center;font-size:20px;
  background:linear-gradient(135deg,var(--primary),#7c3aed);color:#fff;flex-shrink:0;
  box-shadow:0 4px 12px rgba(37,99,235,.35);
}
.brand h1{font-size:16px;font-weight:700;letter-spacing:-.3px}
.brand p{font-size:12px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.nav{display:flex;flex-direction:column;gap:3px;flex:1}
.nav-item{
  display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:var(--radius-sm);
  color:var(--text-2);font-weight:500;font-size:14px;text-align:left;transition:.15s;width:100%;
}
.nav-item:hover{background:var(--surface-2);color:var(--text)}
.nav-item.active{background:var(--primary-soft);color:var(--primary);font-weight:600}
.nav-item .ico{font-size:17px;width:20px;text-align:center}
.nav-item .badge{margin-left:auto;background:var(--danger);color:#fff;font-size:11px;font-weight:700;
  padding:1px 7px;border-radius:20px;min-width:20px;text-align:center}
.sidebar-footer{padding-top:12px;border-top:1px solid var(--border);font-size:11.5px;color:var(--text-2);text-align:center}
.db-badge{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;
  padding:2px 8px;border-radius:20px;background:var(--success-soft);color:var(--success);
  margin-top:8px;letter-spacing:.3px}
.db-badge::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;
  animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  display:flex;align-items:center;gap:14px;padding:14px 26px;
  background:var(--surface);border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:50;
}
.hamburger{display:none;font-size:20px;padding:6px 10px;border-radius:8px;background:var(--surface-2)}
.topbar h2{font-size:19px;font-weight:700;letter-spacing:-.4px}
.topbar .sub{font-size:12.5px;color:var(--text-2);margin-top:1px}
.topbar-actions{margin-left:auto;display:flex;gap:8px;align-items:center}
.view{padding:24px 26px 60px;flex:1;max-width:1500px;width:100%}

/* ============ COMPONENTES ============ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:9px 15px;border-radius:var(--radius-sm);font-weight:600;font-size:13.5px;
  background:var(--surface-2);color:var(--text);transition:.15s;white-space:nowrap;
  border:1px solid transparent;
}
.btn:hover{filter:brightness(.96)}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--primary);color:#fff;box-shadow:0 2px 8px rgba(37,99,235,.28)}
.btn-primary:hover{background:var(--primary-h);filter:none}
.btn-ghost{background:transparent;border:1px solid var(--border)}
.btn-ghost:hover{background:var(--surface-2);filter:none}
.btn-danger{background:var(--danger-soft);color:var(--danger)}
.btn-success{background:var(--success-soft);color:var(--success)}
.btn-sm{padding:6px 10px;font-size:12.5px;border-radius:8px}
.btn-icon{padding:7px;width:32px;height:32px;border-radius:8px;background:transparent;color:var(--text-2)}
.btn-icon:hover{background:var(--surface-2);color:var(--text)}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-pad{padding:18px}
.card-title{font-size:14px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:20px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px 17px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.stat::after{content:'';position:absolute;inset:0 auto 0 0;width:4px;background:var(--accent,var(--primary))}
.stat-label{font-size:12.5px;color:var(--text-2);font-weight:500;display:flex;align-items:center;gap:6px}
.stat-value{font-size:27px;font-weight:750;margin-top:5px;letter-spacing:-1px;line-height:1.1}
.stat-sub{font-size:11.5px;color:var(--text-2);margin-top:3px}

/* Toolbar */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:18px}
.search{position:relative;flex:1;min-width:200px;max-width:380px}
.search input{
  width:100%;padding:10px 14px 10px 38px;border-radius:var(--radius-sm);
  border:1px solid var(--border);background:var(--surface);outline:none;transition:.15s;
}
.search input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.search .ico{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--text-2);font-size:14px}
select.filter{
  padding:10px 12px;border-radius:var(--radius-sm);border:1px solid var(--border);
  background:var(--surface);outline:none;cursor:pointer;transition:.15s;max-width:170px;
}
select.filter:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}

/* Grid herramientas */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:14px}
.tool{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px;box-shadow:var(--shadow);transition:.18s;display:flex;flex-direction:column;gap:11px;
  position:relative;
}
.tool:hover{box-shadow:var(--shadow-md);transform:translateY(-2px);border-color:var(--primary)}
.tool-top{display:flex;gap:11px;align-items:flex-start}
.tool-ico{
  width:42px;height:42px;border-radius:11px;display:grid;place-items:center;font-size:20px;
  background:var(--surface-2);flex-shrink:0;
}
.tool-name{font-weight:650;font-size:14.5px;line-height:1.3;letter-spacing:-.2px;word-break:break-word}
.tool-meta{font-size:12px;color:var(--text-2);margin-top:2px}
.tool-body{display:flex;flex-wrap:wrap;gap:6px;font-size:12px}
.chip{
  display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;
  background:var(--surface-2);color:var(--text-2);font-size:11.5px;font-weight:550;
}
.badge-est{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;
  font-size:11.5px;font-weight:650;white-space:nowrap}
.badge-est::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
.est-disponible{background:var(--success-soft);color:var(--success)}
.est-prestada{background:var(--info-soft);color:var(--info)}
.est-averiada{background:var(--danger-soft);color:var(--danger)}
.tool-actions{display:flex;gap:6px;flex-wrap:wrap;padding-top:11px;border-top:1px solid var(--border);margin-top:auto}
.tool-actions .btn{flex:1;min-width:0}

/* Lista / préstamos */
.list{display:flex;flex-direction:column;gap:11px}
.row{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:14px 16px;box-shadow:var(--shadow);display:flex;gap:14px;align-items:center;flex-wrap:wrap;
}
.row-main{flex:1;min-width:190px}
.row-title{font-weight:650;font-size:14.5px}
.row-sub{font-size:12.5px;color:var(--text-2);margin-top:2px}
.row-actions{display:flex;gap:7px;flex-wrap:wrap}

/* Vacío */
.empty{text-align:center;padding:60px 20px;color:var(--text-2)}
.empty .em{font-size:44px;margin-bottom:12px;opacity:.6}
.empty h3{font-size:16px;color:var(--text);margin-bottom:5px;font-weight:650}
.empty p{font-size:13.5px;max-width:400px;margin:0 auto 18px}

/* Alertas */
.alert{
  display:flex;gap:11px;align-items:flex-start;padding:12px 14px;border-radius:var(--radius-sm);
  font-size:13.5px;margin-bottom:9px;border:1px solid transparent;
}
.alert-w{background:var(--warning-soft);color:var(--warning);border-color:rgba(217,119,6,.2)}
.alert-d{background:var(--danger-soft);color:var(--danger);border-color:rgba(220,38,38,.2)}
.alert-i{background:var(--info-soft);color:var(--info);border-color:rgba(8,145,178,.2)}
.alert b{font-weight:700}

/* Barras dashboard */
.bar-row{display:flex;align-items:center;gap:11px;margin-bottom:9px;font-size:13px}
.bar-label{width:110px;flex-shrink:0;color:var(--text-2);font-weight:500;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-track{flex:1;height:9px;background:var(--surface-2);border-radius:20px;overflow:hidden}
.bar-fill{height:100%;border-radius:20px;background:var(--primary);transition:width .5s ease}
.bar-val{width:34px;text-align:right;font-weight:650;font-size:12.5px;color:var(--text-2)}

/* Formularios */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-grid label{display:flex;flex-direction:column;gap:6px;font-size:12.5px;font-weight:600;color:var(--text-2)}
.form-grid label.full{grid-column:1/-1}
.form-grid input,.form-grid select,.form-grid textarea{
  padding:10px 12px;border-radius:var(--radius-sm);border:1px solid var(--border);
  background:var(--surface);outline:none;transition:.15s;font-weight:400;font-size:14px;color:var(--text);
  width:100%;
}
.form-grid input:focus,.form-grid select:focus,.form-grid textarea:focus{
  border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft);
}
.form-grid textarea{resize:vertical;min-height:60px}
.form-grid .hint{font-size:11.5px;font-weight:400;color:var(--text-2)}

/* Modal */
.overlay{
  position:fixed;inset:0;background:rgba(10,14,22,.55);backdrop-filter:blur(3px);
  display:none;align-items:center;justify-content:center;z-index:200;padding:20px;
}
.overlay.open{display:flex;animation:fade .18s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{
  background:var(--surface);border-radius:18px;width:100%;max-width:560px;max-height:90vh;
  display:flex;flex-direction:column;box-shadow:var(--shadow-lg);animation:pop .2s;
  border:1px solid var(--border);
}
@keyframes pop{from{transform:scale(.95) translateY(10px);opacity:0}to{transform:none;opacity:1}}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;
  border-bottom:1px solid var(--border)}
.modal-head h3{font-size:16px;font-weight:700;letter-spacing:-.3px}
.modal-body{padding:22px;overflow-y:auto}
.modal-foot{display:flex;gap:9px;justify-content:flex-end;padding:16px 22px;border-top:1px solid var(--border)}

/* Toast */
.toasts{position:fixed;bottom:22px;right:22px;z-index:300;display:flex;flex-direction:column;gap:9px}
.toast{
  background:var(--text);color:var(--bg);padding:12px 17px;border-radius:11px;font-size:13.5px;
  font-weight:600;box-shadow:var(--shadow-lg);animation:slide .25s;display:flex;align-items:center;gap:9px;
  max-width:340px;
}
@keyframes slide{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
.toast.err{background:var(--danger);color:#fff}
.toast.ok{background:var(--success);color:#fff}

/* Tabs */
.tabs{display:flex;gap:5px;background:var(--surface-2);padding:4px;border-radius:11px;margin-bottom:18px;width:fit-content}
.tab{padding:7px 15px;border-radius:8px;font-size:13.5px;font-weight:600;color:var(--text-2);transition:.15s}
.tab.active{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}

/* Ubicaciones */
.loc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.loc{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:15px;
  box-shadow:var(--shadow);display:flex;align-items:center;gap:12px}
.loc-ico{width:38px;height:38px;border-radius:10px;background:var(--primary-soft);display:grid;
  place-items:center;font-size:18px;flex-shrink:0}
.loc-info{flex:1;min-width:0}
.loc-name{font-weight:650;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.loc-count{font-size:12px;color:var(--text-2)}

.section-title{font-size:15px;font-weight:700;margin:26px 0 13px;display:flex;align-items:center;gap:8px}
.section-title:first-child{margin-top:0}

/* Responsive */
@media(max-width:900px){
  .sidebar{position:fixed;left:0;top:0;transform:translateX(-100%);box-shadow:var(--shadow-lg)}
  .sidebar.open{transform:none}
  .hamburger{display:block}
  .view{padding:18px 15px 70px}
  .topbar{padding:12px 15px}
  .form-grid{grid-template-columns:1fr}
  .grid{grid-template-columns:1fr}
  .toasts{left:15px;right:15px;bottom:15px}
  .toast{max-width:none}
}
.backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:55}
.backdrop.open{display:block}
</style>
</head>
<body>

<!-- LOADER -->
<div id="loader">
  <div class="spinner"></div>
  <h2 id="loaderTitle">Cargando base de datos SQLite…</h2>
  <p id="loaderMsg">Inicializando motor SQL en el navegador (sql.js / WebAssembly).</p>
</div>

<div class="app" id="app" style="display:none">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-icon">🛠️</div>
      <div style="min-width:0">
        <h1>TallerPro</h1>
        <p id="brandSub">Mi Taller</p>
      </div>
    </div>
    <nav class="nav" id="nav">
      <button class="nav-item active" data-view="dashboard"><span class="ico">📊</span> Panel</button>
      <button class="nav-item" data-view="herramientas"><span class="ico">🔧</span> Herramientas</button>
      <button class="nav-item" data-view="prestamos"><span class="ico">🤝</span> Préstamos<span class="badge" id="navBadge" style="display:none">0</span></button>
      <button class="nav-item" data-view="ubicaciones"><span class="ico">📍</span> Ubicaciones</button>
      <button class="nav-item" data-view="ajustes"><span class="ico">⚙️</span> Ajustes</button>
    </nav>
    <div class="sidebar-footer">
      TallerPro · v2.0<br>
      <span class="db-badge" id="dbBadge">SQLite activo</span>
    </div>
  </aside>
  <div class="backdrop" id="backdrop"></div>

  <main class="main">
    <header class="topbar">
      <button class="hamburger" id="hamburger">☰</button>
      <div>
        <h2 id="viewTitle">Panel</h2>
        <div class="sub" id="viewSub">Resumen de tu taller</div>
      </div>
      <div class="topbar-actions">
        <button class="btn btn-ghost btn-sm" id="btnTheme" title="Cambiar tema">🌙</button>
        <button class="btn btn-primary" id="btnNueva">＋ Nueva herramienta</button>
      </div>
    </header>
    <div class="view" id="view"></div>
  </main>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-head">
      <h3 id="modalTitle">Título</h3>
      <button class="btn-icon" id="modalClose">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot">
      <button class="btn btn-ghost" id="modalCancel">Cancelar</button>
      <button class="btn btn-primary" id="modalSave">Guardar</button>
    </div>
  </div>
</div>

<div class="toasts" id="toasts"></div>

<!-- SQL.js (SQLite en WebAssembly) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.min.js"></script>

<script>
/* ============================================================
   TallerPro v2.0 — SQLite (sql.js) + sin mantenimiento
   ============================================================ */

/* ---------- Utilidades ---------- */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const uid = (p = 'id') => p + '_' + Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hoy = () => new Date().toISOString().slice(0, 10);
const addDays = (f, n) => { const d = new Date(f + 'T00:00:00'); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); };
const diasHasta = f => Math.round((new Date(f + 'T00:00:00') - new Date(hoy() + 'T00:00:00')) / 86400000);
const fmtFecha = f => f ? new Date(f + 'T00:00:00').toLocaleDateString('es-ES', { day: '2-digit', month: 'short', year: 'numeric' }) : '—';
const fmtMoney = n => new Intl.NumberFormat('es-ES', { style: 'currency', currency: 'EUR', maximumFractionDigits: 2 }).format(n || 0);
const num = v => { const n = parseFloat(v); return isNaN(n) ? 0 : n; };

const ESTADOS = {
  disponible: { label: 'Disponible', cls: 'est-disponible' },
  prestada:   { label: 'Prestada',   cls: 'est-prestada' },
  averiada:   { label: 'Averiada',   cls: 'est-averiada' }
};
const ICONOS_CAT = {
  'Manuales':'🔨','Eléctricas':'⚡','Medición':'📏','Automoción':'🚗','Jardinería':'🌿',
  'Fijación':'🔩','Seguridad':'🦺','Soldadura':'🔥','Neumática':'💨','Pintura':'🎨','Otros':'🧰'
};
const iconoCat = c => ICONOS_CAT[c] || '🧰';

/* ---------- Estado global ---------- */
let db = null;
let currentView = 'dashboard';
let filtros = { q: '', cat: '', est: '', ubi: '', orden: 'nombre' };
let tabPrestamos = 'activos';
let ajustes = { taller: 'Mi Taller', tema: 'claro' };
const LS_DATA = 'tallerpro_sqlite_v2';
const LS_CFG  = 'tallerpro_cfg_v2';

/* ============================================================
   MOTOR SQL — helpers
   ============================================================ */
function dbRun(sql, params = []) {
  const stmt = db.prepare(sql);
  try { stmt.bind(params); stmt.step(); }
  finally { stmt.free(); }
  scheduleSave();
}
function dbAll(sql, params = []) {
  const stmt = db.prepare(sql);
  try {
    stmt.bind(params);
    const rows = [];
    while (stmt.step()) rows.push(stmt.getAsObject());
    return rows;
  } finally { stmt.free(); }
}
function dbGet(sql, params = []) { return dbAll(sql, params)[0] || null; }
function dbExec(sql) { db.exec(sql); scheduleSave(); }

/* Persistencia en localStorage (base64 de la BD) */
let saveTimer = null;
function scheduleSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(persistDB, 250);
}
function persistDB() {
  try {
    const data = db.export();          // Uint8Array
    let s = '';
    const chunk = 0x8000;
    for (let i = 0; i < data.length; i += chunk)
      s += String.fromCharCode.apply(null, data.subarray(i, i + chunk));
    localStorage.setItem(LS_DATA, btoa(s));
  } catch (e) {
    console.warn('No se pudo guardar la BD', e);
    toast('Aviso: no se pudo guardar la base de datos', 'err');
  }
}
function loadPersisted() {
  const b64 = localStorage.getItem(LS_DATA);
  if (!b64) return null;
  try {
    const bin = atob(b64);
    const u8 = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
    return u8;
  } catch (e) { console.warn('BD guardada corrupta', e); return null; }
}

// Devuelve herramientas junto con su préstamo activo (si lo hay)
const SQL_HERR_CON_PRESTAMO = `
SELECT h.*,
       p.id             AS p_id,
       p.persona        AS p_persona,
       p.telefono       AS p_telefono,
       p.fecha_prestamo AS p_fecha,
       p.fecha_prevista AS p_fecha_prevista,
       p.notas          AS p_notas
FROM herramientas h
LEFT JOIN prestamos p ON p.herramienta_id = h.id AND p.activo = 1
`;

function mapHerramienta(row) {
  if (!row) return null;
  return {
    id: row.id,
    nombre: row.nombre,
    categoria: row.categoria,
    marca: row.marca,
    modelo: row.modelo,
    serie: row.serie,
    cantidad: row.cantidad,
    precio: row.precio,
    fechaCompra: row.fecha_compra,
    ubicacion: row.ubicacion,
    estado: row.estado,
    notas: row.notas,
    creado: row.creado,
    prestamo: row.p_id ? {
      id: row.p_id,
      persona: row.p_persona,
      telefono: row.p_telefono,
      fecha: row.p_fecha,
      fechaPrevista: row.p_fecha_prevista,
      notas: row.p_notas
    } : null
  };
}

const getH = id => mapHerramienta(dbGet(SQL_HERR_CON_PRESTAMO + ' WHERE h.id = ?', [id]));
const listH = () => dbAll(SQL_HERR_CON_PRESTAMO + ' ORDER BY h.nombre COLLATE NOCASE').map(mapHerramienta);
const activos = () => dbAll(SQL_HERR_CON_PRESTAMO + ' WHERE p.id IS NOT NULL ORDER BY p.fecha_prevista').map(mapHerramienta);

`);

function renderHerramientas() {

  const where = [];
  const params = [];
  if (filtros.q) {
    where.push(`(h.nombre LIKE ? OR h.marca LIKE ? OR h.modelo LIKE ? OR h.serie LIKE ? OR h.notas LIKE ?)`);
    const like = '%' + filtros.q + '%';
    params.push(like, like, like, like, like);
  }
  if (filtros.cat) { where.push('h.categoria = ?'); params.push(filtros.cat); }
  if (filtros.ubi) { where.push('h.ubicacion = ?'); params.push(filtros.ubi); }
  if (filtros.est) {
    if (filtros.est === 'prestada') where.push('p.id IS NOT NULL');
    else if (filtros.est === 'disponible') where.push("p.id IS NULL AND h.estado = 'disponible'");
    else if (filtros.est === 'averiada')    where.push("h.estado = 'averiada'");
  }
  const orderMap = {
    nombre:   'h.nombre COLLATE NOCASE ASC',

    precio:   'h.precio DESC',
    categoria:'h.categoria COLLATE NOCASE ASC, h.nombre COLLATE NOCASE ASC'
  };
  const orderSQL = orderMap[filtros.orden] || orderMap.nombre;

  const sql = SQL_HERR_CON_PRESTAMO
    + (where.length ? ' WHERE ' + where.join(' AND ') : '')
    + ' ORDER BY ' + orderSQL;
  const list = dbAll(sql, params).map(mapHerramienta);

    return;
  }

  cont.innerHTML = `<div class="grid">${list.map(cardHerramienta).join('')}</div>`;
  bindFiltros();
}

function cardHerramienta(h) {
  const est = h.prestamo ? 'prestada' : (h.estado === 'averiada' ? 'averiada' : 'disponible');
  const venc = h.prestamo && h.prestamo.fechaPrevista && diasHasta(h.prestamo.fechaPrevista) < 0;

  return `
  <div class="tool">
    <div class="tool-top">
      <div class="tool-ico">${iconoCat(h.categoria)}</div>
      <div style="flex:1;min-width:0">
        <div class="tool-name">${esc(h.nombre)}</div>
        <div class="tool-meta">${[h.marca, h.modelo].filter(Boolean).map(esc).join(' · ') || esc(h.categoria)}</div>
      </div>
    </div>
    <div class="tool-body">
      <span class="badge-est ${ESTADOS[est].cls}">${ESTADOS[est].label}</span>
      ${h.ubicacion ? `<span class="chip">📍 ${esc(h.ubicacion)}</span>` : ''}
      ${(num(h.cantidad) || 1) > 1 ? `<span class="chip">×${h.cantidad}</span>` : ''}
      ${num(h.precio) > 0 ? `<span class="chip">${fmtMoney(h.precio)}</span>` : ''}
    </div>
    ${h.prestamo ? `
      <div style="background:var(--info-soft);color:var(--info);padding:9px 12px;border-radius:9px;font-size:12.5px">
        <b>${esc(h.prestamo.persona)}</b>${h.prestamo.telefono ? ' · ' + esc(h.prestamo.telefono) : ''}<br>
        <span style="${venc ? 'color:var(--danger);font-weight:700' : ''}">
          Devolución: ${fmtFecha(h.prestamo.fechaPrevista)}${venc ? ` (${Math.abs(diasHasta(h.prestamo.fechaPrevista))}d de retraso)` : ''}
        </span>
      </div>` : ''}
    ${h.notas ? `<div style="font-size:12.5px;color:var(--text-2);font-style:italic">${esc(h.notas)}</div>` : ''}
    <div class="tool-actions">
      ${h.prestamo
        ? `<button class="btn btn-sm btn-success" onclick="devolver('${h.id}')">↩️ Devolver</button>`
        : `<button class="btn btn-sm btn-primary" onclick="prestar('${h.id}')">🤝 Prestar</button>`}
      <button class="btn btn-sm btn-ghost" onclick="editarHerramienta('${h.id}')">✏️ Editar</button>
      <button class="btn btn-sm btn-ghost" onclick="verDetalle('${h.id}')" title="Detalle">ℹ️</button>
      <button class="btn btn-sm btn-ghost" onclick="eliminarHerramienta('${h.id}')" title="Eliminar" style="color:var(--danger)">🗑️</button>
    </div>
  </div>`;
}

function bindFiltros() {
  const q = $('#f-q');
  if (q) {
    q.oninput = e => {
      filtros.q = e.target.value;
      clearTimeout(window._tq);
      window._tq = setTimeout(() => {
        const pos = e.target.selectionStart;
        render();
        const nq = $('#f-q'); if (nq) { nq.focus(); nq.setSelectionRange(pos, pos); }
      }, 220);
    };
  }
  const bind = (id, key) => { const el = $(id); if (el) el.onchange = e => { filtros[key] = e.target.value; render(); }; };
  bind('#f-cat', 'cat'); bind('#f-est', 'est'); bind('#f-ubi', 'ubi'); bind('#f-orden', 'orden');
  const cl = $('#f-clear');
  if (cl) cl.onclick = () => { filtros = { q: '', cat: '', est: '', ubi: '', orden: filtros.orden }; render(); };
}

/* ============================================================
   FORMULARIO HERRAMIENTA
   ============================================================ */
function formHerramienta(h = {}) {
  const prestada = !!h.prestamo;
  return `
  <div class="form-grid">
    <label class="full">Nombre de la herramienta *
      <input id="f-nombre" value="${esc(h.nombre || '')}" placeholder="Ej: Taladro percutor 18V" maxlength="80">
    </label>
    <label>Categoría
      <input id="f-categoria" list="dl-categorias" value="${esc(h.categoria || '')}" placeholder="Eléctricas">
    </label>
    <label>Ubicación
      <input id="f-ubicacion" list="dl-ubicaciones" value="${esc(h.ubicacion || '')}" placeholder="Estantería A">
    </label>
    <label>Marca
      <input id="f-marca" value="${esc(h.marca || '')}" placeholder="Bosch">
    </label>
    <label>Modelo
      <input id="f-modelo" value="${esc(h.modelo || '')}" placeholder="GSB 18V-55">
    </label>
    <label>Nº de serie / referencia
      <input id="f-serie" value="${esc(h.serie || '')}" placeholder="Opcional">

      <input id="f-fechaCompra" type="date" value="${esc(h.fechaCompra || '')}">
    </label>

      <select id="f-estado" ${prestada ? 'disabled' : ''}>
        <option value="disponible" ${(!prestada && (h.estado || 'disponible') === 'disponible') ? 'selected' : ''}>Disponible</option>
        <option value="averiada" ${(!prestada && h.estado === 'averiada') ? 'selected' : ''}>Averiada</option>
        ${prestada ? '<option value="prestada" selected>Prestada</option>' : ''}
      </select>
      ${prestada ? '<span class="hint">Prestada a ' + esc(h.prestamo.persona) + ' — devuélvela para cambiar el estado</span>' : ''}
    </label>
    <label class="full">Notas
      <textarea id="f-notas" rows="3" placeholder="Accesorios, observaciones, ubicación exacta...">${esc(h.notas || '')}</textarea>

function leerFormulario(h) {
  const nombre = $('#f-nombre').value.trim();
  if (!nombre) { toast('El nombre es obligatorio', 'err'); return null; }
  const cat = ($('#f-categoria').value.trim()) || 'Otros';
  const ubi = $('#f-ubicacion').value.trim();
  dbRun('INSERT OR IGNORE INTO categorias (nombre) VALUES (?)', [cat]);
  if (ubi) dbRun('INSERT OR IGNORE INTO ubicaciones (nombre) VALUES (?)', [ubi]);
  return {
    nombre,
    categoria: cat,
    marca: $('#f-marca').value.trim(),
    modelo: $('#f-modelo').value.trim(),
    serie: $('#f-serie').value.trim(),
    cantidad: Math.max(1, parseInt($('#f-cantidad').value) || 1),
    precio: num($('#f-precio').value),
    fechaCompra: $('#f-fechaCompra').value,
    ubicacion: ubi,
    estado: h.prestamo ? h.estado : $('#f-estado').value,
    notas: $('#f-notas').value.trim()
  };
}

function nuevaHerramienta() {
  showModal({
    title: 'Nueva herramienta',
    body: formHerramienta({ cantidad: 1, estado: 'disponible' }),
    saveText: 'Añadir al inventario',
    onSave: () => {
      const datos = leerFormulario({});
      if (!datos) return false;
      const id = uid('h');
      dbRun(`INSERT INTO herramientas
        (id,nombre,categoria,marca,modelo,serie,cantidad,precio,fecha_compra,ubicacion,estado,notas,creado)
        VALUES (?,?,?,?,?,?,?,?,?,?,?,?,?)`,
        [id, datos.nombre, datos.categoria, datos.marca, datos.modelo, datos.serie,
         datos.cantidad, datos.precio, datos.fechaCompra, datos.ubicacion, datos.estado,
         datos.notas, Date.now()]);
      log('alta', `Añadida «${datos.nombre}» al inventario`);
      render(); toast('Herramienta añadida');
    }
  });
}

function editarHerramienta(id) {
  const h = getH(id);
  if (!h) return;
  showModal({
    title: 'Editar herramienta',
    body: formHerramienta(h),
    saveText: 'Guardar cambios',
    onSave: () => {
      const d = leerFormulario(h);
      if (!d) return false;
      dbRun(`UPDATE herramientas SET
        nombre=?, categoria=?, marca=?, modelo=?, serie=?, cantidad=?, precio=?,
        fecha_compra=?, ubicacion=?, estado=?, notas=? WHERE id=?`,
        [d.nombre, d.categoria, d.marca, d.modelo, d.serie, d.cantidad, d.precio,
         d.fechaCompra, d.ubicacion, d.estado, d.notas, id]);
      log('edicion', `Editada «${d.nombre}»`);
      render(); toast('Cambios guardados');
    }
  });
}

function eliminarHerramienta(id) {
  const h = getH(id);
  if (!h) return;
  showModal({
    title: 'Eliminar herramienta',
    body: `<p style="font-size:14.5px;line-height:1.6">¿Seguro que quieres eliminar <b>${esc(h.nombre)}</b> del inventario?</p>

    saveText: 'Sí, eliminar',
    onSave: () => {
      dbRun('DELETE FROM herramientas WHERE id = ?', [id]);
      log('baja', `Eliminada «${h.nombre}»`);
      render(); toast('Herramienta eliminada');
    }

}

/* ============================================================
   DETALLE DE HERRAMIENTA
   ============================================================ */
function verDetalle(id) {
  const h = getH(id);
  if (!h) return;
  const est = h.prestamo ? 'prestada' : (h.estado === 'averiada' ? 'averiada' : 'disponible');

  // Historial de préstamos (devueltos)
  const historial = dbAll(`
    SELECT * FROM prestamos WHERE herramienta_id = ? AND activo = 0
    ORDER BY fecha_devolucion DESC, fecha_prestamo DESC
  `, [id]);

  const body = `
    <div style="display:flex;gap:14px;align-items:center;margin-bottom:18px">
      <div class="tool-ico" style="width:54px;height:54px;font-size:26px">${iconoCat(h.categoria)}</div>
      <div style="flex:1;min-width:0">
        <div style="font-size:17px;font-weight:700;letter-spacing:-.3px">${esc(h.nombre)}</div>
        <div style="color:var(--text-2);font-size:13px">${[h.marca, h.modelo].filter(Boolean).map(esc).join(' · ') || esc(h.categoria)}</div>
      </div>
      <span class="badge-est ${ESTADOS[est].cls}">${ESTADOS[est].label}</span>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:11px;font-size:13.5px">
      ${filaDetalle('Categoría', h.categoria)}
      ${filaDetalle('Ubicación', h.ubicacion || '—')}
      ${filaDetalle('Nº de serie', h.serie || '—')}
      ${filaDetalle('Cantidad', h.cantidad || 1)}
      ${filaDetalle('Precio', num(h.precio) ? fmtMoney(h.precio) : '—')}
      ${filaDetalle('Fecha de compra', h.fechaCompra ? fmtFecha(h.fechaCompra) : '—')}
    </div>

    ${h.notas ? `<div style="margin-top:15px;padding:12px 14px;background:var(--surface-2);border-radius:10px;font-size:13px;color:var(--text-2)">${esc(h.notas)}</div>` : ''}

    ${h.prestamo ? `
      <div class="section-title" style="font-size:13.5px;margin-top:20px">🤝 Préstamo activo</div>
      <div style="background:var(--info-soft);color:var(--info);padding:13px 15px;border-radius:10px;font-size:13px;line-height:1.7">
        <b>${esc(h.prestamo.persona)}</b>${h.prestamo.telefono ? ' · ' + esc(h.prestamo.telefono) : ''}<br>
        Prestada el ${fmtFecha(h.prestamo.fecha)} · Devolución prevista: ${fmtFecha(h.prestamo.fechaPrevista)}
        ${h.prestamo.notas ? '<br><i>' + esc(h.prestamo.notas) + '</i>' : ''}
      </div>` : ''}

    <div class="section-title" style="font-size:13.5px;margin-top:20px">📜 Historial de préstamos (${historial.length})</div>
    ${historial.length ? historial.map(p => `
      <div style="padding:10px 0;border-bottom:1px solid var(--border);font-size:13px">
        <div style="display:flex;justify-content:space-between;gap:10px">
          <b>${esc(p.persona)}</b>
          <span style="color:var(--text-2);font-size:12.5px">Devuelto: ${fmtFecha(p.fecha_devolucion)}</span>
        </div>
        <div style="color:var(--text-2);margin-top:2px">Prestado ${fmtFecha(p.fecha_prestamo)}${p.fecha_prevista ? ' → Previsto ' + fmtFecha(p.fecha_prevista) : ''}${p.retraso ? ' · <span style="color:var(--danger)">' + p.retraso + ' días de retraso</span>' : ''}</div>
        ${p.notas ? `<div style="color:var(--text-2);font-style:italic;margin-top:2px">${esc(p.notas)}</div>` : ''}
      </div>`).join('') : '<p style="color:var(--text-2);font-size:13px">Sin préstamos registrados</p>'}
  `;

  showModal({
    title: 'Detalle de herramienta',
    body,
    saveText: 'Editar',
    onSave: () => { setTimeout(() => editarHerramienta(id), 50); return true; }

function filaDetalle(k, v) {
  return `<div style="background:var(--surface-2);padding:9px 12px;border-radius:9px">
    <div style="font-size:11px;color:var(--text-2);font-weight:600;text-transform:uppercase;letter-spacing:.4px">${esc(k)}</div>
    <div style="font-weight:600;margin-top:2px">${esc(v)}</div>
  </div>`;
}

/* ============================================================
   PRÉSTAMOS
   ============================================================ */
function prestar(id) {
  const h = getH(id);
  if (!h) return;
  if (h.prestamo) { toast('Ya está prestada', 'err'); return; }
  showModal({
    title: 'Prestar: ' + h.nombre,
    body: `
      <div class="form-grid">
        <label class="full">Persona que lo lleva *
          <input id="p-persona" placeholder="Nombre y apellidos" maxlength="60">
        </label>
        <label>Teléfono de contacto
          <input id="p-tel" placeholder="Opcional">
        </label>
        <label>Fecha de devolución prevista
          <input id="p-fecha" type="date" value="${addDays(hoy(), 7)}">
        </label>
        <label class="full">Notas
          <textarea id="p-notas" rows="2" placeholder="Para qué lo necesita, en qué estado se lleva..."></textarea>
        </label>
      </div>`,
    saveText: 'Registrar préstamo',
    onSave: () => {
      const persona = $('#p-persona').value.trim();
      if (!persona) { toast('Indica el nombre de la persona', 'err'); return false; }
      dbRun(`INSERT INTO prestamos
        (id, herramienta_id, persona, telefono, fecha_prestamo, fecha_prevista, fecha_devolucion, retraso, notas, activo)
        VALUES (?,?,?,?,?,?,'',0,?,1)`,
        [uid('p'), id, persona, $('#p-tel').value.trim(), hoy(),
         $('#p-fecha').value || addDays(hoy(), 7), $('#p-notas').value.trim()]);
      log('prestamo', `«${h.nombre}» prestada a ${persona}`);
      render(); toast('Préstamo registrado');
    }
  });
}

function devolver(id) {
  const h = getH(id);
  if (!h || !h.prestamo) return;
  const p = h.prestamo;
  const retraso = p.fechaPrevista ? diasHasta(p.fechaPrevista) : 0;
  showModal({
    title: 'Devolver herramienta',
    body: `
      <p style="font-size:14.5px;margin-bottom:14px">Registrar la devolución de <b>${esc(h.nombre)}</b> por parte de <b>${esc(p.persona)}</b>.</p>
      ${retraso < 0 ? `<div class="alert alert-d"><span>⏰</span><div>Devolución con <b>${Math.abs(retraso)} días</b> de retraso respecto a la fecha prevista.</div></div>` : ''}
      <div class="form-grid">
        <label class="full">Estado en que se devuelve
          <select id="d-estado">
            <option value="disponible">Correcto — disponible</option>
            <option value="averiada">Averiada</option>
          </select>
        </label>
        <label class="full">Observaciones
          <textarea id="d-notas" rows="2" placeholder="Opcional"></textarea>
        </label>
      </div>`,
    saveText: 'Confirmar devolución',
    onSave: () => {
      const nuevoEstado = $('#d-estado').value;
      const obs = $('#d-notas').value.trim();
      dbRun(`UPDATE prestamos SET
        activo = 0, fecha_devolucion = ?, retraso = ?,
        notas = CASE WHEN ? <> '' THEN ? ELSE notas END
        WHERE id = ?`,
        [hoy(), retraso < 0 ? Math.abs(retraso) : 0, obs, obs, p.id]);
      dbRun('UPDATE herramientas SET estado = ? WHERE id = ?', [nuevoEstado, id]);
      log('devolucion', `«${h.nombre}» devuelta por ${p.persona}${obs ? ' — ' + obs : ''}`);
      render(); toast('Devolución registrada');
    }
  });
}

function renderPrestamos() {
  const act = activos();
  const hist = getHistPrest();

  $('#view').innerHTML = `
    <div class="tabs">
      <button class="tab ${tabPrestamos === 'activos' ? 'active' : ''}" data-tab="activos">Activos (${act.length})</button>
      <button class="tab ${tabPrestamos === 'historial' ? 'active' : ''}" data-tab="historial">Historial (${hist.length})</button>
    </div>
    <div id="prest-body"></div>
  `;

  $$('.tab').forEach(t => t.onclick = () => { tabPrestamos = t.dataset.tab; renderPrestamos(); });

  const body = $('#prest-body');

  if (tabPrestamos === 'activos') {
    if (!act.length) {
      body.innerHTML = `<div class="empty"><div class="em">🤝</div><h3>No hay préstamos activos</h3><p>Todas tus herramientas están en el taller. Cuando prestes alguna, aparecerá aquí con su fecha de devolución.</p></div>`;
      return;
    }
    body.innerHTML = `<div class="list">${act.map(h => {
      const d = h.prestamo.fechaPrevista ? diasHasta(h.prestamo.fechaPrevista) : null;
      const venc = d !== null && d < 0;
      const proximo = d !== null && d >= 0 && d <= 3;
      return `
      <div class="row" style="${venc ? 'border-color:var(--danger)' : proximo ? 'border-color:var(--warning)' : ''}">
        <div class="tool-ico">${iconoCat(h.categoria)}</div>
        <div class="row-main">
          <div class="row-title">${esc(h.nombre)}</div>
          <div class="row-sub">
            <b>${esc(h.prestamo.persona)}</b>${h.prestamo.telefono ? ' · ' + esc(h.prestamo.telefono) : ''}
            · Prestada el ${fmtFecha(h.prestamo.fecha)}
          </div>
          <div class="row-sub" style="${venc ? 'color:var(--danger);font-weight:700' : proximo ? 'color:var(--warning);font-weight:700' : ''}">
            ${venc ? `⏰ Vencida hace ${Math.abs(d)} días (${fmtFecha(h.prestamo.fechaPrevista)})`
                   : d === 0 ? '📅 Devolución prevista para hoy'
                   : `📅 Devolución prevista: ${fmtFecha(h.prestamo.fechaPrevista)} (en ${d} días)`}
          </div>
          ${h.prestamo.notas ? `<div class="row-sub" style="font-style:italic">${esc(h.prestamo.notas)}</div>` : ''}
        </div>
        <div class="row-actions">
          <button class="btn btn-sm btn-success" onclick="devolver('${h.id}')">↩️ Devolver</button>
          <button class="btn btn-sm btn-ghost" onclick="verDetalle('${h.id}')">ℹ️</button>
        </div>
      </div>`;
    }).join('')}</div>`;
  } else {
    if (!hist.length) {
      body.innerHTML = `<div class="empty"><div class="em">📜</div><h3>Sin historial todavía</h3><p>Aquí se registrarán todas las devoluciones con sus fechas y observaciones.</p></div>`;
      return;
    }
    body.innerHTML = `<div class="list">${hist.map(p => `
      <div class="row">
        <div class="tool-ico" style="background:var(--success-soft)">↩️</div>
        <div class="row-main">
          <div class="row-title">${esc(p.herramienta || '(eliminada)')}</div>
          <div class="row-sub"><b>${esc(p.persona)}</b> · Prestada ${fmtFecha(p.fecha_prestamo)} → Devuelta ${fmtFecha(p.fecha_devolucion)}</div>
          ${p.retraso ? `<div class="row-sub" style="color:var(--danger)">⏰ Con ${p.retraso} días de retraso</div>` : ''}
          ${p.notas ? `<div class="row-sub" style="font-style:italic">${esc(p.notas)}</div>` : ''}
        </div>
        <div class="row-actions">
          <button class="btn btn-sm btn-ghost" onclick="borrarHistorial('${p.id}')" title="Eliminar registro" style="color:var(--danger)">🗑️</button>
        </div>
      </div>`).join('')}</div>`;
  }
}

function borrarHistorial(id) {
  dbRun('DELETE FROM prestamos WHERE id = ? AND activo = 0', [id]);
  renderPrestamos(); toast('Registro eliminado');
}

/* ============================================================
   UBICACIONES Y CATEGORÍAS
   ============================================================ */
function renderUbicaciones() {
  const cats = dbAll(`
    SELECT c.nombre AS nombre,
           (SELECT COUNT(*) FROM herramientas h WHERE h.categoria = c.nombre) AS n
    FROM categorias c ORDER BY c.nombre COLLATE NOCASE
  `);
  const ubis = dbAll(`
    SELECT u.nombre AS nombre,
           (SELECT COUNT(*) FROM herramientas h WHERE h.ubicacion = u.nombre) AS n
    FROM ubicaciones u ORDER BY u.nombre COLLATE NOCASE
  `);
  const sinUbi = dbGet("SELECT COUNT(*) AS c FROM herramientas WHERE ubicacion = '' OR ubicacion IS NULL").c;

  $('#view').innerHTML = `
    <div class="section-title">📍 Ubicaciones de almacenamiento
      <button class="btn btn-sm btn-primary" style="margin-left:auto" onclick="nuevaUbicacion()">＋ Añadir ubicación</button>
    </div>
    ${ubis.length ? `<div class="loc-grid">${ubis.map(u => `
      <div class="loc">
        <div class="loc-ico">📍</div>
        <div class="loc-info">
          <div class="loc-name">${esc(u.nombre)}</div>
          <div class="loc-count">${u.n} herramienta(s)</div>
        </div>
        <button class="btn-icon" onclick="editarUbicacion('${esc(u.nombre).replace(/'/g, "\\'")}')" title="Renombrar">✏️</button>
        <button class="btn-icon" onclick="borrarUbicacion('${esc(u.nombre).replace(/'/g, "\\'")}')" title="Eliminar" style="color:var(--danger)">🗑️</button>
      </div>`).join('')}</div>`
    : '<p style="color:var(--text-2);font-size:13.5px">No hay ubicaciones definidas.</p>'}

    ${sinUbi ? `<div class="alert alert-i" style="margin-top:16px"><span>ℹ️</span><div>Hay <b>${sinUbi}</b> herramienta(s) sin ubicación asignada. Edítalas para asignarles un sitio.</div></div>` : ''}

    </div>
    <div class="loc-grid">
      ${cats.map(c => `
        <div class="loc">
          <div class="loc-ico">${iconoCat(c.nombre)}</div>

            <div class="loc-name">${esc(c.nombre)}</div>

        </div>`).join('')}
    </div>
  `;
}

function nuevaUbicacion() {
  showModal({
    title: 'Nueva ubicación',
    body: `<div class="form-grid"><label class="full">Nombre de la ubicación
      <input id="u-nombre" placeholder="Ej: Estantería C, Caja roja, Pared sur..."></label></div>`,
    saveText: 'Añadir',
    onSave: () => {
      const n = $('#u-nombre').value.trim();
      if (!n) { toast('Escribe un nombre', 'err'); return false; }
      const ex = dbGet('SELECT 1 AS x FROM ubicaciones WHERE nombre = ?', [n]);
      if (ex) { toast('Ya existe esa ubicación', 'err'); return false; }
      dbRun('INSERT INTO ubicaciones (nombre) VALUES (?)', [n]);
      render(); toast('Ubicación añadida');
    }
  });
}
function editarUbicacion(antigua) {
  showModal({
    title: 'Renombrar ubicación',
    body: `<div class="form-grid"><label class="full">Nuevo nombre
      <input id="u-nombre" value="${esc(antigua)}"></label></div>`,
    saveText: 'Guardar',
    onSave: () => {
      const n = $('#u-nombre').value.trim();
      if (!n) { toast('Escribe un nombre', 'err'); return false; }
      dbExec('BEGIN');
      dbRun('UPDATE ubicaciones SET nombre = ? WHERE nombre = ?', [n, antigua]);
      dbRun('UPDATE herramientas SET ubicacion = ? WHERE ubicacion = ?', [n, antigua]);
      dbExec('COMMIT');
      render(); toast('Ubicación renombrada');
    }
  });
}
function borrarUbicacion(nombre) {
  const n = dbGet('SELECT COUNT(*) AS c FROM herramientas WHERE ubicacion = ?', [nombre]).c;
  showModal({
    title: 'Eliminar ubicación',
    body: `<p style="font-size:14.5px">¿Eliminar la ubicación <b>${esc(nombre)}</b>?</p>
           ${n ? `<div class="alert alert-w" style="margin-top:12px"><span>⚠️</span><div>${n} herramienta(s) quedarán sin ubicación asignada.</div></div>` : ''}`,
    saveText: 'Eliminar',
    onSave: () => {
      dbExec('BEGIN');
      dbRun('DELETE FROM ubicaciones WHERE nombre = ?', [nombre]);
      dbRun('UPDATE herramientas SET ubicacion = ? WHERE ubicacion = ?', ['', nombre]);
      dbExec('COMMIT');
      render(); toast('Ubicación eliminada');
    }
  });
}

/* ---------- Exportar / Importar ---------- */
function descargar(nombre, contenido, tipo) {
  const blob = contenido instanceof Blob ? contenido : new Blob([contenido], { type: tipo });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = nombre;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function exportarSQLite() {
  const data = db.export();
  descargar(`tallerpro_${hoy()}.sqlite`, new Blob([data], { type: 'application/x-sqlite3' }));
  toast('Base de datos exportada');
}
function exportarSQL() {
  const tablas = ['categorias','ubicaciones','herramientas','prestamos','actividad'];
  let out = '-- TallerPro SQL dump\n-- ' + new Date().toISOString() + '\n\n';
  out += SCHEMA.replace(/CREATE INDEX[^;]+;/g, '').trim() + '\n\n';
  tablas.forEach(t => {
    const rows = dbAll(`SELECT * FROM ${t}`);
    if (!rows.length) return;
    out += `-- Datos de ${t}\n`;
    rows.forEach(r => {
      const cols = Object.keys(r);
      const vals = cols.map(c => {
        const v = r[c];
        if (v === null || v === undefined) return 'NULL';
        if (typeof v === 'number') return String(v);
        return "'" + String(v).replace(/'/g, "''") + "'";
      });
      out += `INSERT INTO ${t} (${cols.join(',')}) VALUES (${vals.join(',')});\n`;
    });
    out += '\n';
  });
  descargar(`tallerpro_${hoy()}.sql`, out, 'application/sql');
  toast('Dump SQL exportado');
}
function exportarCSV() {
  const rows = dbAll(SQL_HERR_CON_PRESTAMO + ' ORDER BY h.nombre COLLATE NOCASE');
  const cab = ['Nombre','Categoría','Marca','Modelo','Nº Serie','Cantidad','Precio','Fecha compra','Ubicación','Estado','Prestada a','Devolución prevista','Notas'];
  const filas = rows.map(r => {
    const m = mapHerramienta(r);
    const est = m.prestamo ? 'prestada' : (m.estado === 'averiada' ? 'averiada' : 'disponible');
    return [m.nombre, m.categoria, m.marca, m.modelo, m.serie, m.cantidad, m.precio, m.fechaCompra,
            m.ubicacion, est, m.prestamo ? m.prestamo.persona : '', m.prestamo ? m.prestamo.fechaPrevista : '', m.notas];
  });
  const csv = [cab, ...filas].map(f => f.map(c => `"${String(c ?? '').replace(/"/g, '""')}"`).join(';')).join('\r\n');
  descargar(`inventario_${hoy()}.csv`, '\uFEFF' + csv, 'text/csv;charset=utf-8');
  toast('CSV exportado');
}
function importarSQLite(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const u8 = new Uint8Array(ev.target.result);
      // Comprobación básica de cabecera SQLite: "SQLite format 3\0"
      const cab = new TextDecoder().decode(u8.slice(0, 15));
      if (!cab.startsWith('SQLite format 3')) throw new Error('No es un archivo SQLite válido');
      showModal({
        title: 'Confirmar importación',
        body: `<p style="font-size:14.5px">Se reemplazará toda la base de datos actual por el archivo <b>${esc(file.name)}</b>.</p>
               <div class="alert alert-w" style="margin-top:12px"><span>⚠️</span><div>Esta acción no se puede deshacer.</div></div>`,
        saveText: 'Importar y reemplazar',
        onSave: () => {
          const nuevo = new SQL.Database(u8);
          db.close();
          db = nuevo;
          // Asegurar que las tablas existen
          db.exec(SCHEMA);
          persistDB();
          render(); toast('Base de datos importada correctamente');
        }
      });
    } catch (err) {
      toast('Error al importar: ' + err.message, 'err');
    }
    e.target.value = '';
  };
  reader.readAsArrayBuffer(file);
}

    saveText: 'Sí, borrar todo',

document.addEventListener('keydown', e => {

    const q = $('#f-q'); if (q) q.focus();
  }
});

/* ============================================================
   INICIALIZACIÓN
   ============================================================ */
async function init() {
  try {
    if (typeof initSqlJs !== 'function') throw new Error('No se pudo cargar sql.js (comprueba tu conexión a internet)');

    $('#loaderMsg').textContent = 'Inicializando motor SQLite…';
    const SQL = await initSqlJs({
      locateFile: f => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/${f}`
    });

    $('#loaderMsg').textContent = 'Abriendo base de datos…';
    const persisted = loadPersisted();
    db = persisted ? new SQL.Database(persisted) : new SQL.Database();

    // Asegurar esquema (por si la BD guardada es antigua o vacía)
    db.exec(SCHEMA);

    // Cargar ajustes
    try {
      const cfg = JSON.parse(localStorage.getItem(LS_CFG) || '{}');
      ajustes = { ...ajustes, ...cfg };
    } catch {}

    // Sembrar si está vacía
    seedIfEmpty();

    // Mostrar app
    $('#loader').style.display = 'none';
    $('#app').style.display = '';
    render();

    // Guardar al cerrar
    window.addEventListener('beforeunload', () => { try { persistDB(); } catch {} });

  } catch (err) {
    console.error(err);
    $('#loader').classList.add('err');
    $('#loaderTitle').textContent = 'Error al iniciar SQLite';
    $('#loaderMsg').innerHTML = esc(err.message) +
      '<br><br>Esta aplicación necesita conexión a internet la primera vez para descargar <b>sql.js</b> desde el CDN.' +
      '<br><br><button class="btn btn-primary" onclick="location.reload()" style="margin-top:8px">Reintentar</button>';
  }
}

init();
