  <main>
    <div class="tabs" id="tabs"></div>
    <div id="content"></div>

    <!-- ===== DATOS TÉCNICOS ===== -->
    <section id="td-section" class="td-section">
      <div class="td-head">
        <h2>📁 Datos técnicos</h2>
        <p class="td-sub">Documentos, datos y enlaces guardados en tu cuenta.</p>
      </div>

      <form id="td-form" class="td-form" autocomplete="off">
        <div class="td-row">
          <label>Tipo
            <select id="td-type">
              <option value="documento">📄 Documento</option>
              <option value="dato">🔧 Dato técnico</option>
              <option value="enlace">🔗 Enlace</option>
            </select>
          </label>

          <label>Vehículo / etiqueta
            <input id="td-tag" list="td-tags" placeholder="Ej. Seat León · 1234ABC">
            <datalist id="td-tags"></datalist>
          </label>

          <label class="td-grow">Título *
            <input id="td-title" required placeholder="Ej. Manual del propietario">
          </label>
        </div>

        <div class="td-row" id="td-field-dato" hidden>
          <label class="td-grow">Valor / dato *
            <input id="td-value" placeholder="Ej. Presión neumáticos: 2,3 bar delante / 2,1 detrás">
          </label>
        </div>

        <div class="td-row" id="td-field-enlace" hidden>
          <label class="td-grow">URL *
            <input id="td-url" type="url" placeholder="https://...">
          </label>
        </div>

        <div class="td-row" id="td-field-documento" hidden>
          <label class="td-grow">Archivo * (máx. 20 MB)
            <input id="td-file" type="file">
          </label>
        </div>

        <div class="td-row">
          <label class="td-grow">Notas (opcional)
            <input id="td-notes" placeholder="Descripción breve">
          </label>
        </div>

        <div class="td-actions">
          <button type="submit" class="btn primary" id="td-submit">Guardar</button>
          <span id="td-status" class="td-status"></span>
        </div>
      </form>

      <div id="td-list" class="td-list"></div>
    </section>
    <!-- ===== /DATOS TÉCNICOS ===== -->
  </main>
