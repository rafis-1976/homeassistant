<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi Garaje</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<script>window.process=window.process||{env:{}};</script>
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<link rel="stylesheet" href="styles.css">
<script defer src="config.js"></script>
<script defer src="app.js"></script>
<script defer src="technical.js"></script>
</head>
<body>

<div id="app-view" hidden>
  <header>
    <div class="header-in">
      <div class="logo"><span class="mark">🚗</span> Mi Garaje</div>
      <div class="header-actions">
        <div class="user-chip"><span id="user-email">—</span></div>
        <button class="btn ghost sm" id="btn-logout">Salir</button>
        <button class="btn primary" id="btn-add-vehicle">＋ Añadir vehículo</button>
      </div>
    </div>
  </header>
  <main>
    <div class="tabs" id="tabs"></div>
    <div id="content"></div>

    <!-- ===== DATOS TÉCNICOS ===== -->
    <section id="td-section" class="td-section">
      <div class="td-head">
        <h2>📁 Datos técnicos</h2>
        <p class="td-sub">Documentos, datos y enlaces guardados en tu cuenta.</p>
      </div>

      <form id="td-form" class="td-form" autocomplete="off">
        <div class="td-row">
          <label>Tipo
            <select id="td-type">
              <option value="documento">📄 Documento</option>
              <option value="dato">🔧 Dato técnico</option>
              <option value="enlace">🔗 Enlace</option>
            </select>
          </label>

          <label>Vehículo / etiqueta
            <input id="td-tag" list="td-tags" placeholder="Ej. Seat León · 1234ABC">
            <datalist id="td-tags"></datalist>
          </label>

          <label class="td-grow">Título *
            <input id="td-title" required placeholder="Ej. Manual del propietario">
          </label>
        </div>

        <div class="td-row" id="td-field-dato" hidden>
          <label class="td-grow">Valor / dato *
            <input id="td-value" placeholder="Ej. Presión neumáticos: 2,3 bar delante / 2,1 detrás">
          </label>
        </div>

        <div class="td-row" id="td-field-enlace" hidden>
          <label class="td-grow">URL *
            <input id="td-url" type="url" placeholder="https://...">
          </label>
        </div>

        <div class="td-row" id="td-field-documento" hidden>
          <label class="td-grow">Archivo * (máx. 20 MB)
            <input id="td-file" type="file">
          </label>
        </div>

        <div class="td-row">
          <label class="td-grow">Notas (opcional)
            <input id="td-notes" placeholder="Descripción breve">
          </label>
        </div>

        <div class="td-actions">
          <button type="submit" class="btn primary" id="td-submit">Guardar</button>
          <span id="td-status" class="td-status"></span>
        </div>
      </form>

      <div id="td-list" class="td-list"></div>
    </section>
    <!-- ===== /DATOS TÉCNICOS ===== -->
  </main>
  <footer class="site">Los datos se guardan en tu cuenta de Supabase.</footer>
</div>

<div id="modal"></div>

</body>
</html>
