<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi Garaje — Control de mantenimiento</title>
<script>window.process = window.process || { env: {} };</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<style>
:root{
  --bg:#f4f6fa; --card:#ffffff; --text:#131a2b; --muted:#68738a;
  --border:#e2e7f0; --accent:#2563eb; --accent-dark:#1d4ed8;
  --ok:#16a34a; --ok-bg:#e8f7ee;
  --warn:#b45309; --warn-bg:#fef3c7;
  --danger:#dc2626; --danger-bg:#fee2e2;
  --radius:14px;
  --shadow:0 1px 2px rgba(16,24,40,.05), 0 12px 28px -16px rgba(16,24,40,.25);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0e1420; --card:#161e2e; --text:#e8edf7; --muted:#93a0b8;
    --border:#26314a; --accent:#3b82f6; --accent-dark:#2563eb;
    --ok:#4ade80; --ok-bg:#14301f;
    --warn:#fbbf24; --warn-bg:#3a2c0a;
    --danger:#f87171; --danger-bg:#3b1414;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 28px -16px rgba(0,0,0,.7);
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:var(--bg); color:var(--text); line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{margin:0;line-height:1.25}
button{font:inherit;cursor:pointer}
input,select,textarea{
  font:inherit;padding:10px 12px;border:1px solid var(--border);border-radius:10px;
  background:var(--card);color:var(--text);width:100%;
}
input[type=file]{padding:8px 10px;font-size:.82rem;cursor:pointer}
input[type=file]::file-selector-button{
  font:inherit;font-size:.8rem;font-weight:600;
  padding:6px 12px;margin-right:10px;
  border:1px solid var(--border);border-radius:8px;
  background:var(--bg);color:var(--text);cursor:pointer;
}
input[type=checkbox]{width:auto}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
label{display:flex;flex-direction:column;gap:6px;font-size:.78rem;font-weight:700;color:var(--muted);letter-spacing:.02em;text-transform:uppercase}

header{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--border)}
.header-in{max-width:1180px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.15rem;letter-spacing:-.02em}
.logo .mark{
  width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:1.1rem;
  background:linear-gradient(135deg,var(--accent),#7c3aed);color:#fff;
}
.header-actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.user-chip{
  display:flex;align-items:center;gap:8px;padding:5px 10px;border-radius:999px;
  background:var(--bg);border:1px solid var(--border);font-size:.8rem;font-weight:600;color:var(--muted);
  max-width:220px;
}
.user-chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

main{max-width:1180px;margin:0 auto;padding:22px 20px 60px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.section{margin-bottom:20px}
.section-head{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.section-head h2{font-size:1.05rem}
.section-head .spacer{margin-left:auto}

.btn{
  border:1px solid transparent;border-radius:10px;padding:9px 14px;font-weight:600;font-size:.88rem;
  display:inline-flex;align-items:center;gap:7px;transition:.15s;white-space:nowrap;
  background:var(--card);color:var(--text);border-color:var(--border);
}
.btn:hover{transform:translateY(-1px)}
.btn:disabled{opacity:.55;cursor:not-allowed;transform:none}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.primary:hover{background:var(--accent-dark)}
.btn.ghost{background:transparent;border-color:var(--border);color:var(--muted)}
.btn.ghost:hover{color:var(--text);border-color:var(--muted)}
.btn.danger{background:transparent;border-color:var(--border);color:var(--danger)}
.btn.danger:hover{background:var(--danger-bg);border-color:var(--danger)}
.btn.sm{padding:6px 10px;font-size:.8rem}
.btn.tiny{padding:4px 9px;font-size:.74rem;border-radius:8px}
.icon-btn{
  border:none;background:transparent;color:var(--muted);border-radius:8px;width:30px;height:30px;
  display:grid;place-items:center;font-size:.95rem;
}
.icon-btn:hover{background:var(--bg);color:var(--text)}

.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:18px}
.tab{
  border:1px solid var(--border);background:var(--card);border-radius:12px;padding:10px 16px;
  display:flex;flex-direction:column;gap:2px;min-width:150px;text-align:left;transition:.15s;
}
.tab:hover{border-color:var(--accent)}
.tab.active{border-color:var(--accent);background:var(--accent);color:#fff}
.tab.active .tab-sub{color:rgba(255,255,255,.8)}
.tab-name{font-weight:700;font-size:.92rem}
.tab-sub{font-size:.74rem;color:var(--muted);font-weight:600}

.vehicle-head{padding:20px;display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap}
.plate{
  background:#fff;color:#111;border:2px solid #111;border-radius:8px;padding:6px 12px 6px 8px;
  font-weight:800;letter-spacing:.06em;font-size:1rem;display:inline-flex;align-items:center;gap:8px;
  font-family:ui-monospace,"SFMono-Regular",Menlo,monospace;
}
.plate::before{content:"";display:block;width:8px;height:22px;border-radius:2px;background:#003399}
@media (prefers-color-scheme: dark){ .plate{border-color:#cbd5e1} }
.vehicle-title{flex:1;min-width:220px}
.vehicle-title h2{font-size:1.35rem;letter-spacing:-.02em}
.vehicle-meta{color:var(--muted);font-size:.86rem;margin-top:4px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.dot{width:4px;height:4px;border-radius:50%;background:var(--muted);display:inline-block}
.km-box{text-align:right}
.km-box .big{font-size:1.5rem;font-weight:800;letter-spacing:-.02em}
.km-box .lbl{font-size:.74rem;color:var(--muted);text-transform:uppercase;font-weight:700;letter-spacing:.04em}

.docs{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.doc{border:1px solid var(--border);border-radius:12px;padding:14px;background:var(--card);position:relative;overflow:hidden}
.doc .name{font-size:.74rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.doc .date{font-size:1.15rem;font-weight:700;margin-top:6px}
.doc .sub{font-size:.78rem;margin-top:6px;font-weight:600}
.doc.ok .sub{color:var(--ok)}
.doc.warn{border-color:var(--warn)}
.doc.warn .sub{color:var(--warn)}
.doc.danger{border-color:var(--danger)}
.doc.danger .sub{color:var(--danger)}
.doc .bar{position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--border)}
.doc.ok .bar{background:var(--ok)}
.doc.warn .bar{background:var(--warn)}
.doc.danger .bar{background:var(--danger)}
.doc .actions{margin-top:10px;display:flex;gap:6px;flex-wrap:wrap}
.doc .no-file{font-size:.72rem;color:var(--muted);font-style:italic;margin-top:10px}
.doc .doc-extra{
  margin-top:10px;padding-top:10px;border-top:1px dashed var(--border);
  display:flex;flex-direction:column;gap:4px;font-size:.78rem;color:var(--text);
  font-weight:600;letter-spacing:0;text-transform:none;
}
.doc .doc-extra .lbl{color:var(--muted);font-weight:700;font-size:.72rem;text-transform:uppercase;letter-spacing:.03em;margin-right:4px}
.doc .doc-actions{
  margin-top:10px;padding-top:10px;border-top:1px dashed var(--border);
  display:flex;gap:6px;flex-wrap:wrap;
}

.hist-item{
  display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;
  padding:12px 0;border-bottom:1px dashed var(--border);
}
.hist-item:last-child{border-bottom:none}
.hist-item .hist-info{display:flex;flex-direction:column;gap:2px;font-size:.85rem}
.hist-item .hist-line{color:var(--muted);font-size:.78rem}
.hist-item .hist-line strong{color:var(--text)}
.hist-item .hist-actions{display:flex;gap:4px}
.hist-empty{text-align:center;padding:30px 20px;color:var(--muted);font-size:.85rem}
.hist-total{text-align:right;margin-top:12px;padding-top:12px;border-top:1px solid var(--border);font-size:.85rem;color:var(--muted)}
.hist-total strong{color:var(--text);font-size:1rem}

.alert{
  display:flex;gap:10px;align-items:center;padding:11px 14px;border-radius:11px;font-size:.87rem;
  font-weight:600;margin-bottom:8px;border:1px solid transparent;
}
.alert.warn{background:var(--warn-bg);color:var(--warn);border-color:color-mix(in srgb,var(--warn) 30%,transparent)}
.alert.danger{background:var(--danger-bg);color:var(--danger);border-color:color-mix(in srgb,var(--danger) 30%,transparent)}
.alert.info{background:var(--ok-bg);color:var(--ok);border-color:color-mix(in srgb,var(--ok) 30%,transparent)}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{border:1px solid var(--border);border-radius:12px;padding:14px;background:var(--card)}
.stat .k{font-size:.74rem;text-transform:uppercase;font-weight:800;letter-spacing:.05em;color:var(--muted)}
.stat .v{font-size:1.35rem;font-weight:800;letter-spacing:-.02em;margin-top:4px}

.expense-breakdown{
  margin-top:12px;padding:12px 14px;border-radius:12px;
  background:var(--bg);border:1px solid var(--border);
  display:flex;gap:20px;flex-wrap:wrap;font-size:.85rem;
}
.expense-breakdown .exp-item{display:flex;align-items:center;gap:6px}
.expense-breakdown .exp-lbl{color:var(--muted);font-weight:600}
.expense-breakdown strong{font-weight:800;letter-spacing:-.01em}

.table-wrap{overflow-x:auto;border-radius:var(--radius)}
table{width:100%;border-collapse:collapse;font-size:.88rem;min-width:720px}
thead th{
  text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);
  padding:12px 14px;border-bottom:1px solid var(--border);font-weight:800;background:var(--bg);
}
tbody td{padding:12px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--bg)}
.tag{
  display:inline-block;padding:3px 9px;border-radius:999px;font-size:.74rem;font-weight:700;
  background:var(--bg);border:1px solid var(--border);color:var(--text);
}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:.72rem;font-weight:800}
.badge.ok{background:var(--ok-bg);color:var(--ok)}
.badge.warn{background:var(--warn-bg);color:var(--warn)}
.badge.danger{background:var(--danger-bg);color:var(--danger)}
.badge.muted{background:var(--bg);color:var(--muted);border:1px solid var(--border)}
.muted{color:var(--muted)}
.row-actions{display:flex;gap:4px;justify-content:flex-end}

.empty{text-align:center;padding:70px 24px}
.empty .emoji{font-size:3.2rem}
.empty h2{margin:14px 0 8px}
.empty p{color:var(--muted);max-width:440px;margin:0 auto 22px}

.overlay{
  position:fixed;inset:0;background:rgba(10,15,25,.55);backdrop-filter:blur(3px);
  display:flex;align-items:flex-start;justify-content:center;padding:24px 16px;z-index:100;
  overflow-y:auto;animation:fade .15s ease;
}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{
  background:var(--card);border-radius:16px;width:100%;max-width:760px;box-shadow:0 24px 60px -12px rgba(0,0,0,.5);
  animation:pop .18s ease;margin:auto;
}
@keyframes pop{from{transform:translateY(10px) scale(.98);opacity:0}to{transform:none;opacity:1}}
.modal-head{display:flex;align-items:center;gap:12px;padding:18px 20px;border-bottom:1px solid var(--border)}
.modal-head h3{font-size:1.05rem;flex:1}
.modal-body{padding:20px;display:flex;flex-direction:column;gap:16px}
.modal-body h4{
  font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);
  margin-top:6px;padding-bottom:6px;border-bottom:1px dashed var(--border);
}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:16px 20px;border-top:1px solid var(--border)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:560px){ .grid2,.grid3{grid-template-columns:1fr} }
.hint{font-size:.76rem;color:var(--muted);font-weight:500;text-transform:none;letter-spacing:0}

footer.site{text-align:center;color:var(--muted);font-size:.78rem;padding:0 20px 40px}

.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  background:#111827;color:#fff;padding:11px 18px;border-radius:10px;
  font-size:.86rem;font-weight:600;z-index:200;box-shadow:0 12px 30px rgba(0,0,0,.35);
  animation:pop .2s ease;max-width:90%;
}
.toast.ok{background:#16a34a}
.toast.error{background:#dc2626}

.material-row{
  display:grid;
  grid-template-columns: 90px 2fr 0.7fr 0.9fr 1.4fr auto;
  gap:8px;
  align-items:start;
  margin-bottom:10px;
  padding-bottom:10px;
  border-bottom:1px dashed var(--border);
}
.material-row:last-child{border-bottom:none;padding-bottom:0;margin-bottom:0}
.material-row input{padding:8px 10px;font-size:.85rem}
@media(max-width:780px){
  .material-row{grid-template-columns:90px 1fr 1fr;grid-auto-rows:auto}
  .material-row input[data-field="nombre"]{grid-column:2/-1}
  .material-row input[data-field="tienda"]{grid-column:2/-1}
  .material-row button[data-remove]{grid-column:3;justify-self:end}
}
.mat-img-cell{display:flex;flex-direction:column;gap:4px;align-items:center;padding-top:2px}
.mat-img{width:78px;height:78px;border-radius:10px;object-fit:cover;border:1px solid var(--border);background:var(--bg);display:block}
.mat-img-placeholder{display:grid;place-items:center;cursor:pointer;font-size:1.6rem;color:var(--muted)}
.mat-img-placeholder:hover{border-color:var(--accent);color:var(--accent)}
.mat-img-empty{
  width:78px;height:78px;border-radius:10px;border:1px dashed var(--border);
  display:grid;place-items:center;font-size:.68rem;font-weight:700;color:var(--muted);
  text-align:center;background:var(--bg);line-height:1.15;padding:4px;
  text-transform:uppercase;letter-spacing:.03em;
}
.mat-img-btn{
  border:none;background:transparent;color:var(--accent);font-size:.68rem;
  font-weight:800;text-transform:uppercase;letter-spacing:.03em;padding:0;cursor:pointer;
}
.mat-img-btn:hover{text-decoration:underline}

.total-box{
  margin-top:12px;padding:12px 14px;border-radius:10px;
  background:var(--bg);border:1px solid var(--border);
  display:flex;justify-content:space-between;align-items:center;
  font-size:.9rem;font-weight:600;
}
.total-box strong{font-size:1.1rem}
.link-btn{
  border:none;background:transparent;color:var(--accent);font-size:.76rem;
  font-weight:700;padding:0;margin-top:3px;cursor:pointer;display:block;
}
.link-btn:hover{text-decoration:underline}
.detail-row td{padding:0!important;background:var(--bg)}
.mats-wrap{padding:14px 16px}
.mats-table{width:100%;border-collapse:collapse;font-size:.82rem;min-width:0}
.mats-table th,.mats-table td{padding:6px 10px;text-align:left;border-bottom:1px solid var(--border)}
.mats-table th{font-size:.7rem;text-transform:uppercase;color:var(--muted);font-weight:800;background:transparent}
.mats-table tr:last-child td{border-bottom:none}
.mats-total{text-align:right;margin-top:8px;font-size:.82rem;color:var(--muted)}
.mats-total strong{color:var(--text)}

.mat-thumb{
  width:44px;height:44px;border-radius:8px;object-fit:cover;
  border:1px solid var(--border);background:var(--bg);display:block;cursor:pointer;
}
.mat-thumb-tag{display:grid;place-items:center;font-size:1.15rem;color:var(--muted)}
.mat-thumb-tag:hover{border-color:var(--accent);color:var(--accent)}

/* Mantenimiento programado */
.row-mp-overdue{background:color-mix(in srgb,var(--danger-bg) 45%,transparent)}
.row-mp-overdue:hover{background:color-mix(in srgb,var(--danger-bg) 70%,transparent)}
.row-mp-due{background:color-mix(in srgb,var(--warn-bg) 45%,transparent)}
.row-mp-due:hover{background:color-mix(in srgb,var(--warn-bg) 70%,transparent)}
.row-mp-soon{background:color-mix(in srgb,var(--accent) 6%,transparent)}

.mp-legend{
  display:flex;gap:14px;flex-wrap:wrap;margin-bottom:10px;
  font-size:.78rem;color:var(--muted);
}
.mp-legend .lg{display:inline-flex;align-items:center;gap:5px}
.mp-legend .dotc{width:9px;height:9px;border-radius:50%}
.mp-legend .dotc.d{background:var(--danger)}
.mp-legend .dotc.w{background:var(--warn)}
.mp-legend .dotc.a{background:var(--accent)}
.mp-legend .dotc.o{background:var(--ok)}

.xml-preview{
  margin-top:8px;border:1px dashed var(--border);border-radius:10px;
  padding:10px;background:var(--bg);font-size:.78rem;max-height:220px;overflow:auto;
}
.xml-preview table{min-width:0;font-size:.78rem}
.xml-preview td,.xml-preview th{padding:4px 8px}
.xml-preview .ok{color:var(--ok);font-weight:700}
.xml-preview code{
  background:var(--card);padding:1px 5px;border-radius:4px;
  border:1px solid var(--border);font-size:.74rem;
}

#app-view[hidden]{display:none}
</style>
</head>
<body>

<div id="app-view" hidden>
  <header>
    <div class="header-in">
      <div class="logo"><span class="mark">🚗</span> Mi Garaje</div>
      <div class="header-actions">
        <div class="user-chip"><span id="user-email">—</span></div>
        <button class="btn ghost sm" id="btn-test-email" title="Enviar un email de prueba simple">📨 Test email</button>
        <button class="btn ghost sm" id="btn-test-avisos" title="Enviar los avisos reales pendientes">📧 Probar avisos</button>
        <button class="btn ghost sm" id="btn-logout" title="Cerrar sesión">Salir</button>
        <button class="btn primary" id="btn-add-vehicle">＋ Añadir vehículo</button>
      </div>
    </div>
  </header>

  <main>
    <div class="tabs" id="tabs"></div>
    <div id="content"></div>
  </main>

  <footer class="site">Los datos se guardan en tu cuenta de Supabase. Los avisos se envían por email.</footer>
</div>

<div id="modal"></div>

<script>
/* =========================================================
   Configuración
   ========================================================= */
const CFG = window.MIGARAJE_CONFIG || {};

if(!CFG.SUPABASE_URL || !CFG.SUPABASE_ANON_KEY ||
   CFG.SUPABASE_URL.includes('TU-PROYECTO') ||
   CFG.SUPABASE_ANON_KEY.includes('TU-ANON')){
  document.body.innerHTML = `
    <div style="max-width:640px;margin:60px auto;padding:24px;font-family:system-ui;line-height:1.6">
      <h1>⚠️ Falta configurar Supabase</h1>
      <p>Abre el archivo <code>config.js</code> y rellena los dos valores.</p>
    </div>`;
  throw new Error('Falta config.js');
}

const { createClient } = window.supabase;
const sb = createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY, {
  auth: { persistSession: true, autoRefreshToken: true }
});

const BUCKET = 'documentos';

/* =========================================================
   Utilidades
   ========================================================= */
const eur = new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR',maximumFractionDigits:2});
const num = new Intl.NumberFormat('es-ES');
const money = n => eur.format(Number(n)||0);
const kmFmt = n => num.format(Number(n)||0) + ' km';

function esc(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtDate(iso){
  if(!iso) return '—';
  const [y,m,d] = iso.split('-');
  if(!y||!m||!d) return '—';
  return `${d}/${m}/${y}`;
}
function todayISO(){
  const d = new Date();
  return new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().slice(0,10);
}
function daysUntil(iso){
  if(!iso) return null;
  const today = new Date(); today.setHours(0,0,0,0);
  const t = new Date(iso + 'T00:00:00');
  if(isNaN(t)) return null;
  return Math.round((t - today) / 86400000);
}
function pluralDias(n){ return n === 1 ? '1 día' : n + ' días'; }
function uid(){
  return crypto.randomUUID
    ? crypto.randomUUID()
    : Date.now().toString(36)+Math.random().toString(36).slice(2,8);
}
function toast(msg, type='info'){
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 3600);
}
function normTipo(t){
  return String(t || '').toLowerCase().trim();
}

/* =========================================================
   Intervalo → km mínima / km máxima
   ---------------------------------------------------------
   Ejemplos soportados:
     "15000 - 30000 km / 12 meses"  → { kmMin: 15000, kmMax: 30000 }
     "60000 km / 48 meses"          → { kmMin: 60000, kmMax: null }
     "200000 km"                    → { kmMin: 200000, kmMax: null }
     "15000 - 30000"                → { kmMin: 15000, kmMax: 30000 }
   ========================================================= */
function parseIntervaloKm(intervalo){
  if(!intervalo) return { kmMin: null, kmMax: null };

  // Solo la parte de km: descartamos lo que va después del "/" (meses)
  const soloKm = String(intervalo).split('/')[0];

  // Extraer todos los números (admitiendo separadores de miles con punto o espacio)
  const matches = soloKm.match(/\d[\d.,\s]*/g);
  if(!matches) return { kmMin: null, kmMax: null };

  const nums = matches
    .map(s => Number(String(s).replace(/[.,\s]/g, '')))
    .filter(n => Number.isFinite(n) && n > 0);

  if(!nums.length) return { kmMin: null, kmMax: null };
  if(nums.length === 1) return { kmMin: nums[0], kmMax: null };
  return { kmMin: Math.min(nums[0], nums[1]), kmMax: Math.max(nums[0], nums[1]) };
}

/* =========================================================
   Estado del mantenimiento según km actual del vehículo
   ---------------------------------------------------------
   - vencido:    km > kmMax (o km > kmMin + 10.000 si no hay max)
   - toca:       dentro del rango [kmMin, kmMax]
   - proximo:    kmMin - km <= 3000
   - programado: aún queda mucho
   ========================================================= */
function estadoMantProg(intervalo, kmActual){
  const { kmMin, kmMax } = parseIntervaloKm(intervalo);
  if(kmMin == null) return { nivel:'muted', orden: 5, etiqueta:'Sin datos', detalle:'' };

  const MARGEN_VENCIDO = 10000; // si no hay kmMax, el vencimiento se calcula kmMin + 10.000
  const MARGEN_PROXIMO = 3000;  // a partir de aquí ya avisamos "Próximo"

  const kMax = kmMax != null ? kmMax : kmMin + MARGEN_VENCIDO;

  if(kmActual > kMax){
    return {
      nivel: 'danger',
      orden: 0,
      etiqueta: 'Vencido',
      detalle: `Superado por ${num.format(kmActual - kMax)} km`
    };
  }
  if(kmActual >= kmMin){
    return {
      nivel: 'warn',
      orden: 1,
      etiqueta: 'Toca',
      detalle: `En rango (${num.format(kmMin)}${kmMax ? ' - ' + num.format(kmMax) : ''} km)`
    };
  }
  if(kmMin - kmActual <= MARGEN_PROXIMO){
    return {
      nivel: 'accent',
      orden: 2,
      etiqueta: 'Próximo',
      detalle: `Faltan ${num.format(kmMin - kmActual)} km`
    };
  }
  return {
    nivel: 'ok',
    orden: 3,
    etiqueta: 'Programado',
    detalle: `Faltan ${num.format(kmMin - kmActual)} km`
  };
}

/* =========================================================
   Parser XML Spreadsheet 2003
   ---------------------------------------------------------
   Formatos soportados:
     · Nuevo:  Kilómetros | Meses | Revisión
     · Antiguo: Operación | Intervalo | Notas  (Sistema ignorado)
   ========================================================= */
function parseMantProgXML(xmlText){
  const NS = 'urn:schemas-microsoft-com:office:spreadsheet';

  if(xmlText.charCodeAt(0) === 0xFEFF) xmlText = xmlText.slice(1);

  const doc = new DOMParser().parseFromString(xmlText, 'application/xml');
  const parserError = doc.querySelector('parsererror');
  if(parserError) throw new Error('El archivo no es un XML válido.');

  function findElems(parent, tag){
    let els = parent.getElementsByTagNameNS(NS, tag);
    if(els.length === 0) els = parent.getElementsByTagName(tag);
    return els;
  }
  function getAttr(elem, name){
    let v = elem.getAttributeNS(NS, name);
    if(v == null) v = elem.getAttribute('ss:' + name) || elem.getAttribute(name);
    return v;
  }

  const worksheets = findElems(doc, 'Worksheet');
  if(!worksheets.length) throw new Error('El XML no contiene ninguna hoja de cálculo.');

  const rows = findElems(worksheets[0], 'Row');
  if(!rows.length) return [];

  function getRowValues(rowEl){
    const out = [];
    const cells = findElems(rowEl, 'Cell');
    let col = 0;
    for(const cell of cells){
      const idxAttr = getAttr(cell, 'Index');
      if(idxAttr) col = Number(idxAttr) - 1;
      const dataEls = findElems(cell, 'Data');
      out[col] = dataEls.length ? String(dataEls[0].textContent || '').trim() : '';
      col++;
    }
    return out;
  }

  const norm = s => String(s||'')
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .toLowerCase().trim();

  const headers = getRowValues(rows[0]).map(norm);

  const idx = {
    operacion: headers.findIndex(h =>
      ['revision','operacion','tarea','mantenimiento','nombre','descripcion'].includes(h)),
    intervalo: headers.findIndex(h =>
      ['intervalo','periodicidad','cada','frecuencia'].includes(h)),
    notas:     headers.findIndex(h =>
      ['notas','nota','observaciones','comentarios'].includes(h)),
    kilometros:headers.findIndex(h =>
      ['kilometros','kilometraje','km'].includes(h)),
    meses:     headers.findIndex(h =>
      ['meses','mes','periodo'].includes(h))
  };

  const out = [];
  for(let r = 1; r < rows.length; r++){
    const row = getRowValues(rows[r]);
    const operacion = idx.operacion >= 0 ? String(row[idx.operacion] || '').trim() : '';
    if(!operacion) continue;

    let intervalo = '';
    if(idx.intervalo >= 0){
      intervalo = String(row[idx.intervalo] || '').trim();
    }
    if(!intervalo && (idx.kilometros >= 0 || idx.meses >= 0)){
      const km    = idx.kilometros >= 0 ? String(row[idx.kilometros] || '').trim() : '';
      const meses = idx.meses      >= 0 ? String(row[idx.meses]      || '').trim() : '';
      const partes = [];
      if(km)    partes.push(km + ' km');
      if(meses) partes.push(meses + (meses === '1' ? ' mes' : ' meses'));
      intervalo = partes.join(' / ');
    }

    out.push({
      operacion,
      intervalo,
      notas: idx.notas >= 0 ? String(row[idx.notas] || '').trim() : ''
    });
  }
  return out;
}

function mantFromDB(row){
  return {
    id: row.id, tipo: row.tipo || '', fecha: row.fecha || '',

function mantToDB(m, vehicleId){
  return {
    vehicle_id: vehicleId,
    tipo: m.tipo || null,

    km: m.km === '' || m.km == null ? null : Number(m.km),

      cantidad: x.cantidad === '' || x.cantidad == null ? null : Number(x.cantidad),
      precio:   x.precio   === '' || x.precio   == null ? null : Number(x.precio),
      tienda:   String(x.tienda || '').trim(),
      imagen:   String(x.imagen || '')
    })) : []
  };
}

/* =========================================================
   Carga
   ========================================================= */
async function loadData(){
  const [vRes, mRes, hRes, pRes] = await Promise.all([
    sb.from('vehicles').select('*').order('created_at', { ascending: true }),
    sb.from('mantenimientos').select('*').order('created_at', { ascending: true }),
    sb.from('historial_obligaciones').select('*').order('fecha', { ascending: false }),
    sb.from('mantenimiento_programado').select('*').order('orden', { ascending: true })
  ]);
  if(vRes.error) throw vRes.error;
  if(mRes.error) throw mRes.error;

  if(hRes.error){
    console.error('Error al leer historial_obligaciones:', hRes.error);
    allHistorialRaw = [];
  } else {
    allHistorialRaw = hRes.data || [];
  }

  if(pRes.error){
    console.error('Error al leer mantenimiento_programado:', pRes.error);
    allMantProg = [];
  } else {
    allMantProg = pRes.data || [];
  }

  const mantsByVehicle = new Map();
  mRes.data.forEach(m => {
    if(!mantsByVehicle.has(m.vehicle_id)) mantsByVehicle.set(m.vehicle_id, []);
    mantsByVehicle.get(m.vehicle_id).push(mantFromDB(m));
  });

  vehicles = vRes.data.map(v => ({
    ...v,
    km: Number(v.km) || 0,
    mantenimientos: mantsByVehicle.get(v.id) || []
  }));

  if(!selected || !vehicles.find(v => v.id === selected)){
    selected = vehicles[0]?.id || null;
  }
}

function registrosHist(vehicleId, tipo){
  const tipoN = normTipo(tipo);
  return allHistorialRaw.filter(h =>
    String(h.vehicle_id) === String(vehicleId) &&
    normTipo(h.tipo) === tipoN
  );
}
function registrosMantProg(vehicleId){
  return allMantProg.filter(p => String(p.vehicle_id) === String(vehicleId));
}

/* =========================================================
   Storage
   ========================================================= */
async function subirDocumento(file, vehicleId, tipo){
  if(!file || file.size === 0) return null;
  const ext = (file.name.split('.').pop() || 'bin').toLowerCase();
  const path = `${currentUser.id}/${vehicleId}/${tipo}.${ext}`;
  const { error } = await sb.storage.from(BUCKET).upload(path, file, {
    upsert: true, cacheControl: '3600',
    contentType: file.type || 'application/octet-stream'
  });
  if(error) throw error;
  return path;
}
async function subirMaterialImagen(file, vehicleId, materialId){
  if(!file || file.size === 0) return null;
  const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
  const path = `${currentUser.id}/${vehicleId}/material_${materialId}.${ext}`;
  const { error } = await sb.storage.from(BUCKET).upload(path, file, {
    upsert: true, cacheControl: '3600',
    contentType: file.type || 'image/jpeg'
  });
  if(error) throw error;
  return path;
}
async function verDocumento(path){
  if(!path) return;
  const { data, error } = await sb.storage.from(BUCKET).createSignedUrl(path, 3600);
  if(error) return toast('No se pudo abrir el archivo: ' + error.message, 'error');
  window.open(data.signedUrl, '_blank', 'noopener');
}
async function borrarDocumento(path){
  if(!path) return;
  const { error } = await sb.storage.from(BUCKET).remove([path]);
  if(error) console.warn('No se pudo borrar:', error.message);
}
async function borrarCarpetaVehiculo(vehicleId){
  const prefix = `${currentUser.id}/${vehicleId}`;
  const { data: files, error } = await sb.storage.from(BUCKET).list(prefix);
  if(error || !files?.length) return;
  const paths = files.map(f => `${prefix}/${f.name}`);
  await sb.storage.from(BUCKET).remove(paths);
}

function docCard(nombre, iso, warnDays, extraHtml, acciones){
  const d = daysUntil(iso);
  let cls = 'ok', sub = '';
  if(d === null){ cls = ''; sub = 'Sin fecha'; }
  else if(d < 0){ cls = 'danger'; sub = `Vencido hace ${pluralDias(Math.abs(d))}`; }
  else if(d <= warnDays){ cls = 'warn'; sub = `Vence en ${pluralDias(d)}`; }
  else { cls = 'ok'; sub = `Quedan ${pluralDias(d)}`; }
  return `<div class="doc ${cls}"><div class="bar"></div>
    <div class="name">${nombre}</div>
    <div class="date">${fmtDate(iso)}</div>
    <div class="sub">${sub}</div>
    ${extraHtml ? `<div class="doc-extra">${extraHtml}</div>` : ''}
    ${acciones ? `<div class="doc-actions">${acciones}</div>` : ''}
  </div>`;
}

function docFileCard(nombre, path){
  const tieneArchivo = !!path;
  return `<div class="doc ${tieneArchivo ? 'ok' : ''}"><div class="bar"></div>
    <div class="name">${nombre}</div>
    ${tieneArchivo
      ? `<div class="actions" style="margin-top:8px">
           <button type="button" class="btn ghost tiny" data-ver-doc="${esc(path)}">📄 Ver documento</button>
         </div>`
      : `<div class="no-file">Sin documento adjunto</div>`}
  </div>`;
}

function mantRow(m, v){
  let prox = '<span class="muted">—</span>';
  if(m.proximaFecha || m.proximoKm){
    const partes = [];
    if(m.proximaFecha){
      const d = daysUntil(m.proximaFecha);
      let cls = 'ok';
      if(d !== null && d < 0) cls = 'danger';
      else if(d !== null && d <= 30) cls = 'warn';
      partes.push(`<span class="badge ${cls}">${fmtDate(m.proximaFecha)}</span>`);
    }
    if(m.proximoKm){
      const rest = Number(m.proximoKm) - (Number(v.km)||0);
      let cls = 'ok';
      if(rest <= 0) cls = 'danger';
      else if(rest <= 1000) cls = 'warn';
      partes.push(`<span class="badge ${cls}">${kmFmt(m.proximoKm)}</span>`);
    }
    prox = `<div style="display:flex;gap:5px;flex-wrap:wrap">${partes.join('')}</div>`;
  }

  const mats = Array.isArray(m.materiales) ? m.materiales : [];
  const totalMats = mats.reduce((s,x) => s + (Number(x.cantidad)||0) * (Number(x.precio)||0), 0);
  const totalCoste = (Number(m.coste)||0) + totalMats;
  const hasMats = mats.length > 0;
  const matsConFoto = mats.filter(x => x.imagen).length;
  const detailId = 'det-' + m.id;

  const mainRow = `<tr>
    <td><span class="tag">${esc(m.tipo || 'Otros')}</span></td>
    <td>${fmtDate(m.fecha)}</td>
    <td>${m.km ? kmFmt(m.km) : '<span class="muted">—</span>'}</td>
    <td>
      <strong>${totalCoste ? money(totalCoste) : '<span class="muted">—</span>'}</strong>
      ${hasMats ? `<button type="button" class="link-btn" data-toggle="${detailId}">
        🔧 ${mats.length} material${mats.length===1?'':'es'}${matsConFoto ? ` · 📷 ${matsConFoto}` : ''}
      </button>` : ''}
    </td>
    <td>${m.taller ? esc(m.taller) : '<span class="muted">—</span>'}</td>
    <td>${prox}</td>
    <td>
      <div class="row-actions">
        <button class="icon-btn" title="Editar" data-edit-mant="${m.id}">✎</button>
        <button class="icon-btn" title="Eliminar" data-del-mant="${m.id}">🗑</button>
      </div>
    </td>
  </tr>`;

  const detailRow = hasMats ? `
    <tr id="${detailId}" class="detail-row" hidden>
      <td colspan="7">
        <div class="mats-wrap">
          <table class="mats-table">
            <thead><tr>
              <th>Foto</th><th>Material</th><th>Cantidad</th><th>Precio unit.</th><th>Subtotal</th><th>Dónde se compró</th>
            </tr></thead>
            <tbody>
              ${mats.map(x => {
                const sub = (Number(x.cantidad)||0) * (Number(x.precio)||0);
                return `<tr>
                  <td>${x.imagen ? `<div class="mat-thumb mat-thumb-tag" data-ver-doc="${esc(x.imagen)}" title="Ver imagen">📷</div>` : '<span class="muted">—</span>'}</td>
                  <td>${esc(x.nombre || '—')}</td>
                  <td>${x.cantidad ?? '—'}</td>
                  <td>${x.precio != null && x.precio !== '' ? money(x.precio) : '—'}</td>
                  <td><strong>${money(sub)}</strong></td>
                  <td>${esc(x.tienda || '—')}</td>
                </tr>`;
              }).join('')}
            </tbody>
          </table>
          <div class="mats-total">
            Mano de obra: <strong>${money(m.coste)}</strong> ·
            Materiales: <strong>${money(totalMats)}</strong> ·
            Total: <strong>${money(totalCoste)}</strong>
          </div>
        </div>
      </td>
    </tr>` : '';

  return mainRow + detailRow;
}

/* =========================================================
   Alertas
   ========================================================= */
function getAlerts(v){
  const out = [];
  const check = (label, iso, warnDays) => {
    const d = daysUntil(iso);
    if(d === null) return;
    if(d < 0) out.push({ level:'danger', text:`${label} vencido hace ${pluralDias(Math.abs(d))} (${fmtDate(iso)})` });
    else if(d <= warnDays) out.push({ level:'warn', text:`${label} vence en ${pluralDias(d)} — ${fmtDate(iso)}` });
  };
  check('ITV', v.itv, 30);
  check('Seguro', v.seguro, 21);
  check('Impuesto de circulación (IVTM)', v.impuesto, 30);

  if(v.intervalo_revision_km && v.ultima_revision_km){
    const proxima = Number(v.ultima_revision_km) + Number(v.intervalo_revision_km);
    const restantes = proxima - (Number(v.km) || 0);
    if(restantes <= 1000){
      out.push({
        level: restantes <= 0 ? 'danger' : 'warn',
        text: restantes <= 0
          ? `Revisión por km superada por ${kmFmt(Math.abs(restantes))} (tocaba a los ${kmFmt(proxima)})`
          : `Revisión por km próxima: faltan ${kmFmt(restantes)} (a los ${kmFmt(proxima)})`
      });
    }
  }

  (v.mantenimientos || []).forEach(m => {
    if(m.proximaFecha){
      const d = daysUntil(m.proximaFecha);
      if(d !== null && d <= 30)
        out.push({ level: d < 0 ? 'danger' : 'warn',
                   text: `${m.tipo || 'Mantenimiento'} ${d < 0 ? 'pendiente desde hace ' + pluralDias(Math.abs(d)) : 'programado en ' + pluralDias(d)}` });
    }
    if(m.proximoKm){
      const rest = Number(m.proximoKm) - (Number(v.km) || 0);
      if(rest <= 1000)
        out.push({ level: rest <= 0 ? 'danger' : 'warn',
                   text: `${m.tipo || 'Mantenimiento'} ${rest <= 0 ? 'superado por ' + kmFmt(Math.abs(rest)) : 'en ' + kmFmt(rest)}` });
    }
  });

  // Avisos según el plan de mantenimiento programado (Vencidos y Toca)
  registrosMantProg(v.id).forEach(p => {
    const est = estadoMantProg(p.intervalo, v.km);
    if(est.nivel === 'danger'){
      out.push({ level:'danger', text:`Plan: "${p.operacion}" vencido (${est.detalle})` });
    } else if(est.nivel === 'warn'){
      out.push({ level:'warn', text:`Plan: "${p.operacion}" ${est.detalle.toLowerCase()}` });
    }
  });

  if(!out.length) out.push({ level:'info', text:'Todo en orden. No hay avisos próximos.' });
  return out.sort((a,b) => {
    const r = x => x === 'danger' ? 0 : x === 'warn' ? 1 : 2;
    return r(a.level) - r(b.level);
  });
}

/* =========================================================
   Modal
   ========================================================= */
function openModal(title, bodyHtml, onSubmit, submitLabel = 'Guardar'){
  modalRoot.innerHTML = `
    <div class="overlay">
      <div class="modal" role="dialog" aria-modal="true">
        <div class="modal-head">
          <h3>${esc(title)}</h3>
          <button type="button" class="icon-btn" data-close>✕</button>
        </div>
        <form id="modal-form" novalidate>
          <div class="modal-body">${bodyHtml}</div>
          <div class="modal-foot">
            <button type="button" class="btn ghost" data-close>Cancelar</button>
            <button type="submit" class="btn primary" id="modal-submit">${esc(submitLabel)}</button>
          </div>
        </form>
      </div>
    </div>`;
  const overlay = modalRoot.querySelector('.overlay');
  overlay.addEventListener('click', e => { if(e.target === overlay) closeModal(); });
  modalRoot.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', closeModal));
  modalRoot.querySelector('#modal-form').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = document.getElementById('modal-submit');
    const orig = btn.textContent;
    btn.disabled = true; btn.textContent = 'Guardando…';
    try{
      await onSubmit(new FormData(e.target));
    }catch(err){
      console.error(err);
      alert('Error: ' + (err.message || err));
      btn.disabled = false; btn.textContent = orig;
    }
  });
  const first = modalRoot.querySelector('input,select,textarea');
  if(first) setTimeout(() => first.focus(), 40);
}
function closeModal(){ modalRoot.innerHTML = ''; }
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeModal(); });

    } else {
      const { data: inserted, error } = await sb.from('vehicles')
        .insert({ ...data, user_id: currentUser.id }).select('id').single();
      if(error) throw error;
      vehicleId = inserted.id;
      selected  = vehicleId;
    }

    const permisoFile = fd.get('permiso_file');
    if(permisoFile && permisoFile.size > 0){
      const path = await subirDocumento(permisoFile, vehicleId, 'permiso_circulacion');
      if(path){
        const { error } = await sb.from('vehicles').update({ permiso_circulacion_path: path }).eq('id', vehicleId);
        if(error) throw error;
      }
    }
    const fichaFile = fd.get('ficha_file');
    if(fichaFile && fichaFile.size > 0){
      const path = await subirDocumento(fichaFile, vehicleId, 'ficha_tecnica');
      if(path){
        const { error } = await sb.from('vehicles').update({ ficha_tecnica_path: path }).eq('id', vehicleId);
        if(error) throw error;
      }
    }

    if(xmlParsed && xmlParsed.length){
      const reemplazar = esNuevo || !!fd.get('reemplazar_mant_prog');
      if(reemplazar){
        const { error: eDel } = await sb.from('mantenimiento_programado').delete().eq('vehicle_id', vehicleId);
        if(eDel) throw eDel;
      }
      const registros = xmlParsed.map((r, i) => ({
        vehicle_id: vehicleId,
        operacion:  r.operacion,
        intervalo:  r.intervalo || null,
        notas:      r.notas || null,
        orden:      i
      }));
      for(let i = 0; i < registros.length; i += 500){
        const chunk = registros.slice(i, i + 500);
        const { error } = await sb.from('mantenimiento_programado').insert(chunk);
        if(error) throw error;
      }
    }

    await loadData();
    closeModal(); render();
    toast(id ? 'Vehículo actualizado' : 'Vehículo añadido', 'ok');
  }, esNuevo ? 'Añadir vehículo' : 'Guardar cambios');

  setTimeout(() => {
    const fileInput = document.getElementById('mant-prog-file');
    const previewCont = document.getElementById('xml-preview-container');
    if(!fileInput || !previewCont) return;

    fileInput.addEventListener('change', e => {
      const file = e.target.files[0];
      if(!file){ xmlParsed = null; previewCont.innerHTML = ''; return; }

      const reader = new FileReader();
      reader.onload = ev => {
        try{
          const objs = parseMantProgXML(ev.target.result);
          xmlParsed = objs;

          if(!objs.length){
            previewCont.innerHTML = '<div class="xml-preview">⚠️ No se han detectado filas válidas en el XML.</div>';
            return;
          }

          const preview = objs.slice(0, 8).map(o => `
            <tr>
              <td>${esc(o.operacion)}</td>
              <td>${esc(o.intervalo || '—')}</td>
              <td>${esc((o.notas || '').slice(0, 60))}${(o.notas||'').length > 60 ? '…' : ''}</td>
            </tr>`).join('');

          previewCont.innerHTML = `
            <div class="xml-preview">
              <div class="ok">✓ ${objs.length} registro${objs.length===1?'':'s'} detectado${objs.length===1?'':'s'} en el XML</div>
              <table style="margin-top:8px">
                <thead><tr><th>Operación</th><th>Intervalo</th><th>Notas</th></tr></thead>
                <tbody>${preview}</tbody>
              </table>
              ${objs.length > 8 ? `<div class="hint" style="margin-top:6px">... y ${objs.length - 8} más.</div>` : ''}
            </div>`;
        }catch(err){
          console.error(err);
          xmlParsed = null;
          previewCont.innerHTML = '<div class="xml-preview">❌ Error al procesar el XML: ' + esc(err.message) + '</div>';
        }
      };
      reader.readAsText(file, 'UTF-8');
    });
  }, 60);
}

function openMantForm(vehicleId, mantId){
  const v = vehicles.find(x => x.id === vehicleId);
  if(!v) return;
  const m = mantId ? v.mantenimientos.find(x => x.id === mantId) : {};
  const esNuevo = !mantId;

  let mats = Array.isArray(m.materiales) ? m.materiales.map(x => ({
    id: x.id || uid(), nombre: x.nombre || '', cantidad: x.cantidad ?? '',
    precio: x.precio ?? '', tienda: x.tienda || '', imagen: x.imagen || '',
    _file: null, _preview: null
  })) : [];

  const body = `
    <div class="grid2">
      <label>Tipo de intervención
        <select name="tipo" required>
          ${TIPOS_MANT.map(t => `<option ${m.tipo === t ? 'selected' : ''}>${t}</option>`).join('')}
        </select>
      </label>
      <label>Fecha<input type="date" name="fecha" value="${esc(m.fecha || todayISO())}" required></label>
      <label>Kilómetros del vehículo<input type="number" min="0" step="1" name="km" value="${esc(m.km ?? v.km)}"></label>
      <label>Mano de obra / servicio (€)<input type="number" min="0" step="0.01" name="coste" value="${esc(m.coste)}" placeholder="0,00"></label>
    </div>
    <label>Taller / proveedor<input name="taller" value="${esc(m.taller)}" placeholder="Ej. Talleres Pérez"></label>

    <h4>Materiales utilizados</h4>
    <div id="materiales-list"></div>
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:4px">
      <button type="button" class="btn ghost sm" id="add-material">＋ Añadir material</button>
      <div class="hint">Materiales: <strong id="materiales-total">0,00 €</strong></div>
    </div>

    <h4>Próximo aviso (opcional)</h4>
    <div class="grid2">
      <label>Fecha próxima<input type="date" name="proximaFecha" value="${esc(m.proximaFecha)}"></label>
      <label>Km próximos<input type="number" min="0" step="1" name="proximoKm" value="${esc(m.proximoKm)}" placeholder="Ej. 135000"></label>
    </div>

    <label>Notas<textarea name="notas" rows="2">${esc(m.notas)}</textarea></label>

    <div class="total-box">
      <span>Total intervención</span>
      <strong id="total-intervencion">0,00 €</strong>
    </div>
  `;

  openModal(esNuevo ? 'Nueva intervención' : 'Editar intervención', body, async fd => {
    for(const mat of mats){
      if(mat._file && mat._file.size > 0){
        try{
          const path = await subirMaterialImagen(mat._file, vehicleId, mat.id);
          if(path) mat.imagen = path;
        }catch(err){ console.warn('Error subiendo imagen:', err); }
      }
    }

    const data = {
      tipo: fd.get('tipo') || 'Otros',
      fecha: fd.get('fecha') || '',
      km: fd.get('km') ? Number(fd.get('km')) : '',
      coste: fd.get('coste') ? Number(fd.get('coste')) : 0,
      taller: (fd.get('taller') || '').trim(),
      proximaFecha: fd.get('proximaFecha') || '',
      proximoKm: fd.get('proximoKm') ? Number(fd.get('proximoKm')) : '',
      notas: (fd.get('notas') || '').trim(),
      materiales: mats.filter(x => (x.nombre||'').trim() || x.cantidad || x.precio || (x.tienda||'').trim() || x.imagen)
        .map(x => ({ id: x.id, nombre: x.nombre, cantidad: x.cantidad, precio: x.precio, tienda: x.tienda, imagen: x.imagen }))
    };

    const payload = mantToDB(data, vehicleId);
    if(mantId){
      const { error } = await sb.from('mantenimientos').update(payload).eq('id', mantId);
      if(error) throw error;
    } else {
      const { error } = await sb.from('mantenimientos').insert(payload);
      if(error) throw error;
    }
    if(data.km && Number(data.km) > (Number(v.km) || 0)){
      await sb.from('vehicles').update({ km: Number(data.km) }).eq('id', vehicleId);
    }
    await loadData();
    closeModal(); render();
    toast(esNuevo ? 'Intervención añadida' : 'Intervención actualizada', 'ok');
  }, esNuevo ? 'Añadir' : 'Guardar cambios');

  const listEl    = document.getElementById('materiales-list');
  const matTotalEl= document.getElementById('materiales-total');
  const totalEl   = document.getElementById('total-intervencion');
  const costeInput= document.querySelector('#modal-form [name="coste"]');

  const sumMats = () => mats.reduce((s,x) => s + (Number(x.cantidad)||0) * (Number(x.precio)||0), 0);
  function refreshTotals(){
    const t = sumMats();
    matTotalEl.textContent = money(t);
    totalEl.textContent    = money((Number(costeInput.value)||0) + t);
  }
  function imagenCell(x, i){
    let inner;
    if(x._preview) inner = `<img class="mat-img" src="${x._preview}" alt="Material">`;
    else if(x.imagen) inner = `<div class="mat-img mat-img-placeholder" data-ver-doc="${esc(x.imagen)}" title="Ver imagen">📷</div>`;
    else inner = `<div class="mat-img-empty">Sin foto</div>`;
    return `<div class="mat-img-cell">${inner}
      <button type="button" class="mat-img-btn" data-img-trigger="${i}">${x._preview || x.imagen ? 'Cambiar' : 'Subir foto'}</button>
      <input type="file" accept="image/*" class="mat-img-input" data-idx="${i}" hidden>
    </div>`;
  }
  function renderMats(){
    if(!mats.length){
      listEl.innerHTML = '<div class="hint" style="padding:4px 0">Sin materiales añadidos.</div>';
    } else {
      listEl.innerHTML = mats.map((x,i) => `
        <div class="material-row" data-idx="${i}">
          ${imagenCell(x, i)}
          <input data-field="nombre"   placeholder="Material" value="${esc(x.nombre)}">
          <input data-field="cantidad" type="number" step="0.01" min="0" placeholder="Cant." value="${esc(x.cantidad)}">
          <input data-field="precio"   type="number" step="0.01" min="0" placeholder="€ / ud." value="${esc(x.precio)}">
          <input data-field="tienda"   placeholder="Dónde lo compraste" value="${esc(x.tienda)}">
          <button type="button" class="icon-btn" data-remove="${i}" title="Quitar">✕</button>
        </div>
      `).join('');
      listEl.querySelectorAll('input[data-field]').forEach(inp => {
        inp.addEventListener('input', e => {
          const i = Number(e.target.closest('.material-row').dataset.idx);
          mats[i][e.target.dataset.field] = e.target.value;
          refreshTotals();
        });
      });
      listEl.querySelectorAll('[data-ver-doc]').forEach(el => el.addEventListener('click', () => verDocumento(el.dataset.verDoc)));
      listEl.querySelectorAll('[data-img-trigger]').forEach(b => {
        b.addEventListener('click', () => {
          const input = listEl.querySelector(`.mat-img-input[data-idx="${b.dataset.imgTrigger}"]`);
          if(input) input.click();
        });
      });
      listEl.querySelectorAll('.mat-img-input').forEach(inp => {
        inp.addEventListener('change', e => {
          const i = Number(e.target.dataset.idx);
          const file = e.target.files[0];
          if(!file) return;
          mats[i]._file = file;
          mats[i]._preview = URL.createObjectURL(file);
          renderMats();
        });
      });
      listEl.querySelectorAll('[data-remove]').forEach(b => {
        b.addEventListener('click', () => {
          const i = Number(b.dataset.remove);
          const mat = mats[i];
          if(mat.imagen && !mat._file) borrarDocumento(mat.imagen);
          mats.splice(i, 1);
          renderMats();
        });
      });
    }
    refreshTotals();
  }
  document.getElementById('add-material').addEventListener('click', () => {
    mats.push({ id: uid(), nombre:'', cantidad:'', precio:'', tienda:'', imagen:'', _file:null, _preview:null });
    renderMats();
    const rows = listEl.querySelectorAll('.material-row');
    const last = rows[rows.length-1];
    if(last) last.querySelector('input[data-field="nombre"]').focus();
  });
  costeInput.addEventListener('input', refreshTotals);
  renderMats();
}

/* =========================================================
   HISTORIAL DE OBLIGACIONES
   ========================================================= */
function _proximaPorDefecto(fechaISO, tipo, v){
  if(!fechaISO) return '';
  const f = new Date(fechaISO + 'T00:00:00');
  if(isNaN(f)) return '';
  if(tipo === 'ivtm') f.setFullYear(f.getFullYear() + 1);
  else if(tipo === 'seguro') f.setFullYear(f.getFullYear() + 1);
  else if(tipo === 'itv'){
    const edad = v?.anio ? (new Date().getFullYear() - Number(v.anio)) : 0;
    f.setFullYear(f.getFullYear() + (edad >= 10 ? 1 : 2));
  }
  return f.toISOString().slice(0,10);
}

      </label>
    </div>
    <div class="grid2">
      <label>Próximo vencimiento
        <input type="date" name="proxima_fecha" id="hist-proxima" value="${esc(proximaVal)}">
      </label>
      <div class="hint" style="align-self:end;padding-bottom:10px">
        <label style="flex-direction:row;align-items:center;gap:8px;text-transform:none;letter-spacing:0;font-weight:600;font-size:.85rem">
          <input type="checkbox" name="actualizar_vehiculo" checked>
          Actualizar vencimiento del vehículo
        </label>
      </div>
    </div>
    ${camposEspecificos}
    <label>Notas<textarea name="notas" rows="2">${esc(registro?.notas)}</textarea></label>
  `;

  openModal(
    esNuevo ? `Registrar ${tipoLabel.toLowerCase()}` : `Editar registro de ${tipoLabel.toLowerCase()}`,
    body,
    async fd => {
      const data = {
        vehicle_id: vehicleId,
        tipo: normTipo(tipo),
        fecha: fd.get('fecha') || null,
        proxima_fecha: fd.get('proxima_fecha') || null,
        precio: fd.get('precio') ? Number(fd.get('precio')) : null,
        lugar: (fd.get('lugar') || '').trim() || null,
        compania: (fd.get('compania') || '').trim() || null,
        tipo_seguro: (fd.get('tipo_seguro') || '').trim() || null,
        plazos: (fd.get('plazos') || '').trim() || null,
        notas: (fd.get('notas') || '').trim() || null
      };

      if(registroId){
        const { error } = await sb.from('historial_obligaciones').update(data).eq('id', registroId);
        if(error) throw new Error('Error al actualizar: ' + error.message);
      } else {
        const { error } = await sb.from('historial_obligaciones').insert(data);
        if(error) throw new Error('Error al guardar: ' + error.message);
      }

      if(fd.get('actualizar_vehiculo') && data.proxima_fecha){
        const campoVenc = tipo === 'itv' ? 'itv' : tipo === 'seguro' ? 'seguro' : 'impuesto';
        const camposExtra = {};
        if(tipo === 'itv'){
          if(data.precio != null) camposExtra.itv_precio = data.precio;
          if(data.lugar) camposExtra.itv_lugar = data.lugar;
          if(data.fecha) camposExtra.itv_fecha = data.fecha;
        } else if(tipo === 'seguro'){
          if(data.precio != null) camposExtra.seguro_precio = data.precio;
          if(data.compania) camposExtra.seguro_compania = data.compania;
          if(data.tipo_seguro) camposExtra.seguro_tipo = data.tipo_seguro;
          if(data.plazos) camposExtra.seguro_plazos = data.plazos;
          if(data.fecha) camposExtra.seguro_fecha = data.fecha;
        } else if(tipo === 'ivtm'){
          if(data.precio != null) camposExtra.impuesto_precio = data.precio;
          if(data.lugar) camposExtra.impuesto_lugar = data.lugar;
          if(data.fecha) camposExtra.impuesto_fecha = data.fecha;
        }
        const { error } = await sb.from('vehicles').update({ [campoVenc]: data.proxima_fecha, ...camposExtra }).eq('id', vehicleId);
        if(error) console.warn('Aviso: no se pudo actualizar el vehículo:', error.message);
      }

      await loadData();
      closeModal(); render();
      toast(registroId ? 'Registro actualizado' : `Registro de ${tipoLabel.toLowerCase()} guardado`, 'ok');
    },
    esNuevo ? 'Guardar registro' : 'Guardar cambios'
  );

  setTimeout(() => {
    const fFecha = document.getElementById('hist-fecha');
    const fProx = document.getElementById('hist-proxima');
    if(fFecha && fProx){
      fFecha.addEventListener('change', () => {
        if(!fFecha.value) return;
        fProx.value = _proximaPorDefecto(fFecha.value, tipo, v);
      });
    }
  }, 30);
}

function openHistorialList(vehicleId, tipo){
  tipo = normTipo(tipo);
  const v = vehicles.find(x => x.id === vehicleId);
  if(!v) return;
  const tipoLabel = TIPOS_HIST_LABEL[tipo] || tipo;

  const items = registrosHist(vehicleId, tipo)
    .sort((a, b) => (b.fecha || '').localeCompare(a.fecha || ''));

  const total = items.reduce((s, h) => s + (Number(h.precio) || 0), 0);
  const años = items.length ? new Set(items.map(h => (h.fecha || '').slice(0,4))).size : 0;

  let html = '';
  if(!items.length){
    html = `<div class="hist-empty">Aún no hay registros de ${tipoLabel.toLowerCase()}.</div>`;
  } else {
    html = items.map(h => {
      const extras = [];
      if(h.lugar) extras.push(`📍 ${esc(h.lugar)}`);
      if(h.compania) extras.push(`🏢 ${esc(h.compania)}`);
      if(h.tipo_seguro) extras.push(`🛡 ${esc(h.tipo_seguro)}`);
      if(h.plazos) extras.push(`📅 ${esc(h.plazos)}`);
      if(h.proxima_fecha) extras.push(`→ vence ${fmtDate(h.proxima_fecha)}`);
      if(h.notas) extras.push(`📝 ${esc(h.notas)}`);
      return `<div class="hist-item">
        <div class="hist-info">
          <div><strong>${fmtDate(h.fecha)}</strong>${h.precio != null ? ` · <strong>${money(h.precio)}</strong>` : ''}</div>
          ${extras.length ? `<div class="hist-line">${extras.join(' · ')}</div>` : ''}
        </div>
        <div class="hist-actions">
          <button type="button" class="icon-btn" title="Editar" data-hist-edit="${h.id}">✎</button>
          <button type="button" class="icon-btn" title="Eliminar" data-hist-del="${h.id}">🗑</button>
        </div>
      </div>`;
    }).join('');
  }

  const body = `
    <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px">
      <div class="hint">${items.length} registro${items.length===1?'':'s'} · ${años} año${años===1?'':'s'}</div>
      <button type="button" class="btn primary sm" id="hist-add">＋ Nuevo registro</button>
    </div>
    <div>${html}</div>
    ${items.length ? `<div class="hist-total">Total pagado en ${tipoLabel.toLowerCase()}: <strong>${money(total)}</strong></div>` : ''}
  `;

  openModal(`Historial — ${tipoLabel} · ${v.matricula || v.nombre}`, body, async () => { closeModal(); }, 'Cerrar');

  setTimeout(() => {
    const submitBtn = document.getElementById('modal-submit');
    if(submitBtn) submitBtn.style.display = 'none';
    modalRoot.querySelectorAll('[data-close]').forEach(b => {
      if(b.classList.contains('btn')){
        b.textContent = 'Cerrar';
        b.classList.remove('ghost');
        b.classList.add('primary');
      }
    });
    const addBtn = document.getElementById('hist-add');
    if(addBtn) addBtn.addEventListener('click', () => { closeModal(); openHistorialForm(vehicleId, tipo); });
    modalRoot.querySelectorAll('[data-hist-edit]').forEach(b =>
      b.addEventListener('click', () => { closeModal(); openHistorialForm(vehicleId, tipo, b.dataset.histEdit); })
    );
    modalRoot.querySelectorAll('[data-hist-del]').forEach(b =>
      b.addEventListener('click', async () => {
        if(!confirm('¿Eliminar este registro del historial?\n\nNo se puede deshacer.')) return;
        const { error } = await sb.from('historial_obligaciones').delete().eq('id', b.dataset.histDel);
        if(error) return toast('Error: ' + error.message, 'error');
        await loadData(); closeModal(); render();
        toast('Registro eliminado', 'ok');
      })
    );
  }, 30);
}

/* =========================================================
   Probar envío de emails
   ========================================================= */
document.getElementById('btn-test-email').addEventListener('click', async () => {
  const btn = document.getElementById('btn-test-email');
  const original = btn.textContent;
  btn.disabled = true; btn.textContent = '⏳ Enviando…';
  try{
    const { data: { session } } = await sb.auth.getSession();
    if(!session){ toast('No hay sesión activa.', 'error'); return; }
    const url = `${CFG.SUPABASE_URL}/functions/v1/enviar-avisos`;
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${session.access_token}` },
      body: JSON.stringify({ ping: true }),
    });
    let json = null;
    try { json = await res.json(); } catch(_) { json = { error: 'Respuesta no válida' }; }
    if(!res.ok || !json.ok){ console.error('Error test email:', json); toast('❌ Error: ' + (json.error || res.statusText), 'error'); return; }
    toast(`✅ Email de prueba enviado a ${json.email}. Revisa tu bandeja (y spam).`, 'ok');
  }catch(err){
    console.error(err);
    toast('Error de red: ' + err.message, 'error');
  }finally{
    btn.disabled = false; btn.textContent = original;
  }
});

document.getElementById('btn-test-avisos').addEventListener('click', async () => {
  const btn = document.getElementById('btn-test-avisos');
  const original = btn.textContent;
  if(vehicles.length === 0){ toast('Añade primero algún vehículo.', 'error'); return; }
  btn.disabled = true; btn.textContent = '⏳ Enviando…';
  try{
    const { data: { session } } = await sb.auth.getSession();
    if(!session){ toast('No hay sesión activa.', 'error'); return; }
    const url = `${CFG.SUPABASE_URL}/functions/v1/enviar-avisos`;
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${session.access_token}` },
      body: JSON.stringify({ test: true }),
    });
    let json = null;
    try { json = await res.json(); } catch(_) { json = { error: 'Respuesta no válida' }; }
    if(!res.ok || json.error){ console.error('Error:', json); toast('Error: ' + (json.error || res.statusText), 'error'); return; }
    const resultados = json.resultados || [];
    const totalAvisos = resultados.reduce((s,r) => s + (r.enviados || 0), 0);
    const totalVehiculos = resultados.length;
    const errores = resultados.filter(r => r.error);
    if(errores.length && totalAvisos === 0){ toast('No se pudo enviar: ' + errores[0].error, 'error'); return; }
    if(totalAvisos === 0){
      toast(`Prueba completada. No hay avisos pendientes en ${totalVehiculos} vehículo${totalVehiculos===1?'':'s'}.`, 'info');
    } else {
      toast(`✅ Email enviado: ${totalAvisos} aviso${totalAvisos===1?'':'s'} de ${totalVehiculos} vehículo${totalVehiculos===1?'':'s'}.`, 'ok');
    }
  }catch(err){
    console.error(err);
    toast('Error de red: ' + err.message, 'error');
  }finally{
    btn.disabled = false; btn.textContent = original;
  }
});
