<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi Garaje — Control de mantenimiento</title>
<script>window.process = window.process || { env: {} };</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<style>
:root{
  --bg:#f4f6fa; --card:#ffffff; --text:#131a2b; --muted:#68738a;
  --border:#e2e7f0; --accent:#2563eb; --accent-dark:#1d4ed8;
  --ok:#16a34a; --ok-bg:#e8f7ee;
  --warn:#b45309; --warn-bg:#fef3c7;
  --danger:#dc2626; --danger-bg:#fee2e2;
  --radius:14px;
  --shadow:0 1px 2px rgba(16,24,40,.05), 0 12px 28px -16px rgba(16,24,40,.25);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0e1420; --card:#161e2e; --text:#e8edf7; --muted:#93a0b8;
    --border:#26314a; --accent:#3b82f6; --accent-dark:#2563eb;
    --ok:#4ade80; --ok-bg:#14301f;
    --warn:#fbbf24; --warn-bg:#3a2c0a;
    --danger:#f87171; --danger-bg:#3b1414;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 28px -16px rgba(0,0,0,.7);
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:var(--bg); color:var(--text); line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{margin:0;line-height:1.25}
button{font:inherit;cursor:pointer}
input,select,textarea{
  font:inherit;padding:10px 12px;border:1px solid var(--border);border-radius:10px;
  background:var(--card);color:var(--text);width:100%;
}
input[type=file]{
  padding:8px 10px;font-size:.82rem;cursor:pointer;
}
input[type=file]::file-selector-button{
  font:inherit;font-size:.8rem;font-weight:600;
  padding:6px 12px;margin-right:10px;
  border:1px solid var(--border);border-radius:8px;
  background:var(--bg);color:var(--text);cursor:pointer;
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
label{display:flex;flex-direction:column;gap:6px;font-size:.78rem;font-weight:700;color:var(--muted);letter-spacing:.02em;text-transform:uppercase}

header{
  position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--border);
}
.header-in{
  max-width:1180px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;
}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.15rem;letter-spacing:-.02em}
.logo .mark{
  width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:1.1rem;
  background:linear-gradient(135deg,var(--accent),#7c3aed);color:#fff;
}
.header-actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.user-chip{
  display:flex;align-items:center;gap:8px;padding:5px 10px;border-radius:999px;
  background:var(--bg);border:1px solid var(--border);font-size:.8rem;font-weight:600;color:var(--muted);
  max-width:220px;
}
.user-chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

main{max-width:1180px;margin:0 auto;padding:22px 20px 60px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.section{margin-bottom:20px}
.section-head{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.section-head h2{font-size:1.05rem}
.section-head .spacer{margin-left:auto}

.btn{
  border:1px solid transparent;border-radius:10px;padding:9px 14px;font-weight:600;font-size:.88rem;
  display:inline-flex;align-items:center;gap:7px;transition:.15s;white-space:nowrap;
  background:var(--card);color:var(--text);border-color:var(--border);
}
.btn:hover{transform:translateY(-1px)}
.btn:disabled{opacity:.55;cursor:not-allowed;transform:none}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.primary:hover{background:var(--accent-dark)}
.btn.ghost{background:transparent;border-color:var(--border);color:var(--muted)}
.btn.ghost:hover{color:var(--text);border-color:var(--muted)}
.btn.danger{background:transparent;border-color:var(--border);color:var(--danger)}
.btn.danger:hover{background:var(--danger-bg);border-color:var(--danger)}
.btn.sm{padding:6px 10px;font-size:.8rem}
.btn.tiny{padding:4px 9px;font-size:.74rem;border-radius:8px}
.icon-btn{
  border:none;background:transparent;color:var(--muted);border-radius:8px;width:30px;height:30px;
  display:grid;place-items:center;font-size:.95rem;
}
.icon-btn:hover{background:var(--bg);color:var(--text)}

.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:18px}
.tab{
  border:1px solid var(--border);background:var(--card);border-radius:12px;padding:10px 16px;
  display:flex;flex-direction:column;gap:2px;min-width:150px;text-align:left;transition:.15s;
}
.tab:hover{border-color:var(--accent)}
.tab.active{border-color:var(--accent);background:var(--accent);color:#fff}
.tab.active .tab-sub{color:rgba(255,255,255,.8)}
.tab-name{font-weight:700;font-size:.92rem}
.tab-sub{font-size:.74rem;color:var(--muted);font-weight:600}

.vehicle-head{padding:20px;display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap}
.plate{
  background:#fff;color:#111;border:2px solid #111;border-radius:8px;padding:6px 12px 6px 8px;
  font-weight:800;letter-spacing:.06em;font-size:1rem;display:inline-flex;align-items:center;gap:8px;
  font-family:ui-monospace,"SFMono-Regular",Menlo,monospace;
}
.plate::before{content:"";display:block;width:8px;height:22px;border-radius:2px;background:#003399}
@media (prefers-color-scheme: dark){ .plate{border-color:#cbd5e1} }
.vehicle-title{flex:1;min-width:220px}
.vehicle-title h2{font-size:1.35rem;letter-spacing:-.02em}
.vehicle-meta{color:var(--muted);font-size:.86rem;margin-top:4px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.dot{width:4px;height:4px;border-radius:50%;background:var(--muted);display:inline-block}
.km-box{text-align:right}
.km-box .big{font-size:1.5rem;font-weight:800;letter-spacing:-.02em}
.km-box .lbl{font-size:.74rem;color:var(--muted);text-transform:uppercase;font-weight:700;letter-spacing:.04em}

.docs{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.doc{border:1px solid var(--border);border-radius:12px;padding:14px;background:var(--card);position:relative;overflow:hidden}
.doc .name{font-size:.74rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.doc .date{font-size:1.15rem;font-weight:700;margin-top:6px}
.doc .sub{font-size:.78rem;margin-top:6px;font-weight:600}
.doc.ok .sub{color:var(--ok)}
.doc.warn{border-color:var(--warn)}
.doc.warn .sub{color:var(--warn)}
.doc.danger{border-color:var(--danger)}
.doc.danger .sub{color:var(--danger)}
.doc .bar{position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--border)}
.doc.ok .bar{background:var(--ok)}
.doc.warn .bar{background:var(--warn)}
.doc.danger .bar{background:var(--danger)}
.doc .actions{margin-top:10px;display:flex;gap:6px;flex-wrap:wrap}
.doc .no-file{font-size:.72rem;color:var(--muted);font-style:italic;margin-top:10px}
.doc .doc-extra{
  margin-top:10px;padding-top:10px;border-top:1px dashed var(--border);
  display:flex;flex-direction:column;gap:4px;font-size:.78rem;color:var(--text);
  font-weight:600;letter-spacing:0;text-transform:none;
}
.doc .doc-extra .lbl{color:var(--muted);font-weight:700;font-size:.72rem;text-transform:uppercase;letter-spacing:.03em;margin-right:4px}

.alert{
  display:flex;gap:10px;align-items:center;padding:11px 14px;border-radius:11px;font-size:.87rem;
  font-weight:600;margin-bottom:8px;border:1px solid transparent;
}
.alert.warn{background:var(--warn-bg);color:var(--warn);border-color:color-mix(in srgb,var(--warn) 30%,transparent)}
.alert.danger{background:var(--danger-bg);color:var(--danger);border-color:color-mix(in srgb,var(--danger) 30%,transparent)}
.alert.info{background:var(--ok-bg);color:var(--ok);border-color:color-mix(in srgb,var(--ok) 30%,transparent)}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{border:1px solid var(--border);border-radius:12px;padding:14px;background:var(--card)}
.stat .k{font-size:.74rem;text-transform:uppercase;font-weight:800;letter-spacing:.05em;color:var(--muted)}
.stat .v{font-size:1.35rem;font-weight:800;letter-spacing:-.02em;margin-top:4px}

.table-wrap{overflow-x:auto;border-radius:var(--radius)}
table{width:100%;border-collapse:collapse;font-size:.88rem;min-width:720px}
thead th{
  text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);
  padding:12px 14px;border-bottom:1px solid var(--border);font-weight:800;background:var(--bg);
}
tbody td{padding:12px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--bg)}
.tag{
  display:inline-block;padding:3px 9px;border-radius:999px;font-size:.74rem;font-weight:700;
  background:var(--bg);border:1px solid var(--border);color:var(--text);
}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:.72rem;font-weight:800}
.badge.ok{background:var(--ok-bg);color:var(--ok)}
.badge.warn{background:var(--warn-bg);color:var(--warn)}
.badge.danger{background:var(--danger-bg);color:var(--danger)}
.muted{color:var(--muted)}
.row-actions{display:flex;gap:4px;justify-content:flex-end}

.empty{text-align:center;padding:70px 24px}
.empty .emoji{font-size:3.2rem}
.empty h2{margin:14px 0 8px}
.empty p{color:var(--muted);max-width:440px;margin:0 auto 22px}

.overlay{
  position:fixed;inset:0;background:rgba(10,15,25,.55);backdrop-filter:blur(3px);
  display:flex;align-items:flex-start;justify-content:center;padding:24px 16px;z-index:100;
  overflow-y:auto;animation:fade .15s ease;
}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{
  background:var(--card);border-radius:16px;width:100%;max-width:760px;box-shadow:0 24px 60px -12px rgba(0,0,0,.5);
  animation:pop .18s ease;margin:auto;
}
@keyframes pop{from{transform:translateY(10px) scale(.98);opacity:0}to{transform:none;opacity:1}}
.modal-head{display:flex;align-items:center;gap:12px;padding:18px 20px;border-bottom:1px solid var(--border)}
.modal-head h3{font-size:1.05rem;flex:1}
.modal-body{padding:20px;display:flex;flex-direction:column;gap:16px}
.modal-body h4{
  font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);
  margin-top:6px;padding-bottom:6px;border-bottom:1px dashed var(--border);
}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:16px 20px;border-top:1px solid var(--border)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:560px){ .grid2,.grid3{grid-template-columns:1fr} }
.hint{font-size:.76rem;color:var(--muted);font-weight:500;text-transform:none;letter-spacing:0}

footer.site{text-align:center;color:var(--muted);font-size:.78rem;padding:0 20px 40px}

.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  background:#111827;color:#fff;padding:11px 18px;border-radius:10px;
  font-size:.86rem;font-weight:600;z-index:200;box-shadow:0 12px 30px rgba(0,0,0,.35);
  animation:pop .2s ease;max-width:90%;
}
.toast.ok{background:#16a34a}
.toast.error{background:#dc2626}

/* Materiales */
.material-row{
  display:grid;
  grid-template-columns: 90px 2fr 0.7fr 0.9fr 1.4fr auto;
  gap:8px;
  align-items:start;
  margin-bottom:10px;
  padding-bottom:10px;
  border-bottom:1px dashed var(--border);
}
.material-row:last-child{border-bottom:none;padding-bottom:0;margin-bottom:0}
.material-row input{padding:8px 10px;font-size:.85rem}
@media(max-width:780px){
  .material-row{grid-template-columns:90px 1fr 1fr;grid-auto-rows:auto}
  .material-row input[data-field="nombre"]{grid-column:2/-1}
  .material-row input[data-field="tienda"]{grid-column:2/-1}
  .material-row button[data-remove]{grid-column:3;justify-self:end}
}
.mat-img-cell{
  display:flex;flex-direction:column;gap:4px;align-items:center;
  padding-top:2px;
}
.mat-img{
  width:78px;height:78px;border-radius:10px;object-fit:cover;
  border:1px solid var(--border);background:var(--bg);display:block;
}
.mat-img-placeholder{
  display:grid;place-items:center;cursor:pointer;
  font-size:1.6rem;color:var(--muted);
}
.mat-img-placeholder:hover{border-color:var(--accent);color:var(--accent)}
.mat-img-empty{
  width:78px;height:78px;border-radius:10px;border:1px dashed var(--border);
  display:grid;place-items:center;font-size:.68rem;font-weight:700;color:var(--muted);
  text-align:center;background:var(--bg);line-height:1.15;padding:4px;
  text-transform:uppercase;letter-spacing:.03em;
}
.mat-img-btn{
  border:none;background:transparent;color:var(--accent);font-size:.68rem;
  font-weight:800;text-transform:uppercase;letter-spacing:.03em;padding:0;cursor:pointer;
}
.mat-img-btn:hover{text-decoration:underline}

.total-box{
  margin-top:12px;padding:12px 14px;border-radius:10px;
  background:var(--bg);border:1px solid var(--border);
  display:flex;justify-content:space-between;align-items:center;
  font-size:.9rem;font-weight:600;
}
.total-box strong{font-size:1.1rem}
.link-btn{
  border:none;background:transparent;color:var(--accent);font-size:.76rem;
  font-weight:700;padding:0;margin-top:3px;cursor:pointer;display:block;
}
.link-btn:hover{text-decoration:underline}
.detail-row td{padding:0!important;background:var(--bg)}
.mats-wrap{padding:14px 16px}
.mats-table{width:100%;border-collapse:collapse;font-size:.82rem;min-width:0}
.mats-table th,.mats-table td{padding:6px 10px;text-align:left;border-bottom:1px solid var(--border)}
.mats-table th{font-size:.7rem;text-transform:uppercase;color:var(--muted);font-weight:800;background:transparent}
.mats-table tr:last-child td{border-bottom:none}
.mats-total{text-align:right;margin-top:8px;font-size:.82rem;color:var(--muted)}
.mats-total strong{color:var(--text)}

.mat-thumb{
  width:44px;height:44px;border-radius:8px;object-fit:cover;
  border:1px solid var(--border);background:var(--bg);display:block;cursor:pointer;
}
.mat-thumb-tag{
  display:grid;place-items:center;font-size:1.15rem;color:var(--muted);
}
.mat-thumb-tag:hover{border-color:var(--accent);color:var(--accent)}

#app-view[hidden]{display:none}
</style>
</head>
<body>

<div id="app-view" hidden>
  <header>
    <div class="header-in">
      <div class="logo"><span class="mark">🚗</span> Mi Garaje</div>
      <div class="header-actions">
        <div class="user-chip"><span id="user-email">—</span></div>
        <button class="btn ghost sm" id="btn-logout" title="Cerrar sesión">Salir</button>
        <button class="btn primary" id="btn-add-vehicle">＋ Añadir vehículo</button>
      </div>
    </div>
  </header>

  <main>
    <div class="tabs" id="tabs"></div>
    <div id="content"></div>
  </main>

  <footer class="site">Los datos se guardan en tu cuenta de Supabase.</footer>
</div>

<div id="modal"></div>

<script>
/* =========================================================
   Configuración
   ========================================================= */
const CFG = window.MIGARAJE_CONFIG || {};

if(!CFG.SUPABASE_URL || !CFG.SUPABASE_ANON_KEY ||
   CFG.SUPABASE_URL.includes('TU-PROYECTO') ||
   CFG.SUPABASE_ANON_KEY.includes('TU-ANON')){
  document.body.innerHTML = `
    <div style="max-width:640px;margin:60px auto;padding:24px;font-family:system-ui;line-height:1.6">
      <h1>⚠️ Falta configurar Supabase</h1>
      <p>Abre el archivo <code>config.js</code> y rellena los dos valores.</p>
    </div>`;
  throw new Error('Falta config.js');
}

const { createClient } = window.supabase;
const sb = createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY, {
  auth: { persistSession: true, autoRefreshToken: true }
});

const BUCKET = 'documentos';

/* =========================================================
   Utilidades
   ========================================================= */
const eur = new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR',maximumFractionDigits:2});
const num = new Intl.NumberFormat('es-ES');
const money = n => eur.format(Number(n)||0);
const kmFmt = n => num.format(Number(n)||0) + ' km';

function esc(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtDate(iso){
  if(!iso) return '—';
  const [y,m,d] = iso.split('-');
  if(!y||!m||!d) return '—';
  return `${d}/${m}/${y}`;
}
function todayISO(){
  const d = new Date();
  return new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().slice(0,10);
}
function daysUntil(iso){
  if(!iso) return null;
  const today = new Date(); today.setHours(0,0,0,0);
  const t = new Date(iso + 'T00:00:00');
  if(isNaN(t)) return null;
  return Math.round((t - today) / 86400000);
}
function pluralDias(n){ return n === 1 ? '1 día' : n + ' días'; }
function uid(){
  return crypto.randomUUID
    ? crypto.randomUUID()
    : Date.now().toString(36)+Math.random().toString(36).slice(2,8);
}
function toast(msg, type='info'){
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 3200);
}

/* =========================================================
   Catálogos
   ========================================================= */
const COMBUSTIBLES = ['Gasolina','Diésel','Híbrido','Híbrido enchufable','Eléctrico','GLP','GNC','Otro'];
const TIPOS_MANT = [
  'Cambio de aceite y filtros','Filtro de aire','Filtro de combustible','Filtro de habitáculo',
  'Frenos (pastillas/discos)','Neumáticos','Batería','Correa de distribución','Bujías',
  'Líquido de frenos','Refrigerante','Aire acondicionado','Revisión oficial',
  'ITV','Escobillas limpiaparabrisas','Suspensión','Embrague','Diagnosis / electrónica','Otros'
];
const TIPOS_SEGURO = [
  'Terceros',
  'Terceros ampliado',
  'Terceros con lunas',
  'Todo riesgo con franquicia',
  'Todo riesgo sin franquicia',
  'Otro'
];

/* =========================================================
   Mapeo mantenimiento
   ========================================================= */
function mantFromDB(row){
  return {
    id: row.id,
    tipo: row.tipo || '',
    fecha: row.fecha || '',
    km: row.km ?? '',
    coste: row.coste ?? 0,
    taller: row.taller || '',
    proximaFecha: row.proxima_fecha || '',
    proximoKm: row.proximo_km ?? '',
    notas: row.notas || '',
    materiales: Array.isArray(row.materiales) ? row.materiales : []
  };
}
function mantToDB(m, vehicleId){
  return {
    vehicle_id: vehicleId,
    tipo: m.tipo || null,
    fecha: m.fecha || null,
    km: m.km === '' || m.km == null ? null : Number(m.km),
    coste: Number(m.coste) || 0,
    taller: m.taller || null,
    proxima_fecha: m.proximaFecha || null,
    proximo_km: m.proximoKm === '' || m.proximoKm == null ? null : Number(m.proximoKm),
    notas: m.notas || null,
    materiales: Array.isArray(m.materiales) ? m.materiales.map(x => ({
      nombre:   String(x.nombre || '').trim(),
      cantidad: x.cantidad === '' || x.cantidad == null ? null : Number(x.cantidad),
      precio:   x.precio   === '' || x.precio   == null ? null : Number(x.precio),
      tienda:   String(x.tienda || '').trim(),
      imagen:   String(x.imagen || '')
    })) : []
  };
}

/* =========================================================
   Estado
   ========================================================= */
let currentUser = null;
let vehicles = [];
let selected = null;

const appView   = document.getElementById('app-view');
const modalRoot = document.getElementById('modal');

document.getElementById('btn-logout').addEventListener('click', async () => {
  if(!confirm('¿Cerrar sesión?')) return;
  await sb.auth.signOut();
  window.location.replace('login.html');
});

/* =========================================================
   Sesión
   ========================================================= */
(async () => {
  const { data: { session } } = await sb.auth.getSession();
  if(!session){
    window.location.replace('login.html');
    return;
  }
  currentUser = session.user;
  await entrar();
})();

sb.auth.onAuthStateChange((event) => {
  if(event === 'SIGNED_OUT') window.location.replace('login.html');
});

async function entrar(){
  appView.hidden = false;
  document.getElementById('user-email').textContent = currentUser?.email || '';

  try{
    await loadData();
  }catch(err){
    console.error('Error cargando datos desde Supabase:', err);
    vehicles = [];
    selected = null;
    setTimeout(() => toast('No se han podido cargar los datos: ' + (err?.message || 'Error'), 'error'), 200);
  }
  render();
}

/* =========================================================
   Carga
   ========================================================= */
async function loadData(){
  const [vRes, mRes] = await Promise.all([
    sb.from('vehicles').select('*').order('created_at', { ascending: true }),
    sb.from('mantenimientos').select('*').order('created_at', { ascending: true })
  ]);
  if(vRes.error) throw vRes.error;
  if(mRes.error) throw mRes.error;

  const mantsByVehicle = new Map();
  mRes.data.forEach(m => {
    if(!mantsByVehicle.has(m.vehicle_id)) mantsByVehicle.set(m.vehicle_id, []);
    mantsByVehicle.get(m.vehicle_id).push(mantFromDB(m));
  });

  vehicles = vRes.data.map(v => ({
    ...v,
    km: Number(v.km) || 0,
    mantenimientos: mantsByVehicle.get(v.id) || []
  }));

  if(!selected || !vehicles.find(v => v.id === selected)){
    selected = vehicles[0]?.id || null;
  }
}

/* =========================================================
   Storage
   ========================================================= */
async function subirDocumento(file, vehicleId, tipo){
  if(!file || file.size === 0) return null;
  const ext = (file.name.split('.').pop() || 'bin').toLowerCase();
  const path = `${currentUser.id}/${vehicleId}/${tipo}.${ext}`;

  const { error } = await sb.storage.from(BUCKET).upload(path, file, {
    upsert: true,
    cacheControl: '3600',
    contentType: file.type || 'application/octet-stream'
  });
  if(error) throw error;
  return path;
}

async function subirMaterialImagen(file, vehicleId, materialId){
  if(!file || file.size === 0) return null;
  const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
  const path = `${currentUser.id}/${vehicleId}/material_${materialId}.${ext}`;

  const { error } = await sb.storage.from(BUCKET).upload(path, file, {
    upsert: true,
    cacheControl: '3600',
    contentType: file.type || 'image/jpeg'
  });
  if(error) throw error;
  return path;
}

async function verDocumento(path){
  if(!path) return;
  const { data, error } = await sb.storage.from(BUCKET).createSignedUrl(path, 3600);
  if(error) return toast('No se pudo abrir el archivo: ' + error.message, 'error');
  window.open(data.signedUrl, '_blank', 'noopener');
}

async function borrarDocumento(path){
  if(!path) return;
  const { error } = await sb.storage.from(BUCKET).remove([path]);
  if(error) console.warn('No se pudo borrar el archivo:', error.message);
}

async function borrarCarpetaVehiculo(vehicleId){
  const prefix = `${currentUser.id}/${vehicleId}`;
  const { data: files, error } = await sb.storage.from(BUCKET).list(prefix);
  if(error || !files?.length) return;
  const paths = files.map(f => `${prefix}/${f.name}`);
  await sb.storage.from(BUCKET).remove(paths);
}

function docCard(nombre, iso, warnDays, extraHtml){
  const d = daysUntil(iso);
  let cls = 'ok', sub = '';
  if(d === null){ cls = ''; sub = 'Sin fecha'; }
  else if(d < 0){ cls = 'danger'; sub = `Vencido hace ${pluralDias(Math.abs(d))}`; }
  else if(d <= warnDays){ cls = 'warn'; sub = `Vence en ${pluralDias(d)}`; }
  else { cls = 'ok'; sub = `Quedan ${pluralDias(d)}`; }
  return `<div class="doc ${cls}"><div class="bar"></div>
    <div class="name">${nombre}</div>
    <div class="date">${fmtDate(iso)}</div>
    <div class="sub">${sub}</div>
    ${extraHtml ? `<div class="doc-extra">${extraHtml}</div>` : ''}
  </div>`;
}

function docFileCard(nombre, path){
  const tieneArchivo = !!path;
  return `<div class="doc ${tieneArchivo ? 'ok' : ''}"><div class="bar"></div>
    <div class="name">${nombre}</div>
    ${tieneArchivo
      ? `<div class="actions" style="margin-top:8px">
           <button type="button" class="btn ghost tiny" data-ver-doc="${esc(path)}">📄 Ver documento</button>
         </div>`
      : `<div class="no-file">Sin documento adjunto</div>`}
  </div>`;
}

function mantRow(m, v){
  let prox = '<span class="muted">—</span>';
  if(m.proximaFecha || m.proximoKm){
    const partes = [];
    if(m.proximaFecha){
      const d = daysUntil(m.proximaFecha);
      let cls = 'ok';
      if(d !== null && d < 0) cls = 'danger';
      else if(d !== null && d <= 30) cls = 'warn';
      partes.push(`<span class="badge ${cls}">${fmtDate(m.proximaFecha)}</span>`);
    }
    if(m.proximoKm){
      const rest = Number(m.proximoKm) - (Number(v.km)||0);
      let cls = 'ok';
      if(rest <= 0) cls = 'danger';
      else if(rest <= 1000) cls = 'warn';
      partes.push(`<span class="badge ${cls}">${kmFmt(m.proximoKm)}</span>`);
    }
    prox = `<div style="display:flex;gap:5px;flex-wrap:wrap">${partes.join('')}</div>`;
  }

  const mats = Array.isArray(m.materiales) ? m.materiales : [];
  const totalMats = mats.reduce((s,x) => s + (Number(x.cantidad)||0) * (Number(x.precio)||0), 0);
  const totalCoste = (Number(m.coste)||0) + totalMats;
  const hasMats = mats.length > 0;
  const matsConFoto = mats.filter(x => x.imagen).length;
  const detailId = 'det-' + m.id;

  const mainRow = `<tr>
    <td><span class="tag">${esc(m.tipo || 'Otros')}</span></td>
    <td>${fmtDate(m.fecha)}</td>
    <td>${m.km ? kmFmt(m.km) : '<span class="muted">—</span>'}</td>
    <td>
      <strong>${totalCoste ? money(totalCoste) : '<span class="muted">—</span>'}</strong>
      ${hasMats ? `<button type="button" class="link-btn" data-toggle="${detailId}">
        🔧 ${mats.length} material${mats.length===1?'':'es'}${matsConFoto ? ` · 📷 ${matsConFoto}` : ''}
      </button>` : ''}
    </td>
    <td>${m.taller ? esc(m.taller) : '<span class="muted">—</span>'}</td>
    <td>${prox}</td>
    <td>
      <div class="row-actions">
        <button class="icon-btn" title="Editar" data-edit-mant="${m.id}">✎</button>
        <button class="icon-btn" title="Eliminar" data-del-mant="${m.id}">🗑</button>
      </div>
    </td>
  </tr>`;

  const detailRow = hasMats ? `
    <tr id="${detailId}" class="detail-row" hidden>
      <td colspan="7">
        <div class="mats-wrap">
          <table class="mats-table">
            <thead><tr>
              <th>Foto</th><th>Material</th><th>Cantidad</th><th>Precio unit.</th><th>Subtotal</th><th>Dónde se compró</th>
            </tr></thead>
            <tbody>
              ${mats.map(x => {
                const sub = (Number(x.cantidad)||0) * (Number(x.precio)||0);
                return `<tr>
                  <td>
                    ${x.imagen
                      ? `<div class="mat-thumb mat-thumb-tag" data-ver-doc="${esc(x.imagen)}" title="Ver imagen">📷</div>`
                      : '<span class="muted">—</span>'}
                  </td>
                  <td>${esc(x.nombre || '—')}</td>
                  <td>${x.cantidad ?? '—'}</td>
                  <td>${x.precio != null && x.precio !== '' ? money(x.precio) : '—'}</td>
                  <td><strong>${money(sub)}</strong></td>
                  <td>${esc(x.tienda || '—')}</td>
                </tr>`;
              }).join('')}
            </tbody>
          </table>
          <div class="mats-total">
            Mano de obra: <strong>${money(m.coste)}</strong> ·
            Materiales: <strong>${money(totalMats)}</strong> ·
            Total: <strong>${money(totalCoste)}</strong>
          </div>
        </div>
      </td>
    </tr>` : '';

  return mainRow + detailRow;
}

function getAlerts(v){
  const out = [];
  const check = (label, iso, warnDays) => {
    const d = daysUntil(iso);
    if(d === null) return;
    if(d < 0) out.push({ level:'danger', text:`${label} vencido hace ${pluralDias(Math.abs(d))} (${fmtDate(iso)})` });
    else if(d <= warnDays) out.push({ level:'warn', text:`${label} vence en ${pluralDias(d)} — ${fmtDate(iso)}` });
  };
  check('ITV', v.itv, 30);
  check('Seguro', v.seguro, 21);
  check('Impuesto de circulación (IVTM)', v.impuesto, 30);

  (v.mantenimientos || []).forEach(m => {
    if(m.proximaFecha){
      const d = daysUntil(m.proximaFecha);
      if(d !== null && d <= 30)
        out.push({ level: d < 0 ? 'danger' : 'warn',
                   text: `${m.tipo || 'Mantenimiento'} ${d < 0 ? 'pendiente desde hace ' + pluralDias(Math.abs(d)) : 'programado en ' + pluralDias(d)}` });
    }
    if(m.proximoKm){
      const rest = Number(m.proximoKm) - (Number(v.km) || 0);
      if(rest <= 1000)
        out.push({ level: rest <= 0 ? 'danger' : 'warn',
                   text: `${m.tipo || 'Mantenimiento'} ${rest <= 0 ? 'superado por ' + kmFmt(Math.abs(rest)) : 'en ' + kmFmt(rest)}` });
    }
  });

  if(!out.length) out.push({ level:'info', text:'Todo en orden. No hay avisos próximos.' });
  return out.sort((a,b) => {
    const r = x => x === 'danger' ? 0 : x === 'warn' ? 1 : 2;
    return r(a.level) - r(b.level);
  });
}

function openModal(title, bodyHtml, onSubmit, submitLabel = 'Guardar'){
  modalRoot.innerHTML = `
    <div class="overlay">
      <div class="modal" role="dialog" aria-modal="true">
        <div class="modal-head">
          <h3>${esc(title)}</h3>
          <button type="button" class="icon-btn" data-close>✕</button>
        </div>
        <form id="modal-form" novalidate>
          <div class="modal-body">${bodyHtml}</div>
          <div class="modal-foot">
            <button type="button" class="btn ghost" data-close>Cancelar</button>
            <button type="submit" class="btn primary" id="modal-submit">${esc(submitLabel)}</button>
          </div>
        </form>
      </div>
    </div>`;
  const overlay = modalRoot.querySelector('.overlay');
  overlay.addEventListener('click', e => { if(e.target === overlay) closeModal(); });
  modalRoot.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', closeModal));
  modalRoot.querySelector('#modal-form').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = document.getElementById('modal-submit');
    const orig = btn.textContent;
    btn.disabled = true; btn.textContent = 'Guardando…';
    try{
      await onSubmit(new FormData(e.target));
    }catch(err){
      console.error(err);
      alert('Error: ' + (err.message || err));
      btn.disabled = false; btn.textContent = orig;
    }
  });
  const first = modalRoot.querySelector('input,select,textarea');
  if(first) setTimeout(() => first.focus(), 40);
}
function closeModal(){ modalRoot.innerHTML = ''; }
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeModal(); });

          ${TIPOS_SEGURO.map(t => `<option ${v.seguro_tipo === t ? 'selected' : ''}>${t}</option>`).join('')}
        </select>
      </label>
      <label>Precio (€)
        <input type="number" min="0" step="0.01" name="seguro_precio" value="${esc(v.seguro_precio)}" placeholder="0,00">
      </label>
    </div>
    <label>Compañía aseguradora
      <input name="seguro_compania" value="${esc(v.seguro_compania)}" placeholder="Ej. Mapfre, Mutua Madrileña, Línea Directa…">
    </label>

    <h4>Impuesto de circulación (IVTM)</h4>
    <div class="grid2">
      <label>Vencimiento<input type="date" name="impuesto" value="${esc(v.impuesto)}"></label>
      <label>Precio (€)
        <input type="number" min="0" step="0.01" name="impuesto_precio" value="${esc(v.impuesto_precio)}" placeholder="0,00">
      </label>
    </div>
    <div class="hint">El IVTM se paga normalmente entre marzo y mayo en el ayuntamiento donde esté domiciliado el vehículo.</div>

    <label>Notas<textarea name="notas" rows="2" placeholder="Taller habitual, observaciones…">${esc(v.notas)}</textarea></label>
  `;

  openModal(esNuevo ? 'Nuevo vehículo' : 'Editar vehículo', body, async fd => {
    const data = {
      nombre:      (fd.get('nombre') || '').trim(),
      matricula:   (fd.get('matricula') || '').trim().toUpperCase(),
      marca:       (fd.get('marca') || '').trim(),
      modelo:      (fd.get('modelo') || '').trim(),
      anio:        (fd.get('anio') || '').trim(),
      combustible: fd.get('combustible') || '',
      bastidor:    (fd.get('bastidor') || '').trim().toUpperCase(),
      km:          Number(fd.get('km')) || 0,

      itv:            fd.get('itv') || null,
      itv_precio:     fd.get('itv_precio') ? Number(fd.get('itv_precio')) : null,
      itv_lugar:      (fd.get('itv_lugar') || '').trim(),

      seguro:         fd.get('seguro') || null,
      seguro_tipo:    fd.get('seguro_tipo') || '',
      seguro_precio:  fd.get('seguro_precio') ? Number(fd.get('seguro_precio')) : null,
      seguro_compania:(fd.get('seguro_compania') || '').trim(),

      impuesto:        fd.get('impuesto') || null,
      impuesto_precio: fd.get('impuesto_precio') ? Number(fd.get('impuesto_precio')) : null,

      notas: (fd.get('notas') || '').trim()
    };

    let vehicleId = id;

    if(id){
      const { error } = await sb.from('vehicles').update(data).eq('id', id);
      if(error) throw error;
    } else {
      const { data: inserted, error } = await sb.from('vehicles')
        .insert({ ...data, user_id: currentUser.id })
        .select('id').single();
      if(error) throw error;
      vehicleId = inserted.id;
      selected  = vehicleId;
    }

    const permisoFile = fd.get('permiso_file');
    if(permisoFile && permisoFile.size > 0){
      const path = await subirDocumento(permisoFile, vehicleId, 'permiso_circulacion');
      if(path){
        const { error } = await sb.from('vehicles')
          .update({ permiso_circulacion_path: path }).eq('id', vehicleId);
        if(error) throw error;
      }
    }

    const fichaFile = fd.get('ficha_file');
    if(fichaFile && fichaFile.size > 0){
      const path = await subirDocumento(fichaFile, vehicleId, 'ficha_tecnica');
      if(path){
        const { error } = await sb.from('vehicles')
          .update({ ficha_tecnica_path: path }).eq('id', vehicleId);
        if(error) throw error;
      }
    }

    await loadData();
    closeModal(); render();
    toast(id ? 'Vehículo actualizado' : 'Vehículo añadido', 'ok');
  }, esNuevo ? 'Añadir vehículo' : 'Guardar cambios');
}

async function deleteVehicle(id){
  const v = vehicles.find(x => x.id === id);
  if(!v) return;
  if(!confirm(`¿Eliminar «${v.nombre || v.matricula}» y todo su historial?\n\nEsta acción no se puede deshacer.`)) return;

  await borrarCarpetaVehiculo(id);

  const { error } = await sb.from('vehicles').delete().eq('id', id);
  if(error) return toast('Error: ' + error.message, 'error');
  if(selected === id) selected = null;
  await loadData();
  render();
  toast('Vehículo eliminado', 'ok');
}

function openKmForm(id){
  const v = vehicles.find(x => x.id === id);
  if(!v) return;
  openModal('Actualizar kilómetros',
    `<label>Kilómetros actuales<input name="km" type="number" min="0" step="1" value="${esc(v.km)}" required></label>`,
    async fd => {
      const km = Number(fd.get('km')) || 0;
      const { error } = await sb.from('vehicles').update({ km }).eq('id', id);
      if(error) throw error;
      await loadData();
      closeModal(); render();
      toast('Kilómetros actualizados', 'ok');
    }, 'Actualizar');
}

/* =========================================================
   CRUD mantenimientos (con imágenes en los materiales)
   ========================================================= */
function openMantForm(vehicleId, mantId){
  const v = vehicles.find(x => x.id === vehicleId);
  if(!v) return;
  const m = mantId ? v.mantenimientos.find(x => x.id === mantId) : {};
  const esNuevo = !mantId;

  let mats = Array.isArray(m.materiales) ? m.materiales.map(x => ({
    id: x.id || uid(),
    nombre:   x.nombre   || '',
    cantidad: x.cantidad ?? '',
    precio:   x.precio   ?? '',
    tienda:   x.tienda   || '',
    imagen:   x.imagen   || '',
    _file:    null,
    _preview: null
  })) : [];

  const body = `
    <div class="grid2">
      <label>Tipo de intervención
        <select name="tipo" required>
          ${TIPOS_MANT.map(t => `<option ${m.tipo === t ? 'selected' : ''}>${t}</option>`).join('')}
        </select>
      </label>
      <label>Fecha<input type="date" name="fecha" value="${esc(m.fecha || todayISO())}" required></label>
      <label>Kilómetros del vehículo<input type="number" min="0" step="1" name="km" value="${esc(m.km ?? v.km)}"></label>
      <label>Mano de obra / servicio (€)<input type="number" min="0" step="0.01" name="coste" value="${esc(m.coste)}" placeholder="0,00"></label>
    </div>
    <label>Taller / proveedor<input name="taller" value="${esc(m.taller)}" placeholder="Ej. Talleres Pérez"></label>

    <h4>Materiales utilizados</h4>
    <div id="materiales-list"></div>
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:4px">
      <button type="button" class="btn ghost sm" id="add-material">＋ Añadir material</button>
      <div class="hint">Materiales: <strong id="materiales-total">0,00 €</strong></div>
    </div>

    <h4>Próximo aviso (opcional)</h4>
    <div class="grid2">
      <label>Fecha próxima<input type="date" name="proximaFecha" value="${esc(m.proximaFecha)}"></label>
      <label>Km próximos<input type="number" min="0" step="1" name="proximoKm" value="${esc(m.proximoKm)}" placeholder="Ej. 135000"></label>
    </div>

    <label>Notas<textarea name="notas" rows="2" placeholder="Referencias, marca del aceite…">${esc(m.notas)}</textarea></label>

    <div class="total-box">
      <span>Total intervención</span>
      <strong id="total-intervencion">0,00 €</strong>
    </div>
  `;

  openModal(esNuevo ? 'Nueva intervención' : 'Editar intervención', body, async fd => {
    for(const mat of mats){
      if(mat._file && mat._file.size > 0){
        try{
          const path = await subirMaterialImagen(mat._file, vehicleId, mat.id);
          if(path) mat.imagen = path;
        }catch(err){
          console.warn('Error subiendo imagen de material:', err);
          toast('No se pudo subir la imagen de «' + (mat.nombre || 'material') + '»', 'error');
        }
      }
    }

    const data = {
      tipo:         fd.get('tipo') || 'Otros',
      fecha:        fd.get('fecha') || '',
      km:           fd.get('km') ? Number(fd.get('km')) : '',
      coste:        fd.get('coste') ? Number(fd.get('coste')) : 0,
      taller:       (fd.get('taller') || '').trim(),
      proximaFecha: fd.get('proximaFecha') || '',
      proximoKm:    fd.get('proximoKm') ? Number(fd.get('proximoKm')) : '',
      notas:        (fd.get('notas') || '').trim(),
      materiales:   mats
        .filter(x => (x.nombre||'').trim() || x.cantidad || x.precio || (x.tienda||'').trim() || x.imagen)
        .map(x => ({
          id: x.id,
          nombre: x.nombre,
          cantidad: x.cantidad,
          precio: x.precio,
          tienda: x.tienda,
          imagen: x.imagen
        }))
    };

    const payload = mantToDB(data, vehicleId);

    if(mantId){
      const { error } = await sb.from('mantenimientos').update(payload).eq('id', mantId);
      if(error) throw error;
    } else {
      const { error } = await sb.from('mantenimientos').insert(payload);
      if(error) throw error;
    }

    if(data.km && Number(data.km) > (Number(v.km) || 0)){
      await sb.from('vehicles').update({ km: Number(data.km) }).eq('id', vehicleId);
    }

    await loadData();
    closeModal(); render();
    toast(esNuevo ? 'Intervención añadida' : 'Intervención actualizada', 'ok');
  }, esNuevo ? 'Añadir' : 'Guardar cambios');

  const listEl    = document.getElementById('materiales-list');
  const matTotalEl= document.getElementById('materiales-total');
  const totalEl   = document.getElementById('total-intervencion');
  const costeInput= document.querySelector('#modal-form [name="coste"]');

  const sumMats = () => mats.reduce((s,x) => s + (Number(x.cantidad)||0) * (Number(x.precio)||0), 0);
  function refreshTotals(){
    const t = sumMats();
    matTotalEl.textContent = money(t);
    totalEl.textContent    = money((Number(costeInput.value)||0) + t);
  }

  function imagenCell(x, i){
    let inner;
    if(x._preview){
      inner = `<img class="mat-img" src="${x._preview}" alt="Material">`;
    } else if(x.imagen){
      inner = `<div class="mat-img mat-img-placeholder" data-ver-doc="${esc(x.imagen)}" title="Ver imagen guardada">📷</div>`;
    } else {
      inner = `<div class="mat-img-empty">Sin foto</div>`;
    }
    return `
      <div class="mat-img-cell">
        ${inner}
        <button type="button" class="mat-img-btn" data-img-trigger="${i}">
          ${x._preview || x.imagen ? 'Cambiar' : 'Subir foto'}
        </button>
        <input type="file" accept="image/*" class="mat-img-input" data-idx="${i}" hidden>
      </div>`;
  }

  function renderMats(){
    if(!mats.length){
      listEl.innerHTML = '<div class="hint" style="padding:4px 0">Sin materiales añadidos.</div>';
    } else {
      listEl.innerHTML = mats.map((x,i) => `
        <div class="material-row" data-idx="${i}">
          ${imagenCell(x, i)}
          <input data-field="nombre"   placeholder="Material (ej. Aceite 5W30)" value="${esc(x.nombre)}">
          <input data-field="cantidad" type="number" step="0.01" min="0" placeholder="Cant." value="${esc(x.cantidad)}">
          <input data-field="precio"   type="number" step="0.01" min="0" placeholder="€ / ud." value="${esc(x.precio)}">
          <input data-field="tienda"   placeholder="Dónde lo compraste" value="${esc(x.tienda)}">
          <button type="button" class="icon-btn" data-remove="${i}" title="Quitar">✕</button>
        </div>
      `).join('');

      listEl.querySelectorAll('input[data-field]').forEach(inp => {
        inp.addEventListener('input', e => {
          const i = Number(e.target.closest('.material-row').dataset.idx);
          mats[i][e.target.dataset.field] = e.target.value;
          refreshTotals();
        });
      });

      listEl.querySelectorAll('[data-ver-doc]').forEach(el => {
        el.addEventListener('click', () => verDocumento(el.dataset.verDoc));
      });

      listEl.querySelectorAll('[data-img-trigger]').forEach(b => {
        b.addEventListener('click', () => {
          const i = Number(b.dataset.imgTrigger);
          const input = listEl.querySelector(`.mat-img-input[data-idx="${i}"]`);
          if(input) input.click();
        });
      });

      listEl.querySelectorAll('.mat-img-input').forEach(inp => {
        inp.addEventListener('change', e => {
          const i = Number(e.target.dataset.idx);
          const file = e.target.files[0];
          if(!file) return;
          mats[i]._file = file;
          mats[i]._preview = URL.createObjectURL(file);
          renderMats();
        });
      });

      listEl.querySelectorAll('[data-remove]').forEach(b => {
        b.addEventListener('click', () => {
          const i = Number(b.dataset.remove);
          const mat = mats[i];
          if(mat.imagen && !mat._file){
            borrarDocumento(mat.imagen);
          }
          mats.splice(i, 1);
          renderMats();
        });
      });
    }
    refreshTotals();
  }

  document.getElementById('add-material').addEventListener('click', () => {
    mats.push({
      id: uid(), nombre:'', cantidad:'', precio:'', tienda:'',
      imagen:'', _file:null, _preview:null
    });
    renderMats();
    const rows = listEl.querySelectorAll('.material-row');
    const last = rows[rows.length-1];
    if(last) last.querySelector('input[data-field="nombre"]').focus();
  });

  costeInput.addEventListener('input', refreshTotals);
  renderMats();
}

async function deleteMant(vehicleId, mantId){
  const v = vehicles.find(x => x.id === vehicleId);
  if(!v) return;
  const m = v.mantenimientos.find(x => x.id === mantId);
  if(!m) return;
  if(!confirm(`¿Eliminar la intervención «${m.tipo}» del ${fmtDate(m.fecha)}?`)) return;

  const imgs = (m.materiales || []).map(x => x.imagen).filter(Boolean);
  if(imgs.length) await sb.storage.from(BUCKET).remove(imgs);

  const { error } = await sb.from('mantenimientos').delete().eq('id', mantId);
  if(error) return toast('Error: ' + error.message, 'error');
  await loadData();
  render();
  toast('Intervención eliminada', 'ok');
}

   Botones globales
   ========================================================= */
document.getElementById('btn-add-vehicle').addEventListener('click', () => openVehicleForm());
</script>
