<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi Garaje</title>
<script>window.process=window.process||{env:{}};</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="config.js"></script>
<style>
:root{--bg:#f4f6fa;--card:#fff;--text:#131a2b;--muted:#68738a;--border:#e2e7f0;--accent:#2563eb;--accent-dark:#1d4ed8;--ok:#16a34a;--ok-bg:#e8f7ee;--warn:#b45309;--warn-bg:#fef3c7;--danger:#dc2626;--danger-bg:#fee2e2;--radius:14px;--shadow:0 1px 2px rgba(16,24,40,.05),0 12px 28px -16px rgba(16,24,40,.25)}
@media(prefers-color-scheme:dark){:root{--bg:#0e1420;--card:#161e2e;--text:#e8edf7;--muted:#93a0b8;--border:#26314a;--accent:#3b82f6;--accent-dark:#2563eb;--ok:#4ade80;--ok-bg:#14301f;--warn:#fbbf24;--warn-bg:#3a2c0a;--danger:#f87171;--danger-bg:#3b1414;--shadow:0 1px 2px rgba(0,0,0,.4),0 12px 28px -16px rgba(0,0,0,.7)}}
*{box-sizing:border-box}html,body{margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.5}
h1,h2,h3,h4{margin:0;line-height:1.25}button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--card);color:var(--text);width:100%}
input[type=file]{padding:8px 10px;font-size:.82rem}
input[type=checkbox]{width:auto}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);border-color:transparent}
label{display:flex;flex-direction:column;gap:6px;font-size:.78rem;font-weight:700;color:var(--muted);text-transform:uppercase}
header{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--border)}
.header-in{max-width:1180px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.15rem}
.logo .mark{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),#7c3aed);color:#fff}
.header-actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.user-chip{display:flex;align-items:center;gap:8px;padding:5px 10px;border-radius:999px;background:var(--bg);border:1px solid var(--border);font-size:.8rem;font-weight:600;color:var(--muted);max-width:220px}
.user-chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main{max-width:1180px;margin:0 auto;padding:22px 20px 60px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.section{margin-bottom:20px}
.section-head{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.section-head h2{font-size:1.05rem}
.section-head .spacer{margin-left:auto}
.btn{border:1px solid var(--border);border-radius:10px;padding:9px 14px;font-weight:600;font-size:.88rem;display:inline-flex;align-items:center;gap:7px;background:var(--card);color:var(--text);white-space:nowrap}
.btn:hover{transform:translateY(-1px)}
.btn:disabled{opacity:.55;cursor:not-allowed;transform:none}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.ghost{background:transparent;color:var(--muted)}
.btn.danger{background:transparent;color:var(--danger)}
.btn.sm{padding:6px 10px;font-size:.8rem}
.btn.tiny{padding:4px 9px;font-size:.74rem;border-radius:8px}
.icon-btn{border:none;background:transparent;color:var(--muted);border-radius:8px;width:30px;height:30px;display:grid;place-items:center}
.icon-btn:hover{background:var(--bg);color:var(--text)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:18px}
.tab{border:1px solid var(--border);background:var(--card);border-radius:12px;padding:10px 16px;display:flex;flex-direction:column;gap:2px;min-width:150px;text-align:left}
.tab.active{border-color:var(--accent);background:var(--accent);color:#fff}
.tab.active .tab-sub{color:rgba(255,255,255,.8)}
.tab-name{font-weight:700;font-size:.92rem}
.tab-sub{font-size:.74rem;color:var(--muted);font-weight:600}
.vehicle-head{padding:20px;display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap}
.plate{background:#fff;color:#111;border:2px solid #111;border-radius:8px;padding:6px 12px 6px 8px;font-weight:800;letter-spacing:.06em;display:inline-flex;align-items:center;gap:8px;font-family:ui-monospace,monospace}
.plate::before{content:"";display:block;width:8px;height:22px;border-radius:2px;background:#003399}
.vehicle-title{flex:1;min-width:220px}
.vehicle-title h2{font-size:1.35rem}
.vehicle-meta{color:var(--muted);font-size:.86rem;margin-top:4px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.dot{width:4px;height:4px;border-radius:50%;background:var(--muted);display:inline-block}
.km-box{text-align:right}
.km-box .big{font-size:1.5rem;font-weight:800}
.km-box .lbl{font-size:.74rem;color:var(--muted);text-transform:uppercase;font-weight:700}
.docs{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.doc{border:1px solid var(--border);border-radius:12px;padding:14px;background:var(--card);position:relative;overflow:hidden}
.doc .name{font-size:.74rem;font-weight:800;text-transform:uppercase;color:var(--muted)}
.doc .date{font-size:1.15rem;font-weight:700;margin-top:6px}
.doc .sub{font-size:.78rem;margin-top:6px;font-weight:600}
.doc.ok .sub{color:var(--ok)}
.doc.warn{border-color:var(--warn)}.doc.warn .sub{color:var(--warn)}
.doc.danger{border-color:var(--danger)}.doc.danger .sub{color:var(--danger)}
.doc .bar{position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--border)}
.doc.ok .bar{background:var(--ok)}
.doc.warn .bar{background:var(--warn)}
.doc.danger .bar{background:var(--danger)}
.doc .actions{margin-top:10px;display:flex;gap:6px;flex-wrap:wrap}
.doc .no-file{font-size:.72rem;color:var(--muted);font-style:italic;margin-top:10px}
.doc .doc-extra{margin-top:10px;padding-top:10px;border-top:1px dashed var(--border);display:flex;flex-direction:column;gap:4px;font-size:.78rem;font-weight:600}
.doc .doc-extra .lbl{color:var(--muted);font-weight:700;font-size:.72rem;text-transform:uppercase;margin-right:4px}
.doc .doc-actions{margin-top:10px;padding-top:10px;border-top:1px dashed var(--border);display:flex;gap:6px;flex-wrap:wrap}
.hist-item{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px dashed var(--border)}
.hist-item:last-child{border-bottom:none}
.hist-item .hist-info{display:flex;flex-direction:column;gap:2px;font-size:.85rem}
.hist-item .hist-line{color:var(--muted);font-size:.78rem}
.hist-item .hist-actions{display:flex;gap:4px}
.hist-empty{text-align:center;padding:30px 20px;color:var(--muted);font-size:.85rem}
.hist-total{text-align:right;margin-top:12px;padding-top:12px;border-top:1px solid var(--border);font-size:.85rem;color:var(--muted)}
.hist-total strong{color:var(--text)}
.alert{display:flex;gap:10px;align-items:center;padding:11px 14px;border-radius:11px;font-size:.87rem;font-weight:600;margin-bottom:8px;border:1px solid transparent}
.alert.warn{background:var(--warn-bg);color:var(--warn)}
.alert.danger{background:var(--danger-bg);color:var(--danger)}
.alert.info{background:var(--ok-bg);color:var(--ok)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{border:1px solid var(--border);border-radius:12px;padding:14px;background:var(--card)}
.stat .k{font-size:.74rem;text-transform:uppercase;font-weight:800;color:var(--muted)}
.stat .v{font-size:1.35rem;font-weight:800;margin-top:4px}
.expense-breakdown{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--bg);border:1px solid var(--border);display:flex;gap:20px;flex-wrap:wrap;font-size:.85rem}
.expense-breakdown .exp-item{display:flex;align-items:center;gap:6px}
.expense-breakdown .exp-lbl{color:var(--muted);font-weight:600}
.expense-breakdown strong{font-weight:800}
.table-wrap{overflow-x:auto;border-radius:var(--radius)}
table{width:100%;border-collapse:collapse;font-size:.88rem;min-width:720px}
thead th{text-align:left;font-size:.72rem;text-transform:uppercase;color:var(--muted);padding:12px 14px;border-bottom:1px solid var(--border);font-weight:800;background:var(--bg)}
tbody td{padding:12px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--bg)}
.tag{display:inline-block;padding:3px 9px;border-radius:999px;font-size:.74rem;font-weight:700;background:var(--bg);border:1px solid var(--border)}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:.72rem;font-weight:800}
.badge.ok{background:var(--ok-bg);color:var(--ok)}
.badge.warn{background:var(--warn-bg);color:var(--warn)}
.badge.danger{background:var(--danger-bg);color:var(--danger)}
.badge.muted{background:var(--bg);color:var(--muted);border:1px solid var(--border)}
.muted{color:var(--muted)}
.row-actions{display:flex;gap:4px;justify-content:flex-end}
.empty{text-align:center;padding:70px 24px}
.empty .emoji{font-size:3.2rem}
.empty h2{margin:14px 0 8px}
.empty p{color:var(--muted);max-width:440px;margin:0 auto 22px}
.overlay{position:fixed;inset:0;background:rgba(10,15,25,.55);display:flex;align-items:flex-start;justify-content:center;padding:24px 16px;z-index:100;overflow-y:auto}
.modal{background:var(--card);border-radius:16px;width:100%;max-width:760px;box-shadow:0 24px 60px -12px rgba(0,0,0,.5);margin:auto}
.modal-head{display:flex;align-items:center;gap:12px;padding:18px 20px;border-bottom:1px solid var(--border)}
.modal-head h3{font-size:1.05rem;flex:1}
.modal-body{padding:20px;display:flex;flex-direction:column;gap:16px}
.modal-body h4{font-size:.78rem;text-transform:uppercase;color:var(--muted);margin-top:6px;padding-bottom:6px;border-bottom:1px dashed var(--border)}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:16px 20px;border-top:1px solid var(--border)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:560px){.grid2,.grid3{grid-template-columns:1fr}}
.hint{font-size:.76rem;color:var(--muted);font-weight:500;text-transform:none}
footer.site{text-align:center;color:var(--muted);font-size:.78rem;padding:0 20px 40px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:11px 18px;border-radius:10px;font-size:.86rem;font-weight:600;z-index:200;box-shadow:0 12px 30px rgba(0,0,0,.35);max-width:90%}
.toast.ok{background:#16a34a}.toast.error{background:#dc2626}
.material-row{display:grid;grid-template-columns:130px 2fr .7fr .9fr 1.4fr auto;gap:8px;align-items:start;margin-bottom:10px;padding-bottom:10px;border-bottom:1px dashed var(--border)}
.material-row:last-child{border-bottom:none;padding-bottom:0;margin-bottom:0}
.material-row input{padding:8px 10px;font-size:.85rem}
@media(max-width:780px){.material-row{grid-template-columns:130px 1fr 1fr}.material-row input[data-field=nombre],.material-row input[data-field=tienda]{grid-column:2/-1}.material-row button[data-remove]{grid-column:3;justify-self:end}}
.mat-img-cell{display:flex;flex-direction:column;gap:5px;align-items:center;padding-top:2px}
.mat-img{width:78px;height:78px;border-radius:10px;object-fit:cover;border:1px solid var(--border);background:var(--bg);display:block}
.mat-img-placeholder{display:grid;place-items:center;cursor:pointer;font-size:1.6rem;color:var(--muted)}
.mat-img-placeholder:hover{border-color:var(--accent);color:var(--accent)}
.mat-img-empty{width:78px;height:78px;border-radius:10px;border:1px dashed var(--border);display:grid;place-items:center;font-size:.68rem;font-weight:700;color:var(--muted);text-align:center;background:var(--bg);text-transform:uppercase}
.mat-img-btns{display:flex;flex-direction:column;gap:3px;width:100%}
.mat-img-btn{border:1px solid var(--border);background:var(--card);color:var(--accent);font-size:.68rem;font-weight:800;padding:4px 6px;border-radius:6px;cursor:pointer;white-space:nowrap;text-align:center}
.mat-img-btn:hover{background:var(--bg);border-color:var(--accent)}
.total-box{margin-top:12px;padding:12px 14px;border-radius:10px;background:var(--bg);border:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;font-size:.9rem;font-weight:600}
.total-box strong{font-size:1.1rem}
.link-btn{border:none;background:transparent;color:var(--accent);font-size:.76rem;font-weight:700;padding:0;margin-top:3px;cursor:pointer;display:block}
.link-btn:hover{text-decoration:underline}
.detail-row td{padding:0!important;background:var(--bg)}
.mats-wrap{padding:14px 16px}
.mats-table{width:100%;border-collapse:collapse;font-size:.82rem;min-width:0}
.mats-table th,.mats-table td{padding:6px 10px;text-align:left;border-bottom:1px solid var(--border)}
.mats-table th{font-size:.7rem;text-transform:uppercase;color:var(--muted);font-weight:800}
.mats-table tr:last-child td{border-bottom:none}
.mats-total{text-align:right;margin-top:8px;font-size:.82rem;color:var(--muted)}
.mats-total strong{color:var(--text)}
.mat-thumb{width:44px;height:44px;border-radius:8px;object-fit:cover;border:1px solid var(--border);background:var(--bg);display:block;cursor:pointer}
.mat-thumb-tag{display:grid;place-items:center;font-size:1.15rem;color:var(--muted)}
.mat-thumb-tag:hover{border-color:var(--accent);color:var(--accent)}
.rec-thumb{width:56px;height:56px;border-radius:8px;object-fit:cover;border:1px solid var(--border);background:var(--bg);display:block;cursor:pointer}
.rec-thumb-tag{display:grid;place-items:center;font-size:1.4rem;color:var(--muted);width:56px;height:56px;border-radius:8px;border:1px solid var(--border);background:var(--bg);cursor:pointer}
.rec-thumb-tag:hover{border-color:var(--accent);color:var(--accent)}
.rec-pn{font-family:ui-monospace,monospace;background:var(--bg);padding:2px 8px;border-radius:6px;border:1px solid var(--border);font-size:.82rem;font-weight:700}
.rec-alt{font-family:ui-monospace,monospace;font-size:.78rem;color:var(--muted)}
.rec-img-preview{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-top:6px}
.rec-img-preview .mat-img{width:96px;height:96px}
.rec-img-preview .rec-thumb-tag{width:96px;height:96px;font-size:2rem}
.rec-img-btns{display:flex;flex-direction:row;gap:6px;flex-wrap:wrap;margin-top:6px}
.rec-img-btns .mat-img-btn{font-size:.74rem;padding:6px 10px}
.row-mp-overdue{background:color-mix(in srgb,var(--danger-bg) 45%,transparent)}
.row-mp-due{background:color-mix(in srgb,var(--warn-bg) 45%,transparent)}
.row-mp-soon{background:color-mix(in srgb,var(--accent) 6%,transparent)}
.mp-panel[hidden]{display:none}
.mp-toggle{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:10px;background:var(--card);border:1px solid var(--border);color:var(--text);font-weight:600;font-size:.88rem;cursor:pointer}
.mp-toggle:hover{border-color:var(--accent);color:var(--accent)}
.xml-preview{margin-top:8px;border:1px dashed var(--border);border-radius:10px;padding:10px;background:var(--bg);font-size:.78rem;max-height:220px;overflow:auto}
.xml-preview table{min-width:0;font-size:.78rem}
.xml-preview td,.xml-preview th{padding:4px 8px}
.xml-preview .ok{color:var(--ok);font-weight:700}
.xml-preview code{background:var(--card);padding:1px 5px;border-radius:4px;border:1px solid var(--border)}
.rep-chart-wrap{position:relative;height:280px;margin-top:12px}
.rep-chart-tabs{display:flex;gap:6px;flex-wrap:wrap}
.rep-chart-tab{border:1px solid var(--border);background:var(--card);color:var(--muted);padding:6px 14px;border-radius:999px;font-weight:700;font-size:.8rem;cursor:pointer}
.rep-chart-tab:hover{border-color:var(--accent);color:var(--accent)}
.rep-chart-tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.rep-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-top:12px}
.pagination{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px;padding:10px 14px;border-radius:10px;background:var(--bg);border:1px solid var(--border);font-size:.85rem}
.pg-btn{border:1px solid var(--border);background:var(--card);color:var(--text);padding:6px 12px;border-radius:8px;font-weight:600;font-size:.82rem;cursor:pointer}
.pg-btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.pg-btn:disabled{opacity:.45;cursor:not-allowed}
.pg-info{margin-left:auto;color:var(--muted);font-weight:600}
.pg-info strong{color:var(--text)}
@media(max-width:560px){.pg-info{margin-left:0;width:100%;text-align:center}}
#app-view[hidden]{display:none}
</style>
</head>
<body>

<div id="app-view" hidden>
  <header>
    <div class="header-in">
      <div class="logo"><span class="mark">🚗</span> Mi Garaje</div>
      <div class="header-actions">
        <div class="user-chip"><span id="user-email">—</span></div>
        <button class="btn ghost sm" id="btn-logout">Salir</button>
        <button class="btn primary" id="btn-add-vehicle">＋ Añadir vehículo</button>
      </div>
    </div>
  </header>
  <main>
    <div class="tabs" id="tabs"></div>
    <div id="content"></div>
  </main>
  <footer class="site">Los datos se guardan en tu cuenta de Supabase.</footer>
</div>

<div id="modal"></div>

<script>
/* ============ CONFIG ============ */
const CFG = window.MIGARAJE_CONFIG || {};
if(!CFG.SUPABASE_URL || !CFG.SUPABASE_ANON_KEY || CFG.SUPABASE_URL.includes('TU-PROYECTO') || CFG.SUPABASE_ANON_KEY.includes('TU-ANON')){
  document.body.innerHTML='<div style="max-width:640px;margin:60px auto;padding:24px;font-family:system-ui"><h1>⚠️ Falta configurar Supabase</h1><p>Rellena <code>config.js</code>.</p></div>';
  throw new Error('Falta config.js');
}
const { createClient } = window.supabase;
const sb = createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY, { auth:{ persistSession:true, autoRefreshToken:true } });
const BUCKET = 'documentos';

/* ============ HELPERS ============ */
const eur = new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR',maximumFractionDigits:2});
const num = new Intl.NumberFormat('es-ES');
const money = n => eur.format(Number(n)||0);
const kmFmt = n => num.format(Number(n)||0) + ' km';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate = iso => { if(!iso) return '—'; const [y,m,d] = iso.split('-'); if(!y||!m||!d) return '—'; return `${d}/${m}/${y}`; };
const todayISO = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().slice(0,10); };
const daysUntil = iso => { if(!iso) return null; const t = new Date(); t.setHours(0,0,0,0); const f = new Date(iso+'T00:00:00'); if(isNaN(f)) return null; return Math.round((f-t)/86400000); };
const pluralDias = n => n === 1 ? '1 día' : n + ' días';
const uid = () => crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const normTipo = t => String(t||'').toLowerCase().trim();
function toast(m,t='info'){ const e=document.createElement('div'); e.className='toast '+t; e.textContent=m; document.body.appendChild(e); setTimeout(()=>e.remove(),3600); }

function parseIntervaloKm(intervalo){
  if(!intervalo) return {kmMin:null,kmMax:null};
  const soloKm = String(intervalo).split('/')[0];
  const matches = soloKm.match(/\d[\d.,\s]*/g);
  if(!matches) return {kmMin:null,kmMax:null};
  const nums = matches.map(s => Number(String(s).replace(/[.,\s]/g,''))).filter(n => isFinite(n) && n > 0);
  if(!nums.length) return {kmMin:null,kmMax:null};
  if(nums.length === 1) return {kmMin:nums[0],kmMax:null};
  return {kmMin:Math.min(nums[0],nums[1]),kmMax:Math.max(nums[0],nums[1])};
}

function estadoMantProg(intervalo,kmActual){
  const {kmMin,kmMax} = parseIntervaloKm(intervalo);
  if(kmMin == null) return {nivel:'muted',orden:5,detalle:''};
  const kMax = kmMax != null ? kmMax : kmMin + 10000;
  if(kmActual > kMax) return {nivel:'danger',orden:0,detalle:`Superado por ${num.format(kmActual-kMax)} km`};
  if(kmActual >= kmMin) return {nivel:'warn',orden:1,detalle:`En rango (${num.format(kmMin)}${kmMax?' - '+num.format(kmMax):''} km)`};
  if(kmMin - kmActual <= 3000) return {nivel:'accent',orden:2,detalle:`Faltan ${num.format(kmMin-kmActual)} km`};
  return {nivel:'ok',orden:3,detalle:`Faltan ${num.format(kmMin-kmActual)} km`};
}

function parseMantProgXML(xmlText){
  const NS='urn:schemas-microsoft-com:office:spreadsheet';
  if(xmlText.charCodeAt(0) === 0xFEFF) xmlText = xmlText.slice(1);
  const doc = new DOMParser().parseFromString(xmlText,'application/xml');
  if(doc.querySelector('parsererror')) throw new Error('XML no válido.');
  const find=(p,t)=>{let e=p.getElementsByTagNameNS(NS,t); if(!e.length) e=p.getElementsByTagName(t); return e;};
  const getA=(e,n)=>{let v=e.getAttributeNS(NS,n); if(v==null) v=e.getAttribute('ss:'+n)||e.getAttribute(n); return v;};
  const sh = find(doc,'Worksheet'); if(!sh.length) throw new Error('XML sin hoja.');
  const rows = find(sh[0],'Row'); if(!rows.length) return [];
  const getV=rowEl=>{const out=[];const cells=find(rowEl,'Cell');let col=0;for(const c of cells){const i=getA(c,'Index');if(i)col=Number(i)-1;const d=find(c,'Data');out[col]=d.length?String(d[0].textContent||'').trim():'';col++;}return out;};
  const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
  const headers = getV(rows[0]).map(norm);
  const idx = {
    operacion: headers.findIndex(h=>['revision','operacion','tarea','mantenimiento','nombre','descripcion'].includes(h)),
    intervalo: headers.findIndex(h=>['intervalo','periodicidad','cada','frecuencia'].includes(h)),
    notas: headers.findIndex(h=>['notas','nota','observaciones','comentarios'].includes(h)),
    kilometros: headers.findIndex(h=>['kilometros','kilometraje','km'].includes(h)),
    meses: headers.findIndex(h=>['meses','mes','periodo'].includes(h))
  };
  const out = [];
  for(let r=1;r<rows.length;r++){
    const row = getV(rows[r]);
    const operacion = idx.operacion>=0 ? String(row[idx.operacion]||'').trim() : '';
    if(!operacion) continue;
    let intervalo = idx.intervalo>=0 ? String(row[idx.intervalo]||'').trim() : '';
    if(!intervalo && (idx.kilometros>=0||idx.meses>=0)){
      const km = idx.kilometros>=0 ? String(row[idx.kilometros]||'').trim() : '';
      const me = idx.meses>=0 ? String(row[idx.meses]||'').trim() : '';
      const partes=[]; if(km)partes.push(km+' km'); if(me)partes.push(me+(me==='1'?' mes':' meses'));
      intervalo = partes.join(' / ');
    }
    out.push({operacion,intervalo,notas: idx.notas>=0 ? String(row[idx.notas]||'').trim() : ''});
  }
  return out;
}

async function loadData(){
  const [vRes,mRes,hRes,pRes,rRes,fRes] = await Promise.all([
    sb.from('vehicles').select('*').order('created_at',{ascending:true}),
    sb.from('mantenimientos').select('*').order('created_at',{ascending:true}),
    sb.from('historial_obligaciones').select('*').order('fecha',{ascending:false}),
    sb.from('mantenimiento_programado').select('*').order('orden',{ascending:true}),
    sb.from('recambios').select('*').order('orden',{ascending:true}),
    sb.from('repostajes').select('*').order('fecha',{ascending:false})
  ]);
  if(vRes.error) throw vRes.error;
  if(mRes.error) throw mRes.error;
  allHistorialRaw = hRes.error ? [] : (hRes.data||[]);
  allMantProg = pRes.error ? [] : (pRes.data||[]);
  allRecambios = rRes.error ? [] : (rRes.data||[]);
  allRepostajes = fRes.error ? [] : (fRes.data||[]);
  if(fRes.error) console.error('Error repostajes:',fRes.error);
  const mByV = new Map();
  mRes.data.forEach(m=>{ if(!mByV.has(m.vehicle_id)) mByV.set(m.vehicle_id,[]); mByV.get(m.vehicle_id).push(mantFromDB(m)); });
  vehicles = vRes.data.map(v=>({...v,km:Number(v.km)||0,mantenimientos:mByV.get(v.id)||[]}));
  if(!selected||!vehicles.find(v=>v.id===selected)) selected = vehicles[0]?.id||null;
}

async function subirDocumento(file,vid,tipo){
  if(!file||file.size===0) return null;
  const ext=(file.name.split('.').pop()||'bin').toLowerCase();
  const path=`${currentUser.id}/${vid}/${tipo}.${ext}`;
  const {error}=await sb.storage.from(BUCKET).upload(path,file,{upsert:true,cacheControl:'3600',contentType:file.type||'application/octet-stream'});
  if(error) throw error; return path;
}

/* ============ GRÁFICA ============ */
function dibujarGrafica(repostajes){
  const c = document.getElementById('rep-chart');
  if(!c || typeof Chart === 'undefined') return;
  if(repChart){try{repChart.destroy();}catch(e){} repChart=null;}
  const hoy = new Date(); hoy.setHours(0,0,0,0);
  const labels=[],values=[];
  const fISO = d => { const x = new Date(d.getTime()-d.getTimezoneOffset()*60000); return x.toISOString().slice(0,10); };
  const fShort = iso => { const [y,m,d]=iso.split('-'); return `${d}/${m}`; };

  if(repVista === 'semanal'){
    const dias=[];
    for(let i=6;i>=0;i--){ const d=new Date(hoy); d.setDate(d.getDate()-i); dias.push(fISO(d)); }
    dias.forEach(iso=>{labels.push(fShort(iso));values.push(0);});
    repostajes.forEach(r=>{const i=dias.indexOf(r.fecha);if(i>=0)values[i]+=Number(r.coste_total)||0;});
  } else if(repVista === 'mensual'){
    const dias=[];
    for(let i=29;i>=0;i--){ const d=new Date(hoy); d.setDate(d.getDate()-i); dias.push(fISO(d)); }
    const buckets=[0,0,0,0,0];
    dias.forEach((iso,idx)=>{
      const sem = Math.floor((dias.length-1-idx)/7);
      const val = repostajes.filter(r=>r.fecha===iso).reduce((s,r)=>s+(Number(r.coste_total)||0),0);
      buckets[sem] += val;
    });
    ['Esta semana','Hace 1 sem.','Hace 2 sem.','Hace 3 sem.','Hace 4 sem.'].forEach((n,i)=>{labels.push(n);values.push(buckets[i]||0);});
  } else {
    const meses=[];
    for(let i=11;i>=0;i--){
      const d=new Date(hoy.getFullYear(),hoy.getMonth()-i,1);
      const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0');
      meses.push({key:`${y}-${m}`,label:`${m}/${String(y).slice(2)}`});
    }
    meses.forEach(mm=>{labels.push(mm.label);values.push(0);});
    repostajes.forEach(r=>{if(!r.fecha)return;const k=r.fecha.slice(0,7);const i=meses.findIndex(mm=>mm.key===k);if(i>=0)values[i]+=Number(r.coste_total)||0;});
  }

  const isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  const txt = isDark ? '#e8edf7' : '#131a2b';
  const grd = isDark ? 'rgba(255,255,255,.08)' : 'rgba(0,0,0,.06)';

  repChart = new Chart(c,{
    type:'bar',
    data:{labels,datasets:[{label:'Gasto (€)',data:values,backgroundColor:isDark?'rgba(59,130,246,.65)':'rgba(37,99,235,.7)',borderColor:isDark?'#3b82f6':'#2563eb',borderWidth:1,borderRadius:6,maxBarThickness:60}]},
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>money(ctx.parsed.y)}}},
      scales:{x:{ticks:{color:txt,font:{size:11}},grid:{display:false}},y:{beginAtZero:true,ticks:{color:txt,callback:v=>money(v)},grid:{color:grd}}}
    }
  });
}

/* ============ TARJETAS ============ */
function docCard(nombre,iso,warnDays,extra,acciones){
  const d = daysUntil(iso);
  let cls='ok',sub='';
  if(d===null){cls='';sub='Sin fecha';}
  else if(d<0){cls='danger';sub=`Vencido hace ${pluralDias(Math.abs(d))}`;}
  else if(d<=warnDays){cls='warn';sub=`Vence en ${pluralDias(d)}`;}
  else {cls='ok';sub=`Quedan ${pluralDias(d)}`;}
  return `<div class="doc ${cls}"><div class="bar"></div><div class="name">${nombre}</div><div class="date">${fmtDate(iso)}</div><div class="sub">${sub}</div>${extra?`<div class="doc-extra">${extra}</div>`:''}${acciones?`<div class="doc-actions">${acciones}</div>`:''}</div>`;
}
function docFileCard(nombre,path){
  return `<div class="doc ${path?'ok':''}"><div class="bar"></div><div class="name">${nombre}</div>${path?`<div class="actions" style="margin-top:8px"><button type="button" class="btn ghost tiny" data-ver-doc="${esc(path)}">📄 Ver documento</button></div>`:`<div class="no-file">Sin documento adjunto</div>`}</div>`;
}
function mantRow(m,v){
  let prox = '<span class="muted">—</span>';
  if(m.proximaFecha||m.proximoKm){
    const p=[];
    if(m.proximaFecha){const d=daysUntil(m.proximaFecha);let c='ok';if(d!==null&&d<0)c='danger';else if(d!==null&&d<=30)c='warn';p.push(`<span class="badge ${c}">${fmtDate(m.proximaFecha)}</span>`);}
    if(m.proximoKm){const r=Number(m.proximoKm)-(Number(v.km)||0);let c='ok';if(r<=0)c='danger';else if(r<=1000)c='warn';p.push(`<span class="badge ${c}">${kmFmt(m.proximoKm)}</span>`);}
    prox = `<div style="display:flex;gap:5px;flex-wrap:wrap">${p.join('')}</div>`;
  }
  const mats = Array.isArray(m.materiales)?m.materiales:[];
  const totM = mats.reduce((s,x)=>s+(Number(x.cantidad)||0)*(Number(x.precio)||0),0);
  const tot = (Number(m.coste)||0)+totM;
  const cf = mats.filter(x=>x.imagen).length;
  const dId = 'det-'+m.id;
  const mainRow = `<tr>
    <td><span class="tag">${esc(m.tipo||'Otros')}</span></td>
    <td>${fmtDate(m.fecha)}</td>
    <td>${m.km?kmFmt(m.km):'<span class="muted">—</span>'}</td>
    <td><strong>${tot?money(tot):'<span class="muted">—</span>'}</strong>${mats.length?`<button type="button" class="link-btn" data-toggle="${dId}">🔧 ${mats.length} material${mats.length===1?'':'es'}${cf?` · 📷 ${cf}`:''}</button>`:''}</td>
    <td>${m.taller?esc(m.taller):'<span class="muted">—</span>'}</td>
    <td>${prox}</td>
    <td><div class="row-actions"><button class="icon-btn" data-edit-mant="${m.id}">✎</button><button class="icon-btn" data-del-mant="${m.id}">🗑</button></div></td>
  </tr>`;
  const detRow = mats.length?`
    <tr id="${dId}" class="detail-row" hidden><td colspan="7"><div class="mats-wrap">
      <table class="mats-table"><thead><tr><th>Foto</th><th>Material</th><th>Cantidad</th><th>Precio</th><th>Subtotal</th><th>Tienda</th></tr></thead>

/* ============ ALERTAS ============ */
function getAlerts(v){
  const out=[];
  const check=(label,iso,w)=>{
    const d = daysUntil(iso);
    if(d===null) return;
    if(d<0) out.push({level:'danger',text:`${label} vencido hace ${pluralDias(Math.abs(d))} (${fmtDate(iso)})`});
    else if(d<=w) out.push({level:'warn',text:`${label} vence en ${pluralDias(d)} — ${fmtDate(iso)}`});
  };
  check('ITV',v.itv,30); check('Seguro',v.seguro,21); check('Impuesto de circulación (IVTM)',v.impuesto,30);
  if(v.intervalo_revision_km && v.ultima_revision_km){
    const p = Number(v.ultima_revision_km)+Number(v.intervalo_revision_km);
    const r = p-(Number(v.km)||0);
    if(r<=1000) out.push({level:r<=0?'danger':'warn',text:r<=0?`Revisión por km superada por ${kmFmt(Math.abs(r))} (tocaba a los ${kmFmt(p)})`:`Revisión por km próxima: faltan ${kmFmt(r)} (a los ${kmFmt(p)})`});
  }
  (v.mantenimientos||[]).forEach(m=>{
    if(m.proximaFecha){const d=daysUntil(m.proximaFecha);if(d!==null&&d<=30)out.push({level:d<0?'danger':'warn',text:`${m.tipo||'Mantenimiento'} ${d<0?'pendiente desde hace '+pluralDias(Math.abs(d)):'programado en '+pluralDias(d)}`});}
    if(m.proximoKm){const r=Number(m.proximoKm)-(Number(v.km)||0);if(r<=1000)out.push({level:r<=0?'danger':'warn',text:`${m.tipo||'Mantenimiento'} ${r<=0?'superado por '+kmFmt(Math.abs(r)):'en '+kmFmt(r)}`});}
  });
  if(!out.length) out.push({level:'info',text:'Todo en orden. No hay avisos próximos.'});
  return out.sort((a,b)=>{const r=x=>x==='danger'?0:x==='warn'?1:2;return r(a.level)-r(b.level);});
}

/* ============ MODAL ============ */
function openModal(title,body,onSubmit,submitLabel='Guardar'){
  modalRoot.innerHTML = `
    <div class="overlay"><div class="modal" role="dialog" aria-modal="true">
      <div class="modal-head"><h3>${esc(title)}</h3><button type="button" class="icon-btn" data-close>✕</button></div>
      <form id="modal-form" novalidate>
        <div class="modal-body">${body}</div>
        <div class="modal-foot">
          <button type="button" class="btn ghost" data-close>Cancelar</button>
          <button type="submit" class="btn primary" id="modal-submit">${esc(submitLabel)}</button>
        </div>
      </form>
    </div></div>`;
  const overlay = modalRoot.querySelector('.overlay');
  overlay.addEventListener('click',e=>{if(e.target===overlay)closeModal();});
  modalRoot.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',closeModal));
  modalRoot.querySelector('#modal-form').addEventListener('submit',async e=>{
    e.preventDefault();
    const btn = document.getElementById('modal-submit');
    const orig = btn.textContent;
    btn.disabled = true; btn.textContent = 'Guardando…';
    try { await onSubmit(new FormData(e.target)); }
    catch(err){console.error(err);alert('Error: '+(err.message||err));btn.disabled=false;btn.textContent=orig;}
  });
  const first = modalRoot.querySelector('input,select,textarea');
  if(first) setTimeout(()=>first.focus(),40);
}
function closeModal(){ modalRoot.innerHTML = ''; }

function openMantForm(vid,mantId){
  const v = vehicles.find(x=>x.id===vid); if(!v) return;
  const m = mantId ? v.mantenimientos.find(x=>x.id===mantId) : {};
  const esNuevo = !mantId;
  let mats = Array.isArray(m.materiales) ? m.materiales.map(x=>({id:x.id||uid(),nombre:x.nombre||'',cantidad:x.cantidad??'',precio:x.precio??'',tienda:x.tienda||'',imagen:x.imagen||'',_file:null,_preview:null})) : [];
  const body = `
    <div class="grid2">
      <label>Tipo<select name="tipo" required>${TIPOS_MANT.map(t=>`<option ${m.tipo===t?'selected':''}>${t}</option>`).join('')}</select></label>
      <label>Fecha<input type="date" name="fecha" value="${esc(m.fecha||todayISO())}" required></label>
      <label>Kilómetros vehículo<input type="number" min="0" step="1" name="km" value="${esc(m.km??v.km)}"></label>
      <label>Mano de obra (€)<input type="number" min="0" step="0.01" name="coste" value="${esc(m.coste)}"></label>
    </div>
    <label>Taller<input name="taller" value="${esc(m.taller)}"></label>
    <h4>Materiales</h4>
    <div id="mats-list"></div>
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:4px">
      <button type="button" class="btn ghost sm" id="add-mat">＋ Añadir material</button>
      <div class="hint">Materiales: <strong id="mats-total">0,00 €</strong></div>
    </div>
    <h4>Próximo aviso (opcional)</h4>
    <div class="grid2">
      <label>Fecha próxima<input type="date" name="proximaFecha" value="${esc(m.proximaFecha)}"></label>
      <label>Km próximos<input type="number" min="0" step="1" name="proximoKm" value="${esc(m.proximoKm)}"></label>
    </div>
    <label>Notas<textarea name="notas" rows="2">${esc(m.notas)}</textarea></label>
    <div class="total-box"><span>Total</span><strong id="tot-int">0,00 €</strong></div>`;
  openModal(esNuevo?'Nueva intervención':'Editar intervención',body,async fd=>{
    for(const mat of mats){
      if(mat._file && mat._file.size>0){
        try{const path=await subirMaterialImagen(mat._file,vid,mat.id);if(path) mat.imagen=path;}catch(e){console.warn(e);}
      }
    }
    const data = {
      tipo: fd.get('tipo')||'Otros', fecha: fd.get('fecha')||'',
      km: fd.get('km')?Number(fd.get('km')):'',
      coste: fd.get('coste')?Number(fd.get('coste')):0,
      taller: (fd.get('taller')||'').trim(),
      proximaFecha: fd.get('proximaFecha')||'',
      proximoKm: fd.get('proximoKm')?Number(fd.get('proximoKm')):'',
      notas: (fd.get('notas')||'').trim(),
      materiales: mats.filter(x=>(x.nombre||'').trim()||x.cantidad||x.precio||(x.tienda||'').trim()||x.imagen).map(x=>({id:x.id,nombre:x.nombre,cantidad:x.cantidad,precio:x.precio,tienda:x.tienda,imagen:x.imagen}))
    };
    const payload = mantToDB(data,vid);
    if(mantId){const {error}=await sb.from('mantenimientos').update(payload).eq('id',mantId);if(error) throw error;}
    else {const {error}=await sb.from('mantenimientos').insert(payload);if(error) throw error;}
    if(data.km && Number(data.km)>(Number(v.km)||0)) await sb.from('vehicles').update({km:Number(data.km)}).eq('id',vid);
    await loadData(); closeModal(); render(); toast(esNuevo?'Añadido':'Actualizado','ok');
  }, esNuevo?'Añadir':'Guardar');

  const listEl=document.getElementById('mats-list'),mtEl=document.getElementById('mats-total'),tEl=document.getElementById('tot-int'),ci=document.querySelector('#modal-form [name="coste"]');
  const sumM=()=>mats.reduce((s,x)=>s+(Number(x.cantidad)||0)*(Number(x.precio)||0),0);
  const refresh=()=>{const t=sumM();mtEl.textContent=money(t);tEl.textContent=money((Number(ci.value)||0)+t);};
  function imgCell(x,i){
    let inner;
    if(x._preview) inner=`<img class="mat-img" src="${x._preview}" alt="Material">`;
    else if(x.imagen) inner=`<div class="mat-img mat-img-placeholder" data-ver-doc="${esc(x.imagen)}" title="Ver imagen">📷</div>`;
    else inner=`<div class="mat-img-empty">Sin foto</div>`;
    return `<div class="mat-img-cell">${inner}
      <div class="mat-img-btns">
        <button type="button" class="mat-img-btn" data-cam="${i}">📷 Foto</button>
        <button type="button" class="mat-img-btn" data-gal="${i}">🖼 Galería</button>
      </div>
      <input type="file" accept="image/*" capture="environment" class="mat-cam" data-idx="${i}" hidden>
      <input type="file" accept="image/*" class="mat-gal" data-idx="${i}" hidden>
    </div>`;
  }
  function renderM(){
    if(!mats.length) listEl.innerHTML='<div class="hint" style="padding:4px 0">Sin materiales.</div>';
    else {
      listEl.innerHTML = mats.map((x,i)=>`<div class="material-row" data-idx="${i}">${imgCell(x,i)}<input data-field="nombre" placeholder="Material" value="${esc(x.nombre)}"><input data-field="cantidad" type="number" step="0.01" min="0" placeholder="Cant." value="${esc(x.cantidad)}"><input data-field="precio" type="number" step="0.01" min="0" placeholder="€/ud." value="${esc(x.precio)}"><input data-field="tienda" placeholder="Dónde lo compraste" value="${esc(x.tienda)}"><button type="button" class="icon-btn" data-remove="${i}">✕</button></div>`).join('');
      listEl.querySelectorAll('input[data-field]').forEach(inp=>inp.addEventListener('input',e=>{const i=Number(e.target.closest('.material-row').dataset.idx);mats[i][e.target.dataset.field]=e.target.value;refresh();}));
      listEl.querySelectorAll('[data-ver-doc]').forEach(el=>el.addEventListener('click',()=>verDocumento(el.dataset.verDoc)));
      listEl.querySelectorAll('[data-cam]').forEach(b=>b.addEventListener('click',()=>{const inp=listEl.querySelector(`.mat-cam[data-idx="${b.dataset.cam}"]`);if(inp)inp.click();}));
      listEl.querySelectorAll('[data-gal]').forEach(b=>b.addEventListener('click',()=>{const inp=listEl.querySelector(`.mat-gal[data-idx="${b.dataset.gal}"]`);if(inp)inp.click();}));
      const handle = (sel) => listEl.querySelectorAll(sel).forEach(inp=>inp.addEventListener('change',e=>{
        const i=Number(e.target.dataset.idx);const f=e.target.files[0];if(!f)return;
        mats[i]._file=f; mats[i]._preview=URL.createObjectURL(f); renderM();
      }));
      handle('.mat-cam'); handle('.mat-gal');
      listEl.querySelectorAll('[data-remove]').forEach(b=>b.addEventListener('click',()=>{const i=Number(b.dataset.remove);const mat=mats[i];if(mat.imagen&&!mat._file)borrarDocumento(mat.imagen);mats.splice(i,1);renderM();}));
    }
    refresh();
  }
  document.getElementById('add-mat').addEventListener('click',()=>{mats.push({id:uid(),nombre:'',cantidad:'',precio:'',tienda:'',imagen:'',_file:null,_preview:null});renderM();const rows=listEl.querySelectorAll('.material-row');const last=rows[rows.length-1];if(last)last.querySelector('input[data-field="nombre"]').focus();});
  ci.addEventListener('input',refresh);
  renderM();
}
async function deleteMant(vid,mantId){
  const v = vehicles.find(x=>x.id===vid); if(!v) return;
  const m = v.mantenimientos.find(x=>x.id===mantId); if(!m) return;
  if(!confirm(`¿Eliminar la intervención «${m.tipo}»?`)) return;
  const imgs = (m.materiales||[]).map(x=>x.imagen).filter(Boolean);
  if(imgs.length) await sb.storage.from(BUCKET).remove(imgs);
  const {error}=await sb.from('mantenimientos').delete().eq('id',mantId);
  if(error) return toast('Error: '+error.message,'error');
  await loadData(); render(); toast('Eliminado','ok');
}

/* ============ HISTORIAL ============ */
function _proxDef(fecha,tipo,v){
  if(!fecha) return '';
  const f = new Date(fecha+'T00:00:00'); if(isNaN(f)) return '';
  if(tipo==='ivtm'||tipo==='seguro') f.setFullYear(f.getFullYear()+1);
  else if(tipo==='itv'){const e=v?.anio?(new Date().getFullYear()-Number(v.anio)):0;f.setFullYear(f.getFullYear()+(e>=10?1:2));}
  return f.toISOString().slice(0,10);
}
function openHistorialForm(vid,tipo,rid){
  tipo = normTipo(tipo);
  const v = vehicles.find(x=>x.id===vid); if(!v) return;
  const regs = registrosHist(vid,tipo);
  const reg = rid ? regs.find(h=>h.id===rid) : null;
  const esNuevo = !reg;
  const lbl = TIPOS_HIST_LABEL[tipo] || tipo;
  const fv = reg?.fecha || todayISO();
  const pv = reg?.proxima_fecha || _proxDef(fv,tipo,v);
  let campos='';
  if(tipo==='itv') campos=`<label>Lugar<input name="lugar" value="${esc(reg?.lugar)}"></label>`;
  else if(tipo==='seguro') campos=`
    <label>Compañía<input name="compania" value="${esc(reg?.compania)}"></label>
    <div class="grid2">
      <label>Tipo<select name="tipo_seguro"><option value="">—</option>${TIPOS_SEGURO.map(t=>`<option ${reg?.tipo_seguro===t?'selected':''}>${t}</option>`).join('')}</select></label>
      <label>Plazos<select name="plazos"><option value="">—</option>${PLAZOS_SEGURO.map(p=>`<option ${reg?.plazos===p?'selected':''}>${p}</option>`).join('')}</select></label>
    </div>`;
  else if(tipo==='ivtm') campos=`<label>Lugar<input name="lugar" value="${esc(reg?.lugar)}"></label>`;
  const body = `
    <h4>${lbl}</h4>
    <div class="grid2">
      <label>Fecha<input type="date" name="fecha" id="hf" value="${esc(fv)}" required></label>
      <label>Importe (€)<input type="number" min="0" step="0.01" name="precio" value="${esc(reg?.precio)}"></label>
    </div>
    <div class="grid2">
      <label>Próximo vencimiento<input type="date" name="proxima_fecha" id="hp" value="${esc(pv)}"></label>
      <div class="hint" style="align-self:end;padding-bottom:10px"><label style="flex-direction:row;align-items:center;gap:8px;text-transform:none;font-weight:600;font-size:.85rem"><input type="checkbox" name="actualizar_vehiculo" checked> Actualizar vencimiento</label></div>
    </div>
    ${campos}
    <label>Notas<textarea name="notas" rows="2">${esc(reg?.notas)}</textarea></label>`;
  openModal(esNuevo?`Registrar ${lbl.toLowerCase()}`:`Editar ${lbl.toLowerCase()}`,body,async fd=>{
    const data = {
      vehicle_id: vid, tipo: normTipo(tipo),
      fecha: fd.get('fecha')||null, proxima_fecha: fd.get('proxima_fecha')||null,
      precio: fd.get('precio')?Number(fd.get('precio')):null,
      lugar: (fd.get('lugar')||'').trim()||null,
      compania: (fd.get('compania')||'').trim()||null,
      tipo_seguro: (fd.get('tipo_seguro')||'').trim()||null,
      plazos: (fd.get('plazos')||'').trim()||null,
      notas: (fd.get('notas')||'').trim()||null
    };
    if(rid){const {error}=await sb.from('historial_obligaciones').update(data).eq('id',rid);if(error) throw new Error(error.message);}
    else {const {error}=await sb.from('historial_obligaciones').insert(data);if(error) throw new Error(error.message);}
    if(fd.get('actualizar_vehiculo') && data.proxima_fecha){
      const cv = tipo==='itv'?'itv':tipo==='seguro'?'seguro':'impuesto';
      const extra = {};
      if(tipo==='itv'){if(data.precio!=null)extra.itv_precio=data.precio;if(data.lugar)extra.itv_lugar=data.lugar;if(data.fecha)extra.itv_fecha=data.fecha;}
      else if(tipo==='seguro'){if(data.precio!=null)extra.seguro_precio=data.precio;if(data.compania)extra.seguro_compania=data.compania;if(data.tipo_seguro)extra.seguro_tipo=data.tipo_seguro;if(data.plazos)extra.seguro_plazos=data.plazos;if(data.fecha)extra.seguro_fecha=data.fecha;}
      else if(tipo==='ivtm'){if(data.precio!=null)extra.impuesto_precio=data.precio;if(data.lugar)extra.impuesto_lugar=data.lugar;if(data.fecha)extra.impuesto_fecha=data.fecha;}
      const {error}=await sb.from('vehicles').update({[cv]:data.proxima_fecha,...extra}).eq('id',vid);
      if(error) console.warn(error.message);
    }
    await loadData(); closeModal(); render(); toast(rid?'Actualizado':'Guardado','ok');
  }, esNuevo?'Guardar':'Guardar cambios');
  setTimeout(()=>{
    const fF=document.getElementById('hf'),fP=document.getElementById('hp');
    if(fF&&fP) fF.addEventListener('change',()=>{if(!fF.value)return;fP.value=_proxDef(fF.value,tipo,v);});
  },30);
}
function openHistorialList(vid,tipo){
  tipo = normTipo(tipo);
  const v = vehicles.find(x=>x.id===vid); if(!v) return;
  const lbl = TIPOS_HIST_LABEL[tipo]||tipo;
  const items = registrosHist(vid,tipo).sort((a,b)=>(b.fecha||'').localeCompare(a.fecha||''));
  const total = items.reduce((s,h)=>s+(Number(h.precio)||0),0);
  const anios = items.length ? new Set(items.map(h=>(h.fecha||'').slice(0,4))).size : 0;
  let html='';
  if(!items.length) html='<div class="hist-empty">Sin registros.</div>';
  else html = items.map(h=>{
    const ex=[];
    if(h.lugar) ex.push(`📍 ${esc(h.lugar)}`);
    if(h.compania) ex.push(`🏢 ${esc(h.compania)}`);
    if(h.tipo_seguro) ex.push(`🛡 ${esc(h.tipo_seguro)}`);
    if(h.plazos) ex.push(`📅 ${esc(h.plazos)}`);
    if(h.proxima_fecha) ex.push(`→ ${fmtDate(h.proxima_fecha)}`);
    if(h.notas) ex.push(`📝 ${esc(h.notas)}`);
    return `<div class="hist-item"><div class="hist-info"><div><strong>${fmtDate(h.fecha)}</strong>${h.precio!=null?` · <strong>${money(h.precio)}</strong>`:''}</div>${ex.length?`<div class="hist-line">${ex.join(' · ')}</div>`:''}</div><div class="hist-actions"><button type="button" class="icon-btn" data-hist-edit="${h.id}">✎</button><button type="button" class="icon-btn" data-hist-del="${h.id}">🗑</button></div></div>`;
  }).join('');
  const body = `<div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px"><div class="hint">${items.length} registro${items.length===1?'':'s'} · ${anios} año${anios===1?'':'s'}</div><button type="button" class="btn primary sm" id="hist-add">＋ Nuevo</button></div><div>${html}</div>${items.length?`<div class="hist-total">Total: <strong>${money(total)}</strong></div>`:''}`;
  openModal(`Historial — ${lbl}`,body,async()=>{closeModal();},'Cerrar');
  setTimeout(()=>{
    const sb2=document.getElementById('modal-submit'); if(sb2) sb2.style.display='none';
    modalRoot.querySelectorAll('[data-close]').forEach(b=>{if(b.classList.contains('btn')){b.textContent='Cerrar';b.classList.remove('ghost');b.classList.add('primary');}});
    const add=document.getElementById('hist-add'); if(add) add.addEventListener('click',()=>{closeModal();openHistorialForm(vid,tipo);});
    modalRoot.querySelectorAll('[data-hist-edit]').forEach(b=>b.addEventListener('click',()=>{closeModal();openHistorialForm(vid,tipo,b.dataset.histEdit);}));
    modalRoot.querySelectorAll('[data-hist-del]').forEach(b=>b.addEventListener('click',async()=>{
      if(!confirm('¿Eliminar este registro?')) return;
      const {error}=await sb.from('historial_obligaciones').delete().eq('id',b.dataset.histDel);
      if(error) return toast('Error: '+error.message,'error');
      await loadData(); closeModal(); render(); toast('Eliminado','ok');
    }));
  },30);
}
