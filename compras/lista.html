<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lista de la compra · Planificador de comidas</title>
  <link rel="stylesheet" href="css/style.css?v=21">
</head>
<body>
<main>
  <div class="paper-sheet">
    <div class="paper-header">
      <h2 class="paper-title">🛒 Lista de la compra</h2>
      <div class="paper-week" id="week-nav"></div>
    </div>

    <div class="paper-resumen" id="resumen"></div>

    <datalist id="lista-ings"></datalist>

    <div class="paper-lines" id="lista-filas"></div>

    <p class="paper-hint">
      ✍️ Escribe un ingrediente o cualquier cosa libre. Pulsa el botón ✓ para marcar como comprado.
    </p>
  </div>
</main>
<script type="module" src="js/lista.js?v=21"></script>
</body>
</html>
