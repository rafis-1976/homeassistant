<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Precios e Informes — Padel Manager</title>
  <link rel="stylesheet" href="../css/theme.css">
</head>
<body>
  <div class="layout">
    <nav class="sidebar"></nav>
    <main class="content">
      <h1>💰 Precios e Informes</h1>

      <div class="card" style="margin-bottom:16px;">
        <h2>Tarifas</h2>
        <div class="tabla-wrapper">
          <table class="tabla">
            <thead><tr><th>Tipo</th><th>Precio/hora</th><th>Precio/alumno</th><th>Activa</th></tr></thead>
            <tbody id="tbody-tarifas"></tbody>
          </table>
        </div>
      </div>

      <div class="card" style="margin-bottom:16px;">
        <h2>Informe mensual</h2>
        <div style="display:flex;gap:12px;align-items:end;margin-bottom:12px;flex-wrap:wrap;">
          <label style="flex:1;min-width:180px;">Mes <input type="month" id="mes"></label>
          <button class="btn-primary" id="btn-generar">Generar informe</button>
          <button class="btn-secondary" id="btn-exportar">Exportar PDF</button>
        </div>
        <div id="resumen"></div>
      </div>

      <div class="card">
        <h2>Pagos</h2>
        <div class="tabla-wrapper">
          <table class="tabla">
            <thead>
              <tr><th>Fecha</th><th>Alumno</th><th>Concepto</th><th>Importe</th><th>Estado</th><th>Método</th><th></th></tr>
            </thead>
            <tbody id="tbody-pagos"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script type="module">
    import { supabase, TABLES } from '../js/supabase-client.js'
    import { renderNav } from '../js/nav.js'

    renderNav('precios')

    // Tarifas
    const { data: tarifas } = await supabase.from(TABLES.tarifas).select('*')
    document.getElementById('tbody-tarifas').innerHTML = (tarifas || []).map(t => `
      <tr>
        <td>${t.tipo}</td>
        <td>${t.precio_por_hora} €</td>
        <td>${t.precio_por_alumno ? t.precio_por_alumno + ' €' : '—'}</td>
        <td>${t.activa ? '✅' : '❌'}</td>
      </tr>
    `).join('')

    // Pagos
    async function cargarPagos() {
      const { data } = await supabase
        .from(TABLES.pagos)
        .select('*, padel_alumnos(nombre, apellidos)')
        .order('created_at', { ascending: false })
        .limit(50)

      document.getElementById('tbody-pagos').innerHTML = (data || []).map(p => `
        <tr>
          <td>${p.fecha_pago || p.created_at?.split('T')[0]}</td>
          <td>${p.padel_alumnos ? p.padel_alumnos.nombre + ' ' + p.padel_alumnos.apellidos : '—'}</td>
          <td>${p.concepto || '—'}</td>
          <td>${p.importe} €</td>
          <td><span class="badge badge-${p.estado}">${p.estado}</span></td>
          <td>${p.metodo}</td>
          <td>
            <select data-pago-estado="${p.id}" style="width:auto;padding:4px;min-height:32px;font-size:14px;">
              <option value="pendiente" ${p.estado==='pendiente'?'selected':''}>Pendiente</option>
              <option value="pagado" ${p.estado==='pagado'?'selected':''}>Pagado</option>
              <option value="parcial" ${p.estado==='parcial'?'selected':''}>Parcial</option>
            </select>
          </td>
        </tr>
      `).join('') || '<tr><td colspan="7" style="text-align:center;color:var(--texto-secundario);">Sin pagos registrados</td></tr>'

      document.querySelectorAll('[data-pago-estado]').forEach(sel => {
        sel.onchange = async () => {
          await supabase.from(TABLES.pagos)
            .update({
              estado: sel.value,
              fecha_pago: sel.value === 'pagado' ? new Date().toISOString().split('T')[0] : null
            })
            .eq('id', sel.dataset.pagoEstado)
          cargarPagos()
        }
      })
    }

    // Informe mensual
    let informeActual = null

    document.getElementById('btn-generar').onclick = async () => {
      const mes = document.getElementById('mes').value
      if (!mes) { alert('Selecciona un mes'); return }
      const [year, month] = mes.split('-')
      const primerDia = `${year}-${month}-01`
      const ultimoDia = new Date(year, month, 0).toISOString().split('T')[0]

      const { data: clases } = await supabase
        .from(TABLES.clases)
        .select('precio_total, tipo, estado')
        .gte('fecha', primerDia)
        .lte('fecha', ultimoDia)

      const realizadas = (clases || []).filter(c => c.estado === 'realizada')
      const anuladas = (clases || []).filter(c => c.estado === 'anulada')
      const total = realizadas.reduce((s, c) => s + (c.precio_total || 0), 0)

      const porTipo = {}
      realizadas.forEach(c => {
        porTipo[c.tipo] = (porTipo[c.tipo] || 0) + (c.precio_total || 0)
      })

      informeActual = { mes, total, numClases: realizadas.length, anuladas: anuladas.length, porTipo }

      document.getElementById('resumen').innerHTML = `
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;">
          <div class="card"><div style="font-size:1.6rem;color:var(--pista-azul-hielo);font-weight:700;">${total.toFixed(2)} €</div><div style="color:var(--texto-secundario);font-size:0.85rem;">Ingresos totales</div></div>
          <div class="card"><div style="font-size:1.6rem;color:var(--pista-azul-hielo);font-weight:700;">${realizadas.length}</div><div style="color:var(--texto-secundario);font-size:0.85rem;">Clases realizadas</div></div>
          <div class="card"><div style="font-size:1.6rem;color:#e74c3c;font-weight:700;">${anuladas.length}</div><div style="color:var(--texto-secundario);font-size:0.85rem;">Clases anuladas</div></div>
        </div>
        <h3 style="margin-top:16px;font-size:1rem;">Por tipo de clase</h3>
        <div class="tabla-wrapper">
          <table class="tabla">
            <thead><tr><th>Tipo</th><th>Ingresos</th></tr></thead>
            <tbody>${Object.entries(porTipo).map(([k, v]) => `
              <tr><td>${k}</td><td>${v.toFixed(2)} €</td></tr>
            `).join('')}</tbody>
          </table>
        </div>
      `
    }

    document.getElementById('btn-exportar').onclick = () => {
      if (!informeActual) { alert('Genera primero un informe'); return }
      const { jsPDF } = window.jspdf
      const doc = new jsPDF()
      doc.setFontSize(18)
      doc.text('Informe mensual Padel Manager', 20, 20)
      doc.setFontSize(12)
      doc.text(`Mes: ${informeActual.mes}`, 20, 35)
      doc.text(`Ingresos totales: ${informeActual.total.toFixed(2)} EUR`, 20, 45)
      doc.text(`Clases realizadas: ${informeActual.numClases}`, 20, 55)
      doc.text(`Clases anuladas: ${informeActual.anuladas}`, 20, 65)
      doc.text('Desglose por tipo:', 20, 80)
      let y = 90
      Object.entries(informeActual.porTipo).forEach(([k, v]) => {
        doc.text(`  - ${k}: ${v.toFixed(2)} EUR`, 20, y)
        y += 8
      })
      doc.save(`informe-padel-${informeActual.mes}.pdf`)
    }

    document.getElementById('mes').value = new Date().toISOString().slice(0, 7)

    cargarPagos()
  </script>
</body>
</html>
