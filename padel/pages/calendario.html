<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Calendario — Padel Manager</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css">
  <link rel="stylesheet" href="../css/theme.css">
</head>
<body>
  <div class="layout">
    <nav class="sidebar"></nav>
    <main class="content">
      <h1>📅 Calendario</h1>

      <div class="tabs-roles" id="tabs-roles">
        <button class="tab-rol active" data-rol="todas">
          <span class="tab-icon">🌐</span>
          <span class="tab-label">Todas</span>
          <span class="tab-count" id="tab-count-todas">0</span>
        </button>
        <button class="tab-rol" data-rol="clase_profesor">
          <span class="tab-icon">🎾</span>
          <span class="tab-label">Clase profesor</span>
          <span class="tab-count" id="tab-count-clase_profesor">0</span>
        </button>
        <button class="tab-rol" data-rol="clase_alumno">
          <span class="tab-icon">👨‍🎓</span>
          <span class="tab-label">Clase alumno</span>
          <span class="tab-count" id="tab-count-clase_alumno">0</span>
        </button>
        <button class="tab-rol" data-rol="partido_nacional">
          <span class="tab-icon">🏆</span>
          <span class="tab-label">Torneo nacional</span>
          <span class="tab-count" id="tab-count-partido_nacional">0</span>
        </button>
        <button class="tab-rol" data-rol="partido_timpik">
          <span class="tab-icon">⚔️</span>
          <span class="tab-label">Liga Timpik</span>
          <span class="tab-count" id="tab-count-partido_timpik">0</span>
        </button>
        <button class="tab-rol" data-rol="gimnasio">
          <span class="tab-icon">💪</span>
          <span class="tab-label">Gimnasio</span>
          <span class="tab-count" id="tab-count-gimnasio">0</span>
        </button>
        <button class="tab-rol" data-rol="estudio">
          <span class="tab-icon">📚</span>
          <span class="tab-label">Estudio</span>
          <span class="tab-count" id="tab-count-estudio">0</span>
        </button>
      </div>

      <div class="tab-info" id="tab-info">
        <span class="tab-info-icon">🌐</span>
        <span class="tab-info-texto">Mostrando: <strong>Todas las clases</strong></span>
      </div>

      <div id="calendar"></div>

      <section class="listado-clases" id="listado-clases">
        <div class="listado-header">
          <h2 id="listado-titulo">📋 Listado</h2>
          <div class="listado-contador" id="listado-contador"></div>
        </div>

        <div class="listado-toolbar">
          <div class="listado-filtros">
            <button class="filtro-chip active" data-filtro="todas">Todas</button>
            <button class="filtro-chip" data-filtro="programada">📅 Programadas</button>
            <button class="filtro-chip" data-filtro="realizada">✅ Realizadas</button>
            <button class="filtro-chip" data-filtro="anulada">🚫 Anuladas</button>
            <button class="filtro-chip" data-filtro="recuperacion">🔄 Recuperaciones</button>
          </div>
          <input type="search" id="listado-buscador" class="listado-buscador" placeholder="🔍 Buscar clase o alumno...">
        </div>

        <div id="listado-contenido" class="listado-contenido">
          <p class="listado-vacio">Cargando clases...</p>
        </div>
      </section>
    </main>
  </div>

  <dialog id="modal-clase">
    <form id="form-clase">
      <h2 id="modal-titulo">Nueva Clase</h2>
      <input type="hidden" id="clase-id">
      <input type="hidden" id="titulo">

      <div class="modal-tabs" id="modal-tabs">
        <button type="button" class="modal-tab active" data-tipo="clase_profesor">
          <span class="mt-icon">🎾</span>
          <span class="mt-label">Clase profesor</span>
        </button>
        <button type="button" class="modal-tab" data-tipo="clase_alumno">
          <span class="mt-icon">👨‍🎓</span>
          <span class="mt-label">Clase alumno</span>
        </button>
        <button type="button" class="modal-tab" data-tipo="partido_nacional">
          <span class="mt-icon">🏆</span>
          <span class="mt-label">Torneo nacional</span>
        </button>
        <button type="button" class="modal-tab" data-tipo="partido_timpik">
          <span class="mt-icon">⚔️</span>
          <span class="mt-label">Liga Timpik</span>
        </button>
        <button type="button" class="modal-tab" data-tipo="gimnasio">
          <span class="mt-icon">💪</span>
          <span class="mt-label">Gimnasio</span>
        </button>
        <button type="button" class="modal-tab" data-tipo="estudio">
          <span class="mt-icon">📚</span>
          <span class="mt-label">Estudio</span>
        </button>
      </div>

      <div class="tipo-activo" id="tipo-activo">
        <span class="ta-icon">🎾</span>
        <span class="ta-label">Clase profesor</span>
      </div>

      <label>Fecha <input type="date" id="fecha" required></label>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
        <label>Hora inicio <input type="time" id="hora_inicio" required></label>
        <label>Hora fin <input type="time" id="hora_fin" required></label>
      </div>

      <div id="aviso-solape" class="aviso-solape" style="display:none;"></div>

      <div class="bloque-condicional" id="bloque-ejercicio">
        <label>Ejercicio del catálogo
          <select id="ejercicio_id">
            <option value="">— Sin ejercicio —</option>
          </select>
        </label>

        <label>O escribe un ejercicio libre
          <input type="text" id="ejercicio_libre" placeholder="Ej: Partidillos, Calentamiento...">
        </label>
      </div>

      <div class="bloque-condicional" id="bloque-tarea">
        <div class="label-tarea">
          <span>Añadir tarea</span>
          <button type="button" class="btn-eliminar-tarea" id="btn-eliminar-tarea" title="Eliminar tarea">
            🗑️ Eliminar tarea
          </button>
        </div>
        <textarea id="tarea" rows="2" placeholder="Ej: Repetir 20 voleas en casa, ver video del partido..."></textarea>
      </div>

      <div class="bloque-alumnos bloque-condicional" id="bloque-alumnos">
        <div id="seccion-recuperar" class="seccion-recuperar" style="display:none;">
          <div class="seccion-recuperar-titulo">
            🔄 Alumnos con faltas por recuperar
            <span id="contador-recuperar" class="contador-recuperar"></span>
          </div>
          <div id="lista-recuperar" class="lista-recuperar"></div>
          <p class="nota-recuperar">Al marcarlos, se vincularán a esta clase para recuperar su falta</p>
        </div>

        <label style="margin-bottom:8px;">Nivel
          <select id="nivel_filtro">
            <option value="">— Selecciona un nivel —</option>
            <option value="iniciacion">Iniciación</option>
            <option value="intermedio">Intermedio</option>
            <option value="avanzado">Avanzado</option>
            <option value="competicion">Competición</option>
          </select>
        </label>

        <div class="lista-alumnos-header">
          <span>Alumnos <span id="contador-alumnos" class="contador"></span></span>
          <div class="acciones-lista">
            <button type="button" class="btn-mini" id="btn-todos">Todos</button>
            <button type="button" class="btn-mini" id="btn-ninguno">Ninguno</button>
          </div>
        </div>

        <div id="lista-alumnos" class="lista-alumnos">
          <p class="vacio">Elige un nivel para ver los alumnos</p>
        </div>
      </div>

      <div id="bloque-repetir" class="bloque-repetir bloque-condicional">
        <label class="check-repetir">
          <input type="checkbox" id="repetir_semanal">
          <span>🔁 Repetir esta clase todas las semanas</span>
        </label>

        <div id="campos-repetir" style="display:none;">
          <label>Repetir hasta (inclusive)
            <input type="date" id="repetir_hasta">
          </label>
          <div id="preview-repeticion" class="preview-repeticion"></div>
        </div>
      </div>

      <label>Notas <textarea id="notas" rows="3"></textarea></label>

      <div id="estado-info" class="estado-info" style="display:none;"></div>
      <div id="aviso-dia" class="aviso-dia" style="display:none;"></div>

      <div class="modal-actions">
        <button type="button" class="btn-peligro btn-con-icono" id="btn-eliminar-clase" style="display:none;" title="Eliminar clase">
          <span class="btn-icon">🗑️</span>
          <span class="btn-texto">Eliminar</span>
        </button>

        <button type="button" class="btn-estado btn-realizada btn-con-icono" id="btn-realizada" style="display:none;" title="Marcar realizada">
          <span class="btn-icon">✅</span>
          <span class="btn-texto">Marcar realizada</span>
        </button>

        <button type="button" class="btn-estado btn-anular btn-con-icono" id="btn-anular" style="display:none;" title="Anular clase">
          <span class="btn-icon">🚫</span>
          <span class="btn-texto">Anular</span>
        </button>

        <button type="button" class="btn-estado btn-reabrir btn-con-icono" id="btn-reabrir" style="display:none;" title="Reabrir">
          <span class="btn-icon">↩️</span>
          <span class="btn-texto">Reabrir</span>
        </button>

        <button type="button" class="btn-secondary btn-con-icono" id="btn-nueva-mismo-dia" style="display:none;" title="Otra clase este día">
          <span class="btn-icon">➕</span>
          <span class="btn-texto">Otra clase este día</span>
        </button>

        <button type="button" class="btn-primary btn-guardar-otra btn-con-icono" id="btn-guardar-otra" style="display:none;" title="Guardar y añadir otra">
          <span class="btn-icon">💾➕</span>
          <span class="btn-texto">Guardar y añadir otra</span>
        </button>

        <button type="submit" class="btn-primary btn-con-icono" id="btn-guardar" title="Guardar">
          <span class="btn-icon">💾</span>
          <span class="btn-texto">Guardar</span>
        </button>

        <button type="button" class="btn-secondary btn-con-icono" id="btn-cancelar" title="Cerrar">
          <span class="btn-icon">❌</span>
          <span class="btn-texto">Cerrar</span>
        </button>
      </div>
    </form>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
  <script type="module">
    import { supabase, TABLES } from '../js/supabase-client.js'
    import { renderNav } from '../js/nav.js'

    renderNav('calendario')

    // ============================================================
    // CONFIGURACIÓN DE ROLES
    // ============================================================
    const ROLES = {
      clase_profesor:   { label: 'Clase profesor',         titulo: 'Clase profesor',         icon: '🎾', color: '#3a8fbf', campos: ['ejercicio','tarea','alumnos','repetir'] },
      clase_alumno:     { label: 'Clase alumno',           titulo: 'Clase alumno',           icon: '👨‍🎓', color: '#5bb8d4', campos: ['repetir'] },
      partido_nacional: { label: 'Torneo nacional',        titulo: 'Partido torneo nacional',icon: '🏆', color: '#e8ff3a', campos: [] },
      partido_timpik:   { label: 'Liga Timpik',            titulo: 'Partido Liga Timpik',    icon: '⚔️', color: '#8a9ba8', campos: [] },
      gimnasio:         { label: 'Gimnasio',               titulo: 'Gimnasio',               icon: '💪', color: '#e67e22', campos: ['tarea','repetir'] },
      estudio:          { label: 'Estudio',                titulo: 'Estudio',                icon: '📚', color: '#8e44ad', campos: ['repetir'] }
    }

    function infoRol(tipo) {
      return ROLES[tipo] || { label: tipo || '—', titulo: tipo || '—', icon: '📅', color: '#3a8fbf', campos: [] }
    }

    // ============================================================
    // REFERENCIAS DOM
    // ============================================================
    const modal = document.getElementById('modal-clase')
    const form = document.getElementById('form-clase')
    const selectEjercicio = document.getElementById('ejercicio_id')
    const selectNivel = document.getElementById('nivel_filtro')
    const listaAlumnos = document.getElementById('lista-alumnos')
    const contadorAlumnos = document.getElementById('contador-alumnos')
    const checkRepetir = document.getElementById('repetir_semanal')
    const camposRepetir = document.getElementById('campos-repetir')
    const inputRepetirHasta = document.getElementById('repetir_hasta')
    const previewRepeticion = document.getElementById('preview-repeticion')
    const btnRealizada = document.getElementById('btn-realizada')
    const btnAnular = document.getElementById('btn-anular')
    const btnReabrir = document.getElementById('btn-reabrir')
    const btnEliminarClase = document.getElementById('btn-eliminar-clase')
    const btnNuevaMismoDia = document.getElementById('btn-nueva-mismo-dia')
    const btnGuardarOtra = document.getElementById('btn-guardar-otra')
    const estadoInfo = document.getElementById('estado-info')
    const avisoDia = document.getElementById('aviso-dia')
    const avisoSolape = document.getElementById('aviso-solape')
    const inputFecha = document.getElementById('fecha')
    const inputHoraInicio = document.getElementById('hora_inicio')
    const inputHoraFin = document.getElementById('hora_fin')
    const inputTarea = document.getElementById('tarea')
    const btnEliminarTarea = document.getElementById('btn-eliminar-tarea')

    const modalTabs = document.getElementById('modal-tabs')
    const bloqueEjercicio = document.getElementById('bloque-ejercicio')
    const bloqueTarea = document.getElementById('bloque-tarea')
    const bloqueAlumnos = document.getElementById('bloque-alumnos')
    const bloqueRepetir = document.getElementById('bloque-repetir')
    const tipoActivoEl = document.getElementById('tipo-activo')

    const seccionRecuperar = document.getElementById('seccion-recuperar')
    const listaRecuperar = document.getElementById('lista-recuperar')
    const contadorRecuperar = document.getElementById('contador-recuperar')

    const listadoTitulo = document.getElementById('listado-titulo')
    const listadoContador = document.getElementById('listado-contador')
    const listadoContenido = document.getElementById('listado-contenido')
    const listadoBuscador = document.getElementById('listado-buscador')

    const tabsRoles = document.getElementById('tabs-roles')
    const tabInfo = document.getElementById('tab-info')

    // ============================================================
    // ESTADO
    // ============================================================
    let alumnosCache = []
    let alumnosSeleccionados = new Set()
    let faltasARecuperar = new Map()
    let faltasPendientes = []
    let claseActualId = null
    let claseActualEstado = null
    let modoGuardarYContinuar = false

    let clasesCache = []
    let eventosCache = []

    let calendar = null
    let listadoRango = null
    let listadoFiltro = 'todas'
    let listadoBusqueda = ''

    let rolActivo = 'todas'
    let tipoModalActivo = 'clase_profesor'

    const diasSemana = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado']
    const meses = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre']

    // ============================================================
    // UTILIDADES
    // ============================================================
    function tiempoAMinutos(t) {
      if (!t) return 0
      const [h, m] = String(t).slice(0, 5).split(':').map(Number)
      return h * 60 + m
    }

    function verificarSolapamiento(fecha, horaInicio, horaFin, excludeId = null) {
      const ini = tiempoAMinutos(horaInicio)
      const fin = tiempoAMinutos(horaFin)
      if (fin <= ini) return { error: 'La hora de fin debe ser posterior a la de inicio', conflictos: [] }
      const conflictos = clasesCache.filter(c => {
        if (excludeId && c.id === excludeId) return false
        if (c.fecha !== fecha) return false
        if (c.estado === 'anulada') return false
        const cIni = tiempoAMinutos(c.hora_inicio)
        const cFin = tiempoAMinutos(c.hora_fin)
        return ini < cFin && fin > cIni
      })
      if (conflictos.length > 0) return { error: 'Este horario se solapa con otra clase', conflictos }
      return null
    }

    function formatearConflictos(conflictos) {
      return conflictos.map(c => {
        const rol = infoRol(c.tipo)
        return `• ${c.hora_inicio.slice(0,5)}–${c.hora_fin.slice(0,5)}  ${rol.icon} "${c.titulo}"`
      }).join('\n')
    }

    function escapar(s) {
      return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    }

    // ============================================================
    // PESTAÑAS DEL MODAL
    // ============================================================
    function aplicarTipoModal(tipo) {
      tipoModalActivo = tipo
      const info = infoRol(tipo)

      document.getElementById('titulo').value = info.titulo

      tipoActivoEl.innerHTML = `
        <span class="ta-icon">${info.icon}</span>
        <span class="ta-label">${info.titulo}</span>
      `
      tipoActivoEl.style.borderLeftColor = info.color

      modalTabs.querySelectorAll('.modal-tab').forEach(t => {
        t.classList.toggle('active', t.dataset.tipo === tipo)
      })

      const campos = info.campos
      bloqueEjercicio.style.display = campos.includes('ejercicio') ? 'block' : 'none'
      bloqueTarea.style.display     = campos.includes('tarea')     ? 'block' : 'none'
      bloqueAlumnos.style.display   = campos.includes('alumnos')   ? 'block' : 'none'
      bloqueRepetir.style.display   = campos.includes('repetir')   ? 'block' : 'none'

      if (!campos.includes('repetir')) {
        checkRepetir.checked = false
        camposRepetir.style.display = 'none'
        previewRepeticion.textContent = ''
      }

      if (!campos.includes('tarea')) {
        inputTarea.value = ''
      }

      // Si estamos editando, reajustar los botones según el nuevo tipo
      if (claseActualId) {
        actualizarBotonesEstado(claseActualEstado, tipo)
      }

      actualizarBotonEliminarTarea()
      validarSolapeEnVivo()
    }

    modalTabs.addEventListener('click', (e) => {
      const tab = e.target.closest('.modal-tab')
      if (!tab) return
      aplicarTipoModal(tab.dataset.tipo)
    })

    // ============================================================
    // BOTÓN ELIMINAR TAREA
    // ============================================================
    function actualizarBotonEliminarTarea() {
      if (!btnEliminarTarea) return
      const tieneTexto = inputTarea.value.trim().length > 0
      btnEliminarTarea.style.display = tieneTexto ? 'inline-flex' : 'none'
    }

    inputTarea.addEventListener('input', actualizarBotonEliminarTarea)
    inputTarea.addEventListener('change', actualizarBotonEliminarTarea)

    btnEliminarTarea.addEventListener('click', () => {
      if (!inputTarea.value.trim()) return
      if (confirm('¿Eliminar la tarea de esta clase?')) {
        inputTarea.value = ''
        actualizarBotonEliminarTarea()
        inputTarea.focus()
      }
    })

    // ============================================================
    // CARGA DE DATOS
    // ============================================================
    async function cargarAlumnos() {
      const { data, error } = await supabase
        .from(TABLES.alumnos).select('id, nombre, nivel').eq('activo', true).order('nombre')
      if (error) { console.error('Error alumnos:', error); alumnosCache = []; return }
      alumnosCache = data || []
    }

    async function cargarFaltasPendientes() {
      const { data, error } = await supabase
        .from(TABLES.faltas)
        .select('id, alumno_id, tipo, fecha_registro, descripcion')
        .in('tipo', ['justificada', 'lesion'])
        .eq('recuperada', false)
        .is('clase_recuperacion_id', null)
        .order('fecha_registro', { ascending: true })
      if (error) { console.error('Error faltas:', error); faltasPendientes = []; return }
      faltasPendientes = data || []
    }

    async function cargarEjercicios() {
      const { data, error } = await supabase
        .from(TABLES.ejercicios).select('id, titulo').order('titulo')
      if (error) { console.error('Error ejercicios:', error); return }
      selectEjercicio.innerHTML = '<option value="">— Sin ejercicio —</option>' +
        (data || []).map(e => `<option value="${e.id}">${e.titulo}</option>`).join('')
    }

    async function cargarClases() {
      const { data, error } = await supabase
        .from(TABLES.clases)
        .select(`
          id, titulo, fecha, hora_inicio, hora_fin, tipo, estado,
          notas, motivo_anulacion, ejercicio_id, ejercicio_libre, tarea,
          padel_clase_alumnos(alumno_id, padel_alumnos(id, nombre)),
          padel_ejercicios(id, titulo)
        `)

      if (error) {
        console.error('Error cargando clases:', error)
        clasesCache = []
        eventosCache = []
        return []
      }

      clasesCache = (data || []).map(c => ({
        id: c.id, fecha: c.fecha, hora_inicio: c.hora_inicio, hora_fin: c.hora_fin,
        titulo: c.titulo, estado: c.estado, tipo: c.tipo
      }))

      const claseIds = (data || []).map(c => c.id)
      let clasesConRecuperacion = new Set()
      if (claseIds.length > 0) {
        const { data: faltasVinc } = await supabase
          .from(TABLES.faltas).select('clase_recuperacion_id').in('clase_recuperacion_id', claseIds)
        ;(faltasVinc || []).forEach(f => {
          if (f.clase_recuperacion_id) clasesConRecuperacion.add(f.clase_recuperacion_id)
        })
      }

      eventosCache = (data || []).map(c => {
        const rol = infoRol(c.tipo)
        return {
          id: c.id,
          title: rol.titulo,
          start: `${c.fecha}T${c.hora_inicio}`,
          end: `${c.fecha}T${c.hora_fin}`,
          extendedProps: {
            tipo: c.tipo,
            tipoLabel: rol.label,
            tipoIcon: rol.icon,
            estado: c.estado,
            notas: c.notas,
            motivo: c.motivo_anulacion,
            tarea: c.tarea,
            ejercicioId: c.ejercicio_id,
            ejercicioLibre: c.ejercicio_libre,
            alumnosIds: (c.padel_clase_alumnos || []).map(a => a.alumno_id),
            alumnosNombres: (c.padel_clase_alumnos || []).map(a => a.padel_alumnos?.nombre).filter(Boolean),
            esRecuperacion: clasesConRecuperacion.has(c.id)
          },
          backgroundColor: colorPorEstado(c.estado, c.tipo, clasesConRecuperacion.has(c.id)),
          borderColor: bordePorEstado(c.estado, clasesConRecuperacion.has(c.id)),
          classNames: classNamesPorEstado(c.estado)
        }
      })

      actualizarContadoresTabs()
      return eventosCache
    }

    function colorPorEstado(estado, tipo, esRecuperacion) {
      if (estado === 'anulada') return '#7a1a1a'
      if (estado === 'realizada') return '#1e8449'
      if (estado === 'reprogramada') return '#e67e22'
      if (esRecuperacion) return '#8e44ad'
      return infoRol(tipo).color
    }

    function bordePorEstado(estado, esRecuperacion) {
      if (estado === 'anulada') return '#e74c3c'
      if (estado === 'realizada') return '#2ecc71'
      if (esRecuperacion) return '#c39bd3'
      return 'transparent'
    }

    function classNamesPorEstado(estado) {
      if (estado === 'anulada') return ['evento-anulado']
      if (estado === 'realizada') return ['evento-realizado']
      return []
    }

    function renderEvento(info) {
      const { estado, esRecuperacion, tipoIcon } = info.event.extendedProps
      const icono = estado === 'realizada' ? '✅'
                  : estado === 'anulada' ? '🚫'
                  : estado === 'reprogramada' ? '🔄'
                  : esRecuperacion ? '🔄'
                  : (tipoIcon || '')
      const hora = info.timeText || ''
      const contenedor = document.createElement('div')
      contenedor.className = 'evento-contenido'
      contenedor.innerHTML = `
        <span class="evento-icono">${icono}</span>
        <span class="evento-hora">${hora}</span>
        <span class="evento-titulo">${info.event.title}</span>
      `
      return { domNodes: [contenedor] }
    }

    // ============================================================
    // PESTAÑAS EXTERNAS
    // ============================================================
    function actualizarContadoresTabs() {
      const elTodas = document.getElementById('tab-count-todas')
      if (elTodas) {
        elTodas.textContent = eventosCache.length
        elTodas.classList.toggle('empty', eventosCache.length === 0)
      }

      Object.keys(ROLES).forEach(rol => {
        const el = document.getElementById(`tab-count-${rol}`)
        if (!el) return
        const total = eventosCache.filter(e => e.extendedProps.tipo === rol).length
        el.textContent = total
        el.classList.toggle('empty', total === 0)
      })
    }

    function activarTab(rol) {
      rolActivo = rol
      document.querySelectorAll('.tab-rol').forEach(t => {
        t.classList.toggle('active', t.dataset.rol === rol)
      })

      if (rol === 'todas') {
        tabInfo.innerHTML = `
          <span class="tab-info-icon">🌐</span>
          <span class="tab-info-texto">Mostrando: <strong>Todas las clases</strong></span>
        `
        tabInfo.style.borderLeftColor = '#e8ff3a'
      } else {
        const info = infoRol(rol)
        tabInfo.innerHTML = `
          <span class="tab-info-icon">${info.icon}</span>
          <span class="tab-info-texto">Mostrando: <strong>${info.label}</strong></span>
        `
        tabInfo.style.borderLeftColor = info.color
      }

      filtrarCalendario()
      pintarListado()
    }

    function filtrarCalendario() {
      if (!calendar) return
      calendar.getEvents().forEach(ev => {
        const visible = rolActivo === 'todas' || ev.extendedProps.tipo === rolActivo
        ev.setProp('display', visible ? 'auto' : 'none')
      })
    }

    tabsRoles.addEventListener('click', (e) => {
      const tab = e.target.closest('.tab-rol')
      if (!tab) return
      activarTab(tab.dataset.rol)
    })

    // ============================================================
    // SECCIÓN RECUPERACIONES
    // ============================================================
    function pintarSeccionRecuperar() {
      if (faltasPendientes.length === 0) {
        seccionRecuperar.style.display = 'none'
        contadorRecuperar.textContent = ''
        return
      }
      seccionRecuperar.style.display = 'block'
      const nSel = faltasARecuperar.size
      contadorRecuperar.textContent = nSel > 0 ? `(${nSel} marcada${nSel > 1 ? 's' : ''})` : ''

      listaRecuperar.innerHTML = faltasPendientes.map(f => {
        const alumno = alumnosCache.find(a => a.id === f.alumno_id)
        if (!alumno) return ''
        const checked = faltasARecuperar.has(f.alumno_id) ? 'checked' : ''
        const tipoLabel = f.tipo === 'lesion' ? '🩹 Lesión' : '📝 Justificada'
        const fecha = f.fecha_registro?.split('T')[0] || ''
        return `
          <label class="item-recuperar" data-alumno="${f.alumno_id}">
            <input type="checkbox" value="${f.alumno_id}" data-falta="${f.id}" ${checked}>
            <div class="item-recuperar-info">
              <div class="item-recuperar-nombre">${escapar(alumno.nombre)}</div>
              <div class="item-recuperar-detalle">
                <span class="tipo-falta-${f.tipo}">${tipoLabel}</span> · ${fecha}
              </div>
            </div>
          </label>
        `
      }).join('')

      listaRecuperar.querySelectorAll('input[type="checkbox"]').forEach(cb => {
        cb.addEventListener('change', () => {
          const alumnoId = cb.value
          const faltaId = cb.dataset.falta
          if (cb.checked) {
            alumnosSeleccionados.add(alumnoId)
            faltasARecuperar.set(alumnoId, faltaId)
          } else {
            alumnosSeleccionados.delete(alumnoId)
            faltasARecuperar.delete(alumnoId)
          }
          pintarAlumnos(selectNivel.value)
          pintarSeccionRecuperar()
          actualizarContador()
        })
      })
    }

    // ============================================================
    // ALUMNOS POR NIVEL
    // ============================================================
    function pintarAlumnos(nivel) {
      if (!nivel) {
        listaAlumnos.innerHTML = '<p class="vacio">Elige un nivel para ver los alumnos</p>'
        actualizarContador()
        return
      }
      const filtrados = alumnosCache.filter(a => a.nivel === nivel)
      if (filtrados.length === 0) {
        listaAlumnos.innerHTML = '<p class="vacio">No hay alumnos de este nivel</p>'
        actualizarContador()
        return
      }
      listaAlumnos.innerHTML = filtrados.map(a => {
        const checked = alumnosSeleccionados.has(a.id) ? 'checked' : ''
        const esRec = faltasARecuperar.has(a.id)
        return `
          <label class="item-alumno ${esRec ? 'item-alumno-recuperacion' : ''}">
            <input type="checkbox" value="${a.id}" ${checked}>
            <span class="nombre">${a.nombre}</span>
            ${esRec ? '<span class="badge-recuperacion">🔄</span>' : ''}
          </label>
        `
      }).join('')

      listaAlumnos.querySelectorAll('input[type="checkbox"]').forEach(cb => {
        cb.addEventListener('change', () => {
          if (cb.checked) alumnosSeleccionados.add(cb.value)
          else {
            alumnosSeleccionados.delete(cb.value)
            if (faltasARecuperar.has(cb.value)) {
              faltasARecuperar.delete(cb.value)
              pintarSeccionRecuperar()
            }
          }
          actualizarContador()
        })
      })
      actualizarContador()
    }

    function actualizarContador() {
      const n = alumnosSeleccionados.size
      contadorAlumnos.textContent = n > 0 ? `(${n} seleccionado${n > 1 ? 's' : ''})` : ''
    }

    document.getElementById('btn-todos').addEventListener('click', () => {
      if (!selectNivel.value) return
      alumnosCache.filter(a => a.nivel === selectNivel.value).forEach(a => alumnosSeleccionados.add(a.id))
      pintarAlumnos(selectNivel.value)
    })

    document.getElementById('btn-ninguno').addEventListener('click', () => {
      if (!selectNivel.value) return
      alumnosCache.filter(a => a.nivel === selectNivel.value).forEach(a => {
        if (!faltasARecuperar.has(a.id)) alumnosSeleccionados.delete(a.id)
      })
      pintarAlumnos(selectNivel.value)
    })

    selectNivel.addEventListener('change', () => pintarAlumnos(selectNivel.value))

    // ============================================================
    // REPETICIÓN SEMANAL
    // ============================================================
    checkRepetir.addEventListener('change', () => {
      camposRepetir.style.display = checkRepetir.checked ? 'block' : 'none'
      if (checkRepetir.checked && !inputRepetirHasta.value) {
        const fb = inputFecha.value
        if (fb) {
          const d = new Date(fb + 'T12:00:00')
          d.setDate(d.getDate() + 7 * 8)
          inputRepetirHasta.value = d.toISOString().split('T')[0]
        }
      }
      actualizarPreviewRepeticion()
    })

    inputFecha.addEventListener('change', () => {
      if (checkRepetir.checked) actualizarPreviewRepeticion()
      if (!claseActualId) actualizarAvisoDia()
      validarSolapeEnVivo()
    })
    inputHoraInicio.addEventListener('change', () => { validarSolapeEnVivo(); actualizarAvisoDia() })
    inputHoraFin.addEventListener('change', () => { validarSolapeEnVivo(); actualizarAvisoDia() })
    inputRepetirHasta.addEventListener('change', actualizarPreviewRepeticion)

    function calcularFechasRepeticion(fb, fh) {
      if (!fb || !fh) return []
      const fechas = []
      const inicio = new Date(fb + 'T12:00:00')
      const fin = new Date(fh + 'T12:00:00')
      if (fin < inicio) return []
      const actual = new Date(inicio)
      while (actual <= fin) {
        fechas.push(actual.toISOString().split('T')[0])
        actual.setDate(actual.getDate() + 7)
        if (fechas.length > 100) break
      }
      return fechas
    }

    function actualizarPreviewRepeticion() {
      if (!checkRepetir.checked) { previewRepeticion.textContent = ''; return }
      const fechas = calcularFechasRepeticion(inputFecha.value, inputRepetirHasta.value)
      if (fechas.length === 0) {
        previewRepeticion.textContent = '⚠️ Selecciona una fecha límite válida'
        return
      }
      const conflictosPorFecha = []
      fechas.forEach(f => {
        const res = verificarSolapamiento(f, inputHoraInicio.value, inputHoraFin.value, claseActualId)
        if (res && res.conflictos.length) conflictosPorFecha.push({ fecha: f })
      })
      if (conflictosPorFecha.length > 0) {
        previewRepeticion.innerHTML = `
          <span style="color:#e74c3c;">⚠️ Se crearán ${fechas.length - conflictosPorFecha.length} de ${fechas.length}.</span>
          <ul style="margin:4px 0 0 16px;padding:0;font-size:0.75rem;color:#e74c3c;">
            ${conflictosPorFecha.map(x => `<li>${x.fecha}</li>`).join('')}
          </ul>
        `
      } else {
        previewRepeticion.innerHTML = `<span style="color:var(--pista-azul-hielo);">📆 Se crearán ${fechas.length} clases (${fechas[0]} → ${fechas[fechas.length - 1]})</span>`
      }
    }

    function validarSolapeEnVivo() {
      if (!inputFecha.value || !inputHoraInicio.value || !inputHoraFin.value) {
        avisoSolape.style.display = 'none'
        return
      }
      const res = verificarSolapamiento(inputFecha.value, inputHoraInicio.value, inputHoraFin.value, claseActualId)
      if (res) {
        avisoSolape.style.display = 'block'
        if (res.conflictos.length === 0) {
          avisoSolape.innerHTML = `<strong>⚠️ ${res.error}</strong>`
        } else {
          avisoSolape.innerHTML = `
            <strong>⚠️ ${res.error}</strong>
            <ul style="margin:6px 0 0 18px;padding:0;font-size:0.78rem;">
              ${res.conflictos.map(c => {
                const rol = infoRol(c.tipo)
                return `<li>${c.hora_inicio.slice(0,5)}–${c.hora_fin.slice(0,5)} ${rol.icon} · ${escapar(c.titulo)}</li>`
              }).join('')}
            </ul>
          `
        }
      } else {
        avisoSolape.style.display = 'none'
      }
    }

    function actualizarAvisoDia() {
      const fecha = inputFecha.value
      if (!fecha) { avisoDia.style.display = 'none'; return }
      const delDia = clasesCache
        .filter(c => c.fecha === fecha)
        .sort((a, b) => a.hora_inicio.localeCompare(b.hora_inicio))
      if (delDia.length === 0) { avisoDia.style.display = 'none'; return }
      avisoDia.style.display = 'block'
      avisoDia.innerHTML = `
        <div class="aviso-titulo">📌 Ya hay <strong>${delDia.length}</strong> clase${delDia.length > 1 ? 's' : ''} este día:</div>
        <ul class="aviso-lista">
          ${delDia.map(c => {
            const rol = infoRol(c.tipo)
            return `
              <li>
                <span class="aviso-hora">${c.hora_inicio.slice(0,5)}–${c.hora_fin.slice(0,5)}</span>
                <span class="aviso-nombre">${rol.icon} ${escapar(c.titulo)}</span>
                ${c.estado === 'anulada' ? '<span style="color:#e74c3c;">🚫</span>' : ''}
              </li>
            `
          }).join('')}
        </ul>
      `
    }

    // ============================================================
    // LISTADO
    // ============================================================
    function pintarListado() {
      if (!listadoRango) {
        listadoContenido.innerHTML = '<p class="listado-vacio">Preparando calendario...</p>'
        return
      }

      const { start, end, tipo, tituloFecha } = listadoRango
      const startMs = start.getTime()
      const endMs = end.getTime()

      let tituloBase
      if (rolActivo === 'todas') {
        tituloBase = '🌐 Todas las clases'
      } else {
        const info = infoRol(rolActivo)
        tituloBase = `${info.icon} ${info.label}`
      }

      if (tipo === 'timeGridDay') {
        listadoTitulo.textContent = `${tituloBase} · ${formatearFechaLarga(tituloFecha)}`
      } else if (tipo === 'timeGridWeek') {
        const fin = new Date(endMs - 86400000)
        listadoTitulo.textContent = `${tituloBase} · semana ${formatearFechaCorta(start)}–${formatearFechaCorta(fin)}`
      } else {
        listadoTitulo.textContent = `${tituloBase} · ${meses[tituloFecha.getMonth()]} ${tituloFecha.getFullYear()}`
      }
      listadoTitulo.style.color = rolActivo === 'todas' ? '#e8ff3a' : infoRol(rolActivo).color

      let enRango = eventosCache.filter(ev => {
        if (rolActivo !== 'todas' && ev.extendedProps.tipo !== rolActivo) return false
        const fecha = parseFechaLocal(ev.start)
        const t = fecha.getTime()
        return t >= startMs && t < endMs
      })

      if (listadoFiltro !== 'todas') {
        if (listadoFiltro === 'recuperacion') {
          enRango = enRango.filter(e => e.extendedProps.esRecuperacion)
        } else {
          enRango = enRango.filter(e => e.extendedProps.estado === listadoFiltro)
        }
      }

      if (listadoBusqueda.trim()) {
        const q = listadoBusqueda.trim().toLowerCase()
        enRango = enRango.filter(e => {
          const p = e.extendedProps
          const alumnos = (p.alumnosNombres || []).join(' ').toLowerCase()
          const titulo = (e.title || '').toLowerCase()
          return titulo.includes(q) || alumnos.includes(q)
        })
      }

      enRango.sort((a, b) => new Date(a.start).getTime() - new Date(b.start).getTime())

      const total = enRango.length
      const programadas = enRango.filter(e => e.extendedProps.estado === 'programada').length
      const realizadas = enRango.filter(e => e.extendedProps.estado === 'realizada').length
      const anuladas = enRango.filter(e => e.extendedProps.estado === 'anulada').length

      listadoContador.innerHTML = total === 0
        ? ''
        : `<span class="chip-resumen">${total} total</span>` +
          (programadas > 0 ? `<span class="chip-resumen chip-prog">${programadas} 📅</span>` : '') +
          (realizadas > 0 ? `<span class="chip-resumen chip-real">${realizadas} ✅</span>` : '') +
          (anuladas > 0 ? `<span class="chip-resumen chip-anul">${anuladas} 🚫</span>` : '')

      if (enRango.length === 0) {
        const msg = listadoBusqueda.trim()
          ? `Sin resultados para "${escapar(listadoBusqueda)}"`
          : (listadoFiltro !== 'todas'
              ? 'Sin clases con este filtro'
              : 'Sin clases en este período')
        listadoContenido.innerHTML = `<p class="listado-vacio">${msg}</p>`
        return
      }

      const porFecha = {}
      enRango.forEach(ev => {
        const fecha = ev.start.split('T')[0]
        if (!porFecha[fecha]) porFecha[fecha] = []
        porFecha[fecha].push(ev)
      })

      const hoyISO = new Date().toISOString().split('T')[0]

      listadoContenido.innerHTML = Object.entries(porFecha)
        .sort(([a], [b]) => a.localeCompare(b))
        .map(([fecha, clases]) => {
          const fechaObj = new Date(fecha + 'T12:00:00')
          const diaSemana = diasSemana[fechaObj.getDay()]
          const esHoy = fecha === hoyISO
          return `
            <div class="listado-dia ${esHoy ? 'listado-hoy' : ''}">
              <div class="listado-dia-header">
                <span class="listado-dia-fecha">${formatearFechaCorta(fechaObj)}</span>
                <span class="listado-dia-nombre">${diaSemana}</span>
                ${esHoy ? '<span class="listado-hoy-tag">HOY</span>' : ''}
                <span class="listado-dia-count">${clases.length} clase${clases.length > 1 ? 's' : ''}</span>
              </div>
              <div class="listado-clases-dia">
                ${clases.map(c => pintarItemListado(c)).join('')}
              </div>
            </div>
          `
        }).join('')
    }

    function pintarItemListado(ev) {
      const p = ev.extendedProps
      const icono = p.estado === 'realizada' ? '✅'
                  : p.estado === 'anulada' ? '🚫'
                  : p.estado === 'reprogramada' ? '🔄'
                  : p.esRecuperacion ? '🔄'
                  : (p.tipoIcon || '📅')
      const hora = `${ev.start.split('T')[1].slice(0,5)}–${ev.end.split('T')[1].slice(0,5)}`
      const alumnos = p.alumnosNombres || []
      const alumnosTxt = alumnos.length > 0
        ? (alumnos.length > 5 ? `${alumnos.slice(0,5).join(', ')} +${alumnos.length-5}` : alumnos.join(', '))
        : 'Sin alumnos'
      const colorBar = p.estado === 'realizada' ? '#1e8449'
                     : p.estado === 'anulada' ? '#7a1a1a'
                     : p.esRecuperacion ? '#8e44ad'
                     : infoRol(p.tipo).color

      const mostrarAlumnos = p.tipo === 'clase_profesor'

      return `
        <div class="listado-clase" data-id="${ev.id}" style="border-left-color: ${colorBar};">
          <div class="listado-clase-hora">${hora}</div>
          <div class="listado-clase-info">
            <div class="listado-clase-titulo">
              <span class="listado-clase-icono">${icono}</span>
              ${escapar(ev.title)}
              ${rolActivo === 'todas' ? `<span class="listado-clase-tipo">${p.tipoIcon} ${p.tipoLabel}</span>` : ''}
            </div>
            ${mostrarAlumnos ? `<div class="listado-clase-alumnos">👥 ${escapar(alumnosTxt)}</div>` : ''}
            ${p.tarea ? `<div class="listado-clase-tarea">📝 ${escapar(p.tarea)}</div>` : ''}
          </div>
        </div>
      `
    }

    function parseFechaLocal(s) {
      if (!s) return new Date(0)
      const [fecha, hora] = s.split('T')
      const [y, m, d] = fecha.split('-').map(Number)
      const [h, mi] = (hora || '00:00').split(':').map(Number)
      return new Date(y, m - 1, d, h, mi, 0, 0)
    }

    function formatearFechaCorta(d) {
      return `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}`
    }

    function formatearFechaLarga(d) {
      return `${diasSemana[d.getDay()]} ${d.getDate()} de ${meses[d.getMonth()]}`
    }

    listadoContenido.addEventListener('click', (e) => {
      const item = e.target.closest('.listado-clase')
      if (!item || !calendar) return
      const evFull = calendar.getEventById(item.dataset.id)
      if (evFull) abrirModal(evFull)
    })

    document.querySelectorAll('.filtro-chip').forEach(chip => {
      chip.onclick = () => {
        document.querySelectorAll('.filtro-chip').forEach(c => c.classList.remove('active'))
        chip.classList.add('active')
        listadoFiltro = chip.dataset.filtro
        pintarListado()
      }
    })

    listadoBuscador.addEventListener('input', (e) => {
      listadoBusqueda = e.target.value
      pintarListado()
    })

    // ============================================================
    // MODAL
    // ============================================================
    async function abrirModal(clase) {
      // Reset visibilidad botones
      btnRealizada.style.display = 'none'
      btnAnular.style.display = 'none'
      btnReabrir.style.display = 'none'
      btnEliminarClase.style.display = 'none'
      btnNuevaMismoDia.style.display = 'none'
      btnGuardarOtra.style.display = 'none'
      estadoInfo.style.display = 'none'
      avisoDia.style.display = 'none'
      avisoSolape.style.display = 'none'

      alumnosSeleccionados = new Set()
      faltasARecuperar = new Map()
      await cargarFaltasPendientes()

      if (clase?.id) {
        // ===== EDITAR =====
        claseActualId = clase.id
        claseActualEstado = clase.extendedProps.estado

        document.getElementById('modal-titulo').textContent = 'Editar'
        document.getElementById('clase-id').value = clase.id
        inputFecha.value = clase.startStr.split('T')[0]
        inputHoraInicio.value = clase.startStr.split('T')[1]?.slice(0,5) || '09:00'
        inputHoraFin.value = clase.endStr?.split('T')[1]?.slice(0,5) || '10:00'
        document.getElementById('ejercicio_id').value = clase.extendedProps.ejercicioId || ''
        document.getElementById('ejercicio_libre').value = clase.extendedProps.ejercicioLibre || ''
        inputTarea.value = clase.extendedProps.tarea || ''
        document.getElementById('notas').value = clase.extendedProps.notas || ''

        alumnosSeleccionados = new Set(clase.extendedProps.alumnosIds || [])

        const { data: faltasVinc } = await supabase
          .from(TABLES.faltas).select('id, alumno_id').eq('clase_recuperacion_id', clase.id)

        ;(faltasVinc || []).forEach(f => {
          faltasARecuperar.set(f.alumno_id, f.id)
          alumnosSeleccionados.add(f.alumno_id)
        })

        selectNivel.value = ''
        const niveles = new Set(alumnosCache.filter(a => alumnosSeleccionados.has(a.id)).map(a => a.nivel))
        if (niveles.size === 1) selectNivel.value = [...niveles][0]
        pintarAlumnos(selectNivel.value)
        pintarSeccionRecuperar()

        document.getElementById('btn-guardar').querySelector('.btn-texto').textContent = 'Guardar'
        btnEliminarClase.style.display = 'inline-flex'
        btnNuevaMismoDia.style.display = 'none'
        btnGuardarOtra.style.display = 'none'

        actualizarBotonesEstado(claseActualEstado, clase.extendedProps.tipo)

        aplicarTipoModal(clase.extendedProps.tipo || 'clase_profesor')
      } else {
        // ===== NUEVA =====
        claseActualId = null
        claseActualEstado = 'programada'
        form.reset()
        document.getElementById('modal-titulo').textContent = 'Nueva'
        document.getElementById('clase-id').value = ''
        inputFecha.value = clase?.fecha || ''
        inputHoraInicio.value = clase?.horaInicio || '09:00'
        inputHoraFin.value = clase?.horaFin || '10:00'
        inputTarea.value = ''
        document.getElementById('btn-guardar').querySelector('.btn-texto').textContent = 'Guardar'
        btnEliminarClase.style.display = 'none'
        btnGuardarOtra.style.display = 'inline-flex'
        btnNuevaMismoDia.style.display = 'inline-flex'
        selectNivel.value = ''
        pintarAlumnos('')
        pintarSeccionRecuperar()

        const tipoInicial = rolActivo === 'todas' ? 'clase_profesor' : rolActivo
        aplicarTipoModal(tipoInicial)

        if (clase?.fecha) {
          actualizarAvisoDia()
          validarSolapeEnVivo()
        }
      }

      actualizarBotonEliminarTarea()

      modoGuardarYContinuar = false
      modal.showModal()
    }

    function actualizarBotonesEstado(estado, tipo) {
      btnRealizada.style.display = 'none'
      btnAnular.style.display = 'none'
      btnReabrir.style.display = 'none'
      estadoInfo.style.display = 'block'

      const esProfesor = tipo === 'clase_profesor'

      if (estado === 'programada' || estado === 'reprogramada') {
        estadoInfo.innerHTML = `Estado actual: <strong style="color:#3a8fbf;">${estado === 'reprogramada' ? '🔄 Reprogramada' : '📅 Programada'}</strong>`
        btnRealizada.style.display = 'inline-flex'
        if (esProfesor) btnAnular.style.display = 'inline-flex'
      } else if (estado === 'realizada') {
        estadoInfo.innerHTML = `Estado actual: <strong style="color:#2ecc71;">✅ Realizada</strong>`
        btnReabrir.style.display = 'inline-flex'
        if (esProfesor) btnAnular.style.display = 'inline-flex'
      } else if (estado === 'anulada') {
        estadoInfo.innerHTML = `Estado actual: <strong style="color:#e74c3c;">🚫 Anulada</strong>`
        btnReabrir.style.display = 'inline-flex'
        btnRealizada.style.display = 'inline-flex'
      }
    }

    async function cambiarEstado(nuevoEstado) {
      if (!claseActualId) return
      if (nuevoEstado === 'anulada') {
        const motivo = prompt('Motivo de la anulación (opcional):', '')
        if (motivo === null) return
        await supabase.from(TABLES.clases).update({ estado: 'anulada', motivo_anulacion: motivo || null }).eq('id', claseActualId)
        await supabase.from(TABLES.faltas).update({ clase_recuperacion_id: null, recuperada: false }).eq('clase_recuperacion_id', claseActualId)
      } else {
        await supabase.from(TABLES.clases).update({ estado: nuevoEstado, motivo_anulacion: nuevoEstado === 'realizada' ? null : undefined }).eq('id', claseActualId)
        if (nuevoEstado === 'realizada') {
          await supabase.from(TABLES.faltas).update({ recuperada: true }).eq('clase_recuperacion_id', claseActualId)
        }
        if (nuevoEstado === 'programada' && claseActualEstado === 'realizada') {
          await supabase.from(TABLES.faltas).update({ recuperada: false }).eq('clase_recuperacion_id', claseActualId)
        }
      }
      claseActualEstado = nuevoEstado

      // Obtener tipo para actualizar botones correctamente
      const ev = calendar?.getEventById(claseActualId)
      const tipoClase = ev?.extendedProps?.tipo || tipoModalActivo
      actualizarBotonesEstado(nuevoEstado, tipoClase)

      await refrescarTodo()
    }

    async function eliminarClase() {
      if (!claseActualId) return
      if (!confirm('¿Eliminar esta clase definitivamente?\n\nEsta acción no se puede deshacer.')) return

      // Desvincular faltas vinculadas
      await supabase.from(TABLES.faltas)
        .update({ clase_recuperacion_id: null, recuperada: false })
        .eq('clase_recuperacion_id', claseActualId)

      const { error } = await supabase.from(TABLES.clases).delete().eq('id', claseActualId)
      if (error) { alert('Error: ' + error.message); return }

      modal.close()
      await refrescarTodo()
    }

    btnEliminarClase.onclick = eliminarClase
    btnRealizada.onclick = () => cambiarEstado('realizada')
    btnAnular.onclick = () => cambiarEstado('anulada')
    btnReabrir.onclick = () => cambiarEstado('programada')
    document.getElementById('btn-cancelar').onclick = () => modal.close()

    btnNuevaMismoDia.onclick = () => {
      const f = inputFecha.value
      modal.close()
      setTimeout(() => abrirModal({ fecha: f }), 150)
    }

    btnGuardarOtra.addEventListener('click', () => {
      modoGuardarYContinuar = true
      form.dispatchEvent(new Event('submit', { cancelable: true, bubbles: true }))
    })

    form.addEventListener('submit', async (e) => {
      e.preventDefault()
      const id = document.getElementById('clase-id').value
      const alumnosIds = Array.from(alumnosSeleccionados)

      const info = infoRol(tipoModalActivo)
      const campos = info.campos

      const datosBase = {
        titulo: info.titulo,
        hora_inicio: inputHoraInicio.value,
        hora_fin: inputHoraFin.value,
        tipo: tipoModalActivo,
        ejercicio_id: campos.includes('ejercicio') ? (document.getElementById('ejercicio_id').value || null) : null,
        ejercicio_libre: campos.includes('ejercicio') ? (document.getElementById('ejercicio_libre').value || null) : null,
        tarea: campos.includes('tarea') ? (inputTarea.value || null) : null,
        notas: document.getElementById('notas').value
      }

      const fechaBase = inputFecha.value

      if (tiempoAMinutos(datosBase.hora_fin) <= tiempoAMinutos(datosBase.hora_inicio)) {
        alert('⚠️ La hora de fin debe ser posterior a la de inicio')
        modoGuardarYContinuar = false
        return
      }

      const resSolape = verificarSolapamiento(fechaBase, datosBase.hora_inicio, datosBase.hora_fin, id || null)
      if (resSolape && resSolape.conflictos.length) {
        alert(`⚠️ Este horario se solapa con otra clase:\n\n${formatearConflictos(resSolape.conflictos)}`)
        modoGuardarYContinuar = false
        return
      }

      const alumnosAGuardar = campos.includes('alumnos') ? alumnosIds : []

      if (id) {
        await supabase.from(TABLES.clases).update({ ...datosBase, fecha: fechaBase }).eq('id', id)
        await supabase.from(TABLES.claseAlumnos).delete().eq('clase_id', id)
        if (alumnosAGuardar.length) {
          await supabase.from(TABLES.claseAlumnos).insert(alumnosAGuardar.map(aid => ({ clase_id: id, alumno_id: aid })))
        }
        await supabase.from(TABLES.faltas).update({ clase_recuperacion_id: null, recuperada: false }).eq('clase_recuperacion_id', id)
        for (const [alumnoId, faltaId] of faltasARecuperar) {
          await supabase.from(TABLES.faltas).update({ clase_recuperacion_id: id }).eq('id', faltaId)
        }
        modal.close()
        await refrescarTodo()
        return
      }

      let fechas = [fechaBase]
      if (checkRepetir.checked && campos.includes('repetir')) {
        fechas = calcularFechasRepeticion(fechaBase, inputRepetirHasta.value)
        if (fechas.length === 0) { alert('Fecha límite inválida'); modoGuardarYContinuar = false; return }
        if (fechas.length > 100) { alert('Demasiadas repeticiones'); modoGuardarYContinuar = false; return }
      }

      const fechasOk = []
      const fechasConflicto = []
      for (const f of fechas) {
        const res = verificarSolapamiento(f, datosBase.hora_inicio, datosBase.hora_fin)
        if (res && res.conflictos.length) fechasConflicto.push({ fecha: f, conflictos: res.conflictos })
        else fechasOk.push(f)
      }

      if (fechasConflicto.length > 0) {
        const detalle = fechasConflicto.map(x => `📅 ${x.fecha}\n${formatearConflictos(x.conflictos)}`).join('\n\n')
        if (fechasOk.length === 0) {
          alert(`⚠️ Todas las fechas tienen conflicto:\n\n${detalle}`)
          modoGuardarYContinuar = false
          return
        }
        if (!confirm(`⚠️ Conflictos en ${fechasConflicto.length} de ${fechas.length}:\n\n${detalle}\n\n¿Guardar solo ${fechasOk.length}?`)) {
          modoGuardarYContinuar = false
          return
        }
      }

      const clasesAInsertar = fechasOk.map(f => ({ ...datosBase, fecha: f }))
      const { data: insertadas, error } = await supabase.from(TABLES.clases).insert(clasesAInsertar).select()
      if (error) { alert('Error: ' + error.message); modoGuardarYContinuar = false; return }

      if (alumnosAGuardar.length && insertadas?.length) {
        const relaciones = []
        insertadas.forEach(c => { alumnosAGuardar.forEach(aid => relaciones.push({ clase_id: c.id, alumno_id: aid })) })
        await supabase.from(TABLES.claseAlumnos).insert(relaciones)
      }

      if (insertadas?.length && faltasARecuperar.size > 0 && campos.includes('alumnos')) {
        const primeraClaseId = insertadas[0].id
        for (const [alumnoId, faltaId] of faltasARecuperar) {
          await supabase.from(TABLES.faltas).update({ clase_recuperacion_id: primeraClaseId }).eq('id', faltaId)
        }
      }

      await refrescarTodo()

      if (modoGuardarYContinuar) {
        modoGuardarYContinuar = false
        const fg = fechaBase
        const aviso = document.createElement('div')
        aviso.className = 'toast-guardado'
        aviso.textContent = '✅ Clase guardada — añade otra'
        document.body.appendChild(aviso)
        setTimeout(() => aviso.remove(), 2000)

        const hf = datosBase.hora_fin
        if (hf) {
          const [h, m] = hf.split(':').map(Number)
          inputHoraInicio.value = `${String((h + 1) % 24).padStart(2, '0')}:${String(m).padStart(2, '0')}`
          inputHoraFin.value = `${String((h + 2) % 24).padStart(2, '0')}:${String(m).padStart(2, '0')}`
        }
        document.getElementById('ejercicio_id').value = ''
        document.getElementById('ejercicio_libre').value = ''
        inputTarea.value = ''
        document.getElementById('notas').value = ''
        checkRepetir.checked = false
        camposRepetir.style.display = 'none'
        previewRepeticion.textContent = ''
        document.getElementById('modal-titulo').textContent = 'Nueva (mismo día)'
        inputFecha.value = fg
        alumnosSeleccionados = new Set()
        faltasARecuperar = new Map()
        await cargarFaltasPendientes()
        selectNivel.value = ''
        pintarAlumnos('')
        pintarSeccionRecuperar()
        actualizarAvisoDia()
        validarSolapeEnVivo()
        actualizarBotonEliminarTarea()
        modal.scrollTop = 0
        return
      }

      modal.close()
    })

    async function refrescarTodo() {
      const eventos = await cargarClases()
      if (calendar) {
        calendar.removeAllEvents()
        calendar.addEventSource(eventos)
        filtrarCalendario()
      }
      pintarListado()
    }

    // ============================================================
    // INICIALIZACIÓN
    // ============================================================
    async function inicializar() {
      await Promise.all([cargarAlumnos(), cargarEjercicios()])
      await cargarClases()

      const esMovil = window.innerWidth < 768

      calendar = new FullCalendar.Calendar(document.getElementById('calendar'), {
        initialView: esMovil ? 'timeGridWeek' : 'dayGridMonth',
        locale: 'es',
        firstDay: 1,
        weekNumbers: false,
        headerToolbar: esMovil
          ? { left: 'prev,next', center: 'title', right: 'dayGridMonth,timeGridWeek,timeGridDay' }
          : { left: 'prev,next today', center: 'title', right: 'dayGridMonth,timeGridWeek,timeGridDay' },
        buttonText: { today: 'Hoy', month: 'Mes', week: 'Sem', day: 'Día' },
        views: {
          dayGridMonth: { buttonText: 'Mes' },
          timeGridWeek: { buttonText: 'Sem' },
          timeGridDay:  { buttonText: 'Día' }
        },
        events: eventosCache,
        eventContent: renderEvento,
        editable: !esMovil,
        selectable: true,
        selectMirror: true,
        selectAllow: (info) => {
          if (!info.startStr.includes('T')) return true
          const fecha = info.startStr.split('T')[0]
          const hi = info.startStr.split('T')[1]?.slice(0,5) || '00:00'
          const hf = info.endStr.split('T')[1]?.slice(0,5) || '23:59'
          const res = verificarSolapamiento(fecha, hi, hf)
          return !res || res.conflictos.length === 0
        },
        dayMaxEvents: esMovil ? 5 : 4,
        moreLinkText: (n) => `+${n} más`,
        nowIndicator: true,
        slotMinTime: '07:00:00',
        slotMaxTime: '23:00:00',
        allDaySlot: false,
        select: (info) => {
          const fecha = info.startStr.split('T')[0]
          const hi = info.startStr.includes('T') ? info.startStr.split('T')[1].slice(0, 5) : '09:00'
          const hf = info.endStr.includes('T') ? info.endStr.split('T')[1].slice(0, 5) : '10:00'
          abrirModal({ fecha, horaInicio: hi, horaFin: hf })
        },
        dateClick: (info) => abrirModal({ fecha: info.dateStr }),
        eventClick: (info) => abrirModal(info.event),
        eventDrop: async (info) => {
          const nf = info.event.startStr.split('T')[0]
          const nhi = info.event.startStr.split('T')[1]?.slice(0,5)
          const dur = (info.event.end - info.event.start) / 60000
          const [h, m] = nhi.split(':').map(Number)
          const finMin = h * 60 + m + dur
          const nhf = `${String(Math.floor(finMin/60)).padStart(2,'0')}:${String(finMin%60).padStart(2,'0')}`
          const res = verificarSolapamiento(nf, nhi, nhf, info.event.id)
          if (res && res.conflictos.length) {
            info.revert()
            alert(`⚠️ No se puede mover:\n\n${formatearConflictos(res.conflictos)}`)
            return
          }
          const { error } = await supabase.from(TABLES.clases)
            .update({ fecha: nf, hora_inicio: nhi, hora_fin: nhf }).eq('id', info.event.id)
          if (error) { info.revert(); alert('Error: ' + error.message); return }
          await refrescarTodo()
        },
        datesSet: (info) => {
          listadoRango = {
            start: info.view.activeStart,
            end: info.view.activeEnd,
            tipo: info.view.type,
            tituloFecha: info.view.currentStart
          }
          pintarListado()
          actualizarContadoresTabs()
        },
        eventOverlap: false,
        moreLinkClick: 'popover',
        dayPopoverFormat: { month: 'long', day: 'numeric', year: 'numeric' }
      })

      calendar.render()

      activarTab('todas')
      aplicarTipoModal('clase_profesor')

      if (calendar.view) {
        listadoRango = {
          start: calendar.view.activeStart,
          end: calendar.view.activeEnd,
          tipo: calendar.view.type,
          tituloFecha: calendar.view.currentStart
        }
        pintarListado()
      }
    }

    let resizeTimer
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer)
      resizeTimer = setTimeout(() => {
        if (calendar?.view) {
          listadoRango = {
            start: calendar.view.activeStart,
            end: calendar.view.activeEnd,
            tipo: calendar.view.type,
            tituloFecha: calendar.view.currentStart
          }
          pintarListado()
        }
      }, 200)
    })

    await inicializar()
  </script>

    /* ============================================================
       Resto (eventos, avisos, etc.)
       ============================================================ */
    .evento-contenido {

      overflow: hidden; white-space: nowrap; padding: 0 2px;

    .evento-titulo { overflow: hidden; text-overflow: ellipsis; font-weight: 500; }

    .evento-anulado .evento-titulo { text-decoration: line-through; opacity: 0.9; }
    .evento-anulado::before {
      content: ''; position: absolute; inset: 0;
      background: repeating-linear-gradient(45deg,
        transparent, transparent 4px,

    .bloque-alumnos {
      background: var(--fondo-app); border: 1px solid var(--borde-card);

    }
    .seccion-recuperar {
      background: linear-gradient(135deg, rgba(142, 68, 173, 0.15), rgba(142, 68, 173, 0.05));

    .lista-alumnos-header {
      display: flex; justify-content: space-between; align-items: center;

      color: var(--texto-secundario); font-weight: 600;
    }
    .contador { color: var(--pista-azul-hielo); font-weight: 700; }
    .acciones-lista { display: flex; gap: 6px; }
    .btn-mini {
      background: var(--pista-azul-oscuro); color: var(--texto-principal);
      border: 1px solid var(--borde-card); padding: 3px 10px; border-radius: 4px;
      font-size: 0.72rem; font-weight: 600; cursor: pointer; min-height: auto;
    }
    .btn-mini:hover { background: var(--pista-azul-claro); border-color: var(--pista-azul-claro); }
    .lista-alumnos {
      max-height: 200px; overflow-y: auto;
      border: 1px solid var(--borde-card); border-radius: 6px;
      background: var(--fondo-card); padding: 4px;

      padding: 12px; text-align: center;
      color: var(--texto-secundario); font-size: 0.82rem; margin: 0;
    }
    .item-alumno {
      display: flex !important; align-items: center; gap: 10px;
      padding: 8px 10px; margin: 0 !important; border-radius: 5px;
      cursor: pointer; font-size: 0.9rem; color: var(--texto-principal);
      transition: background 0.12s;
    }
    .item-alumno:hover { background: rgba(58, 143, 191, 0.15); }
    .item-alumno input[type="checkbox"] {
      width: 18px; height: 18px; min-height: auto; margin: 0;
      flex-shrink: 0; cursor: pointer; accent-color: var(--pista-azul-claro);

    .item-alumno-recuperacion { background: rgba(142, 68, 173, 0.15); }
    .badge-recuperacion {
      background: #8e44ad; color: white; font-size: 0.65rem;
      padding: 2px 6px; border-radius: 10px; flex-shrink: 0;
    }
    .bloque-repetir {
      background: var(--fondo-app); border: 1px solid var(--borde-card);
      border-radius: 8px; padding: 12px; margin-bottom: 12px;
    }
    .check-repetir { display: flex; align-items: center; gap: 8px; margin: 0 !important; cursor: pointer; }

      width: 18px; height: 18px; min-height: auto; margin: 0;
      flex-shrink: 0; accent-color: var(--pista-azul-claro);
    }
    .check-repetir span { font-weight: 600; color: var(--texto-principal); font-size: 0.9rem; }
    .preview-repeticion { font-size: 0.8rem; color: var(--pista-azul-hielo); margin-top: 6px; }

      background: var(--fondo-app); border: 1px solid var(--borde-card);

      background: rgba(192, 57, 43, 0.15); border: 1px solid #e74c3c;
      border-left: 4px solid #e74c3c; border-radius: 6px; padding: 10px 12px;
      margin-bottom: 12px; font-size: 0.83rem; color: #e74c3c;
      animation: shakeIn 0.3s ease;
    }
    .aviso-solape strong { color: #e74c3c; }
    @keyframes shakeIn {
      0% { transform: translateX(0); }
      25% { transform: translateX(-4px); }
      75% { transform: translateX(4px); }
      100% { transform: translateX(0); }
    }
    .aviso-dia {
      background: rgba(58, 143, 191, 0.1); border: 1px solid var(--pista-azul-claro);
      border-left: 4px solid var(--pista-azul-claro); border-radius: 6px;
      padding: 10px 12px; margin-bottom: 12px; font-size: 0.83rem;

      display: flex; gap: 8px; padding: 3px 0;
      color: var(--texto-secundario);
      border-bottom: 1px dashed rgba(138, 155, 168, 0.2); font-size: 0.8rem;
    }
    .aviso-lista li:last-child { border-bottom: none; }

      color: var(--texto-principal);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .btn-estado { font-weight: 600; }
    .btn-estado.btn-realizada { background: #1e8449; color: white; border: none; }
    .btn-estado.btn-realizada:hover { background: #166638; }
    .btn-estado.btn-anular { background: #c0392b; color: white; border: none; }
    .btn-estado.btn-anular:hover { background: #a02d1f; }
    .btn-estado.btn-reabrir { background: var(--pista-azul-medio); color: white; border: none; }
    .btn-estado.btn-reabrir:hover { background: var(--pista-azul-oscuro); }
    .btn-guardar-otra {
      background: linear-gradient(135deg, #2a6b9c, #1a3a5c);
      border: 1px solid var(--pista-azul-hielo);
    }
    .btn-guardar-otra:hover { background: linear-gradient(135deg, #3a8fbf, #2a6b9c); }

    .toast-guardado {
      position: fixed; bottom: 24px; left: 50%;
      transform: translateX(-50%);
      background: #1e8449; color: white;
      padding: 12px 20px; border-radius: 8px;
      font-weight: 600; font-size: 0.9rem; z-index: 9999;
      box-shadow: 0 6px 20px rgba(0,0,0,0.4);
      animation: toastIn 0.3s ease;
    }
    @keyframes toastIn {
      from { opacity: 0; transform: translate(-50%, 20px); }
      to   { opacity: 1; transform: translate(-50%, 0); }
    }

    #calendar {
      background: var(--fondo-card); padding: 12px;
      border-radius: var(--radio); border: 1px solid var(--borde-card);
      overflow-x: auto;
    }
    .fc { color: var(--texto-principal); }
    .fc-theme-standard td, .fc-theme-standard th { border-color: var(--borde-card); }
    .fc .fc-button-primary { background: var(--pista-azul-claro); border-color: var(--pista-azul-claro); }
    .fc .fc-button-primary:hover { background: var(--pista-azul-medio); }
    .fc .fc-button-primary:not(:disabled).fc-button-active { background: var(--pista-azul-oscuro); border-color: var(--pista-azul-oscuro); }
    .fc-day-today { background: rgba(232, 255, 58, 0.08) !important; }
    .fc .fc-timegrid-slot { height: 2.5em; }
    .fc .fc-timegrid-now-indicator-line { border-color: #e8ff3a; }

    .fc-highlight { background: rgba(232, 255, 58, 0.2) !important; }

    .listado-clases {
      margin-top: 24px; background: var(--fondo-card);
      border: 1px solid var(--pista-azul-claro);
      border-radius: var(--radio); padding: 18px;
      box-shadow: 0 0 0 2px rgba(58, 143, 191, 0.1) inset;
    }
    .listado-header {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; margin-bottom: 12px; flex-wrap: wrap;
    }
    .listado-header h2 { font-size: 1.1rem; margin: 0; color: var(--texto-principal); }
    .listado-contador { display: flex; gap: 6px; flex-wrap: wrap; }
    .chip-resumen {
      background: var(--fondo-app); border: 1px solid var(--borde-card);
      padding: 3px 10px; border-radius: 12px;
      font-size: 0.72rem; font-weight: 600;
      color: var(--texto-principal); font-variant-numeric: tabular-nums;
    }
    .chip-prog { border-color: #3a8fbf; color: #3a8fbf; }
    .chip-real { border-color: #1e8449; color: #2ecc71; }
    .chip-anul { border-color: #c0392b; color: #e74c3c; }
    .listado-toolbar {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 14px; flex-wrap: wrap;
      padding-bottom: 12px; border-bottom: 1px solid var(--borde-card);
    }
    .listado-filtros { display: flex; gap: 6px; flex-wrap: wrap; flex: 1; }
    .filtro-chip {
      background: var(--fondo-app); border: 1px solid var(--borde-card);
      color: var(--texto-secundario);
      padding: 6px 12px; border-radius: 16px;
      font-size: 0.78rem; font-weight: 600;
      cursor: pointer; transition: all 0.15s;
      font-family: inherit; min-height: auto; white-space: nowrap;
    }
    .filtro-chip:hover { border-color: var(--pista-azul-claro); color: var(--texto-principal); }
    .filtro-chip.active { background: var(--pista-azul-claro); border-color: var(--pista-azul-claro); color: white; }
    .listado-buscador { min-width: 200px; max-width: 320px; flex: 1; }
    .listado-contenido { display: flex; flex-direction: column; gap: 12px; }
    .listado-vacio {
      text-align: center; padding: 32px 16px;
      color: var(--texto-secundario); font-size: 0.9rem;
      margin: 0; font-style: italic;
      background: var(--fondo-app);
      border: 1px dashed var(--borde-card);
      border-radius: 8px;
    }
    .listado-dia {
      background: var(--fondo-app);
      border: 1px solid var(--borde-card);
      border-radius: 8px;
      padding: 12px 14px;
    }
    .listado-dia.listado-hoy { border-color: var(--pista-azul-hielo); box-shadow: 0 0 0 1px rgba(91, 184, 212, 0.3) inset; }
    .listado-dia-header {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 10px; padding-bottom: 8px;
      border-bottom: 1px solid var(--borde-card);
      flex-wrap: wrap;

    .listado-dia-count { margin-left: auto; font-size: 0.75rem; color: var(--texto-secundario); }
    .listado-clases-dia { display: flex; flex-direction: column; gap: 6px; }
    .listado-clase {
      display: flex; align-items: flex-start; gap: 12px;
      background: var(--fondo-card);
      border-left: 4px solid #3a8fbf;
      border-radius: 6px; padding: 10px 12px;
      cursor: pointer;
      transition: transform 0.12s, background 0.12s;

    .listado-clase-hora { font-family: monospace; font-size: 0.85rem; font-weight: 700; color: var(--pista-azul-hielo); flex-shrink: 0; padding-top: 1px; min-width: 105px; }
    .listado-clase-info { flex: 1; min-width: 0; }
    .listado-clase-titulo { font-size: 0.92rem; font-weight: 600; color: var(--texto-principal); margin-bottom: 3px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

      .tabs-roles { gap: 5px; }
      .tab-rol { padding: 7px 12px; font-size: 0.78rem; }

      .modal-tabs { gap: 3px; }
      .modal-tab { padding: 7px 10px; font-size: 0.72rem; }
      .mt-icon { font-size: 0.85rem; }
      .mt-label { font-size: 0.7rem; }

      /* ⬇️ MÓVIL: botones solo iconos */
      .modal-actions {
        flex-direction: row;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
        margin-top: 18px;
      }
      .btn-con-icono {
        min-width: 52px;
        min-height: 52px;
        padding: 8px;
        gap: 0;
        flex: 0 0 auto;
        border-radius: 12px;
      }
      .btn-con-icono .btn-texto {
        display: none;
      }
      .btn-con-icono .btn-icon {
        font-size: 1.4rem;
      }
      #btn-guardar {
        min-width: 64px;
      }

      .label-tarea { flex-wrap: wrap; }
      .btn-eliminar-tarea { font-size: 0.68rem; padding: 3px 8px; }

      .listado-clases { margin-top: 16px; padding: 12px 10px; }
      .listado-header h2 { font-size: 1rem; }
      .listado-toolbar { flex-direction: column; align-items: stretch; gap: 8px; }
      .listado-buscador { max-width: 100%; min-width: 100%; }
      .listado-clase-hora { font-size: 0.78rem; min-width: 88px; }
      .listado-clase-titulo { font-size: 0.85rem; }
      .listado-clase-alumnos { font-size: 0.72rem; }
    }

    @media (max-width: 480px) {
      .fc .fc-button { padding: 6px 8px !important; font-size: 0.72rem !important; }
      .fc .fc-toolbar-title { font-size: 0.95rem !important; }
      .evento-contenido { font-size: 0.68rem; }
      .btn-con-icono { min-width: 48px; min-height: 48px; }
      .btn-con-icono .btn-icon { font-size: 1.25rem; }
      .listado-clase { flex-direction: column; gap: 4px; }
      .listado-clase-hora { min-width: auto; }
      .tab-label { display: none; }
      .mt-label { display: none; }
    }
  </style>
