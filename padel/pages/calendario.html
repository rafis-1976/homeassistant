<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Calendario — Padel Manager</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css">
  <link rel="stylesheet" href="../css/theme.css">
</head>
<body>
  <div class="layout">
    <nav class="sidebar"></nav>
    <main class="content">
      <h1>📅 Calendario de Clases</h1>

      <!-- LEYENDA -->
      <div class="leyenda-calendario">
        <span class="leyenda-item"><span class="dot dot-programada"></span> Programada</span>
        <span class="leyenda-item"><span class="dot dot-realizada"></span> ✅ Realizada</span>
        <span class="leyenda-item"><span class="dot dot-anulada"></span> 🚫 Anulada</span>
      </div>

      <div id="calendar"></div>
    </main>
  </div>

  <dialog id="modal-clase">
    <form id="form-clase">
      <h2 id="modal-titulo">Nueva Clase</h2>
      <input type="hidden" id="clase-id">

      <label>Título <input type="text" id="titulo" required></label>

      <label>Fecha <input type="date" id="fecha" required></label>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
        <label>Hora inicio <input type="time" id="hora_inicio" required></label>
        <label>Hora fin <input type="time" id="hora_fin" required></label>
      </div>

      <label>Tipo
        <select id="tipo">
          <option value="individual">Individual</option>
          <option value="grupal">Grupal</option>
          <option value="clinica">Clínica</option>
          <option value="partido">Partido</option>
        </select>
      </label>

      <label>Ejercicio del catálogo
        <select id="ejercicio_id">
          <option value="">— Sin ejercicio —</option>
        </select>
      </label>

      <label>O escribe un ejercicio libre
        <input type="text" id="ejercicio_libre" placeholder="Ej: Partidillos, Calentamiento...">
      </label>

      <div class="bloque-alumnos">
        <label style="margin-bottom:8px;">Nivel
          <select id="nivel_filtro">
            <option value="">— Selecciona un nivel —</option>
            <option value="iniciacion">Iniciación</option>
            <option value="intermedio">Intermedio</option>
            <option value="avanzado">Avanzado</option>
            <option value="competicion">Competición</option>
          </select>
        </label>

        <div class="lista-alumnos-header">
          <span>Alumnos <span id="contador-alumnos" class="contador"></span></span>
          <div class="acciones-lista">
            <button type="button" class="btn-mini" id="btn-todos">Todos</button>
            <button type="button" class="btn-mini" id="btn-ninguno">Ninguno</button>
          </div>
        </div>

        <div id="lista-alumnos" class="lista-alumnos">
          <p class="vacio">Elige un nivel para ver los alumnos</p>
        </div>
      </div>

      <div id="bloque-repetir" class="bloque-repetir">
        <label class="check-repetir">
          <input type="checkbox" id="repetir_semanal">
          <span>🔁 Repetir esta clase todas las semanas</span>
        </label>

        <div id="campos-repetir" style="display:none;">
          <label>Repetir hasta (inclusive)
            <input type="date" id="repetir_hasta">
          </label>
          <div id="preview-repeticion" class="preview-repeticion"></div>
        </div>
      </div>

      <label>Notas <textarea id="notas" rows="3"></textarea></label>

      <div id="estado-info" class="estado-info" style="display:none;"></div>

      <div class="modal-actions">
        <button type="button" class="btn-secondary" id="btn-cancelar">Cerrar</button>
        <button type="button" class="btn-estado btn-realizada" id="btn-realizada" style="display:none;">✅ Marcar realizada</button>
        <button type="button" class="btn-estado btn-anular" id="btn-anular" style="display:none;">🚫 Anular clase</button>
        <button type="button" class="btn-estado btn-reabrir" id="btn-reabrir" style="display:none;">↩️ Reabrir como programada</button>
        <button type="submit" class="btn-primary" id="btn-guardar">Guardar</button>
      </div>
    </form>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
  <script type="module">
    import { supabase, TABLES } from '../js/supabase-client.js'
    import { renderNav } from '../js/nav.js'

    renderNav('calendario')

    const modal = document.getElementById('modal-clase')
    const form = document.getElementById('form-clase')
    const selectEjercicio = document.getElementById('ejercicio_id')
    const selectNivel = document.getElementById('nivel_filtro')
    const listaAlumnos = document.getElementById('lista-alumnos')
    const contadorAlumnos = document.getElementById('contador-alumnos')
    const checkRepetir = document.getElementById('repetir_semanal')
    const camposRepetir = document.getElementById('campos-repetir')
    const inputRepetirHasta = document.getElementById('repetir_hasta')
    const previewRepeticion = document.getElementById('preview-repeticion')
    const btnRealizada = document.getElementById('btn-realizada')
    const btnAnular = document.getElementById('btn-anular')
    const btnReabrir = document.getElementById('btn-reabrir')
    const estadoInfo = document.getElementById('estado-info')

    let alumnosCache = []
    let alumnosSeleccionados = new Set()
    let claseActualId = null
    let claseActualEstado = null

    // ============================
    // Cargar alumnos
    // ============================
    async function cargarAlumnos() {
      const { data } = await supabase
        .from(TABLES.alumnos)
        .select('id, nombre, nivel')
        .eq('activo', true)
        .order('nombre')
      alumnosCache = data || []
    }
    await cargarAlumnos()

    // ============================
    // Pintar alumnos según nivel
    // ============================
    function pintarAlumnos(nivel) {
      if (!nivel) {
        listaAlumnos.innerHTML = '<p class="vacio">Elige un nivel para ver los alumnos</p>'
        actualizarContador()
        return
      }
      const filtrados = alumnosCache.filter(a => a.nivel === nivel)
      if (filtrados.length === 0) {
        listaAlumnos.innerHTML = '<p class="vacio">No hay alumnos de este nivel</p>'
        actualizarContador()
        return
      }

      listaAlumnos.innerHTML = filtrados.map(a => {
        const checked = alumnosSeleccionados.has(a.id) ? 'checked' : ''
        return `
          <label class="item-alumno">
            <input type="checkbox" value="${a.id}" ${checked}>
            <span class="nombre">${a.nombre}</span>
          </label>
        `
      }).join('')

      listaAlumnos.querySelectorAll('input[type="checkbox"]').forEach(cb => {
        cb.addEventListener('change', () => {
          if (cb.checked) alumnosSeleccionados.add(cb.value)
          else alumnosSeleccionados.delete(cb.value)
          actualizarContador()
        })
      })

      actualizarContador()
    }

    function actualizarContador() {
      const n = alumnosSeleccionados.size
      contadorAlumnos.textContent = n > 0 ? `(${n} seleccionado${n > 1 ? 's' : ''})` : ''
    }

    document.getElementById('btn-todos').addEventListener('click', () => {
      if (!selectNivel.value) return
      alumnosCache.filter(a => a.nivel === selectNivel.value)
        .forEach(a => alumnosSeleccionados.add(a.id))
      pintarAlumnos(selectNivel.value)
    })

    document.getElementById('btn-ninguno').addEventListener('click', () => {
      if (!selectNivel.value) return
      alumnosCache.filter(a => a.nivel === selectNivel.value)
        .forEach(a => alumnosSeleccionados.delete(a.id))
      pintarAlumnos(selectNivel.value)
    })

    selectNivel.addEventListener('change', () => pintarAlumnos(selectNivel.value))

    // ============================
    // Cargar ejercicios
    // ============================
    const { data: ejercicios } = await supabase
      .from(TABLES.ejercicios).select('id, titulo').order('titulo')
    selectEjercicio.innerHTML = '<option value="">— Sin ejercicio —</option>' +
      (ejercicios || []).map(e => `<option value="${e.id}">${e.titulo}</option>`).join('')

    // ============================
    // Repetición semanal
    // ============================
    checkRepetir.addEventListener('change', () => {
      camposRepetir.style.display = checkRepetir.checked ? 'block' : 'none'
      if (checkRepetir.checked && !inputRepetirHasta.value) {
        const fechaBase = document.getElementById('fecha').value
        if (fechaBase) {
          const d = new Date(fechaBase + 'T12:00:00')
          d.setDate(d.getDate() + 7 * 8)
          inputRepetirHasta.value = d.toISOString().split('T')[0]
        }
      }
      actualizarPreviewRepeticion()
    })

    document.getElementById('fecha').addEventListener('change', () => {
      if (checkRepetir.checked) actualizarPreviewRepeticion()
    })
    inputRepetirHasta.addEventListener('change', actualizarPreviewRepeticion)

    function calcularFechasRepeticion(fechaBase, fechaHasta) {
      if (!fechaBase || !fechaHasta) return []
      const fechas = []
      const inicio = new Date(fechaBase + 'T12:00:00')
      const fin = new Date(fechaHasta + 'T12:00:00')
      if (fin < inicio) return []
      const actual = new Date(inicio)
      while (actual <= fin) {
        fechas.push(actual.toISOString().split('T')[0])
        actual.setDate(actual.getDate() + 7)
        if (fechas.length > 100) break
      }
      return fechas
    }

    function actualizarPreviewRepeticion() {
      if (!checkRepetir.checked) { previewRepeticion.textContent = ''; return }
      const fechaBase = document.getElementById('fecha').value
      const fechas = calcularFechasRepeticion(fechaBase, inputRepetirHasta.value)
      if (fechas.length === 0) {
        previewRepeticion.textContent = '⚠️ Selecciona una fecha límite válida'
        return
      }
      previewRepeticion.textContent =
        `📆 Se crearán ${fechas.length} clases (${fechas[0]} → ${fechas[fechas.length - 1]})`
    }

    // ============================
    // Cargar clases
    // ============================
    async function cargarClases() {
      const { data, error } = await supabase
        .from(TABLES.clases)
        .select('*, padel_clase_alumnos(alumno_id, padel_alumnos(id, nombre)), padel_ejercicios(id, titulo)')
      if (error) { console.error(error); return [] }

      return data.map(c => ({
        id: c.id,
        title: c.titulo,
        start: `${c.fecha}T${c.hora_inicio}`,
        end: `${c.fecha}T${c.hora_fin}`,
        extendedProps: {
          tipo: c.tipo,
          estado: c.estado,
          notas: c.notas,
          motivo: c.motivo_anulacion,
          ejercicioId: c.ejercicio_id,
          ejercicioLibre: c.ejercicio_libre,
          ejercicioTitulo: c.padel_ejercicios?.titulo || c.ejercicio_libre || '',
          alumnosIds: (c.padel_clase_alumnos || []).map(a => a.alumno_id)
        },
        backgroundColor: colorPorEstado(c.estado, c.tipo),
        borderColor: bordePorEstado(c.estado),
        classNames: classNamesPorEstado(c.estado)
      }))
    }

    function colorPorEstado(estado, tipo) {
      if (estado === 'anulada') return '#7a1a1a'
      if (estado === 'realizada') return '#1e8449'
      if (estado === 'reprogramada') return '#e67e22'
      return {
        individual: '#3a8fbf',
        grupal:     '#5bb8d4',
        clinica:    '#e8ff3a',
        partido:    '#8a9ba8'
      }[tipo] || '#3a8fbf'
    }

    function bordePorEstado(estado) {
      if (estado === 'anulada') return '#e74c3c'
      if (estado === 'realizada') return '#2ecc71'
      return 'transparent'
    }

    function classNamesPorEstado(estado) {
      if (estado === 'anulada') return ['evento-anulado']
      if (estado === 'realizada') return ['evento-realizado']
      return []
    }

    function renderEvento(info) {
      const { estado } = info.event.extendedProps
      const titulo = info.event.title
      const icono = estado === 'realizada' ? '✅'
                  : estado === 'anulada'  ? '🚫'
                  : estado === 'reprogramada' ? '🔄'
                  : ''
      const hora = info.timeText || ''
      const contenedor = document.createElement('div')
      contenedor.className = 'evento-contenido'
      contenedor.innerHTML = `
        <span class="evento-icono">${icono}</span>
        <span class="evento-hora">${hora}</span>
        <span class="evento-titulo">${titulo}</span>
      `
      return { domNodes: [contenedor] }
    }

    // ============================
    // Detectar móvil (con listener)
    // ============================
    const esMovil = window.innerWidth < 768

    // ============================
    // FullCalendar — CON VISTAS EN MÓVIL
    // ============================
    const calendar = new FullCalendar.Calendar(document.getElementById('calendar'), {
      initialView: esMovil ? 'timeGridWeek' : 'dayGridMonth',
      locale: 'es',
      headerToolbar: esMovil
        ? {
            left: 'prev,next',
            center: 'title',
            right: 'dayGridMonth,timeGridWeek,timeGridDay'
          }
        : {
            left: 'prev,next today',
            center: 'title',
            right: 'dayGridMonth,timeGridWeek,timeGridDay'
          },
      buttonText: {
        today: 'Hoy',
        month: 'Mes',
        week: 'Sem',
        day: 'Día',
        list: 'Lista'
      },
      // En móvil, acortar los títulos de los botones
      views: {
        dayGridMonth: { buttonText: esMovil ? 'Mes' : 'Mes' },
        timeGridWeek: { buttonText: esMovil ? 'Sem' : 'Semana' },
        timeGridDay:  { buttonText: esMovil ? 'Día' : 'Día' }
      },
      events: await cargarClases(),
      eventContent: renderEvento,
      editable: !esMovil,
      selectable: true,
      dayMaxEvents: 3,
      nowIndicator: true,
      slotMinTime: '07:00:00',
      slotMaxTime: '23:00:00',
      allDaySlot: false,
      dateClick: (info) => abrirModal({ fecha: info.dateStr }),
      eventClick: (info) => abrirModal(info.event),
      eventDrop: async (info) => {
        await supabase.from(TABLES.clases)
          .update({ fecha: info.event.startStr.split('T')[0] })
          .eq('id', info.event.id)
      }
    })
    calendar.render()

    // ============================
    // Abrir modal
    // ============================
    function abrirModal(clase) {
      if (clase?.id) {
        claseActualId = clase.id
        claseActualEstado = clase.extendedProps.estado

        document.getElementById('modal-titulo').textContent = 'Editar Clase'
        document.getElementById('clase-id').value = clase.id
        document.getElementById('titulo').value = clase.title
        document.getElementById('fecha').value = clase.startStr.split('T')[0]
        document.getElementById('hora_inicio').value = clase.startStr.split('T')[1]?.slice(0,5) || '09:00'
        document.getElementById('hora_fin').value = clase.endStr?.split('T')[1]?.slice(0,5) || '10:00'
        document.getElementById('tipo').value = clase.extendedProps.tipo
        document.getElementById('ejercicio_id').value = clase.extendedProps.ejercicioId || ''
        document.getElementById('ejercicio_libre').value = clase.extendedProps.ejercicioLibre || ''
        document.getElementById('notas').value = clase.extendedProps.notas || ''

        alumnosSeleccionados = new Set(clase.extendedProps.alumnosIds || [])
        selectNivel.value = ''
        const niveles = new Set(
          alumnosCache.filter(a => alumnosSeleccionados.has(a.id)).map(a => a.nivel)
        )
        if (niveles.size === 1) selectNivel.value = [...niveles][0]
        pintarAlumnos(selectNivel.value)

        document.getElementById('bloque-repetir').style.display = 'none'
        document.getElementById('btn-guardar').textContent = 'Guardar cambios'

        actualizarBotonesEstado(claseActualEstado)
      } else {
        claseActualId = null
        claseActualEstado = 'programada'

        form.reset()
        document.getElementById('modal-titulo').textContent = 'Nueva Clase'
        document.getElementById('clase-id').value = ''
        document.getElementById('fecha').value = clase?.fecha || ''
        document.getElementById('hora_inicio').value = '09:00'
        document.getElementById('hora_fin').value = '10:00'

        document.getElementById('bloque-repetir').style.display = 'block'
        document.getElementById('btn-guardar').textContent = 'Guardar'

        alumnosSeleccionados = new Set()
        selectNivel.value = ''
        pintarAlumnos('')

        btnRealizada.style.display = 'none'
        btnAnular.style.display = 'none'
        btnReabrir.style.display = 'none'
        estadoInfo.style.display = 'none'
      }
      modal.showModal()
    }

    function actualizarBotonesEstado(estado) {
      btnRealizada.style.display = 'none'
      btnAnular.style.display = 'none'
      btnReabrir.style.display = 'none'
      estadoInfo.style.display = 'block'

      if (estado === 'programada' || estado === 'reprogramada') {
        estadoInfo.innerHTML = `Estado actual: <strong style="color:#3a8fbf;">${estado === 'reprogramada' ? '🔄 Reprogramada' : '📅 Programada'}</strong>`
        btnRealizada.style.display = 'inline-flex'
        btnAnular.style.display = 'inline-flex'
      } else if (estado === 'realizada') {
        estadoInfo.innerHTML = `Estado actual: <strong style="color:#2ecc71;">✅ Realizada</strong>`
        btnReabrir.style.display = 'inline-flex'
        btnAnular.style.display = 'inline-flex'
      } else if (estado === 'anulada') {
        estadoInfo.innerHTML = `Estado actual: <strong style="color:#e74c3c;">🚫 Anulada</strong>`
        btnReabrir.style.display = 'inline-flex'
        btnRealizada.style.display = 'inline-flex'
      }
    }

    async function cambiarEstado(nuevoEstado) {
      if (!claseActualId) return

      if (nuevoEstado === 'anulada') {
        const motivo = prompt('Motivo de la anulación (opcional):', '')
        if (motivo === null) return
        await supabase.from(TABLES.clases)
          .update({ estado: 'anulada', motivo_anulacion: motivo || null })
          .eq('id', claseActualId)
      } else {
        await supabase.from(TABLES.clases)
          .update({ estado: nuevoEstado, motivo_anulacion: nuevoEstado === 'realizada' ? null : undefined })
          .eq('id', claseActualId)
      }

      claseActualEstado = nuevoEstado
      actualizarBotonesEstado(nuevoEstado)
      calendar.removeAllEvents()
      calendar.addEventSource(await cargarClases())
    }

    btnRealizada.onclick = () => cambiarEstado('realizada')
    btnAnular.onclick = () => cambiarEstado('anulada')
    btnReabrir.onclick = () => cambiarEstado('programada')

    document.getElementById('btn-cancelar').onclick = () => modal.close()

    // ============================
    // Guardar
    // ============================
    form.addEventListener('submit', async (e) => {
      e.preventDefault()
      const id = document.getElementById('clase-id').value
      const alumnosIds = Array.from(alumnosSeleccionados)

      const datosBase = {
        titulo: document.getElementById('titulo').value,
        hora_inicio: document.getElementById('hora_inicio').value,
        hora_fin: document.getElementById('hora_fin').value,
        tipo: document.getElementById('tipo').value,
        ejercicio_id: document.getElementById('ejercicio_id').value || null,
        ejercicio_libre: document.getElementById('ejercicio_libre').value || null,
        notas: document.getElementById('notas').value
      }

      const fechaBase = document.getElementById('fecha').value

      if (id) {
        await supabase.from(TABLES.clases).update({
          ...datosBase,
          fecha: fechaBase
        }).eq('id', id)

        await supabase.from(TABLES.claseAlumnos).delete().eq('clase_id', id)
        if (alumnosIds.length) {
          await supabase.from(TABLES.claseAlumnos).insert(
            alumnosIds.map(aid => ({ clase_id: id, alumno_id: aid }))
          )
        }

        modal.close()
        calendar.removeAllEvents()
        calendar.addEventSource(await cargarClases())
        return
      }

      let fechas = [fechaBase]
      if (checkRepetir.checked) {
        fechas = calcularFechasRepeticion(fechaBase, inputRepetirHasta.value)
        if (fechas.length === 0) { alert('La fecha límite de repetición no es válida'); return }
        if (fechas.length > 100) { alert('Demasiadas repeticiones (>100). Reduce el rango.'); return }
      }

      const clasesAInsertar = fechas.map(f => ({ ...datosBase, fecha: f }))
      const { data: insertadas, error } = await supabase
        .from(TABLES.clases).insert(clasesAInsertar).select()

      if (error) { alert('Error: ' + error.message); return }

      if (alumnosIds.length && insertadas?.length) {
        const relaciones = []
        insertadas.forEach(c => {
          alumnosIds.forEach(aid => {
            relaciones.push({ clase_id: c.id, alumno_id: aid })
          })
        })
        await supabase.from(TABLES.claseAlumnos).insert(relaciones)
      }

      modal.close()
      calendar.removeAllEvents()
      calendar.addEventSource(await cargarClases())

      if (fechas.length > 1) {
        setTimeout(() => {
          alert(`✅ Se han creado ${fechas.length} clases (una por semana)\nDesde ${fechas[0]} hasta ${fechas[fechas.length - 1]}`)
        }, 200)
      }
    })
  </script>

  <style>
    /* ============================
       Leyenda
       ============================ */
    .leyenda-calendario {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 12px;
      padding: 8px 12px;
      background: var(--fondo-card);
      border: 1px solid var(--borde-card);
      border-radius: var(--radio-sm);
      font-size: 0.82rem;
      color: var(--texto-secundario);
    }
    .leyenda-item { display: inline-flex; align-items: center; gap: 6px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
    .dot-programada { background: #3a8fbf; }
    .dot-realizada  { background: #1e8449; }
    .dot-anulada    { background: #7a1a1a; border: 1px solid #e74c3c; }

    /* ============================
       Evento contenido
       ============================ */
    .evento-contenido {
      display: flex;
      align-items: center;
      gap: 4px;
      overflow: hidden;
      white-space: nowrap;
      padding: 0 2px;
      font-size: 0.78rem;
    }
    .evento-icono { flex-shrink: 0; font-size: 0.85rem; line-height: 1; }
    .evento-hora  { flex-shrink: 0; opacity: 0.85; font-variant-numeric: tabular-nums; }
    .evento-titulo { overflow: hidden; text-overflow: ellipsis; font-weight: 500; }

    .evento-anulado .evento-titulo {
      text-decoration: line-through;
      opacity: 0.9;
    }
    .evento-anulado::before {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        45deg,
        transparent,
        transparent 4px,
        rgba(0,0,0,0.18) 4px,
        rgba(0,0,0,0.18) 8px
      );
      pointer-events: none;
      border-radius: 2px;
    }
    .evento-realizado .evento-titulo { font-weight: 600; }
    .fc-event { position: relative; }

    /* ============================
       Bloques en el modal
       ============================ */
    .bloque-alumnos {
      background: var(--fondo-app);
      border: 1px solid var(--borde-card);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;

      display: flex;

      background: var(--pista-azul-oscuro);

    .lista-alumnos {

    .bloque-repetir {

    .btn-estado { font-weight: 600; }
    .btn-estado.btn-realizada { background: #1e8449; color: white; border: none; }

    .btn-estado.btn-anular { background: #c0392b; color: white; border: none; }

    .modal-actions { flex-wrap: wrap; gap: 8px; }

    /* ============================
       FullCalendar — estilos base
       ============================ */
    #calendar {
      background: var(--fondo-card);
      padding: 12px;
      border-radius: var(--radio);

      overflow-x: auto;
    }

    .fc-theme-standard td, .fc-theme-standard th { border-color: var(--borde-card); }
    .fc .fc-button-primary {
      background: var(--pista-azul-claro);

    .fc .fc-button-primary:hover { background: var(--pista-azul-medio); }
    .fc .fc-button-primary:not(:disabled).fc-button-active {
      background: var(--pista-azul-oscuro);

    .fc .fc-timegrid-now-indicator-arrow { border-color: #e8ff3a; background: #e8ff3a; }

    /* ============================
       FullCalendar — MÓVIL
       ============================ */
    @media (max-width: 768px) {
      #calendar { padding: 6px; }

      /* Toolbar compacto en 2 filas */
      .fc .fc-toolbar {
        flex-direction: column !important;
        gap: 8px !important;
        margin-bottom: 10px !important;
      }
      .fc .fc-toolbar-chunk {
        display: flex;

        width: 100%;

      .fc .fc-toolbar-title {
        font-size: 1.05rem !important;
        text-align: center;
      }

        border-radius: 6px !important;
        text-transform: capitalize;
      }
      .fc .fc-button-group > .fc-button {
        border-radius: 6px !important;
        margin: 0 2px;
      }

      /* Botones de navegación (prev/next/today) */
      .fc .fc-button-group:first-child .fc-button,

      .evento-contenido { font-size: 0.72rem; gap: 2px; }

      .fc .fc-timegrid-slot { height: 2em; }

      .fc .fc-col-header-cell-cushion { font-size: 0.75rem; padding: 4px 2px; }

    @media (max-width: 480px) {

       ============================ */
    @media (max-width: 480px) {
