<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Dashboard — Padel Manager</title>
  <link rel="stylesheet" href="../css/theme.css">
</head>
<body>
  <div class="layout">
    <nav class="sidebar"></nav>
    <main class="content">
      <h1>📊 Dashboard</h1>

      <div class="grid-cards" id="stats"></div>

      <h2 style="margin-top:24px;">Próximas clases</h2>
      <div class="tabla-wrapper">
        <table class="tabla">
          <thead>
            <tr><th>Fecha</th><th>Hora</th><th>Título</th><th>Tipo</th><th>Alumnos</th></tr>
          </thead>
          <tbody id="tbody-proximas"></tbody>
        </table>
      </div>
    </main>
  </div>

  <script type="module">
    import { supabase, TABLES } from '../js/supabase-client.js'
    import { renderNav } from '../js/nav.js'

    renderNav('dashboard')

    const hoy = new Date().toISOString().split('T')[0]
    const primerDiaMes = hoy.slice(0, 7) + '-01'
    const ultimoDiaMes = new Date(new Date().getFullYear(), new Date().getMonth() + 1, 0).toISOString().split('T')[0]

    const [
      { count: numAlumnos },
      { count: numClases },
      { count: numRealizadasMes },
      { count: numAnuladasMes }
    ] = await Promise.all([
      supabase.from(TABLES.alumnos).select('*', { count: 'exact', head: true }).eq('activo', true),
      supabase.from(TABLES.clases).select('*', { count: 'exact', head: true }).eq('estado', 'programada'),
      supabase.from(TABLES.clases).select('*', { count: 'exact', head: true }).eq('estado', 'realizada').gte('fecha', primerDiaMes).lte('fecha', ultimoDiaMes),
      supabase.from(TABLES.clases).select('*', { count: 'exact', head: true }).eq('estado', 'anulada').gte('fecha', primerDiaMes).lte('fecha', ultimoDiaMes)
    ])

    document.getElementById('stats').innerHTML = `
      <div class="card stat-card">
        <div class="num">${numAlumnos || 0}</div>
        <div class="label">Alumnos activos</div>
      </div>
      <div class="card stat-card">
        <div class="num">${numClases || 0}</div>
        <div class="label">Clases programadas</div>
      </div>
      <div class="card stat-card">
        <div class="num">${numRealizadasMes || 0}</div>
        <div class="label">Realizadas este mes</div>
      </div>
      <div class="card stat-card">
        <div class="num">${numAnuladasMes || 0}</div>
        <div class="label">Anuladas este mes</div>
      </div>
    `

    const { data: proximas } = await supabase
      .from(TABLES.clases)
      .select('*, padel_clase_alumnos(padel_alumnos(nombre))')
      .gte('fecha', hoy)
      .eq('estado', 'programada')
      .order('fecha', { ascending: true })
      .order('hora_inicio', { ascending: true })
      .limit(10)

    document.getElementById('tbody-proximas').innerHTML = (proximas || []).map(c => {
      const alumnos = (c.padel_clase_alumnos || [])
        .map(a => a.padel_alumnos.nombre).join(', ') || '—'
      return `
        <tr>
          <td>${c.fecha}</td>
          <td>${c.hora_inicio?.slice(0,5)}</td>
          <td>${c.titulo}</td>
          <td>${c.tipo}</td>
          <td class="wrap">${alumnos}</td>
        </tr>
      `
    }).join('') || '<tr><td colspan="5" style="text-align:center;color:var(--texto-secundario);">Sin clases próximas</td></tr>'
  </script>
</body>
</html>
