<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Informe — Padel Manager</title>
  <link rel="stylesheet" href="../css/theme.css">
</head>
<body>
  <div class="layout">
    <nav class="sidebar"></nav>
    <main class="content">
      <h1>📄 Informe mensual de clases realizadas</h1>

      <div class="card" style="margin-bottom:16px;">
        <div style="display:flex;gap:12px;align-items:end;flex-wrap:wrap;">
          <label style="flex:1;min-width:180px;">Mes
            <input type="month" id="mes">
          </label>
          <button class="btn-primary" id="btn-generar">Generar informe</button>
          <button class="btn-secondary" id="btn-exportar">📄 Exportar PDF</button>
          <button class="btn-secondary" id="btn-csv">📊 Exportar CSV</button>
        </div>
      </div>

      <div id="resumen" style="margin-bottom:16px;"></div>

      <h2>Detalle de clases realizadas</h2>
      <div class="tabla-wrapper">
        <table class="tabla">
          <thead>
            <tr>
              <th>Fecha</th><th>Hora</th><th>Título</th><th>Tipo</th>
              <th>Ejercicio</th><th>Alumnos</th><th>Notas</th>
            </tr>
          </thead>
          <tbody id="tbody-informe"></tbody>
        </table>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script type="module">
    import { supabase, TABLES } from '../js/supabase-client.js'
    import { renderNav } from '../js/nav.js'

    renderNav('informe')

    let informeActual = null

    document.getElementById('mes').value = new Date().toISOString().slice(0, 7)

    document.getElementById('btn-generar').onclick = generar
    document.getElementById('btn-exportar').onclick = exportarPDF
    document.getElementById('btn-csv').onclick = exportarCSV

    // ============================================
    // Generar informe (consulta a Supabase)
    // ============================================
    async function generar() {
      const mes = document.getElementById('mes').value
      if (!mes) { alert('Selecciona un mes'); return }
      const [year, month] = mes.split('-')
      const primerDia = `${year}-${month}-01`
      const ultimoDia = new Date(year, month, 0).toISOString().split('T')[0]

      const { data: clases, error } = await supabase
        .from(TABLES.clases)
        .select(`
          *,
          padel_ejercicios(titulo),
          padel_clase_alumnos(padel_alumnos(nombre))
        `)
        .gte('fecha', primerDia)
        .lte('fecha', ultimoDia)
        .order('fecha', { ascending: true })
        .order('hora_inicio', { ascending: true })

      if (error) { alert(error.message); return }

      const realizadas = (clases || []).filter(c => c.estado === 'realizada')
      const anuladas = (clases || []).filter(c => c.estado === 'anulada')
      const programadas = (clases || []).filter(c => c.estado === 'programada')

      const porTipo = {}
      realizadas.forEach(c => {
        porTipo[c.tipo] = (porTipo[c.tipo] || 0) + 1
      })

      informeActual = { mes, realizadas, anuladas, programadas, porTipo }

      document.getElementById('resumen').innerHTML = `
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;">
          <div class="card"><div style="font-size:1.8rem;color:#27ae60;font-weight:700;">${realizadas.length}</div><div style="color:var(--texto-secundario);font-size:0.85rem;">Clases realizadas</div></div>
          <div class="card"><div style="font-size:1.8rem;color:#3a8fbf;font-weight:700;">${programadas.length}</div><div style="color:var(--texto-secundario);font-size:0.85rem;">Aún programadas</div></div>
          <div class="card"><div style="font-size:1.8rem;color:#e74c3c;font-weight:700;">${anuladas.length}</div><div style="color:var(--texto-secundario);font-size:0.85rem;">Anuladas</div></div>
        </div>
        <h3 style="margin-top:16px;font-size:1rem;">Por tipo</h3>
        <div class="tabla-wrapper">
          <table class="tabla">
            <thead><tr><th>Tipo</th><th>Clases realizadas</th></tr></thead>
            <tbody>${Object.entries(porTipo).map(([k, v]) =>
              `<tr><td>${k}</td><td>${v}</td></tr>`).join('') || '<tr><td colspan="2" style="text-align:center;color:var(--texto-secundario);">—</td></tr>'}</tbody>
          </table>
        </div>
      `

      document.getElementById('tbody-informe').innerHTML = realizadas.map(c => {
        const ej = c.padel_ejercicios?.titulo || c.ejercicio_libre || '—'
        const alumnos = (c.padel_clase_alumnos || []).map(a => a.padel_alumnos.nombre).join(', ') || '—'
        return `
          <tr>
            <td>${c.fecha}</td>
            <td>${c.hora_inicio?.slice(0,5)}–${c.hora_fin?.slice(0,5)}</td>
            <td>${c.titulo}</td>
            <td>${c.tipo}</td>
            <td class="wrap">${ej}</td>
            <td class="wrap">${alumnos}</td>
            <td class="wrap">${c.notas || '—'}</td>
          </tr>
        `
      }).join('') || '<tr><td colspan="7" style="text-align:center;color:var(--texto-secundario);">Sin clases realizadas este mes</td></tr>'
    }

    // ============================================
    // Exportar PDF con listado completo
    // ============================================
    function exportarPDF() {
      if (!informeActual) { alert('Genera primero el informe'); return }

      const { jsPDF } = window.jspdf
      const doc = new jsPDF()

      const pageWidth = doc.internal.pageSize.getWidth()
      const pageHeight = doc.internal.pageSize.getHeight()
      const margenIzq = 15
      const margenDer = 15
      const anchoUtil = pageWidth - margenIzq - margenDer

      const [year, month] = informeActual.mes.split('-')
      const meses = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre']
      const nombreMes = meses[parseInt(month) - 1] + ' ' + year

      // ============ CABECERA ============
      doc.setFillColor(26, 58, 92) // azul oscuro
      doc.rect(0, 0, pageWidth, 30, 'F')

      doc.setTextColor(255, 255, 255)
      doc.setFontSize(18)
      doc.setFont('helvetica', 'bold')
      doc.text('Informe de clases realizadas', margenIzq, 14)

      doc.setFontSize(11)
      doc.setFont('helvetica', 'normal')
      doc.text(`Mes: ${nombreMes}`, margenIzq, 23)

      // Contador de páginas en la esquina
      doc.setFontSize(9)
      doc.text(`Generado: ${new Date().toLocaleDateString('es-ES')}`, pageWidth - margenDer, 23, { align: 'right' })

      // ============ RESUMEN ============
      let y = 42
      doc.setTextColor(0, 0, 0)
      doc.setFontSize(12)
      doc.setFont('helvetica', 'bold')
      doc.text('Resumen', margenIzq, y)
      y += 6

      doc.setFont('helvetica', 'normal')
      doc.setFontSize(10)
      doc.text(`Clases realizadas: ${informeActual.realizadas.length}`, margenIzq, y)
      doc.text(`Clases anuladas: ${informeActual.anuladas.length}`, margenIzq + 70, y)
      doc.text(`Aún programadas: ${informeActual.programadas.length}`, margenIzq + 130, y)
      y += 8

      // Desglose por tipo
      if (Object.keys(informeActual.porTipo).length > 0) {
        doc.setFont('helvetica', 'bold')
        doc.setFontSize(10)
        doc.text('Por tipo:', margenIzq, y)
        doc.setFont('helvetica', 'normal')
        y += 5
        Object.entries(informeActual.porTipo).forEach(([k, v]) => {
          doc.text(`•  ${k}: ${v} clase${v > 1 ? 's' : ''}`, margenIzq + 4, y)
          y += 5
        })
      }

      y += 4

      // ============ LISTADO DE CLASES ============
      doc.setDrawColor(42, 107, 156)
      doc.setLineWidth(0.5)
      doc.line(margenIzq, y, pageWidth - margenDer, y)
      y += 6

      doc.setFontSize(12)
      doc.setFont('helvetica', 'bold')
      doc.text('Listado de clases realizadas', margenIzq, y)
      y += 8

      // Cabecera de la tabla
      const colFecha = margenIzq
      const colHora = margenIzq + 25
      const colTitulo = margenIzq + 52
      const colTipo = margenIzq + 110
      const colAlumnos = margenIzq + 135

      doc.setFillColor(240, 244, 248)
      doc.rect(margenIzq - 2, y - 4, anchoUtil + 4, 7, 'F')

      doc.setFontSize(9)
      doc.setFont('helvetica', 'bold')
      doc.setTextColor(26, 58, 92)
      doc.text('Fecha', colFecha, y)
      doc.text('Hora', colHora, y)
      doc.text('Título', colTitulo, y)
      doc.text('Tipo', colTipo, y)
      doc.text('Alumnos', colAlumnos, y)
      y += 6

      doc.setTextColor(0, 0, 0)
      doc.setFont('helvetica', 'normal')

      // Filas
      const clasesOrdenadas = [...informeActual.realizadas].sort((a, b) => {
        if (a.fecha !== b.fecha) return a.fecha.localeCompare(b.fecha)
        return (a.hora_inicio || '').localeCompare(b.hora_inicio || '')
      })

      clasesOrdenadas.forEach((c, idx) => {
        // Salto de página si hace falta
        if (y > pageHeight - 25) {
          doc.addPage()
          y = 20
          // Repetir cabecera
          doc.setFillColor(240, 244, 248)
          doc.rect(margenIzq - 2, y - 4, anchoUtil + 4, 7, 'F')
          doc.setFontSize(9)
          doc.setFont('helvetica', 'bold')
          doc.setTextColor(26, 58, 92)
          doc.text('Fecha', colFecha, y)
          doc.text('Hora', colHora, y)
          doc.text('Título', colTitulo, y)
          doc.text('Tipo', colTipo, y)
          doc.text('Alumnos', colAlumnos, y)
          y += 6
          doc.setTextColor(0, 0, 0)
          doc.setFont('helvetica', 'normal')
        }

        // Fondo alterno
        if (idx % 2 === 0) {
          doc.setFillColor(250, 252, 254)
          doc.rect(margenIzq - 2, y - 4, anchoUtil + 4, 6, 'F')
        }

        // Fecha
        const fechaCorta = formatearFechaCorta(c.fecha)
        doc.text(fechaCorta, colFecha, y)

        // Hora
        const horaStr = `${(c.hora_inicio || '').slice(0,5)}–${(c.hora_fin || '').slice(0,5)}`
        doc.text(horaStr, colHora, y)

        // Título (truncado si es muy largo)
        const titulo = truncar(c.titulo || '', 32)
        doc.text(titulo, colTitulo, y)

        // Tipo
        doc.text(c.tipo || '', colTipo, y)

        // Alumnos (truncado)
        const alumnosStr = (c.padel_clase_alumnos || [])
          .map(a => a.padel_alumnos.nombre)
          .join(', ')
        const alumnosTrunc = truncar(alumnosStr || '—', 28)
        doc.text(alumnosTrunc, colAlumnos, y)

        y += 6
      })

      // Si no hay clases
      if (clasesOrdenadas.length === 0) {
        doc.setTextColor(138, 155, 168)
        doc.setFont('helvetica', 'italic')
        doc.text('No hay clases realizadas este mes', margenIzq, y)
      }

      // ============ PIE DE PÁGINA ============
      const totalPaginas = doc.internal.getNumberOfPages()
      for (let i = 1; i <= totalPaginas; i++) {
        doc.setPage(i)
        doc.setFontSize(8)
        doc.setTextColor(138, 155, 168)
        doc.setFont('helvetica', 'normal')
        doc.text(
          `Padel Manager — ${nombreMes}  ·  Página ${i} de ${totalPaginas}`,
          pageWidth / 2,
          pageHeight - 8,
          { align: 'center' }
        )
      }

      doc.save(`informe-padel-${informeActual.mes}.pdf`)
    }

    // ============================================
    // Helpers
    // ============================================
    function formatearFechaCorta(fechaISO) {
      if (!fechaISO) return ''
      const [y, m, d] = fechaISO.split('-')
      return `${d}/${m}/${y.slice(2)}`
    }

    function truncar(str, max) {
      if (!str) return ''
      return str.length > max ? str.slice(0, max - 1) + '…' : str
    }

    // ============================================
    // Exportar CSV
    // ============================================
    function exportarCSV() {
      if (!informeActual) { alert('Genera primero el informe'); return }
      const filas = [['Fecha', 'Hora inicio', 'Hora fin', 'Título', 'Tipo', 'Ejercicio', 'Alumnos', 'Notas']]
      informeActual.realizadas.forEach(c => {
        const ej = c.padel_ejercicios?.titulo || c.ejercicio_libre || ''
        const alumnos = (c.padel_clase_alumnos || []).map(a => a.padel_alumnos.nombre).join('; ')
        filas.push([
          c.fecha,
          c.hora_inicio,
          c.hora_fin,
          c.titulo,
          c.tipo,
          ej,
          alumnos,
          c.notas || ''
        ])
      })
      const csv = filas.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\n')
      const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' })
      const url = URL.createObjectURL(blob)
      const a = document.createElement('a')
      a.href = url
      a.download = `informe-padel-${informeActual.mes}.csv`
      a.click()
      URL.revokeObjectURL(url)
    }

    // ============================================
    // Generar al cargar
    // ============================================
    generar()
  </script>
</body>
</html>
