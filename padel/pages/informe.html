<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Informe — Padel Manager</title>
  <link rel="stylesheet" href="../css/theme.css">
</head>
<body>
  <div class="layout">
    <nav class="sidebar"></nav>
    <main class="content">
      <h1>📄 Informe mensual</h1>

      <div class="card" style="margin-bottom:16px;">
        <div style="display:flex;gap:12px;align-items:end;flex-wrap:wrap;">
          <label style="flex:1;min-width:180px;">Mes
            <input type="month" id="mes">
          </label>
          <button class="btn-primary" id="btn-generar">📄 Generar informe PDF</button>
        </div>
      </div>

      <div id="resumen" style="margin-bottom:16px;"></div>

      <!-- REALIZADAS -->
      <h2 class="seccion-titulo seccion-realizadas">
        ✅ Clases realizadas <span id="cont-realizadas" class="seccion-count"></span>
      </h2>
      <div class="tabla-wrapper">
        <table class="tabla">
          <thead>
            <tr>
              <th>Fecha</th><th>Hora</th><th>Título</th><th>Tipo</th>
              <th>Ejercicio</th><th>Alumnos</th><th>Notas</th>
            </tr>
          </thead>
          <tbody id="tbody-realizadas"></tbody>
        </table>
      </div>

      <!-- REPROGRAMADAS -->
      <h2 class="seccion-titulo seccion-reprogramadas" style="margin-top:24px;">
        🔄 Clases reprogramadas <span id="cont-reprogramadas" class="seccion-count"></span>
      </h2>
      <div class="tabla-wrapper">
        <table class="tabla">
          <thead>
            <tr>
              <th>Fecha</th><th>Hora</th><th>Título</th><th>Tipo</th>
              <th>Ejercicio</th><th>Alumnos</th><th>Notas</th>
            </tr>
          </thead>
          <tbody id="tbody-reprogramadas"></tbody>
        </table>
      </div>

      <!-- ANULADAS -->
      <h2 class="seccion-titulo seccion-anuladas" style="margin-top:24px;">
        🚫 Clases anuladas <span id="cont-anuladas" class="seccion-count"></span>
      </h2>
      <div class="tabla-wrapper">
        <table class="tabla">
          <thead>
            <tr>
              <th>Fecha</th><th>Hora</th><th>Título</th><th>Tipo</th>
              <th>Alumnos</th><th>Motivo</th>
            </tr>
          </thead>
          <tbody id="tbody-anuladas"></tbody>
        </table>
      </div>

      <!-- PROGRAMADAS -->
      <h2 class="seccion-titulo seccion-programadas" style="margin-top:24px;">
        📅 Clases aún programadas <span id="cont-programadas" class="seccion-count"></span>
      </h2>
      <div class="tabla-wrapper">
        <table class="tabla">
          <thead>
            <tr>
              <th>Fecha</th><th>Hora</th><th>Título</th><th>Tipo</th>
              <th>Ejercicio</th><th>Alumnos</th>
            </tr>
          </thead>
          <tbody id="tbody-programadas"></tbody>
        </table>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script type="module">
    import { supabase, TABLES } from '../js/supabase-client.js'
    import { renderNav } from '../js/nav.js'

    renderNav('informe')

    document.getElementById('mes').value = new Date().toISOString().slice(0, 7)
    document.getElementById('btn-generar').onclick = generarYDescargar

    let informeActual = null

    // ============================================
    // Generar informe + PDF
    // ============================================
    async function generarYDescargar() {
      const mes = document.getElementById('mes').value
      if (!mes) { alert('Selecciona un mes'); return }

      const btn = document.getElementById('btn-generar')
      const textoOriginal = btn.textContent
      btn.disabled = true
      btn.textContent = '⏳ Generando...'

      try {
        const [year, month] = mes.split('-')
        const primerDia = `${year}-${month}-01`
        const ultimoDia = new Date(year, month, 0).toISOString().split('T')[0]

        const { data: clases, error } = await supabase
          .from(TABLES.clases)
          .select(`
            *,
            padel_ejercicios(titulo),
            padel_clase_alumnos(padel_alumnos(nombre))
          `)
          .gte('fecha', primerDia)
          .lte('fecha', ultimoDia)
          .order('fecha', { ascending: true })
          .order('hora_inicio', { ascending: true })

        if (error) throw error

        const realizadas     = (clases || []).filter(c => c.estado === 'realizada')
        const anuladas       = (clases || []).filter(c => c.estado === 'anulada')
        const reprogramadas  = (clases || []).filter(c => c.estado === 'reprogramada')
        const programadas    = (clases || []).filter(c => c.estado === 'programada')

        const porTipo = {}
        realizadas.forEach(c => {
          porTipo[c.tipo] = (porTipo[c.tipo] || 0) + 1
        })

        informeActual = { mes, realizadas, anuladas, reprogramadas, programadas, porTipo }

        pintarResumen(informeActual)
        pintarTablaRealizadas(realizadas)
        pintarTablaReprogramadas(reprogramadas)
        pintarTablaAnuladas(anuladas)
        pintarTablaProgramadas(programadas)

        generarPDF(informeActual)

      } catch (err) {
        alert('Error: ' + err.message)
        console.error(err)
      } finally {
        btn.disabled = false
        btn.textContent = textoOriginal
      }
    }

    // ============================================
    // Resumen en pantalla (con emojis OK)
    // ============================================
    function pintarResumen(informe) {
      document.getElementById('resumen').innerHTML = `
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;">
          <div class="card stat-box">
            <div class="stat-num" style="color:#27ae60;">${informe.realizadas.length}</div>
            <div class="stat-label">✅ Realizadas</div>
          </div>
          <div class="card stat-box">
            <div class="stat-num" style="color:#e67e22;">${informe.reprogramadas.length}</div>
            <div class="stat-label">🔄 Reprogramadas</div>
          </div>
          <div class="card stat-box">
            <div class="stat-num" style="color:#e74c3c;">${informe.anuladas.length}</div>
            <div class="stat-label">🚫 Anuladas</div>
          </div>
          <div class="card stat-box">
            <div class="stat-num" style="color:#3a8fbf;">${informe.programadas.length}</div>
            <div class="stat-label">📅 Programadas</div>
          </div>
        </div>
        <h3 style="margin-top:16px;font-size:1rem;">Realizadas por tipo</h3>
        <div class="tabla-wrapper">
          <table class="tabla">
            <thead><tr><th>Tipo</th><th>Clases realizadas</th></tr></thead>
            <tbody>${Object.entries(informe.porTipo).map(([k, v]) =>
              `<tr><td>${k}</td><td>${v}</td></tr>`).join('') || '<tr><td colspan="2" style="text-align:center;color:var(--texto-secundario);">—</td></tr>'}</tbody>
          </table>
        </div>
      `
    }

    // ============================================
    // Helpers comunes (pantalla)
    // ============================================
    function alumnosTxt(c) {
      return (c.padel_clase_alumnos || []).map(a => a.padel_alumnos?.nombre).filter(Boolean).join(', ') || '—'
    }
    function ejercicioTxt(c) {
      return c.padel_ejercicios?.titulo || c.ejercicio_libre || '—'
    }
    function horaTxt(c) {
      return `${(c.hora_inicio || '').slice(0,5)}–${(c.hora_fin || '').slice(0,5)}`
    }
    function escapar(s) {
      return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    }
    function emptyRow(cols, msg) {
      return `<tr><td colspan="${cols}" style="text-align:center;color:var(--texto-secundario);">${msg}</td></tr>`
    }

    // ============================================
    // Tablas en pantalla
    // ============================================
    function pintarTablaRealizadas(lista) {
      document.getElementById('cont-realizadas').textContent = `(${lista.length})`
      document.getElementById('tbody-realizadas').innerHTML = lista.map(c => `
        <tr>
          <td>${c.fecha}</td>
          <td>${horaTxt(c)}</td>
          <td>${escapar(c.titulo)}</td>
          <td>${c.tipo}</td>
          <td class="wrap">${escapar(ejercicioTxt(c))}</td>
          <td class="wrap">${escapar(alumnosTxt(c))}</td>
          <td class="wrap">${escapar(c.notas || '—')}</td>
        </tr>
      `).join('') || emptyRow(7, 'Sin clases realizadas este mes')
    }

    function pintarTablaReprogramadas(lista) {
      document.getElementById('cont-reprogramadas').textContent = `(${lista.length})`
      document.getElementById('tbody-reprogramadas').innerHTML = lista.map(c => `
        <tr>
          <td>${c.fecha}</td>
          <td>${horaTxt(c)}</td>
          <td>${escapar(c.titulo)}</td>
          <td>${c.tipo}</td>
          <td class="wrap">${escapar(ejercicioTxt(c))}</td>
          <td class="wrap">${escapar(alumnosTxt(c))}</td>
          <td class="wrap">${escapar(c.notas || '—')}</td>
        </tr>
      `).join('') || emptyRow(7, 'Sin clases reprogramadas este mes')
    }

    function pintarTablaAnuladas(lista) {
      document.getElementById('cont-anuladas').textContent = `(${lista.length})`
      document.getElementById('tbody-anuladas').innerHTML = lista.map(c => `
        <tr>
          <td>${c.fecha}</td>
          <td>${horaTxt(c)}</td>
          <td>${escapar(c.titulo)}</td>
          <td>${c.tipo}</td>
          <td class="wrap">${escapar(alumnosTxt(c))}</td>
          <td class="wrap">${escapar(c.motivo_anulacion || '—')}</td>
        </tr>
      `).join('') || emptyRow(6, 'Sin clases anuladas este mes')
    }

    function pintarTablaProgramadas(lista) {
      document.getElementById('cont-programadas').textContent = `(${lista.length})`
      document.getElementById('tbody-programadas').innerHTML = lista.map(c => `
        <tr>
          <td>${c.fecha}</td>
          <td>${horaTxt(c)}</td>
          <td>${escapar(c.titulo)}</td>
          <td>${c.tipo}</td>
          <td class="wrap">${escapar(ejercicioTxt(c))}</td>
          <td class="wrap">${escapar(alumnosTxt(c))}</td>
        </tr>
      `).join('') || emptyRow(6, 'Sin clases programadas este mes')
    }

    // ============================================
    // PDF (sin emojis, sin ejercicios/tipo/alumnos/motivo)
    // ============================================
    function generarPDF(informe) {
      const { jsPDF } = window.jspdf
      const doc = new jsPDF()

      const pageWidth  = doc.internal.pageSize.getWidth()
      const pageHeight = doc.internal.pageSize.getHeight()
      const margenIzq  = 15
      const margenDer  = 15
      const anchoUtil  = pageWidth - margenIzq - margenDer

      const [year, month] = informe.mes.split('-')
      const meses = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre']
      const nombreMes = meses[parseInt(month) - 1] + ' ' + year

      // ====== CABECERA ======
      doc.setFillColor(26, 58, 92)
      doc.rect(0, 0, pageWidth, 30, 'F')
      doc.setTextColor(255, 255, 255)
      doc.setFontSize(18)
      doc.setFont('helvetica', 'bold')
      doc.text('Informe mensual de clases', margenIzq, 14)
      doc.setFontSize(11)
      doc.setFont('helvetica', 'normal')
      doc.text(`Mes: ${nombreMes}`, margenIzq, 23)
      doc.setFontSize(9)
      doc.text(`Generado: ${new Date().toLocaleDateString('es-ES')}`, pageWidth - margenDer, 23, { align: 'right' })

      let y = 42

      // ====== RESUMEN (texto plano, sin emojis ni acentos raros) ======
      doc.setTextColor(0, 0, 0)
      doc.setFontSize(12)
      doc.setFont('helvetica', 'bold')
      doc.text('Resumen', margenIzq, y)
      y += 6

      doc.setFont('helvetica', 'normal')
      doc.setFontSize(10)

      const total = informe.realizadas.length + informe.reprogramadas.length +
                    informe.anuladas.length + informe.programadas.length

      doc.text(`Total clases del mes: ${total}`, margenIzq, y); y += 6
      doc.text(`Realizadas: ${informe.realizadas.length}`, margenIzq, y); y += 5
      doc.text(`Reprogramadas: ${informe.reprogramadas.length}`, margenIzq, y); y += 5
      doc.text(`Anuladas: ${informe.anuladas.length}`, margenIzq, y); y += 5
      doc.text(`Programadas: ${informe.programadas.length}`, margenIzq, y); y += 8

      // Desglose por tipo (texto plano)
      if (Object.keys(informe.porTipo).length > 0) {
        doc.setFont('helvetica', 'bold')
        doc.text('Realizadas por tipo:', margenIzq, y); y += 5
        doc.setFont('helvetica', 'normal')
        Object.entries(informe.porTipo).forEach(([k, v]) => {
          doc.text(`- ${k}: ${v}`, margenIzq + 4, y)
          y += 5
        })
      }
      y += 3

      // ====================================================
      // SECCIONES (solo Fecha | Hora | Titulo)
      // ====================================================
      y = seccionPDF(doc, {
        titulo: 'CLASES REALIZADAS',
        color: [39, 174, 96],
        clases: informe.realizadas,
        y, margenIzq, margenDer, anchoUtil, pageWidth, pageHeight
      })

      y = seccionPDF(doc, {
        titulo: 'CLASES REPROGRAMADAS',
        color: [230, 126, 34],
        clases: informe.reprogramadas,
        y, margenIzq, margenDer, anchoUtil, pageWidth, pageHeight
      })

      y = seccionPDF(doc, {
        titulo: 'CLASES ANULADAS',
        color: [192, 57, 43],
        clases: informe.anuladas,
        y, margenIzq, margenDer, anchoUtil, pageWidth, pageHeight
      })

      y = seccionPDF(doc, {
        titulo: 'CLASES AUN PROGRAMADAS',
        color: [58, 143, 191],
        clases: informe.programadas,
        y, margenIzq, margenDer, anchoUtil, pageWidth, pageHeight
      })

      // ====== PIE DE PÁGINA ======
      const totalPaginas = doc.internal.getNumberOfPages()
      for (let i = 1; i <= totalPaginas; i++) {
        doc.setPage(i)
        doc.setFontSize(8)
        doc.setTextColor(138, 155, 168)
        doc.setFont('helvetica', 'normal')
        doc.text(
          `Padel Manager - ${nombreMes}  |  Pagina ${i} de ${totalPaginas}`,
          pageWidth / 2,
          pageHeight - 8,
          { align: 'center' }
        )
      }

      doc.save(`informe-padel-${informe.mes}.pdf`)
    }

    // ============================================
    // Sección del PDF — solo Fecha | Hora | Título
    // ============================================
    function seccionPDF(doc, opts) {
      const { titulo, color, clases, margenIzq, margenDer, anchoUtil, pageWidth, pageHeight } = opts
      let y = opts.y

      if (y > pageHeight - 40) {
        doc.addPage()
        y = 20
      }

      // Barra de título
      doc.setFillColor(color[0], color[1], color[2])
      doc.rect(margenIzq - 2, y - 5, anchoUtil + 4, 8, 'F')
      doc.setTextColor(255, 255, 255)
      doc.setFontSize(11)
      doc.setFont('helvetica', 'bold')
      doc.text(`${titulo}  (${clases.length})`, margenIzq + 2, y)
      y += 10

      if (clases.length === 0) {
        doc.setTextColor(138, 155, 168)
        doc.setFont('helvetica', 'italic')
        doc.setFontSize(9)
        doc.text('Sin clases en esta categoria este mes', margenIzq + 4, y)
        y += 10
        doc.setTextColor(0, 0, 0)
        doc.setFont('helvetica', 'normal')
        return y
      }

      // Columnas: Fecha | Hora | Título
      const colFecha  = margenIzq
      const colHora   = margenIzq + 30
      const colTitulo = margenIzq + 75

      function pintarCabecera() {
        doc.setFillColor(240, 244, 248)
        doc.rect(margenIzq - 2, y - 4, anchoUtil + 4, 7, 'F')
        doc.setFontSize(9)
        doc.setFont('helvetica', 'bold')
        doc.setTextColor(26, 58, 92)
        doc.text('Fecha', colFecha, y)
        doc.text('Hora', colHora, y)
        doc.text('Titulo', colTitulo, y)
        y += 6
        doc.setTextColor(0, 0, 0)
        doc.setFont('helvetica', 'normal')
      }

      pintarCabecera()

      const ordenadas = [...clases].sort((a, b) => {
        if (a.fecha !== b.fecha) return a.fecha.localeCompare(b.fecha)
        return (a.hora_inicio || '').localeCompare(b.hora_inicio || '')
      })

      ordenadas.forEach((c, idx) => {
        if (y > pageHeight - 20) {
          doc.addPage()
          y = 20
          doc.setFillColor(color[0], color[1], color[2])
          doc.rect(margenIzq - 2, y - 5, anchoUtil + 4, 8, 'F')
          doc.setTextColor(255, 255, 255)
          doc.setFontSize(10)
          doc.setFont('helvetica', 'bold')
          doc.text(`${titulo} (cont.)`, margenIzq + 2, y)
          y += 10
          doc.setTextColor(0, 0, 0)
          pintarCabecera()
        }

        if (idx % 2 === 0) {
          doc.setFillColor(250, 252, 254)
          doc.rect(margenIzq - 2, y - 4, anchoUtil + 4, 6, 'F')
        }

        doc.setFontSize(9)
        doc.text(formatearFechaCorta(c.fecha), colFecha, y)
        doc.text(horaTxt(c), colHora, y)
        doc.text(truncar(c.titulo || '', 70), colTitulo, y)

        y += 6
      })

      y += 4
      return y
    }

    // ============================================
    // Helpers
    // ============================================
    function formatearFechaCorta(fechaISO) {
      if (!fechaISO) return ''
      const [y, m, d] = fechaISO.split('-')
      return `${d}/${m}/${y.slice(2)}`
    }

    function truncar(str, max) {
      if (!str) return ''
      return str.length > max ? str.slice(0, max - 1) + '...' : str
    }

    // ============================================
    // Arrancar
    // ============================================
    generarYDescargar()
  </script>

  <style>
    .seccion-titulo {
      font-size: 1.15rem;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding-left: 12px;
      border-left: 5px solid var(--pista-azul-claro);
    }
    .seccion-realizadas { border-left-color: #27ae60; }
    .seccion-reprogramadas { border-left-color: #e67e22; }
    .seccion-anuladas { border-left-color: #e74c3c; }
    .seccion-programadas { border-left-color: #3a8fbf; }

    .seccion-count {
      font-size: 0.85rem;
      color: var(--texto-secundario);
      font-weight: 500;
    }

    .stat-box { text-align: center; }
    .stat-num {
      font-size: 2rem;
      font-weight: 700;
      line-height: 1;
    }
    .stat-label {
      font-size: 0.82rem;
      color: var(--texto-secundario);
      margin-top: 6px;
    }
  </style>
</body>
</html>
