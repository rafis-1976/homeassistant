<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Faltas — Padel Manager</title>
  <link rel="stylesheet" href="../css/theme.css">
</head>
<body>
  <div class="layout">
    <nav class="sidebar"></nav>
    <main class="content">
      <div class="page-header">
        <h1>⚠️ Registro de Faltas</h1>
        <div class="acciones">
          <button class="btn-primary" id="btn-nueva">+ Registrar falta</button>
        </div>
      </div>

      <div class="tabla-wrapper">
        <table class="tabla">
          <thead>
            <tr>
              <th>Fecha</th><th>Alumno</th><th>Clase</th>
              <th>Tipo</th><th>Descripción</th><th></th>
            </tr>
          </thead>
          <tbody id="tbody-faltas"></tbody>
        </table>
      </div>
    </main>
  </div>

  <dialog id="modal-falta">
    <form id="form-falta">
      <h2>Registrar falta</h2>

      <label>Alumno <select id="alumno_id" required></select></label>

      <label>Clase
        <select id="clase_id">
          <option value="">— Selecciona un alumno primero —</option>
        </select>
        <small id="info-clases" style="color:var(--texto-secundario);font-size:0.72rem;display:block;margin-top:4px;"></small>
      </label>

      <label>Tipo
        <select id="tipo">
          <option value="justificada">Justificada</option>
          <option value="no_justificada">No justificada</option>
          <option value="lesion">Lesión</option>
          <option value="aviso_tardio">Aviso tardío</option>
        </select>
      </label>

      <label>Descripción <textarea id="descripcion" rows="3"></textarea></label>

      <div class="modal-actions">
        <button type="button" class="btn-secondary" onclick="document.getElementById('modal-falta').close()">Cancelar</button>
        <button type="submit" class="btn-primary">Guardar</button>
      </div>
    </form>
  </dialog>

  <script type="module">
    import { supabase, TABLES } from '../js/supabase-client.js'
    import { renderNav } from '../js/nav.js'

    renderNav('faltas')

    const modal = document.getElementById('modal-falta')
    const selectAlumno = document.getElementById('alumno_id')
    const selectClase = document.getElementById('clase_id')
    const infoClases = document.getElementById('info-clases')

    // Cache de relaciones clase-alumno
    // Estructura: { alumnoId: [{ claseId, fecha, hora_inicio, titulo, tipo }] }
    let clasesPorAlumno = {}

    // ============================
    // Cargar alumnos
    // ============================
    const { data: alumnos } = await supabase
      .from(TABLES.alumnos)
      .select('id, nombre')
      .eq('activo', true)
      .order('nombre')

    selectAlumno.innerHTML =
      '<option value="">— Selecciona un alumno —</option>' +
      ((alumnos || []).map(a => `<option value="${a.id}">${a.nombre}</option>`).join('') ||
       '<option value="" disabled>Sin alumnos</option>')

    // ============================
    // Precargar todas las clases programadas con sus alumnos
    // ============================
    async function cargarClasesPorAlumno() {
      const hoy = new Date().toISOString().split('T')[0]

      const { data, error } = await supabase
        .from(TABLES.clases)
        .select(`
          id, titulo, fecha, hora_inicio, hora_fin, tipo, estado,
          padel_clase_alumnos(alumno_id)
        `)
        .eq('estado', 'programada')
        .gte('fecha', hoy)
        .order('fecha', { ascending: true })
        .order('hora_inicio', { ascending: true })

      if (error) { console.error(error); return }

      clasesPorAlumno = {}

      ;(data || []).forEach(clase => {
        (clase.padel_clase_alumnos || []).forEach(rel => {
          const alumnoId = rel.alumno_id
          if (!clasesPorAlumno[alumnoId]) clasesPorAlumno[alumnoId] = []
          clasesPorAlumno[alumnoId].push({
            id: clase.id,
            titulo: clase.titulo,
            fecha: clase.fecha,
            hora_inicio: clase.hora_inicio,
            hora_fin: clase.hora_fin,
            tipo: clase.tipo
          })
        })
      })
    }

    await cargarClasesPorAlumno()

    // ============================
    // Al cambiar de alumno → filtrar clases
    // ============================
    selectAlumno.addEventListener('change', () => {
      const alumnoId = selectAlumno.value

      if (!alumnoId) {
        selectClase.innerHTML = '<option value="">— Selecciona un alumno primero —</option>'
        selectClase.disabled = true
        infoClases.textContent = ''
        return
      }

      const clases = clasesPorAlumno[alumnoId] || []

      if (clases.length === 0) {
        selectClase.innerHTML = '<option value="">— Sin clases programadas —</option>'
        selectClase.disabled = true
        infoClases.textContent = 'Este alumno no tiene clases programadas pendientes'
        infoClases.style.color = '#e67e22'
        return
      }

      selectClase.disabled = false
      selectClase.innerHTML =
        '<option value="">— Sin clase asociada —</option>' +
        clases.map(c => {
          const hora = `${(c.hora_inicio || '').slice(0,5)}–${(c.hora_fin || '').slice(0,5)}`
          return `<option value="${c.id}">${c.fecha} · ${hora} · ${c.titulo}</option>`
        }).join('')

      infoClases.textContent = `${clases.length} clase${clases.length > 1 ? 's' : ''} programada${clases.length > 1 ? 's' : ''}`
      infoClases.style.color = 'var(--pista-azul-hielo)'
    })

    // ============================
    // Cargar lista de faltas
    // ============================
    async function cargarFaltas() {
      const { data } = await supabase
        .from(TABLES.faltas)
        .select('*, padel_alumnos(nombre), padel_clases(titulo, fecha)')
        .order('fecha_registro', { ascending: false })

      document.getElementById('tbody-faltas').innerHTML = (data || []).map(f => `
        <tr>
          <td>${f.fecha_registro?.split('T')[0]}</td>
          <td>${f.padel_alumnos?.nombre || '—'}</td>
          <td>${f.padel_clases ? f.padel_clases.fecha + ' — ' + f.padel_clases.titulo : '—'}</td>
          <td><span class="badge ${f.tipo === 'justificada' ? 'badge-realizada' : 'badge-anulada'}">${f.tipo}</span></td>
          <td class="wrap">${f.descripcion || '—'}</td>
          <td><button class="btn-peligro" data-del="${f.id}">🗑️</button></td>
        </tr>
      `).join('') || '<tr><td colspan="6" style="text-align:center;color:var(--texto-secundario);">Sin faltas registradas</td></tr>'

      document.querySelectorAll('[data-del]').forEach(btn => {
        btn.onclick = async () => {
          if (!confirm('¿Eliminar esta falta?')) return
          await supabase.from(TABLES.faltas).delete().eq('id', btn.dataset.del)
          cargarFaltas()
        }
      })
    }

    // ============================
    // Abrir modal (resetear)
    // ============================
    document.getElementById('btn-nueva').onclick = async () => {
      document.getElementById('form-falta').reset()

      // Refrescar el cache por si ha habido cambios en el calendario
      await cargarClasesPorAlumno()

      selectClase.innerHTML = '<option value="">— Selecciona un alumno primero —</option>'
      selectClase.disabled = true
      infoClases.textContent = ''

      modal.showModal()
    }

    // ============================
    // Guardar falta
    // ============================
    document.getElementById('form-falta').addEventListener('submit', async (e) => {
      e.preventDefault()
      const alumnoId = selectAlumno.value
      if (!alumnoId) { alert('Selecciona un alumno'); return }

      await supabase.from(TABLES.faltas).insert({
        alumno_id: alumnoId,
        clase_id: selectClase.value || null,
        tipo: document.getElementById('tipo').value,
        descripcion: document.getElementById('descripcion').value || null
      })
      modal.close()
      cargarFaltas()
    })

    cargarFaltas()
  </script>

  <style>
    #clase_id:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</body>
</html>
