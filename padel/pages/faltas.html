<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Faltas — Padel Manager</title>
  <link rel="stylesheet" href="../css/theme.css">
</head>
<body>
  <div class="layout">
    <nav class="sidebar"></nav>
    <main class="content">
      <div class="page-header">
        <h1>⚠️ Registro de Faltas</h1>
        <div class="acciones">
          <button class="btn-primary" id="btn-nueva">+ Registrar falta</button>
        </div>
      </div>

      <div class="tabla-wrapper">
        <table class="tabla">
          <thead>
            <tr>
              <th>Fecha</th><th>Alumno</th><th>Clase</th>
              <th>Tipo</th><th>Estado</th><th>Descripción</th><th></th>
            </tr>
          </thead>
          <tbody id="tbody-faltas">
            <tr><td colspan="7" style="text-align:center;color:var(--texto-secundario);">Cargando...</td></tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <dialog id="modal-falta">
    <form id="form-falta">
      <h2>Registrar falta</h2>

      <label>Alumno <select id="alumno_id" required></select></label>

      <label>Clase
        <select id="clase_id">
          <option value="">— Selecciona un alumno primero —</option>
        </select>
        <small id="info-clases" style="color:var(--texto-secundario);font-size:0.72rem;display:block;margin-top:4px;"></small>
      </label>

      <div id="aviso-duplicado" class="aviso-duplicado" style="display:none;"></div>

      <label>Tipo
        <select id="tipo">
          <option value="justificada">Justificada</option>
          <option value="no_justificada">No justificada</option>
          <option value="lesion">Lesión</option>
          <option value="aviso_tardio">Aviso tardío</option>
        </select>
      </label>

      <label>Descripción <textarea id="descripcion" rows="3"></textarea></label>

      <div class="modal-actions">
        <button type="button" class="btn-secondary" onclick="document.getElementById('modal-falta').close()">Cancelar</button>
        <button type="submit" class="btn-primary" id="btn-guardar-falta">Guardar</button>
      </div>
    </form>
  </dialog>

  <script type="module">
    import { supabase, TABLES } from '../js/supabase-client.js'
    import { renderNav } from '../js/nav.js'

    renderNav('faltas')

    const modal = document.getElementById('modal-falta')
    const selectAlumno = document.getElementById('alumno_id')
    const selectClase = document.getElementById('clase_id')
    const infoClases = document.getElementById('info-clases')
    const avisoDuplicado = document.getElementById('aviso-duplicado')
    const btnGuardar = document.getElementById('btn-guardar-falta')

    let alumnosMap = {}
    let clasesMap = {}
    let clasesPorAlumno = {}
    let faltasExistentes = new Set()

    // ============================
    // Cargar datos
    // ============================
    async function cargarDatos() {
      const { data: alumnos } = await supabase
        .from(TABLES.alumnos).select('id, nombre').eq('activo', true).order('nombre')

      alumnosMap = Object.fromEntries((alumnos || []).map(a => [a.id, a]))
      selectAlumno.innerHTML =
        '<option value="">— Selecciona un alumno —</option>' +
        ((alumnos || []).map(a => `<option value="${a.id}">${a.nombre}</option>`).join('') ||
         '<option value="" disabled>Sin alumnos</option>')

      const { data: clases } = await supabase
        .from(TABLES.clases)
        .select('id, titulo, fecha, hora_inicio, hora_fin, estado')
        .order('fecha', { ascending: false })
        .limit(500)

      clasesMap = Object.fromEntries((clases || []).map(c => [c.id, c]))

      const { data: rels } = await supabase
        .from(TABLES.claseAlumnos).select('clase_id, alumno_id')

      clasesPorAlumno = {}
      ;(rels || []).forEach(r => {
        const clase = clasesMap[r.clase_id]
        if (!clase) return
        if (!clasesPorAlumno[r.alumno_id]) clasesPorAlumno[r.alumno_id] = []
        clasesPorAlumno[r.alumno_id].push(clase)
      })

      Object.values(clasesPorAlumno).forEach(arr => {
        arr.sort((a, b) => (b.fecha || '').localeCompare(a.fecha || ''))
      })

      const { data: faltas } = await supabase
        .from(TABLES.faltas).select('alumno_id, clase_id')

      faltasExistentes = new Set()
      ;(faltas || []).forEach(f => {
        if (f.alumno_id && f.clase_id) {
          faltasExistentes.add(`${f.alumno_id}:${f.clase_id}`)
        }
      })
    }

    // ============================
    // Al cambiar alumno → filtrar clases
    // ============================
    selectAlumno.addEventListener('change', () => {
      const alumnoId = selectAlumno.value
      avisoDuplicado.style.display = 'none'
      btnGuardar.disabled = false

      if (!alumnoId) {
        selectClase.innerHTML = '<option value="">— Selecciona un alumno primero —</option>'
        selectClase.disabled = true
        infoClases.textContent = ''
        return
      }

      const todasLasClases = clasesPorAlumno[alumnoId] || []
      // Solo clases que NO estén anuladas
      const clasesNoAnuladas = todasLasClases.filter(c => c.estado !== 'anulada')
      // Y de esas, las que aún no tienen falta para este alumno
      const clasesDisponibles = clasesNoAnuladas.filter(c =>
        !faltasExistentes.has(`${alumnoId}:${c.id}`)
      )
      const clasesConFalta = clasesNoAnuladas.length - clasesDisponibles.length

      if (clasesDisponibles.length === 0) {
        selectClase.innerHTML = '<option value="">— Sin clases disponibles —</option>'
        selectClase.disabled = true
        if (todasLasClases.length === 0) {
          infoClases.textContent = 'Este alumno no tiene clases registradas'
          infoClases.style.color = '#e67e22'
        } else {
          infoClases.textContent = `Este alumno ya tiene falta registrada en todas sus clases (${clasesConFalta})`
          infoClases.style.color = '#e74c3c'
        }
        return
      }

      selectClase.disabled = false
      const programadas = clasesDisponibles.filter(c => c.estado === 'programada')
      const otras = clasesDisponibles.filter(c => c.estado !== 'programada')

      let html = '<option value="">— Sin clase asociada —</option>'
      if (programadas.length > 0) {
        html += '<optgroup label="📅 Programadas">'
        html += programadas.map(c => {
          const hora = c.hora_inicio ? `${c.hora_inicio.slice(0,5)}–${(c.hora_fin||'').slice(0,5)}` : ''
          return `<option value="${c.id}">${c.fecha} · ${hora} · ${c.titulo}</option>`
        }).join('')
        html += '</optgroup>'
      }
      if (otras.length > 0) {
        html += '<optgroup label="📚 Otras clases">'
        html += otras.slice(0, 30).map(c => {
          const hora = c.hora_inicio ? `${c.hora_inicio.slice(0,5)}–${(c.hora_fin||'').slice(0,5)}` : ''
          const est = c.estado === 'realizada' ? '✅ ' : ''
          return `<option value="${c.id}">${est}${c.fecha} · ${hora} · ${c.titulo}</option>`
        }).join('')
        html += '</optgroup>'
      }
      selectClase.innerHTML = html

      let infoTxt = `${programadas.length} programada${programadas.length !== 1 ? 's' : ''} · ${otras.length} otras`
      if (clasesConFalta > 0) {
        infoTxt += ` · ${clasesConFalta} oculta${clasesConFalta > 1 ? 's' : ''} (ya tienen falta)`
      }
      infoClases.textContent = infoTxt
      infoClases.style.color = 'var(--pista-azul-hielo)'
    })

    // ============================
    // Al cambiar clase → validar duplicado
    // ============================
    selectClase.addEventListener('change', () => {
      const alumnoId = selectAlumno.value
      const claseId = selectClase.value

      if (!alumnoId || !claseId) {
        avisoDuplicado.style.display = 'none'
        btnGuardar.disabled = false
        return
      }

      if (faltasExistentes.has(`${alumnoId}:${claseId}`)) {
        avisoDuplicado.style.display = 'block'
        avisoDuplicado.innerHTML = `⚠️ <strong>Ya existe una falta registrada</strong> para este alumno en esta clase.`
        btnGuardar.disabled = true
      } else {
        avisoDuplicado.style.display = 'none'
        btnGuardar.disabled = false
      }
    })

    // ============================
    // Cargar tabla
    // ============================
    async function cargarFaltas() {
      const tbody = document.getElementById('tbody-faltas')
      tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;color:var(--texto-secundario);">Cargando...</td></tr>'

      const { data: faltas, error } = await supabase
        .from(TABLES.faltas).select('*').order('fecha_registro', { ascending: false })

      if (error) {
        tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;color:#e74c3c;">Error: ${error.message}</td></tr>`
        return
      }

      if (!faltas || faltas.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;color:var(--texto-secundario);">Sin faltas registradas</td></tr>'
        return
      }

      tbody.innerHTML = faltas.map(f => {
        const alumno = alumnosMap[f.alumno_id]?.nombre || '—'
        const clase = clasesMap[f.clase_id]
        const claseTxt = clase ? `${clase.fecha} — ${clase.titulo}` : '—'

        let estadoHtml = ''
        if (f.tipo === 'justificada' || f.tipo === 'lesion') {
          if (f.recuperada) estadoHtml = '<span class="badge-rec badge-rec-ok">✔️ Recuperada</span>'
          else if (f.clase_recuperacion_id) estadoHtml = '<span class="badge-rec badge-rec-prog">🔄 Programada</span>'
          else estadoHtml = '<span class="badge-rec badge-rec-pend">⏳ Pendiente</span>'
        } else {
          estadoHtml = '<span style="color:var(--texto-secundario);">—</span>'
        }

        const tipoLabel = {
          justificada: 'Justificada',
          no_justificada: 'No justificada',
          lesion: 'Lesión',
          aviso_tardio: 'Aviso tardío'
        }[f.tipo] || f.tipo

        const badgeClass = f.tipo === 'justificada' ? 'badge-realizada'
                         : f.tipo === 'lesion' ? 'badge-anulada'
                         : f.tipo === 'no_justificada' ? 'badge-anulada'
                         : 'badge-programada'

        return `
          <tr>
            <td>${f.fecha_registro?.split('T')[0] || '—'}</td>
            <td>${escapar(alumno)}</td>
            <td class="wrap">${escapar(claseTxt)}</td>
            <td><span class="badge ${badgeClass}">${tipoLabel}</span></td>
            <td>${estadoHtml}</td>
            <td class="wrap">${escapar(f.descripcion || '—')}</td>
            <td><button class="btn-peligro" data-del="${f.id}">🗑️</button></td>
          </tr>
        `
      }).join('')

      tbody.querySelectorAll('[data-del]').forEach(btn => {
        btn.onclick = async () => {
          const faltaId = btn.dataset.del
          const falta = faltas.find(f => f.id === faltaId)
          if (!confirm('¿Eliminar esta falta?')) return
          await supabase.from(TABLES.faltas).delete().eq('id', faltaId)
          // Si la falta tenía clase, revisar si hay que reabrir
          if (falta?.clase_id) {
            await revisarReaperturaClase(falta.clase_id)
          }
          await cargarDatos()
          cargarFaltas()
        }
      })
    }

    // ============================
    // AUTO-ANULACIÓN: si todos los alumnos de la clase faltan → anular
    // ============================
    async function verificarAutoAnulacion(claseId) {
      // 1. Alumnos de la clase
      const { data: alumnosClase } = await supabase
        .from(TABLES.claseAlumnos)
        .select('alumno_id')
        .eq('clase_id', claseId)

      if (!alumnosClase || alumnosClase.length === 0) return null

      // 2. Faltas de la clase
      const { data: faltasClase } = await supabase
        .from(TABLES.faltas)
        .select('alumno_id')
        .eq('clase_id', claseId)

      const alumnosConFalta = new Set((faltasClase || []).map(f => f.alumno_id))
      const todosFaltan = alumnosClase.every(a => alumnosConFalta.has(a.alumno_id))

      if (!todosFaltan) return null

      // 3. Obtener datos de la clase
      const { data: clase } = await supabase
        .from(TABLES.clases)
        .select('estado')
        .eq('id', claseId)
        .single()

      // Solo anular si está programada
      if (!clase || clase.estado !== 'programada') return null

      // 4. Anular la clase
      const { error } = await supabase
        .from(TABLES.clases)
        .update({ estado: 'anulada', motivo_anulacion: 'No hay alumnos' })
        .eq('id', claseId)

      if (error) { console.error('Error anulando:', error); return null }

      return { totalAlumnos: alumnosClase.length }
    }

    // ============================
    // REAPERTURA: si ya NO faltan todos → reabrir (solo si se anuló por "No hay alumnos")
    // ============================
    async function revisarReaperturaClase(claseId) {
      const { data: clase } = await supabase
        .from(TABLES.clases)
        .select('estado, motivo_anulacion')
        .eq('id', claseId)
        .single()

      // Solo reabrir si fue anulada automáticamente por "No hay alumnos"
      if (!clase || clase.estado !== 'anulada') return false
      if (clase.motivo_anulacion !== 'No hay alumnos') return false

      const { data: alumnosClase } = await supabase
        .from(TABLES.claseAlumnos)
        .select('alumno_id')
        .eq('clase_id', claseId)

      const { data: faltasClase } = await supabase
        .from(TABLES.faltas)
        .select('alumno_id')
        .eq('clase_id', claseId)

      const alumnosConFalta = new Set((faltasClase || []).map(f => f.alumno_id))
      const todosFaltan = (alumnosClase || []).every(a => alumnosConFalta.has(a.alumno_id))

      if (todosFaltan) return false

      // Reabrir la clase
      const { error } = await supabase
        .from(TABLES.clases)
        .update({ estado: 'programada', motivo_anulacion: null })
        .eq('id', claseId)

      return !error
    }

    // ============================
    // Toast de notificación
    // ============================
    function mostrarToast(texto, tipo = 'ok') {
      const colores = {
        ok: '#1e8449',
        anulada: '#c0392b',
        reabierta: '#2a6b9c'
      }
      const iconos = {
        ok: '✅',
        anulada: '🚫',
        reabierta: '🔄'
      }
      const t = document.createElement('div')
      t.className = 'toast-notificacion'
      t.style.background = colores[tipo] || colores.ok
      t.innerHTML = `${iconos[tipo] || ''} ${texto}`
      document.body.appendChild(t)
      setTimeout(() => {
        t.style.opacity = '0'
        setTimeout(() => t.remove(), 300)
      }, 3500)
    }

    function escapar(s) {
      return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    }

    // ============================
    // Nuevo
    // ============================
    document.getElementById('btn-nueva').onclick = async () => {
      document.getElementById('form-falta').reset()
      selectClase.innerHTML = '<option value="">— Selecciona un alumno primero —</option>'
      selectClase.disabled = true
      infoClases.textContent = ''
      avisoDuplicado.style.display = 'none'
      btnGuardar.disabled = false
      await cargarDatos()
      modal.showModal()
    }

    // ============================
    // Guardar
    // ============================
    document.getElementById('form-falta').addEventListener('submit', async (e) => {
      e.preventDefault()
      const alumnoId = selectAlumno.value
      if (!alumnoId) { alert('Selecciona un alumno'); return }

      const claseId = selectClase.value || null

      if (claseId && faltasExistentes.has(`${alumnoId}:${claseId}`)) {
        alert('⚠️ Este alumno ya tiene una falta registrada en esa clase.')
        return
      }

      const { error } = await supabase.from(TABLES.faltas).insert({
        alumno_id: alumnoId,
        clase_id: claseId,
        tipo: document.getElementById('tipo').value,
        descripcion: document.getElementById('descripcion').value || null
      })

      if (error) { alert('Error: ' + error.message); return }

      modal.close()

      // ⬇️ Verificar auto-anulación si tiene clase
      if (claseId) {
        const result = await verificarAutoAnulacion(claseId)
        if (result) {
          mostrarToast(
            `Clase anulada automáticamente: todos los alumnos (${result.totalAlumnos}) han faltado`,
            'anulada'
          )
        }
      }

      await cargarDatos()
      cargarFaltas()
    })

    // ============================
    // Init
    // ============================
    await cargarDatos()
    cargarFaltas()
  </script>

  <style>
    #clase_id:disabled { opacity: 0.5; cursor: not-allowed; }

    .badge-rec {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 0.68rem;
      font-weight: 600;
      white-space: nowrap;
    }
    .badge-rec-pend { background: #e67e22; color: white; }
    .badge-rec-prog { background: #8e44ad; color: white; }
    .badge-rec-ok   { background: #27ae60; color: white; }

    .aviso-duplicado {
      background: rgba(192, 57, 43, 0.15);
      border: 1px solid #e74c3c;
      border-left: 4px solid #e74c3c;
      border-radius: 6px;
      padding: 10px 12px;
      margin-bottom: 12px;
      font-size: 0.83rem;
      color: #e74c3c;
      animation: shakeIn 0.3s ease;
    }
    @keyframes shakeIn {
      0%   { transform: translateX(0); }
      25%  { transform: translateX(-4px); }
      75%  { transform: translateX(4px); }
      100% { transform: translateX(0); }
    }

    optgroup {
      background: var(--fondo-card);
      color: var(--pista-azul-hielo);
      font-weight: 700;
    }
    optgroup option {
      background: var(--fondo-app);
      color: var(--texto-principal);
      font-weight: 400;
    }

    #btn-guardar-falta:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Toast de notificación */
    .toast-notificacion {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      color: white;
      padding: 14px 22px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      z-index: 9999;
      box-shadow: 0 6px 24px rgba(0,0,0,0.5);
      animation: toastIn 0.3s ease;
      max-width: 90vw;
      text-align: center;
      transition: opacity 0.3s ease;
    }
    @keyframes toastIn {
      from { opacity: 0; transform: translate(-50%, 20px); }
      to   { opacity: 1; transform: translate(-50%, 0); }
    }
  </style>
</body>
</html>
