<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Diseñador de Ejercicios — Padel Manager</title>
  <link rel="stylesheet" href="../css/theme.css">
  <link rel="stylesheet" href="../css/ejercicios.css">
</head>
<body>
  <div class="layout">
    <nav class="sidebar"></nav>
    <main class="content">

      <div id="banner-edicion" class="banner-edicion" style="display:none;">
        <span>✏️ <strong>Editando:</strong> <span id="banner-titulo"></span></span>
        <button type="button" class="btn-mini" id="btn-cancelar-edicion">✕ Cancelar edición</button>
      </div>

      <h1>🎾 Diseñador de Ejercicios</h1>

      <div class="card" style="margin-bottom:16px;">
        <label style="display:block;font-size:0.85rem;color:var(--texto-secundario);margin-bottom:10px;">
          Título del ejercicio *
          <input type="text" id="titulo-ejercicio" placeholder="Ej: Volea cruzada desde el fondo" required>
        </label>
        <label style="display:block;font-size:0.85rem;color:var(--texto-secundario);">
          Descripción breve (opcional)
          <input type="text" id="descripcion-ejercicio" placeholder="Ej: 3 series de 10 repeticiones">
        </label>
      </div>

      <div class="toolbar">
        <div class="tool-group">
          <span class="tool-label">Jugador azul</span>
          <button class="tool-btn" data-tipo="jugador-azul-0" title="Azul ↑">
            <svg viewBox="-22 -22 44 44"><use href="#icon-jugador-azul"/></svg>
          </button>
          <button class="tool-btn" data-tipo="jugador-azul-90" title="Azul →">
            <svg viewBox="-22 -22 44 44"><g transform="rotate(90)"><use href="#icon-jugador-azul"/></g></svg>
          </button>
          <button class="tool-btn" data-tipo="jugador-azul-180" title="Azul ↓">
            <svg viewBox="-22 -22 44 44"><g transform="rotate(180)"><use href="#icon-jugador-azul"/></g></svg>
          </button>
          <button class="tool-btn" data-tipo="jugador-azul-270" title="Azul ←">
            <svg viewBox="-22 -22 44 44"><g transform="rotate(270)"><use href="#icon-jugador-azul"/></g></svg>
          </button>
        </div>

        <div class="tool-group">
          <span class="tool-label">Jugador rojo</span>
          <button class="tool-btn" data-tipo="jugador-rojo-0" title="Rojo ↑">
            <svg viewBox="-22 -22 44 44"><use href="#icon-jugador-rojo"/></svg>
          </button>
          <button class="tool-btn" data-tipo="jugador-rojo-90" title="Rojo →">
            <svg viewBox="-22 -22 44 44"><g transform="rotate(90)"><use href="#icon-jugador-rojo"/></g></svg>
          </button>
          <button class="tool-btn" data-tipo="jugador-rojo-180" title="Rojo ↓">
            <svg viewBox="-22 -22 44 44"><g transform="rotate(180)"><use href="#icon-jugador-rojo"/></g></svg>
          </button>
          <button class="tool-btn" data-tipo="jugador-rojo-270" title="Rojo ←">
            <svg viewBox="-22 -22 44 44"><g transform="rotate(270)"><use href="#icon-jugador-rojo"/></g></svg>
          </button>
        </div>

        <div class="tool-group">
          <span class="tool-label">Material</span>
          <button class="tool-btn" data-tipo="carro-bolas" title="Carro de bolas">
            <svg viewBox="-20 -14 40 28"><use href="#icon-carro"/></svg>
          </button>
          <button class="tool-btn" data-tipo="cono" title="Cono">
            <svg viewBox="-10 -10 20 20"><use href="#icon-cono"/></svg>
          </button>
          <button class="tool-btn" data-tipo="escalera" title="Escalera de ejercicios">
            <svg viewBox="-52 -14 104 28"><use href="#icon-escalera"/></svg>
          </button>
        </div>

        <div class="tool-group">
          <span class="tool-label">Golpes</span>
          <button class="tool-btn" data-tipo="pelota" title="Pelota de pádel">
            <svg viewBox="-8 -8 16 16"><use href="#icon-pelota"/></svg>
          </button>
          <button class="tool-btn" data-tipo="flecha-recta" title="Flecha recta">
            <svg viewBox="-4 -12 48 24"><use href="#icon-flecha"/></svg>
          </button>
          <button class="tool-btn" data-tipo="trayectoria" title="Trayectoria con pelota">
            <svg viewBox="-4 -12 48 24"><use href="#icon-trayectoria"/></svg>
          </button>
          <button class="tool-btn" data-tipo="globo" title="Globo (lob)">
            <svg viewBox="-4 -24 48 32"><use href="#icon-globo"/></svg>
          </button>
        </div>

        <div class="tool-group" style="margin-left:auto;">
          <button class="btn-peligro" id="btn-limpiar">🗑️ Limpiar</button>
          <button class="btn-primary" id="btn-guardar">💾 Guardar</button>
        </div>
      </div>

        </div>

  <script type="module">
    import { supabase, TABLES } from '../js/supabase-client.js'
    import { renderNav } from '../js/nav.js'
    import { inicializarPista, obtenerDatosPista, cargarDesdeDatos } from '../js/ejercicios.js'

    renderNav('ejercicios')
    inicializarPista('pista-svg')

    let ejercicioEditandoId = null
    let ejerciciosCache = []

    const inputTitulo = document.getElementById('titulo-ejercicio')
    const inputDescripcion = document.getElementById('descripcion-ejercicio')
    const inputNotas = document.getElementById('notas-ejercicio')
    const btnGuardar = document.getElementById('btn-guardar')
    const bannerEdicion = document.getElementById('banner-edicion')
    const bannerTitulo = document.getElementById('banner-titulo')
    const btnCancelarEdicion = document.getElementById('btn-cancelar-edicion')
    const listaEjercicios = document.getElementById('lista-ejercicios')
    const contadorEjercicios = document.getElementById('contador-ejercicios')
    const buscador = document.getElementById('buscar-ejercicio')

    btnGuardar.addEventListener('click', async () => {
      const titulo = inputTitulo.value.trim()
      if (!titulo) {
        alert('Falta el título del ejercicio')
        inputTitulo.focus()
        return
      }
      const descripcion = inputDescripcion.value.trim() || null
      const notas = inputNotas.value || null
      const datos = obtenerDatosPista()

      if (ejercicioEditandoId) {
        const { error } = await supabase
          .from(TABLES.ejercicios)
          .update({ titulo, descripcion, notas, canvas_data: { elementos: datos } })
          .eq('id', ejercicioEditandoId)
        if (error) { alert('Error: ' + error.message); return }
        alert('✅ Ejercicio actualizado')
        salirModoEdicion()
      } else {
        const { error } = await supabase.from(TABLES.ejercicios).insert({
          titulo, descripcion, notas, canvas_data: { elementos: datos }
        })
        if (error) { alert('Error: ' + error.message); return }
        alert('✅ Ejercicio guardado')
        inputTitulo.value = ''
        inputDescripcion.value = ''
        inputNotas.value = ''
      }

      cargarListaEjercicios()
    })

    function entrarModoEdicion(ejercicio) {
      ejercicioEditandoId = ejercicio.id
      inputTitulo.value = ejercicio.titulo || ''
      inputDescripcion.value = ejercicio.descripcion || ''
      inputNotas.value = ejercicio.notas || ''
      const datos = ejercicio.canvas_data?.elementos || []
      cargarDesdeDatos(datos)
      bannerTitulo.textContent = ejercicio.titulo
      bannerEdicion.style.display = 'flex'
      btnGuardar.textContent = '💾 Guardar cambios'
      window.scrollTo({ top: 0, behavior: 'smooth' })
    }

    function salirModoEdicion() {
      ejercicioEditandoId = null
      bannerEdicion.style.display = 'none'
      btnGuardar.textContent = '💾 Guardar'
      inputTitulo.value = ''
      inputDescripcion.value = ''
      inputNotas.value = ''
      cargarDesdeDatos([])
    }

    btnCancelarEdicion.onclick = salirModoEdicion

    document.getElementById('btn-limpiar').addEventListener('click', () => {
      if (ejercicioEditandoId) salirModoEdicion()
      else {
        inputTitulo.value = ''
        inputDescripcion.value = ''
        inputNotas.value = ''
      }
    })

    async function cargarListaEjercicios() {
      const { data, error } = await supabase
        .from(TABLES.ejercicios)
        .select('id, titulo, descripcion, notas, canvas_data, created_at')
        .order('created_at', { ascending: false })
      if (error) {
        listaEjercicios.innerHTML = `<p class="vacio-lista">Error: ${error.message}</p>`
        return
      }
      ejerciciosCache = data || []
      pintarLista()
    }

    function pintarLista(filtro = '') {
      const f = filtro.trim().toLowerCase()
      const filtrados = f
        ? ejerciciosCache.filter(e =>
            (e.titulo || '').toLowerCase().includes(f) ||
            (e.descripcion || '').toLowerCase().includes(f))
        : ejerciciosCache

      contadorEjercicios.textContent = `(${filtrados.length}${f ? ' de ' + ejerciciosCache.length : ''})`

      if (filtrados.length === 0) {
        listaEjercicios.innerHTML = `<p class="vacio-lista">${f ? 'Sin resultados para "' + filtro + '"' : 'Todavía no has guardado ejercicios'}</p>`
        return
      }

      listaEjercicios.innerHTML = filtrados.map(e => {
        const stats = contarElementos(e.canvas_data?.elementos || [])
        const fecha = e.created_at ? e.created_at.split('T')[0] : ''
        const descripcion = e.descripcion ? `<p class="card-desc">${escapar(e.descripcion)}</p>` : ''
        const badges = construirBadges(stats)
        return `
          <div class="card-ejercicio" data-id="${e.id}">
            <div class="card-header">
              <h3 class="card-titulo">${escapar(e.titulo)}</h3>
              <span class="card-fecha">${fecha}</span>
            </div>
            ${descripcion}
            <div class="card-badges">${badges}</div>
            <div class="card-acciones">
              <button class="btn-accion btn-editar" data-action="editar" data-id="${e.id}">✏️ Editar</button>
              <button class="btn-accion btn-duplicar" data-action="duplicar" data-id="${e.id}">📋 Duplicar</button>
              <button class="btn-accion btn-eliminar" data-action="eliminar" data-id="${e.id}">🗑️</button>
            </div>
          </div>
        `
      }).join('')

      listaEjercicios.querySelectorAll('[data-action]').forEach(btn => {
        const id = btn.dataset.id
        const ej = ejerciciosCache.find(x => x.id === id)
        if (!ej) return
        if (btn.dataset.action === 'editar') btn.onclick = () => entrarModoEdicion(ej)
        else if (btn.dataset.action === 'duplicar') btn.onclick = () => duplicarEjercicio(ej)
        else if (btn.dataset.action === 'eliminar') btn.onclick = () => eliminarEjercicio(ej)
      })
    }

    function contarElementos(elementos) {
      const c = { jugadores: 0, carros: 0, conos: 0, escaleras: 0, pelotas: 0, flechas: 0, trayectorias: 0, globos: 0 }
      elementos.forEach(el => {
        const t = el.tipo || ''
        if (t.startsWith('jugador')) c.jugadores++
        else if (t === 'carro-bolas') c.carros++
        else if (t === 'cono') c.conos++
        else if (t === 'escalera') c.escaleras++
        else if (t === 'pelota') c.pelotas++
        else if (t === 'flecha-recta') c.flechas++
        else if (t === 'trayectoria') c.trayectorias++
        else if (t === 'globo') c.globos++
      })
      return c
    }

    function construirBadges(stats) {
      const partes = []
      if (stats.jugadores)    partes.push(`<span class="badge-info">🏃 ${stats.jugadores}</span>`)
      if (stats.carros)       partes.push(`<span class="badge-info">🛒 ${stats.carros}</span>`)
      if (stats.conos)        partes.push(`<span class="badge-info">🔶 ${stats.conos}</span>`)
      if (stats.escaleras)    partes.push(`<span class="badge-info">🪜 ${stats.escaleras}</span>`)
      if (stats.pelotas)      partes.push(`<span class="badge-info">🎾 ${stats.pelotas}</span>`)
      if (stats.flechas)      partes.push(`<span class="badge-info">➡️ ${stats.flechas}</span>`)
      if (stats.trayectorias) partes.push(`<span class="badge-info">〰️ ${stats.trayectorias}</span>`)
      if (stats.globos)       partes.push(`<span class="badge-info">🌈 ${stats.globos}</span>`)
      return partes.join('') || '<span class="badge-info badge-vacio">Pista vacía</span>'
    }

    async function duplicarEjercicio(ej) {
      const nuevoTitulo = prompt('Título del nuevo ejercicio:', ej.titulo + ' (copia)')
      if (!nuevoTitulo) return
      const { error } = await supabase.from(TABLES.ejercicios).insert({
        titulo: nuevoTitulo,
        descripcion: ej.descripcion,
        notas: ej.notas,
        canvas_data: ej.canvas_data
      })
      if (error) { alert('Error: ' + error.message); return }
      cargarListaEjercicios()
    }

    async function eliminarEjercicio(ej) {
      const { count } = await supabase
        .from(TABLES.clases)
        .select('*', { count: 'exact', head: true })
        .eq('ejercicio_id', ej.id)

      const aviso = count > 0
        ? `⚠️ Este ejercicio está asociado a ${count} clase(s).\n\nSi lo eliminas, esas clases se quedarán sin ejercicio asignado.\n\n¿Continuar?`
        : `¿Eliminar el ejercicio "${ej.titulo}"?`

      if (!confirm(aviso)) return

      const { error } = await supabase.from(TABLES.ejercicios).delete().eq('id', ej.id)
      if (error) { alert('Error: ' + error.message); return }

      if (ejercicioEditandoId === ej.id) salirModoEdicion()
      cargarListaEjercicios()
    }

    buscador.addEventListener('input', () => pintarLista(buscador.value))

    function escapar(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
    }

    cargarListaEjercicios()
  </script>
</body>
</html>
