<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Diseñador de Ejercicios — Padel Manager</title>
  <link rel="stylesheet" href="../css/theme.css">
  <link rel="stylesheet" href="../css/ejercicios.css">
</head>
<body>
  <div class="layout">
    <nav class="sidebar"></nav>
    <main class="content">
      <h1>🎾 Diseñador de Ejercicios</h1>

      <!-- ============================ TOOLBAR ============================ -->
      <div class="toolbar">
        <div class="tool-group">
          <span class="tool-label">Jugadores</span>
          <button class="tool-btn" data-tipo="jugador-azul" title="Jugador equipo azul">
            <svg width="18" height="20" viewBox="-12 -16 24 34"><use href="#icon-jugador-azul"/></svg>
          </button>
          <button class="tool-btn" data-tipo="jugador-rojo" title="Jugador equipo rojo">
            <svg width="18" height="20" viewBox="-12 -16 24 34"><use href="#icon-jugador-rojo"/></svg>
          </button>
        </div>

        <div class="tool-group">
          <span class="tool-label">Material</span>
          <button class="tool-btn" data-tipo="carro-bolas" title="Carro de bolas">
            <svg width="24" height="20" viewBox="-18 -14 36 30"><use href="#icon-carro"/></svg>
          </button>
          <button class="tool-btn" data-tipo="cono" title="Cono">
            <svg width="18" height="20" viewBox="-10 -14 20 26"><use href="#icon-cono"/></svg>
          </button>
          <button class="tool-btn" data-tipo="seta" title="Seta">
            <svg width="18" height="20" viewBox="-12 -12 24 24"><use href="#icon-seta"/></svg>
          </button>
        </div>

        <div class="tool-group">
          <span class="tool-label">Golpes</span>
          <button class="tool-btn" data-tipo="pelota" title="Pelota de pádel">
            <svg width="18" height="18" viewBox="-8 -8 16 16"><use href="#icon-pelota"/></svg>
          </button>
          <button class="tool-btn" data-tipo="flecha-recta" title="Flecha recta">
            <svg width="26" height="14" viewBox="-2 -8 46 16"><use href="#icon-flecha"/></svg>
          </button>
          <button class="tool-btn" data-tipo="trayectoria" title="Trayectoria con pelota">
            <svg width="26" height="14" viewBox="-2 -8 46 16"><use href="#icon-trayectoria"/></svg>
          </button>
        </div>

        <div class="tool-group" style="margin-left:auto;">
          <button class="btn-peligro" id="btn-limpiar">🗑️ Limpiar</button>
          <button class="btn-primary" id="btn-guardar">💾 Guardar Ejercicio</button>
        </div>
      </div>

      <!-- ============================ PISTA ============================ -->
      <div class="pista-wrapper">
        <div class="hint-trayectoria" id="hint-trayectoria">
          <strong>Modo trayectoria:</strong> clic para añadir puntos ·
          <strong>clic derecho</strong> para terminar · <strong>Esc</strong> para cancelar
        </div>

        <div class="pista-container">
          <!--
            ============================================================
            PISTA OFICIAL DE PÁDEL — PROPORCIONES REALES 20m × 10m
            ============================================================
            • Court 800 × 400 px = 20m × 10m  →  1m = 40px
            • Márgenes exteriores de 50px para ver los cristales
            • Línea de saque: 3m de la red (120px)
            • Zona de saque: 3m × 5m (120 × 200 px)
            • Red en x = 450 (centro exacto)
            ============================================================
          -->
          <svg id="pista-svg" viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">

            <!-- ============ DEFS ============ -->
            <defs>
              <marker id="flecha-end" markerWidth="8" markerHeight="8" refX="7" refY="4"
                      orient="auto" markerUnits="strokeWidth">
                <polygon points="0 0, 8 4, 0 8" fill="#e8ff3a"/>
              </marker>

              <!-- Patrón de malla de la red -->
              <pattern id="malla-red" width="6" height="6" patternUnits="userSpaceOnUse">
                <rect width="6" height="6" fill="transparent"/>
                <path d="M 0,0 L 6,6 M 6,0 L 0,6" stroke="#e8f0f8" stroke-width="0.4" opacity="0.35"/>
              </pattern>

              <!-- ==== ICONOS ==== -->

              <g id="icon-jugador-azul">
                <circle cx="0" cy="-10" r="4.5" fill="#f4c9a4" stroke="#8a6b52" stroke-width="0.8"/>
                <line x1="0" y1="-5.5" x2="0" y2="4" stroke="#2a6b9c" stroke-width="5" stroke-linecap="round"/>
                <line x1="0" y1="4"  x2="-4" y2="12" stroke="#1a3a5c" stroke-width="2.5" stroke-linecap="round"/>
                <line x1="0" y1="4"  x2="4"  y2="12" stroke="#1a3a5c" stroke-width="2.5" stroke-linecap="round"/>
                <line x1="0" y1="-3" x2="-6" y2="1"  stroke="#f4c9a4" stroke-width="2" stroke-linecap="round"/>
                <line x1="0" y1="-3" x2="6"  y2="-4" stroke="#f4c9a4" stroke-width="2" stroke-linecap="round"/>
                <ellipse cx="8" cy="-6" rx="3" ry="4.5" fill="none" stroke="#e8ff3a" stroke-width="1.3" transform="rotate(-25 8 -6)"/>
              </g>

              <g id="icon-jugador-rojo">
                <circle cx="0" cy="-10" r="4.5" fill="#f4c9a4" stroke="#8a6b52" stroke-width="0.8"/>
                <line x1="0" y1="-5.5" x2="0" y2="4" stroke="#c0392b" stroke-width="5" stroke-linecap="round"/>
                <line x1="0" y1="4"  x2="-4" y2="12" stroke="#7a1a1a" stroke-width="2.5" stroke-linecap="round"/>
                <line x1="0" y1="4"  x2="4"  y2="12" stroke="#7a1a1a" stroke-width="2.5" stroke-linecap="round"/>
                <line x1="0" y1="-3" x2="-6" y2="1"  stroke="#f4c9a4" stroke-width="2" stroke-linecap="round"/>
                <line x1="0" y1="-3" x2="6"  y2="-4" stroke="#f4c9a4" stroke-width="2" stroke-linecap="round"/>
                <ellipse cx="8" cy="-6" rx="3" ry="4.5" fill="none" stroke="#e8ff3a" stroke-width="1.3" transform="rotate(-25 8 -6)"/>
              </g>

              <g id="icon-carro">
                <line x1="-15" y1="-4" x2="-19" y2="6" stroke="#444" stroke-width="2" stroke-linecap="round"/>
                <path d="M -12,-6 L 12,-6 L 14,8 L -14,8 Z"
                      fill="#6b7a88" stroke="#3a4a58" stroke-width="1.2" stroke-linejoin="round"/>
                <line x1="-12" y1="-2" x2="12" y2="-2" stroke="#4a5a68" stroke-width="0.6"/>
                <circle cx="-7" cy="11" r="3" fill="#222" stroke="#555" stroke-width="0.6"/>
                <circle cx="7"  cy="11" r="3" fill="#222" stroke="#555" stroke-width="0.6"/>
                <circle cx="-7" cy="11" r="1" fill="#888"/>
                <circle cx="7"  cy="11" r="1" fill="#888"/>
                <circle cx="-6" cy="-8" r="3" fill="#e8ff3a" stroke="#8a9900" stroke-width="0.6"/>
                <circle cx="0"  cy="-10" r="3" fill="#e8ff3a" stroke="#8a9900" stroke-width="0.6"/>
                <circle cx="6"  cy="-8" r="3" fill="#e8ff3a" stroke="#8a9900" stroke-width="0.6"/>
                <circle cx="-3" cy="-12" r="3" fill="#e8ff3a" stroke="#8a9900" stroke-width="0.6"/>
                <circle cx="3"  cy="-12" r="3" fill="#e8ff3a" stroke="#8a9900" stroke-width="0.6"/>
              </g>

              <g id="icon-cono">
                <polygon points="0,-12 -8,8 8,8" fill="#e67e22" stroke="#b35c00" stroke-width="1.3"/>
                <line x1="-4" y1="-2" x2="4" y2="-2" stroke="white" stroke-width="1.2"/>
                <line x1="-6" y1="3"  x2="6" y2="3"  stroke="white" stroke-width="1.2"/>
                <ellipse cx="0" cy="8" rx="10" ry="3" fill="#b35c00"/>
              </g>

              <g id="icon-seta">
                <ellipse cx="0" cy="-4" rx="10" ry="6" fill="#e74c3c" stroke="#a93226" stroke-width="1.3"/>
                <circle cx="-4" cy="-6" r="1.3" fill="white"/>
                <circle cx="3"  cy="-2" r="1.3" fill="white"/>
                <circle cx="5"  cy="-7" r="1"   fill="white"/>
                <rect x="-3" y="-2" width="6" height="10" fill="#f5f5dc" stroke="#ccc" stroke-width="1"/>
              </g>

              <g id="icon-pelota">
                <circle r="5" fill="#e8ff3a" stroke="#8a9900" stroke-width="0.8"/>
                <path d="M -4,-3 Q -1,0 -4,3" fill="none" stroke="#8a9900" stroke-width="0.8"/>
                <path d="M 4,-3 Q 1,0 4,3"   fill="none" stroke="#8a9900" stroke-width="0.8"/>
              </g>

              <g id="icon-flecha">
                <line x1="0" y1="0" x2="40" y2="0" stroke="#e8ff3a" stroke-width="3"
                      marker-end="url(#flecha-end)" stroke-linecap="round"/>
              </g>

              <g id="icon-trayectoria">
                <path d="M 0,0 Q 20,-12 40,0" fill="none" stroke="#e8ff3a" stroke-width="2.5"
                      stroke-dasharray="5,3" marker-end="url(#flecha-end)"/>
                <circle cx="0" cy="0" r="4" fill="#e8ff3a" stroke="#8a9900" stroke-width="0.8"/>
              </g>
            </defs>

            <!-- ==================================================
                 EXTERIOR (contraste: entorno oscuro fuera de la pista)
                 ================================================== -->
            <rect x="0" y="0" width="900" height="500" fill="#0a1420"/>

            <!-- Marco exterior del recinto (cemento / suelo perimetral) -->
            <rect x="30" y="30" width="840" height="440" fill="#1c2a3a" rx="6"/>

            <!-- ==================================================
                 MUROS PERIMETRALES (cristales)
                 ================================================== -->
            <!-- Muro trasero izquierdo (fondo) -->
            <rect x="40" y="40" width="10" height="420" fill="#a8d5e0" opacity="0.35"/>
            <rect x="40" y="40" width="10" height="420" fill="none" stroke="#5bb8d4" stroke-width="1"/>

            <!-- Muro trasero derecho (fondo) -->
            <rect x="850" y="40" width="10" height="420" fill="#a8d5e0" opacity="0.35"/>
            <rect x="850" y="40" width="10" height="420" fill="none" stroke="#5bb8d4" stroke-width="1"/>

            <!-- Muro lateral superior (fondo) -->
            <rect x="40" y="40" width="820" height="10" fill="#a8d5e0" opacity="0.35"/>
            <rect x="40" y="40" width="820" height="10" fill="none" stroke="#5bb8d4" stroke-width="1"/>

            <!-- Muro lateral inferior (fondo) -->
            <rect x="40" y="450" width="820" height="10" fill="#a8d5e0" opacity="0.35"/>
            <rect x="40" y="450" width="820" height="10" fill="none" stroke="#5bb8d4" stroke-width="1"/>

            <!-- ==================================================
                 SUPERFICIE DE JUEGO — 20m × 10m (800×400 px)
                 Esquinas en (50,50) → (850,450)
                 ================================================== -->
            <rect x="50" y="50" width="800" height="400" fill="#3a8fbf"/>

            <!-- Zonas de saque (más claras): 3m × 5m desde la red
                 Izquierda:  x=[330, 450]  y=[50, 250] y [250, 450]
                 Derecha:    x=[450, 570]  y=[50, 250] y [250, 450] -->
            <rect x="330" y="50"  width="120" height="200" fill="#5bb8d4" opacity="0.55"/>
            <rect x="330" y="250" width="120" height="200" fill="#5bb8d4" opacity="0.55"/>
            <rect x="450" y="50"  width="120" height="200" fill="#5bb8d4" opacity="0.55"/>
            <rect x="450" y="250" width="120" height="200" fill="#5bb8d4" opacity="0.55"/>

            <!-- ==================================================
                 LÍNEAS DE LA PISTA
                 ================================================== -->
            <!-- Perímetro -->
            <rect x="50" y="50" width="800" height="400" fill="none" stroke="white" stroke-width="2.5"/>

            <!-- Línea de saque izquierda (a 3m de la red) -->
            <line x1="330" y1="50" x2="330" y2="450" stroke="white" stroke-width="2.5"/>

            <!-- Línea de saque derecha (a 3m de la red) -->
            <line x1="570" y1="50" x2="570" y2="450" stroke="white" stroke-width="2.5"/>

            <!-- Línea central izquierda (desde la línea de saque hasta la red) -->
            <line x1="330" y1="250" x2="450" y2="250" stroke="white" stroke-width="2.5"/>

            <!-- Línea central derecha (desde la red hasta la línea de saque) -->
            <line x1="450" y1="250" x2="570" y2="250" stroke="white" stroke-width="2.5"/>

            <!-- ==================================================
                 RED (en x=450, centro exacto del campo)
                 ================================================== -->
            <!-- Banda de la red -->
            <rect x="444" y="50" width="12" height="400" fill="#1a3a5c" opacity="0.9"/>
            <!-- Malla -->
            <rect x="444" y="50" width="12" height="400" fill="url(#malla-red)"/>
            <!-- Borde superior e inferior de la red -->
            <line x1="444" y1="50"  x2="456" y2="50"  stroke="#e8ff3a" stroke-width="2"/>
            <line x1="444" y1="450" x2="456" y2="450" stroke="#e8ff3a" stroke-width="2"/>
            <!-- Postes de la red -->
            <circle cx="450" cy="50"  r="5" fill="#1a3a5c" stroke="#e8ff3a" stroke-width="1.5"/>
            <circle cx="450" cy="450" r="5" fill="#1a3a5c" stroke="#e8ff3a" stroke-width="1.5"/>

            <!-- ==================================================
                 ETIQUETAS DE MEDIDAS (opcional, ayuda visual)
                 ================================================== -->
            <text x="450" y="478" text-anchor="middle" fill="#5bb8d4" font-size="11" font-family="monospace">20 m</text>
            <text x="870" y="255" text-anchor="middle" fill="#5bb8d4" font-size="11" font-family="monospace"
                  transform="rotate(90 870 255)">10 m</text>

            <!-- ==================================================
                 CAPA DE ELEMENTOS INTERACTIVOS
                 ================================================== -->
            <g id="capa-elementos"></g>
          </svg>
        </div>
      </div>

      <!-- ============================ NOTAS ============================ -->
      <div class="notas-container">
        <label for="notas-ejercicio">📝 Notas del ejercicio</label>
        <textarea id="notas-ejercicio" rows="4"
                  placeholder="Describe objetivos, correcciones técnicas, variantes, progresiones, material necesario..."></textarea>
      </div>

      <!-- ============================ PROPIEDADES ============================ -->
      <div class="panel-propiedades" id="panel-propiedades" style="display:none;">
        <h3>Propiedades</h3>
        <label id="rot-label">Rotación
          <input type="range" id="prop-rotacion" min="0" max="360" value="0">
          <span id="rot-valor" class="rot-valor">0°</span>
        </label>
        <button class="btn-peligro" id="btn-eliminar-elemento">Eliminar elemento</button>
      </div>
    </main>
  </div>

  <script type="module">
    import { supabase, TABLES } from '../js/supabase-client.js'
    import { renderNav } from '../js/nav.js'
    import { inicializarPista, obtenerDatosPista } from '../js/ejercicios.js'

    renderNav('ejercicios')
    inicializarPista('pista-svg')

    document.getElementById('btn-guardar').addEventListener('click', async () => {
      const titulo = prompt('Título del ejercicio:')
      if (!titulo) return
      const descripcion = prompt('Descripción breve (opcional):') || null
      const notas = document.getElementById('notas-ejercicio').value || null
      const datos = obtenerDatosPista()

      const params = new URLSearchParams(window.location.search)
      const claseId = params.get('clase_id') || null

      const { error } = await supabase.from(TABLES.ejercicios).insert({
        titulo,
        descripcion,
        notas,
        canvas_data: { elementos: datos },
        clase_id: claseId
      })

      if (error) alert('Error: ' + error.message)
      else alert('✅ Ejercicio guardado')
    })
  </script>
</body>
</html>
