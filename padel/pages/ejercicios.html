<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Diseñador de Ejercicios — Padel Manager</title>
  <link rel="stylesheet" href="../css/theme.css">
  <link rel="stylesheet" href="../css/ejercicios.css">
</head>
<body>
  <div class="layout">
    <nav class="sidebar"></nav>
    <main class="content">
      <h1>🎾 Diseñador de Ejercicios</h1>

      <!-- ============================ TOOLBAR ============================ -->
      <div class="toolbar">
        <div class="tool-group">
          <span class="tool-label">Jugadores</span>
          <button class="tool-btn" data-tipo="jugador-azul" title="Jugador equipo azul">
            <svg width="22" height="22" viewBox="-14 -14 28 28"><use href="#icon-jugador-azul"/></svg>
          </button>
          <button class="tool-btn" data-tipo="jugador-rojo" title="Jugador equipo rojo">
            <svg width="22" height="22" viewBox="-14 -14 28 28"><use href="#icon-jugador-rojo"/></svg>
          </button>
        </div>

        <div class="tool-group">
          <span class="tool-label">Material</span>
          <button class="tool-btn" data-tipo="carro-bolas" title="Carro de bolas">
            <svg width="30" height="24" viewBox="-16 -12 32 24"><use href="#icon-carro"/></svg>
          </button>
          <button class="tool-btn" data-tipo="cono" title="Cono">
            <svg width="16" height="16" viewBox="-10 -10 20 20"><use href="#icon-cono"/></svg>
          </button>
          <button class="tool-btn" data-tipo="seta" title="Seta">
            <svg width="16" height="16" viewBox="-10 -10 20 20"><use href="#icon-seta"/></svg>
          </button>
        </div>

        <div class="tool-group">
          <span class="tool-label">Golpes</span>
          <button class="tool-btn" data-tipo="pelota" title="Pelota de pádel">
            <svg width="16" height="16" viewBox="-8 -8 16 16"><use href="#icon-pelota"/></svg>
          </button>
          <button class="tool-btn" data-tipo="flecha-recta" title="Flecha recta">
            <svg width="26" height="14" viewBox="-2 -8 46 16"><use href="#icon-flecha"/></svg>
          </button>
          <button class="tool-btn" data-tipo="trayectoria" title="Trayectoria con pelota">
            <svg width="26" height="14" viewBox="-2 -8 46 16"><use href="#icon-trayectoria"/></svg>
          </button>
        </div>

        <div class="tool-group" style="margin-left:auto;">
          <button class="btn-peligro" id="btn-limpiar">🗑️ Limpiar</button>
          <button class="btn-primary" id="btn-guardar">💾 Guardar</button>
        </div>
      </div>

      <!-- ============================ PISTA ============================ -->
      <div class="pista-wrapper">
        <div class="hint-trayectoria" id="hint-trayectoria">
          <strong>Modo trayectoria:</strong> clic para añadir puntos ·
          <strong>clic derecho</strong> para terminar · <strong>Esc</strong> para cancelar
        </div>

        <div class="pista-container">
          <svg id="pista-svg" viewBox="0 0 940 540" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">

            <defs>
              <marker id="flecha-end" markerWidth="8" markerHeight="8" refX="7" refY="4"
                      orient="auto" markerUnits="strokeWidth">
                <polygon points="0 0, 8 4, 0 8" fill="#e8ff3a"/>
              </marker>

              <pattern id="malla-red" width="6" height="6" patternUnits="userSpaceOnUse">
                <rect width="6" height="6" fill="transparent"/>
                <path d="M 0,0 L 6,6 M 6,0 L 0,6" stroke="#e8f0f8" stroke-width="0.4" opacity="0.35"/>
              </pattern>

              <!-- ============================================
                   JUGADOR AZUL — Vista cenital realista
                   ============================================ -->
              <g id="icon-jugador-azul">
                <ellipse cx="1" cy="2" rx="10" ry="7" fill="rgba(0,0,0,0.28)"/>
                <ellipse cx="0" cy="0" rx="8" ry="5.5" fill="#2a6b9c" stroke="#1a3a5c" stroke-width="0.9"/>
                <circle cx="0" cy="-0.5" r="4.2" fill="#f4c9a4" stroke="#8a6b52" stroke-width="0.5"/>
                <path d="M -4.2,-0.5 A 4.2,4.2 0 0 1 4.2,-0.5 L 3,-1.8 A 3,3 0 0 0 -3,-1.8 Z"
                      fill="#4a2e1e"/>
                <line x1="6" y1="-2" x2="11" y2="-4" stroke="#f4c9a4" stroke-width="1.8" stroke-linecap="round"/>
                <ellipse cx="13" cy="-5.5" rx="3.2" ry="4.5" fill="#e8ff3a" stroke="#8a9900"
                         stroke-width="0.9" transform="rotate(-35 13 -5.5)"/>
                <circle cx="12.5" cy="-6.5" r="0.4" fill="#8a9900"/>
                <circle cx="13.5" cy="-5.5" r="0.4" fill="#8a9900"/>
                <circle cx="12.5" cy="-4.5" r="0.4" fill="#8a9900"/>
                <line x1="-6" y1="-1" x2="-10" y2="1" stroke="#f4c9a4" stroke-width="1.8" stroke-linecap="round"/>
              </g>

              <!-- ============================================
                   JUGADOR ROJO
                   ============================================ -->
              <g id="icon-jugador-rojo">
                <ellipse cx="1" cy="2" rx="10" ry="7" fill="rgba(0,0,0,0.28)"/>
                <ellipse cx="0" cy="0" rx="8" ry="5.5" fill="#c0392b" stroke="#7a1a1a" stroke-width="0.9"/>
                <circle cx="0" cy="-0.5" r="4.2" fill="#f4c9a4" stroke="#8a6b52" stroke-width="0.5"/>
                <path d="M -4.2,-0.5 A 4.2,4.2 0 0 1 4.2,-0.5 L 3,-1.8 A 3,3 0 0 0 -3,-1.8 Z"
                      fill="#4a2e1e"/>
                <line x1="6" y1="-2" x2="11" y2="-4" stroke="#f4c9a4" stroke-width="1.8" stroke-linecap="round"/>
                <ellipse cx="13" cy="-5.5" rx="3.2" ry="4.5" fill="#e8ff3a" stroke="#8a9900"
                         stroke-width="0.9" transform="rotate(-35 13 -5.5)"/>
                <circle cx="12.5" cy="-6.5" r="0.4" fill="#8a9900"/>
                <circle cx="13.5" cy="-5.5" r="0.4" fill="#8a9900"/>
                <circle cx="12.5" cy="-4.5" r="0.4" fill="#8a9900"/>
                <line x1="-6" y1="-1" x2="-10" y2="1" stroke="#f4c9a4" stroke-width="1.8" stroke-linecap="round"/>
              </g>

              <!-- ============================================
                   CARRO DE BOLAS — Vista cenital
                   ============================================ -->
              <g id="icon-carro">
                <ellipse cx="0" cy="3" rx="14" ry="11" fill="rgba(0,0,0,0.3)"/>
                <rect x="-17" y="-2" width="6" height="4" rx="1" fill="#333" stroke="#111" stroke-width="0.5"/>
                <rect x="-12" y="-9" width="24" height="18" rx="2" fill="#6b7a88"
                      stroke="#3a4a58" stroke-width="1.3"/>
                <line x1="-12" y1="-3" x2="12" y2="-3" stroke="#4a5a68" stroke-width="0.5" opacity="0.6"/>
                <line x1="-12" y1="3"  x2="12" y2="3"  stroke="#4a5a68" stroke-width="0.5" opacity="0.6"/>
                <line x1="-4" y1="-9" x2="-4" y2="9" stroke="#4a5a68" stroke-width="0.5" opacity="0.6"/>
                <line x1="4"  y1="-9" x2="4"  y2="9" stroke="#4a5a68" stroke-width="0.5" opacity="0.6"/>
                <circle cx="-7" cy="-5" r="3.2" fill="#e8ff3a" stroke="#8a9900" stroke-width="0.7"/>
                <circle cx="0"  cy="-5" r="3.2" fill="#e8ff3a" stroke="#8a9900" stroke-width="0.7"/>
                <circle cx="7"  cy="-5" r="3.2" fill="#e8ff3a" stroke="#8a9900" stroke-width="0.7"/>
                <circle cx="-3.5" cy="1" r="3.2" fill="#e8ff3a" stroke="#8a9900" stroke-width="0.7"/>
                <circle cx="3.5"  cy="1" r="3.2" fill="#e8ff3a" stroke="#8a9900" stroke-width="0.7"/>
                <circle cx="-7" cy="5" r="2.5" fill="#e8ff3a" stroke="#8a9900" stroke-width="0.6"/>
                <circle cx="0"  cy="5" r="2.5" fill="#e8ff3a" stroke="#8a9900" stroke-width="0.6"/>
                <circle cx="7"  cy="5" r="2.5" fill="#e8ff3a" stroke="#8a9900" stroke-width="0.6"/>
                <ellipse cx="-9" cy="10" rx="3" ry="1.8" fill="#222" stroke="#555" stroke-width="0.5"/>
                <ellipse cx="9"  cy="10" rx="3" ry="1.8" fill="#222" stroke="#555" stroke-width="0.5"/>
              </g>

              <!-- ============================================
                   CONO
                   ============================================ -->
              <g id="icon-cono">
                <ellipse cx="0.5" cy="1.5" rx="7" ry="5" fill="rgba(0,0,0,0.3)"/>
                <circle r="6" fill="#e67e22" stroke="#b35c00" stroke-width="1.2"/>
                <circle r="3.5" fill="#f39c12" stroke="none"/>
                <circle r="3.5" fill="none" stroke="#b35c00" stroke-width="0.6"/>
                <circle r="1.2" fill="#b35c00"/>
              </g>

              <!-- ============================================
                   SETA
                   ============================================ -->
              <g id="icon-seta">
                <ellipse cx="0.5" cy="1.5" rx="6" ry="4" fill="rgba(0,0,0,0.3)"/>
                <circle r="5" fill="#e74c3c" stroke="#a93226" stroke-width="1.2"/>
                <circle cx="-2" cy="-1.5" r="1.2" fill="white"/>
                <circle cx="2"  cy="0.5"  r="1.2" fill="white"/>
                <circle cx="0"  cy="2.5"  r="0.8" fill="white"/>
                <circle r="1.5" fill="#c0392b" stroke="#a93226" stroke-width="0.5"/>
              </g>

              <!-- ============================================
                   PELOTA
                   ============================================ -->
              <g id="icon-pelota">
                <ellipse cx="0.5" cy="1.5" rx="4" ry="3" fill="rgba(0,0,0,0.35)"/>
                <circle r="3.5" fill="#e8ff3a" stroke="#8a9900" stroke-width="0.7"/>
                <path d="M -3,-1.5 Q -1.2,0 -3,1.5" fill="none" stroke="#8a9900" stroke-width="0.6"/>
                <path d="M 3,-1.5 Q 1.2,0 3,1.5"   fill="none" stroke="#8a9900" stroke-width="0.6"/>
              </g>

              <!-- ============================================
                   FLECHA
                   ============================================ -->
              <g id="icon-flecha">
                <line x1="0" y1="0" x2="40" y2="0" stroke="#e8ff3a" stroke-width="3"
                      marker-end="url(#flecha-end)" stroke-linecap="round"/>
              </g>

              <!-- ============================================
                   TRAYECTORIA CON PELOTA
                   ============================================ -->
              <g id="icon-trayectoria">
                <path d="M 0,0 Q 20,-12 40,0" fill="none" stroke="#e8ff3a" stroke-width="2.5"
                      stroke-dasharray="5,3" marker-end="url(#flecha-end)"/>
                <circle cx="0" cy="0" r="3.5" fill="#e8ff3a" stroke="#8a9900" stroke-width="0.7"/>
                <path d="M -2.5,-1 Q -1,0 -2.5,1" fill="none" stroke="#8a9900" stroke-width="0.5"/>
                <path d="M 2.5,-1 Q 1,0 2.5,1"   fill="none" stroke="#8a9900" stroke-width="0.5"/>
              </g>
            </defs>

            <!-- ================================================
                 EXTERIOR
                 ================================================ -->
            <rect x="0" y="0" width="940" height="540" fill="#0a1420"/>
            <rect x="50" y="50" width="840" height="440" fill="#1c2a3a" rx="6"/>

            <!-- ================================================
                 CRISTALES PERIMETRALES
                 ================================================ -->
            <rect x="60" y="60" width="820" height="10" fill="#a8d5e0" opacity="0.35"/>
            <rect x="60" y="60" width="820" height="10" fill="none" stroke="#5bb8d4" stroke-width="1"/>
            <rect x="60" y="470" width="820" height="10" fill="#a8d5e0" opacity="0.35"/>
            <rect x="60" y="470" width="820" height="10" fill="none" stroke="#5bb8d4" stroke-width="1"/>
            <rect x="60" y="60" width="10" height="420" fill="#a8d5e0" opacity="0.35"/>
            <rect x="60" y="60" width="10" height="420" fill="none" stroke="#5bb8d4" stroke-width="1"/>
            <rect x="870" y="60" width="10" height="420" fill="#a8d5e0" opacity="0.35"/>
            <rect x="870" y="60" width="10" height="420" fill="none" stroke="#5bb8d4" stroke-width="1"/>

            <!-- ================================================
                 PISTA 20m × 10m
                 ================================================ -->
            <rect x="70" y="70" width="800" height="400" fill="#3a8fbf"/>

            <!-- Zonas de saque -->
            <rect x="350" y="70"  width="120" height="200" fill="#5bb8d4" opacity="0.55"/>
            <rect x="350" y="270" width="120" height="200" fill="#5bb8d4" opacity="0.55"/>
            <rect x="470" y="70"  width="120" height="200" fill="#5bb8d4" opacity="0.55"/>
            <rect x="470" y="270" width="120" height="200" fill="#5bb8d4" opacity="0.55"/>

            <!-- Líneas -->
            <rect x="70" y="70" width="800" height="400" fill="none" stroke="white" stroke-width="2.5"/>
            <line x1="350" y1="70" x2="350" y2="470" stroke="white" stroke-width="2.5"/>
            <line x1="590" y1="70" x2="590" y2="470" stroke="white" stroke-width="2.5"/>
            <line x1="350" y1="270" x2="590" y2="270" stroke="white" stroke-width="2.5"/>

            <!-- Red -->
            <rect x="464" y="70" width="12" height="400" fill="#1a3a5c" opacity="0.9"/>
            <rect x="464" y="70" width="12" height="400" fill="url(#malla-red)"/>
            <line x1="464" y1="70"  x2="476" y2="70"  stroke="#e8ff3a" stroke-width="2"/>
            <line x1="464" y1="470" x2="476" y2="470" stroke="#e8ff3a" stroke-width="2"/>
            <circle cx="470" cy="70"  r="5" fill="#1a3a5c" stroke="#e8ff3a" stroke-width="1.5"/>
            <circle cx="470" cy="470" r="5" fill="#1a3a5c" stroke="#e8ff3a" stroke-width="1.5"/>

            <!-- Etiquetas de medidas -->
            <text x="470" y="515" text-anchor="middle" fill="#5bb8d4" font-size="12" font-family="monospace">20 m</text>
            <text x="908" y="275" text-anchor="middle" fill="#5bb8d4" font-size="12" font-family="monospace"
                  transform="rotate(90 908 275)">10 m</text>
            <text x="210" y="62" text-anchor="middle" fill="#8a9ba8" font-size="10" font-family="monospace">7 m</text>
            <text x="410" y="62" text-anchor="middle" fill="#e8ff3a" font-size="11" font-family="monospace" font-weight="bold">3 m</text>
            <text x="530" y="62" text-anchor="middle" fill="#e8ff3a" font-size="11" font-family="monospace" font-weight="bold">3 m</text>
            <text x="730" y="62" text-anchor="middle" fill="#8a9ba8" font-size="10" font-family="monospace">7 m</text>
            <text x="46" y="170" text-anchor="middle" fill="#8a9ba8" font-size="10" font-family="monospace"
                  transform="rotate(-90 46 170)">5 m</text>
            <text x="46" y="370" text-anchor="middle" fill="#8a9ba8" font-size="10" font-family="monospace"
                  transform="rotate(-90 46 370)">5 m</text>

            <!-- Capa de elementos interactivos -->
            <g id="capa-elementos"></g>
          </svg>
        </div>
      </div>

      <!-- ============================ NOTAS ============================ -->
      <div class="notas-container">
        <label for="notas-ejercicio">📝 Notas del ejercicio</label>
        <textarea id="notas-ejercicio" rows="4"
                  placeholder="Describe objetivos, correcciones técnicas, variantes, progresiones, material necesario..."></textarea>
      </div>

      <!-- ============================ PROPIEDADES ============================ -->
      <div class="panel-propiedades" id="panel-propiedades" style="display:none;">
        <h3>Propiedades</h3>
        <label id="rot-label">Rotación
          <input type="range" id="prop-rotacion" min="0" max="360" value="0">
          <span id="rot-valor" class="rot-valor">0°</span>
        </label>
        <button class="btn-peligro" id="btn-eliminar-elemento">Eliminar elemento</button>
      </div>
    </main>
  </div>

  <script type="module">
    import { supabase, TABLES } from '../js/supabase-client.js'
    import { renderNav } from '../js/nav.js'
    import { inicializarPista, obtenerDatosPista } from '../js/ejercicios.js'

    renderNav('ejercicios')
    inicializarPista('pista-svg')

    document.getElementById('btn-guardar').addEventListener('click', async () => {
      const titulo = prompt('Título del ejercicio:')
      if (!titulo) return
      const descripcion = prompt('Descripción breve (opcional):') || null
      const notas = document.getElementById('notas-ejercicio').value || null
      const datos = obtenerDatosPista()

      const params = new URLSearchParams(window.location.search)
      const claseId = params.get('clase_id') || null

      const { error } = await supabase.from(TABLES.ejercicios).insert({
        titulo,
        descripcion,
        notas,
        canvas_data: { elementos: datos },
        clase_id: claseId
      })

      if (error) alert('Error: ' + error.message)
      else alert('✅ Ejercicio guardado')
    })
  </script>
</body>
</html>
