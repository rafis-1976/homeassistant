<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi Garaje — Control de mantenimiento</title>
<style>
:root{
  --bg:#f4f6fa; --card:#ffffff; --text:#131a2b; --muted:#68738a;
  --border:#e2e7f0; --accent:#2563eb; --accent-dark:#1d4ed8;
  --ok:#16a34a; --ok-bg:#e8f7ee;
  --warn:#b45309; --warn-bg:#fef3c7;
  --danger:#dc2626; --danger-bg:#fee2e2;
  --radius:14px;
  --shadow:0 1px 2px rgba(16,24,40,.05), 0 12px 28px -16px rgba(16,24,40,.25);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0e1420; --card:#161e2e; --text:#e8edf7; --muted:#93a0b8;
    --border:#26314a; --accent:#3b82f6; --accent-dark:#2563eb;
    --ok:#4ade80; --ok-bg:#14301f;
    --warn:#fbbf24; --warn-bg:#3a2c0a;
    --danger:#f87171; --danger-bg:#3b1414;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 28px -16px rgba(0,0,0,.7);
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:var(--bg); color:var(--text); line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{margin:0;line-height:1.25}
button{font:inherit;cursor:pointer}
input,select,textarea{
  font:inherit;padding:10px 12px;border:1px solid var(--border);border-radius:10px;
  background:var(--card);color:var(--text);width:100%;
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
label{display:flex;flex-direction:column;gap:6px;font-size:.78rem;font-weight:700;color:var(--muted);letter-spacing:.02em;text-transform:uppercase}

/* ---------- Layout ---------- */
header{
  position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--border);
}
.header-in{
  max-width:1180px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;
}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.15rem;letter-spacing:-.02em}
.logo .mark{
  width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:1.1rem;
  background:linear-gradient(135deg,var(--accent),#7c3aed);color:#fff;
}
.header-actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}

main{max-width:1180px;margin:0 auto;padding:22px 20px 60px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.section{margin-bottom:20px}
.section-head{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.section-head h2{font-size:1.05rem}
.section-head .spacer{margin-left:auto}

/* ---------- Botones ---------- */
.btn{
  border:1px solid transparent;border-radius:10px;padding:9px 14px;font-weight:600;font-size:.88rem;
  display:inline-flex;align-items:center;gap:7px;transition:.15s;white-space:nowrap;
  background:var(--card);color:var(--text);border-color:var(--border);
}
.btn:hover{transform:translateY(-1px)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.primary:hover{background:var(--accent-dark)}
.btn.ghost{background:transparent;border-color:var(--border);color:var(--muted)}
.btn.ghost:hover{color:var(--text);border-color:var(--muted)}
.btn.danger{background:transparent;border-color:var(--border);color:var(--danger)}
.btn.danger:hover{background:var(--danger-bg);border-color:var(--danger)}
.btn.sm{padding:6px 10px;font-size:.8rem}
.icon-btn{
  border:none;background:transparent;color:var(--muted);border-radius:8px;width:30px;height:30px;
  display:grid;place-items:center;font-size:.95rem;
}
.icon-btn:hover{background:var(--bg);color:var(--text)}

/* ---------- Pestañas de vehículos ---------- */
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:18px}
.tab{
  border:1px solid var(--border);background:var(--card);border-radius:12px;padding:10px 16px;
  display:flex;flex-direction:column;gap:2px;min-width:150px;text-align:left;transition:.15s;
}
.tab:hover{border-color:var(--accent)}
.tab.active{border-color:var(--accent);background:var(--accent);color:#fff}
.tab.active .tab-sub{color:rgba(255,255,255,.8)}
.tab-name{font-weight:700;font-size:.92rem}
.tab-sub{font-size:.74rem;color:var(--muted);font-weight:600}

/* ---------- Cabecera del vehículo ---------- */
.vehicle-head{padding:20px;display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap}
.plate{
  background:#fff;color:#111;border:2px solid #111;border-radius:8px;padding:6px 12px 6px 8px;
  font-weight:800;letter-spacing:.06em;font-size:1rem;display:inline-flex;align-items:center;gap:8px;
  font-family:ui-monospace,"SFMono-Regular",Menlo,monospace;
}
.plate::before{content:"";display:block;width:8px;height:22px;border-radius:2px;background:#003399}
@media (prefers-color-scheme: dark){ .plate{border-color:#cbd5e1} }
.vehicle-title{flex:1;min-width:220px}
.vehicle-title h2{font-size:1.35rem;letter-spacing:-.02em}
.vehicle-meta{color:var(--muted);font-size:.86rem;margin-top:4px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.dot{width:4px;height:4px;border-radius:50%;background:var(--muted);display:inline-block}
.km-box{text-align:right}
.km-box .big{font-size:1.5rem;font-weight:800;letter-spacing:-.02em}
.km-box .lbl{font-size:.74rem;color:var(--muted);text-transform:uppercase;font-weight:700;letter-spacing:.04em}

/* ---------- Grid documentos ---------- */
.docs{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.doc{border:1px solid var(--border);border-radius:12px;padding:14px;background:var(--card);position:relative;overflow:hidden}
.doc .name{font-size:.74rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.doc .date{font-size:1.15rem;font-weight:700;margin-top:6px}
.doc .sub{font-size:.78rem;margin-top:6px;font-weight:600}
.doc.ok .sub{color:var(--ok)}
.doc.warn{border-color:var(--warn)}
.doc.warn .sub{color:var(--warn)}
.doc.danger{border-color:var(--danger)}
.doc.danger .sub{color:var(--danger)}
.doc .bar{position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--border)}
.doc.ok .bar{background:var(--ok)}
.doc.warn .bar{background:var(--warn)}
.doc.danger .bar{background:var(--danger)}

/* ---------- Alertas ---------- */
.alert{
  display:flex;gap:10px;align-items:center;padding:11px 14px;border-radius:11px;font-size:.87rem;
  font-weight:600;margin-bottom:8px;border:1px solid transparent;
}
.alert.warn{background:var(--warn-bg);color:var(--warn);border-color:color-mix(in srgb,var(--warn) 30%,transparent)}
.alert.danger{background:var(--danger-bg);color:var(--danger);border-color:color-mix(in srgb,var(--danger) 30%,transparent)}
.alert.info{background:var(--ok-bg);color:var(--ok);border-color:color-mix(in srgb,var(--ok) 30%,transparent)}

/* ---------- Stats ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{border:1px solid var(--border);border-radius:12px;padding:14px;background:var(--card)}
.stat .k{font-size:.74rem;text-transform:uppercase;font-weight:800;letter-spacing:.05em;color:var(--muted)}
.stat .v{font-size:1.35rem;font-weight:800;letter-spacing:-.02em;margin-top:4px}

/* ---------- Tabla mantenimientos ---------- */
.table-wrap{overflow-x:auto;border-radius:var(--radius)}
table{width:100%;border-collapse:collapse;font-size:.88rem;min-width:720px}
thead th{
  text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);
  padding:12px 14px;border-bottom:1px solid var(--border);font-weight:800;background:var(--bg);
}
tbody td{padding:12px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--bg)}
.tag{
  display:inline-block;padding:3px 9px;border-radius:999px;font-size:.74rem;font-weight:700;
  background:var(--bg);border:1px solid var(--border);color:var(--text);
}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:.72rem;font-weight:800}
.badge.ok{background:var(--ok-bg);color:var(--ok)}
.badge.warn{background:var(--warn-bg);color:var(--warn)}
.badge.danger{background:var(--danger-bg);color:var(--danger)}
.muted{color:var(--muted)}
.row-actions{display:flex;gap:4px;justify-content:flex-end}

/* ---------- Vacío ---------- */
.empty{text-align:center;padding:70px 24px}
.empty .emoji{font-size:3.2rem}
.empty h2{margin:14px 0 8px}
.empty p{color:var(--muted);max-width:440px;margin:0 auto 22px}

/* ---------- Modal ---------- */
.overlay{
  position:fixed;inset:0;background:rgba(10,15,25,.55);backdrop-filter:blur(3px);
  display:flex;align-items:flex-start;justify-content:center;padding:24px 16px;z-index:100;
  overflow-y:auto;animation:fade .15s ease;
}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{
  background:var(--card);border-radius:16px;width:100%;max-width:660px;box-shadow:0 24px 60px -12px rgba(0,0,0,.5);
  animation:pop .18s ease;margin:auto;
}
@keyframes pop{from{transform:translateY(10px) scale(.98);opacity:0}to{transform:none;opacity:1}}
.modal-head{display:flex;align-items:center;gap:12px;padding:18px 20px;border-bottom:1px solid var(--border)}
.modal-head h3{font-size:1.05rem;flex:1}
.modal-body{padding:20px;display:flex;flex-direction:column;gap:16px}
.modal-body h4{font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-top:4px}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:16px 20px;border-top:1px solid var(--border)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:560px){ .grid2,.grid3{grid-template-columns:1fr} }
.hint{font-size:.76rem;color:var(--muted);font-weight:500;text-transform:none;letter-spacing:0}

footer{text-align:center;color:var(--muted);font-size:.78rem;padding:0 20px 40px}
</style>
</head>
<body>

<header>
  <div class="header-in">
    <div class="logo"><span class="mark">🚗</span> Mi Garaje</div>
    <div class="header-actions">
      <button class="btn ghost sm" id="btn-export">⬇ Exportar</button>
      <button class="btn ghost sm" id="btn-import">⬆ Importar</button>
      <input type="file" id="file-import" accept="application/json" hidden>
      <button class="btn primary" id="btn-add-vehicle">＋ Añadir vehículo</button>
    </div>
  </div>
</header>

<main>
  <div class="tabs" id="tabs"></div>
  <div id="content"></div>
</main>

<footer>Los datos se guardan solo en este navegador. Haz copias de seguridad con «Exportar».</footer>

<div id="modal"></div>

<script>
/* =========================================================
   Estado y persistencia
   ========================================================= */
const KEY = 'migaraje.v1';
let db = loadDB();

function loadDB(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){
      const d = JSON.parse(raw);
      if(d && Array.isArray(d.vehicles)) return d;
    }
  }catch(e){ console.warn(e); }
  return { vehicles: [], selected: null };
}
function saveDB(){
  try{ localStorage.setItem(KEY, JSON.stringify(db)); }
  catch(e){ alert('No se han podido guardar los datos: ' + e.message); }
}
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

/* =========================================================
   Utilidades
   ========================================================= */
const eur = new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR',maximumFractionDigits:2});
const num = new Intl.NumberFormat('es-ES');

function money(n){ return eur.format(Number(n)||0); }
function kmFmt(n){ return num.format(Number(n)||0) + ' km'; }

function esc(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtDate(iso){
  if(!iso) return '—';
  const [y,m,d] = iso.split('-');
  if(!y||!m||!d) return '—';
  return `${d}/${m}/${y}`;
}
function todayISO(){
  const d = new Date();
  return new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().slice(0,10);
}
function daysUntil(iso){
  if(!iso) return null;
  const today = new Date(); today.setHours(0,0,0,0);
  const t = new Date(iso + 'T00:00:00');
  if(isNaN(t)) return null;
  return Math.round((t - today) / 86400000);
}
function pluralDias(n){ return n === 1 ? '1 día' : n + ' días'; }

/* =========================================================
   Catálogos
   ========================================================= */
const COMBUSTIBLES = ['Gasolina','Diésel','Híbrido','Híbrido enchufable','Eléctrico','GLP','GNC','Otro'];
const TIPOS_MANT = [
  'Cambio de aceite y filtros','Filtro de aire','Filtro de combustible','Filtro de habitáculo',
  'Frenos (pastillas/discos)','Neumáticos','Batería','Correa de distribución','Bujías',
  'Líquido de frenos','Refrigerante','Aire acondicionado','Revisión oficial',
  'ITV','Escobillas limpiaparabrisas','Suspensión','Embrague','Diagnosis / electrónica','Otros'
];

/* =========================================================
   Render principal
   ========================================================= */
function render(){
  renderTabs();
  renderContent();
}

function renderTabs(){
  const el = document.getElementById('tabs');
  if(!db.vehicles.length){ el.innerHTML = ''; return; }
  el.innerHTML = db.vehicles.map(v => `
    <button class="tab ${v.id === db.selected ? 'active' : ''}" data-id="${v.id}">
      <span class="tab-name">${esc(v.nombre || (v.marca + ' ' + v.modelo))}</span>
      <span class="tab-sub">${esc(v.matricula || '—')}</span>
    </button>
  `).join('');
  el.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => {
    db.selected = b.dataset.id; saveDB(); render();
  }));
}

function renderContent(){
  const el = document.getElementById('content');

  if(!db.vehicles.length){
    el.innerHTML = `
      <div class="card empty">
        <div class="emoji">🚙</div>
        <h2>Aún no tienes ningún vehículo</h2>
        <p>Añade tu primer coche para empezar a controlar las revisiones, la ITV, el seguro y todos los gastos de mantenimiento.</p>
        <button class="btn primary" id="empty-add">＋ Añadir mi primer vehículo</button>
      </div>`;
    document.getElementById('empty-add').addEventListener('click', () => openVehicleForm());
    return;
  }

  let v = db.vehicles.find(x => x.id === db.selected) || db.vehicles[0];
  db.selected = v.id;

  const alerts = getAlerts(v);
  const mants = [...v.mantenimientos].sort((a,b) => (b.fecha||'').localeCompare(a.fecha||''));
  const year = new Date().getFullYear();
  const totalGasto = v.mantenimientos.reduce((s,m) => s + (Number(m.coste)||0), 0);
  const gastoAnio  = v.mantenimientos
      .filter(m => (m.fecha||'').startsWith(String(year)))
      .reduce((s,m) => s + (Number(m.coste)||0), 0);
  const gastoUlt   = v.mantenimientos
      .filter(m => { const d = daysUntil(m.fecha); return d !== null && d > -365 && d <= 0; })
      .reduce((s,m) => s + (Number(m.coste)||0), 0);

  const partes = [v.marca, v.modelo].filter(Boolean).join(' ');
  const edad = v.anio ? (year - Number(v.anio)) : null;

  el.innerHTML = `
    <div class="card section">
      <div class="vehicle-head">
        <div class="vehicle-title">
          <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
            <h2>${esc(v.nombre || partes || 'Vehículo')}</h2>
            ${v.matricula ? `<span class="plate">${esc(v.matricula.toUpperCase())}</span>` : ''}
          </div>
          <div class="vehicle-meta">
            ${partes ? `<span>${esc(partes)}</span>` : ''}
            ${v.anio ? `<span class="dot"></span><span>${esc(v.anio)}${edad !== null ? ` (${edad} año${edad===1?'':'s'})` : ''}</span>` : ''}
            ${v.combustible ? `<span class="dot"></span><span>${esc(v.combustible)}</span>` : ''}
          </div>
          ${v.notas ? `<div class="vehicle-meta" style="margin-top:10px"><span>📝 ${esc(v.notas)}</span></div>` : ''}
        </div>
        <div class="km-box">
          <div class="lbl">Kilómetros</div>
          <div class="big">${num.format(Number(v.km)||0)}</div>
          <button class="btn ghost sm" id="btn-km" style="margin-top:6px">Actualizar</button>
        </div>
        <div style="display:flex;flex-direction:column;gap:8px">
          <button class="btn ghost sm" id="btn-edit-vehicle">✎ Editar</button>
          <button class="btn danger sm" id="btn-del-vehicle">🗑 Eliminar</button>
        </div>
      </div>
    </div>

    ${alerts.length ? `<div class="section">${alerts.map(a =>
        `<div class="alert ${a.level}">${a.level === 'danger' ? '⛔' : '⚠️'} <span>${esc(a.text)}</span></div>`).join('')}</div>` : ''}

    <div class="section">
      <div class="section-head"><h2>Documentos y obligaciones</h2></div>
      <div class="docs">
        ${docCard('ITV', v.itv, 30)}
        ${docCard('Seguro', v.seguro, 21)}
        ${docCard('Impuesto (IVTM)', v.impuesto, 30)}
      </div>
    </div>

    <div class="section">
      <div class="section-head"><h2>Resumen de gastos</h2></div>
      <div class="stats">
        <div class="stat"><div class="k">Gasto total</div><div class="v">${money(totalGasto)}</div></div>
        <div class="stat"><div class="k">Últimos 12 meses</div><div class="v">${money(gastoUlt)}</div></div>
        <div class="stat"><div class="k">Año ${year}</div><div class="v">${money(gastoAnio)}</div></div>
        <div class="stat"><div class="k">Intervenciones</div><div class="v">${v.mantenimientos.length}</div></div>
      </div>
    </div>

    <div class="section">
      <div class="section-head">
        <h2>Historial de mantenimiento</h2>
        <div class="spacer"></div>
        <button class="btn primary sm" id="btn-add-mant">＋ Añadir intervención</button>
      </div>
      <div class="card table-wrap">
        ${mants.length ? `
        <table>
          <thead><tr>
            <th>Tipo</th><th>Fecha</th><th>Km</th><th>Coste</th><th>Taller</th>
            <th>Próximo</th><th></th>
          </tr></thead>
          <tbody>
            ${mants.map(m => mantRow(m, v)).join('')}
          </tbody>
        </table>` : `
        <div class="empty" style="padding:44px 20px">
          <div class="emoji">🔧</div>
          <p style="margin-bottom:0">Todavía no has registrado ninguna intervención.</p>
        </div>`}
      </div>
    </div>
  `;

  document.getElementById('btn-edit-vehicle').onclick = () => openVehicleForm(v.id);
  document.getElementById('btn-del-vehicle').onclick  = () => deleteVehicle(v.id);
  document.getElementById('btn-km').onclick           = () => openKmForm(v.id);
  document.getElementById('btn-add-mant').onclick     = () => openMantForm(v.id);
  el.querySelectorAll('[data-edit-mant]').forEach(b =>
    b.onclick = () => openMantForm(v.id, b.dataset.editMant));
  el.querySelectorAll('[data-del-mant]').forEach(b =>
    b.onclick = () => deleteMant(v.id, b.dataset.delMant));
}

/* ---------- tarjeta de documento ---------- */
function docCard(nombre, iso, warnDays){
  const d = daysUntil(iso);
  let cls = 'ok', sub = '';
  if(d === null){ cls = ''; sub = 'Sin fecha'; }
  else if(d < 0){ cls = 'danger'; sub = `Vencido hace ${pluralDias(Math.abs(d))}`; }
  else if(d <= warnDays){ cls = 'warn'; sub = `Vence en ${pluralDias(d)}`; }
  else { cls = 'ok'; sub = `Quedan ${pluralDias(d)}`; }
  return `<div class="doc ${cls}"><div class="bar"></div>
    <div class="name">${nombre}</div>
    <div class="date">${fmtDate(iso)}</div>
    <div class="sub">${sub}</div>
  </div>`;
}

/* ---------- fila de mantenimiento ---------- */
function mantRow(m, v){
  let prox = '<span class="muted">—</span>';
  if(m.proximaFecha || m.proximoKm){
    const partes = [];
    if(m.proximaFecha){
      const d = daysUntil(m.proximaFecha);
      let cls = 'ok';
      if(d !== null && d < 0) cls = 'danger';
      else if(d !== null && d <= 30) cls = 'warn';
      partes.push(`<span class="badge ${cls}">${fmtDate(m.proximaFecha)}</span>`);
    }
    if(m.proximoKm){
      const rest = Number(m.proximoKm) - (Number(v.km)||0);
      let cls = 'ok';
      if(rest <= 0) cls = 'danger';
      else if(rest <= 1000) cls = 'warn';
      partes.push(`<span class="badge ${cls}">${kmFmt(m.proximoKm)}</span>`);
    }
    prox = `<div style="display:flex;gap:5px;flex-wrap:wrap">${partes.join('')}</div>`;
  }
  return `<tr>
    <td><span class="tag">${esc(m.tipo || 'Otros')}</span></td>
    <td>${fmtDate(m.fecha)}</td>
    <td>${m.km ? kmFmt(m.km) : '<span class="muted">—</span>'}</td>
    <td><strong>${m.coste ? money(m.coste) : '<span class="muted">—</span>'}</strong></td>
    <td>${m.taller ? esc(m.taller) : '<span class="muted">—</span>'}</td>
    <td>${prox}</td>
    <td>
      <div class="row-actions">
        <button class="icon-btn" title="Editar" data-edit-mant="${m.id}">✎</button>
        <button class="icon-btn" title="Eliminar" data-del-mant="${m.id}">🗑</button>
      </div>
    </td>
  </tr>`;
}

/* =========================================================
   Alertas
   ========================================================= */
function getAlerts(v){
  const out = [];
  const check = (label, iso, warnDays) => {
    const d = daysUntil(iso);
    if(d === null) return;
    if(d < 0) out.push({ level:'danger', text:`${label} vencido hace ${pluralDias(Math.abs(d))} (${fmtDate(iso)})` });
    else if(d <= warnDays) out.push({ level:'warn', text:`${label} vence en ${pluralDias(d)} — ${fmtDate(iso)}` });
  };
  check('ITV', v.itv, 30);
  check('Seguro', v.seguro, 21);
  check('Impuesto de circulación (IVTM)', v.impuesto, 30);

  (v.mantenimientos || []).forEach(m => {
    if(m.proximaFecha){
      const d = daysUntil(m.proximaFecha);
      if(d !== null && d <= 30)
        out.push({ level: d < 0 ? 'danger' : 'warn',
                   text: `${m.tipo || 'Mantenimiento'} ${d < 0 ? 'pendiente desde hace ' + pluralDias(Math.abs(d)) : 'programado en ' + pluralDias(d)}` });
    }
    if(m.proximoKm){
      const rest = Number(m.proximoKm) - (Number(v.km) || 0);
      if(rest <= 1000)
        out.push({ level: rest <= 0 ? 'danger' : 'warn',
                   text: `${m.tipo || 'Mantenimiento'} ${rest <= 0 ? 'superado por ' + kmFmt(Math.abs(rest)) : 'en ' + kmFmt(rest)}` });
    }
  });

  if(!out.length) out.push({ level:'info', text:'Todo en orden. No hay avisos próximos.' });
  return out.sort((a,b) => (a.level === 'danger' ? -1 : 1) - (b.level === 'danger' ? -1 : 1));
}

/* =========================================================
   Modal genérico
   ========================================================= */
const modalRoot = document.getElementById('modal');

function openModal(title, bodyHtml, onSubmit, submitLabel = 'Guardar'){
  modalRoot.innerHTML = `
    <div class="overlay">
      <div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}">
        <div class="modal-head">
          <h3>${esc(title)}</h3>
          <button type="button" class="icon-btn" data-close>✕</button>
        </div>
        <form id="modal-form" novalidate>
          <div class="modal-body">${bodyHtml}</div>
          <div class="modal-foot">
            <button type="button" class="btn ghost" data-close>Cancelar</button>
            <button type="submit" class="btn primary">${esc(submitLabel)}</button>
          </div>
        </form>
      </div>
    </div>`;
  const overlay = modalRoot.querySelector('.overlay');
  overlay.addEventListener('click', e => { if(e.target === overlay) closeModal(); });
  modalRoot.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', closeModal));
  modalRoot.querySelector('#modal-form').addEventListener('submit', e => {
    e.preventDefault();
    onSubmit(new FormData(e.target));
  });
  const first = modalRoot.querySelector('input,select,textarea');
  if(first) setTimeout(() => first.focus(), 40);
}
function closeModal(){ modalRoot.innerHTML = ''; }
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeModal(); });

/* =========================================================
   Formulario de vehículo
   ========================================================= */
function openVehicleForm(id){
  const v = id ? db.vehicles.find(x => x.id === id) : {};
  const esNuevo = !id;

  const body = `
    <div class="grid2">
      <label>Nombre / Apodo<input name="nombre" value="${esc(v.nombre)}" placeholder="Ej. Coche de casa" required></label>
      <label>Matrícula<input name="matricula" value="${esc(v.matricula)}" placeholder="1234 ABC" required></label>
      <label>Marca<input name="marca" value="${esc(v.marca)}" placeholder="Seat"></label>
      <label>Modelo<input name="modelo" value="${esc(v.modelo)}" placeholder="León 2.0 TDI"></label>
      <label>Año<input name="anio" type="number" min="1900" max="2100" value="${esc(v.anio)}" placeholder="2018"></label>
      <label>Combustible
        <select name="combustible">
          ${COMBUSTIBLES.map(c => `<option ${v.combustible === c ? 'selected' : ''}>${c}</option>`).join('')}
        </select>
      </label>
    </div>
    <label>Kilómetros actuales<input name="km" type="number" min="0" step="1" value="${esc(v.km)}" placeholder="125000"></label>

    <h4>Documentos y obligaciones</h4>
    <div class="grid3">
      <label>Próxima ITV<input type="date" name="itv" value="${esc(v.itv)}"></label>
      <label>Vencimiento seguro<input type="date" name="seguro" value="${esc(v.seguro)}"></label>
      <label>Impuesto (IVTM)<input type="date" name="impuesto" value="${esc(v.impuesto)}"></label>
    </div>
    <div class="hint">Turismos: primera ITV a los 4 años, cada 2 años hasta los 10 y anual a partir de ahí. El IVTM se paga normalmente entre marzo y mayo.</div>

    <label>Notas<textarea name="notas" rows="2" placeholder="Observaciones, taller habitual, etc.">${esc(v.notas)}</textarea></label>
  `;

  openModal(esNuevo ? 'Nuevo vehículo' : 'Editar vehículo', body, fd => {
    const data = {
      nombre:    (fd.get('nombre') || '').trim(),
      matricula: (fd.get('matricula') || '').trim().toUpperCase(),
      marca:     (fd.get('marca') || '').trim(),
      modelo:    (fd.get('modelo') || '').trim(),
      anio:      (fd.get('anio') || '').trim(),
      combustible: fd.get('combustible') || '',
      km:        Number(fd.get('km')) || 0,
      itv:       fd.get('itv') || '',
      seguro:    fd.get('seguro') || '',
      impuesto:  fd.get('impuesto') || '',
      notas:     (fd.get('notas') || '').trim()
    };

    if(id){
      Object.assign(v, data);
    } else {
      const nuevo = { id: uid(), ...data, mantenimientos: [] };
      db.vehicles.push(nuevo);
      db.selected = nuevo.id;
    }
    saveDB(); closeModal(); render();
  }, esNuevo ? 'Añadir vehículo' : 'Guardar cambios');
}

function deleteVehicle(id){
  const v = db.vehicles.find(x => x.id === id);
  if(!v) return;
  if(!confirm(`¿Eliminar «${v.nombre || v.matricula}» y todo su historial?\n\nEsta acción no se puede deshacer.`)) return;
  db.vehicles = db.vehicles.filter(x => x.id !== id);
  db.selected = db.vehicles[0] ? db.vehicles[0].id : null;
  saveDB(); render();
}

function openKmForm(id){
  const v = db.vehicles.find(x => x.id === id);
  if(!v) return;
  openModal('Actualizar kilómetros',
    `<label>Kilómetros actuales<input name="km" type="number" min="0" step="1" value="${esc(v.km)}" required></label>`,
    fd => {
      v.km = Number(fd.get('km')) || 0;
      saveDB(); closeModal(); render();
    }, 'Actualizar');
}

/* =========================================================
   Formulario de mantenimiento
   ========================================================= */
function openMantForm(vehicleId, mantId){
  const v = db.vehicles.find(x => x.id === vehicleId);
  if(!v) return;
  const m = mantId ? v.mantenimientos.find(x => x.id === mantId) : {};
  const esNuevo = !mantId;

  const body = `
    <div class="grid2">
      <label>Tipo de intervención
        <select name="tipo" required>
          ${TIPOS_MANT.map(t => `<option ${m.tipo === t ? 'selected' : ''}>${t}</option>`).join('')}
        </select>
      </label>
      <label>Fecha<input type="date" name="fecha" value="${esc(m.fecha || todayISO())}" required></label>
      <label>Kilómetros del vehículo<input type="number" min="0" step="1" name="km" value="${esc(m.km ?? v.km)}"></label>
      <label>Coste (€)<input type="number" min="0" step="0.01" name="coste" value="${esc(m.coste)}" placeholder="0,00"></label>
    </div>
    <label>Taller / proveedor<input name="taller" value="${esc(m.taller)}" placeholder="Ej. Talleres Pérez"></label>

    <h4>Próximo aviso (opcional)</h4>
    <div class="grid2">
      <label>Fecha próxima<input type="date" name="proximaFecha" value="${esc(m.proximaFecha)}"></label>
      <label>Km próximos<input type="number" min="0" step="1" name="proximoKm" value="${esc(m.proximoKm)}" placeholder="Ej. 135000"></label>
    </div>

    <label>Notas<textarea name="notas" rows="2" placeholder="Marca del aceite, referencia de piezas, etc.">${esc(m.notas)}</textarea></label>
  `;

  openModal(esNuevo ? 'Nueva intervención' : 'Editar intervención', body, fd => {
    const data = {
      tipo:         fd.get('tipo') || 'Otros',
      fecha:        fd.get('fecha') || '',
      km:           fd.get('km') ? Number(fd.get('km')) : '',
      coste:        fd.get('coste') ? Number(fd.get('coste')) : 0,
      taller:       (fd.get('taller') || '').trim(),
      proximaFecha: fd.get('proximaFecha') || '',
      proximoKm:    fd.get('proximoKm') ? Number(fd.get('proximoKm')) : '',
      notas:        (fd.get('notas') || '').trim()
    };

    if(mantId){
      Object.assign(m, data);
    } else {
      v.mantenimientos.push({ id: uid(), ...data });
    }

    // Si los km registrados superan los del vehículo, actualizamos
    if(data.km && Number(data.km) > (Number(v.km) || 0)) v.km = Number(data.km);

    saveDB(); closeModal(); render();
  }, esNuevo ? 'Añadir' : 'Guardar cambios');
}

function deleteMant(vehicleId, mantId){
  const v = db.vehicles.find(x => x.id === vehicleId);
  if(!v) return;
  const m = v.mantenimientos.find(x => x.id === mantId);
  if(!m) return;
  if(!confirm(`¿Eliminar la intervención «${m.tipo}» del ${fmtDate(m.fecha)}?`)) return;
  v.mantenimientos = v.mantenimientos.filter(x => x.id !== mantId);
  saveDB(); render();
}

/* =========================================================
   Exportar / Importar
   ========================================================= */
document.getElementById('btn-add-vehicle').addEventListener('click', () => openVehicleForm());

document.getElementById('btn-export').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(db, null, 2)], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `mi-garaje-${todayISO()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
});

const fileInput = document.getElementById('file-import');
document.getElementById('btn-import').addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', () => {
  const file = fileInput.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const data = JSON.parse(reader.result);
      if(!data || !Array.isArray(data.vehicles)) throw new Error('Formato no válido');
      const modo = confirm(
        'Aceptar = SUSTITUIR todos los datos actuales\n' +
        'Cancelar = FUSIONAR con los vehículos existentes'
      );
      if(modo){
        db = data;
      } else {
        const existentes = new Set(db.vehicles.map(v => v.id));
        data.vehicles.forEach(v => {
          if(existentes.has(v.id)) v.id = uid();
          if(!Array.isArray(v.mantenimientos)) v.mantenimientos = [];
          db.vehicles.push(v);
        });
      }
      if(!db.selected && db.vehicles[0]) db.selected = db.vehicles[0].id;
      saveDB(); render();
      alert('Datos importados correctamente.');
    }catch(e){
      alert('No se ha podido importar el archivo: ' + e.message);
    }
    fileInput.value = '';
  };
  reader.readAsText(file);
});

/* =========================================================
   Arranque
   ========================================================= */
render();
</script>
</body>
