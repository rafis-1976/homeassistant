<!DOCTYPE html>
<html lang="es" data-theme="claro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tiempo — Taller</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f0f4f8; --surface:#ffffff; --surface-2:#eef2f7; --border:#dde3ec;
  --text:#151922; --text-2:#6b7280; --primary:#2563eb; --primary-h:#1d4ed8;
  --primary-soft:#e8f0fe; --success:#0f9d63; --success-soft:#e3f8ee;
  --warning:#d97706; --warning-soft:#fef4e3; --danger:#dc2626; --danger-soft:#fdeaea;
  --info:#0891b2; --info-soft:#e2f6fa;
  --radius:16px; --radius-sm:10px;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.05);
  --shadow-md:0 4px 14px rgba(16,24,40,.08);
  --shadow-lg:0 20px 50px rgba(16,24,40,.22);
}
[data-theme="oscuro"]{
  --bg:#0e1117; --surface:#171b23; --surface-2:#1f242e; --border:#2a313d;
  --text:#e8ebf0; --text-2:#9aa3b2; --primary:#4d84ff; --primary-h:#3b74f0;
  --primary-soft:#1c2740; --success:#2ecc8b; --success-soft:#123326;
  --warning:#f0a742; --warning-soft:#332512; --danger:#ff6b6b; --danger-soft:#3a1c1c;
  --info:#38bcd8; --info-soft:#123038;
  --shadow:0 1px 2px rgba(0,0,0,.5); --shadow-md:0 4px 14px rgba(0,0,0,.4);
  --shadow-lg:0 20px 50px rgba(0,0,0,.6);
}
html,body{min-height:100%}
body{
  font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg); color:var(--text); font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased; transition:background .25s,color .25s;
}
input,button{font-family:inherit;font-size:14px;color:inherit}
button{cursor:pointer;border:none;background:none}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:20px}

.page{max-width:960px;margin:0 auto;padding:22px 18px 60px}

.header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:22px}
.header h1{font-size:22px;font-weight:750;letter-spacing:-.5px;display:flex;align-items:center;gap:9px}
.header h1 .icon{font-size:26px}
.header-actions{margin-left:auto;display:flex;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 15px;border-radius:var(--radius-sm);font-weight:600;font-size:13.5px;background:var(--surface-2);color:var(--text);transition:.15s;white-space:nowrap;border:1px solid transparent}
.btn:hover{filter:brightness(.96)}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--primary);color:#fff;box-shadow:0 2px 8px rgba(37,99,235,.28)}
.btn-primary:hover{background:var(--primary-h);filter:none}
.btn-ghost{background:transparent;border:1px solid var(--border)}
.btn-ghost:hover{background:var(--surface-2);filter:none}
.btn-icon{padding:8px;width:36px;height:36px;border-radius:10px;background:transparent;color:var(--text-2);font-size:17px}
.btn-icon:hover{background:var(--surface-2);color:var(--text)}

.search-bar{display:flex;gap:10px;margin-bottom:22px;flex-wrap:wrap}
.search-input-wrap{flex:1;min-width:200px;position:relative}
.search-input-wrap .ico{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text-2);font-size:15px;pointer-events:none}
.search-input-wrap input{width:100%;padding:12px 16px 12px 42px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface);outline:none;font-size:14.5px;transition:.15s;box-shadow:var(--shadow)}
.search-input-wrap input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.suggestions{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);box-shadow:var(--shadow-lg);z-index:1000;max-height:280px;overflow-y:auto;display:none}
.suggestions.open{display:block}
.suggestion{padding:11px 15px;cursor:pointer;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);transition:.12s}
.suggestion:last-child{border-bottom:none}
.suggestion:hover,.suggestion.active{background:var(--primary-soft);color:var(--primary)}
.suggestion .s-icon{font-size:16px;opacity:.7}
.suggestion .s-name{font-weight:600;font-size:14px}
.suggestion .s-region{font-size:12px;color:var(--text-2);margin-left:4px}
.suggestion .s-country{font-size:11.5px;color:var(--text-2);margin-left:auto}

.state{text-align:center;padding:60px 20px;color:var(--text-2)}
.state .em{font-size:52px;margin-bottom:14px;opacity:.6}
.state h3{font-size:17px;color:var(--text);margin-bottom:6px;font-weight:650}
.state p{font-size:13.5px;max-width:420px;margin:0 auto 18px;line-height:1.6}
.spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .9s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}

.banner-warn{background:var(--warning-soft);color:var(--warning);border:1px solid rgba(217,119,6,.25);padding:10px 14px;border-radius:var(--radius-sm);font-size:13px;margin-bottom:16px;display:flex;gap:10px;align-items:flex-start}
.banner-warn .ic{font-size:15px;flex-shrink:0}

.location-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:11px 15px;margin-bottom:20px;box-shadow:var(--shadow)}
.location-bar .loc-icon{font-size:19px}
.location-bar .loc-name{font-weight:650;font-size:15px}
.location-bar .loc-coords{font-size:12px;color:var(--text-2)}
.location-bar .loc-time{margin-left:auto;font-size:12.5px;color:var(--text-2);text-align:right}

.main-card{background:linear-gradient(135deg,var(--primary) 0%,#7c3aed 100%);border-radius:var(--radius);padding:28px 26px;color:#fff;box-shadow:0 12px 30px rgba(37,99,235,.28);margin-bottom:20px;position:relative;overflow:hidden}
.main-card::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 85% 15%,rgba(255,255,255,.18),transparent 55%);pointer-events:none}
.main-top{display:flex;align-items:flex-start;gap:20px;position:relative}
.main-temp{font-size:72px;font-weight:200;line-height:1;letter-spacing:-4px;display:flex;align-items:flex-start}
.main-temp .deg{font-size:32px;font-weight:300;margin-top:6px}
.main-icon{font-size:56px;line-height:1;filter:drop-shadow(0 2px 6px rgba(0,0,0,.15))}
.main-info{flex:1;min-width:0}
.main-desc{font-size:17px;font-weight:600;letter-spacing:-.2px}
.main-sub{font-size:13px;opacity:.85;margin-top:3px}
.main-details{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:14px;margin-top:24px;position:relative}
.main-detail{background:rgba(255,255,255,.14);backdrop-filter:blur(6px);border-radius:12px;padding:11px 13px}
.main-detail .d-label{font-size:11.5px;opacity:.85;font-weight:500;display:flex;align-items:center;gap:5px}
.main-detail .d-value{font-size:17px;font-weight:700;margin-top:3px;letter-spacing:-.3px}
.main-detail .d-sub{font-size:11px;opacity:.75;margin-top:1px}

.sun-card,.forecast-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow);margin-bottom:20px}
.sun-title,.forecast-title{font-size:14px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.sun-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.sun-item{display:flex;align-items:center;gap:10px;flex:1;min-width:120px}
.sun-item .s-icon{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:20px;background:var(--surface-2);flex-shrink:0}
.sun-item .s-label{font-size:11.5px;color:var(--text-2);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.sun-item .s-value{font-size:15.5px;font-weight:700;letter-spacing:-.2px;margin-top:1px}
.day-bar{margin-top:16px;height:10px;border-radius:10px;background:var(--surface-2);position:relative;overflow:hidden}
.day-bar .day-fill{position:absolute;top:0;bottom:0;border-radius:10px;background:linear-gradient(90deg,#fbbf24,#f97316,#8b5cf6);transition:left .5s,width .5s}
.day-bar-labels{display:flex;justify-content:space-between;font-size:11px;color:var(--text-2);margin-top:6px}

.rain-summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:20px}
.rain-stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px 16px;box-shadow:var(--shadow)}
.rain-stat .r-label{font-size:11.5px;color:var(--text-2);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.rain-stat .r-value{font-size:22px;font-weight:750;letter-spacing:-.5px;margin-top:4px}
.rain-stat .r-sub{font-size:11.5px;color:var(--text-2);margin-top:2px}

.radar-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:20px;overflow:hidden}
.radar-header{padding:16px 20px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.radar-header h3{font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px}
.radar-header .radar-status{margin-left:auto;font-size:12px;color:var(--text-2);display:flex;align-items:center;gap:6px}
.radar-header .radar-status .dot{width:8px;height:8px;border-radius:50%;background:var(--success);animation:pulse 1.6s infinite}
.radar-header .radar-status.cargando .dot{background:var(--warning)}
.radar-header .radar-status.error .dot{background:var(--danger);animation:none}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

#radar-map{width:100%;height:420px;background:var(--surface-2);position:relative}
@media(max-width:640px){#radar-map{height:300px}}

.leaflet-container{font-family:inherit;background:var(--surface-2)}
.leaflet-control-attribution{background:rgba(255,255,255,.85)!important;color:#333!important;font-size:10px!important}
[data-theme="oscuro"] .leaflet-control-attribution{background:rgba(23,27,35,.85)!important;color:#9aa3b2!important}
[data-theme="oscuro"] .leaflet-control-attribution a{color:#4d84ff!important}

/* Indicador de zoom en el mapa */
.leaflet-control-zoom-indicator{
  background:var(--surface);
  color:var(--text);
  border:1px solid var(--border);
  border-radius:8px;
  padding:6px 10px;
  font-size:12.5px;
  font-weight:600;
  font-family:inherit;
  display:flex;
  align-items:center;
  gap:6px;
  box-shadow:0 2px 8px rgba(0,0,0,.12);
  cursor:default;
  user-select:none;
  margin:10px;
}
.leaflet-control-zoom-indicator .zi-icon{font-size:12px;opacity:.7}
.leaflet-control-zoom-indicator .zi-label{color:var(--text-2);font-weight:500}
.leaflet-control-zoom-indicator .zi-value{
  color:var(--primary);
  font-weight:700;
  font-variant-numeric:tabular-nums;
  min-width:20px;
  text-align:right;
}
[data-theme="oscuro"] .leaflet-control-zoom-indicator{background:#171b23;border-color:#2a313d}
[data-theme="oscuro"] .leaflet-control-zoom-indicator .zi-value{color:#4d84ff}

.radar-controls{padding:14px 18px 16px;display:flex;flex-direction:column;gap:11px}
.radar-controls-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.radar-play{width:42px;height:42px;border-radius:12px;background:var(--primary);color:#fff;font-size:17px;display:grid;place-items:center;flex-shrink:0;box-shadow:0 2px 8px rgba(37,99,235,.28);transition:.15s}
.radar-play:hover{background:var(--primary-h)}
.radar-play:active{transform:scale(.95)}
.radar-slider-wrap{flex:1;min-width:180px}
.radar-slider{width:100%;height:6px;border-radius:6px;background:var(--surface-2);outline:none;-webkit-appearance:none;appearance:none;cursor:pointer;display:block}
.radar-slider::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:18px;height:18px;border-radius:50%;background:var(--primary);cursor:pointer;box-shadow:0 0 0 4px var(--primary-soft)}
.radar-slider::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--primary);cursor:pointer;border:none;box-shadow:0 0 0 4px var(--primary-soft)}
.radar-time{font-size:13.5px;font-weight:700;min-width:120px;text-align:right;font-variant-numeric:tabular-nums}
.radar-time .offset{font-size:11.5px;font-weight:500;color:var(--text-2);display:block;margin-top:1px}
.radar-speed{display:flex;gap:2px;background:var(--surface-2);padding:3px;border-radius:9px;flex-shrink:0}
.radar-speed button{padding:5px 10px;border-radius:6px;font-size:12px;font-weight:600;color:var(--text-2);transition:.15s}
.radar-speed button:hover{color:var(--text)}
.radar-speed button.active{background:var(--surface);color:var(--primary);box-shadow:var(--shadow)}
.radar-legend{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:11.5px;color:var(--text-2);padding-top:6px;border-top:1px solid var(--border)}
.radar-legend .legend-bar{height:10px;border-radius:6px;flex:1;min-width:120px;max-width:260px;background:linear-gradient(90deg,#a4f5fc 0%,#3bb0f7 18%,#0b46c8 35%,#3eeb2a 50%,#f7e641 65%,#f79e25 80%,#e63e30 92%,#b2146b 100%)}

.user-marker{width:18px;height:18px;border-radius:50%;background:var(--primary);border:3px solid #fff;box-shadow:0 0 0 6px rgba(37,99,235,.28);position:relative}
.user-marker::after{content:'';position:absolute;inset:-3px;border-radius:50%;background:var(--primary);animation:pulse-ring 2s infinite}
@keyframes pulse-ring{0%{transform:scale(1);opacity:.6}100%{transform:scale(2.4);opacity:0}}

.forecast-list{display:flex;flex-direction:column;gap:2px}
.forecast-day{display:flex;align-items:center;gap:14px;padding:11px 10px;border-radius:10px;transition:.12s}
.forecast-day:hover{background:var(--surface-2)}
.forecast-day .f-day{width:70px;font-weight:650;font-size:14px;flex-shrink:0}
.forecast-day .f-day small{display:block;font-size:11px;color:var(--text-2);font-weight:500}
.forecast-day .f-icon{font-size:26px;width:36px;text-align:center;flex-shrink:0}
.forecast-day .f-precip{width:60px;font-size:12.5px;color:var(--info);font-weight:600;flex-shrink:0}
.forecast-day .f-temps{flex:1;display:flex;align-items:center;gap:10px;min-width:0}
.forecast-day .f-max{font-weight:700;font-size:15px;width:40px;text-align:right}
.forecast-day .f-min{color:var(--text-2);font-size:14px;width:40px;text-align:right}
.forecast-day .f-bar{flex:1;height:6px;border-radius:6px;background:var(--surface-2);position:relative;overflow:hidden;min-width:40px;max-width:160px}
.forecast-day .f-bar-fill{position:absolute;top:0;bottom:0;border-radius:6px;background:linear-gradient(90deg,#60a5fa,#fbbf24)}

.footer{text-align:center;font-size:11.5px;color:var(--text-2);margin-top:30px;padding-top:18px;border-top:1px solid var(--border)}
.footer a{color:var(--primary);text-decoration:none}

@media(max-width:640px){
  .page{padding:16px 12px 50px}
  .header h1{font-size:19px}
  .main-card{padding:22px 18px}
  .main-temp{font-size:56px}
  .main-icon{font-size:44px}
  .main-details{grid-template-columns:1fr 1fr;gap:10px}
  .forecast-day{gap:8px;padding:9px 6px}
  .forecast-day .f-day{width:56px;font-size:13px}
  .forecast-day .f-bar{display:none}
  .radar-time{text-align:left;min-width:0}
}
</style>
</head>
<body>
<div class="page">

  <header class="header">
    <h1><span class="icon">🌤️</span> El Tiempo</h1>
    <div class="header-actions">
      <button class="btn-icon" id="btnTheme" title="Cambiar tema">🌙</button>
      <button class="btn btn-ghost" id="btnGeo">📍 Mi ubicación</button>
    </div>
  </header>

  <div class="search-bar">
    <div class="search-input-wrap">
      <span class="ico">🔍</span>
      <input id="search" placeholder="Buscar ciudad, pueblo o código postal..." autocomplete="off">
      <div class="suggestions" id="suggestions"></div>
    </div>
  </div>

  <div id="content"></div>

  <div class="radar-card" id="radar-card" style="display:none">
    <div class="radar-header">
      <h3>📡 Radar de lluvia</h3>
      <div class="radar-status" id="radar-status"><span class="dot"></span> Esperando ubicación…</div>
    </div>
    <div id="radar-map"></div>
    <div class="radar-controls">
      <div class="radar-controls-row">
        <button class="radar-play" id="radar-play" title="Reproducir / Pausar">▶</button>
        <div class="radar-slider-wrap">
          <input type="range" class="radar-slider" id="radar-slider" min="0" max="0" value="0" step="1">
        </div>
        <div class="radar-time" id="radar-time">—</div>
        <div class="radar-speed">
          <button data-v="900">×0.5</button>
          <button data-v="600" class="active">×1</button>
          <button data-v="300">×2</button>
          <button data-v="150">×4</button>
        </div>
      </div>
      <div class="radar-legend">
        <span style="font-weight:600;color:var(--text)">Intensidad</span>
        <span>Débil</span>
        <div class="legend-bar"></div>
        <span>Fuerte</span>
      </div>
    </div>
  </div>

  <div class="footer">
    Datos: <a href="https://open-meteo.com" target="_blank" rel="noopener">Open-Meteo</a> · Radar: <a href="https://www.rainviewer.com" target="_blank" rel="noopener">RainViewer</a> · Mapa: <a href="https://www.jawg.io" target="_blank" rel="noopener">JAWG Maps</a>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
(() => {
  'use strict';

  console.log('🚀 TallerPro-Tiempo: iniciando...');

  const $ = (s, r = document) => r.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const hoyISO = () => new Date().toISOString().slice(0, 10);

  /* ============================================================
     CONFIGURACIÓN DE JAWG MAPS
     ============================================================ */
  // ⚠️ SUSTITUYE ESTE TOKEN por el tuyo de https://app.jawg.io
  const JAWG_TOKEN = 'bQUll5WQyxb42bBkNkHy4ppYPX7ImVhmIh8xOMh3TPJCh5ACW8iyaGmMqJQSULfN';

  // Estilos disponibles: 'jawg-light' | 'jawg-dark' | 'jawg-sunny'
  //                     'jawg-streets' | 'jawg-terrain' | 'jawg-lagoon'
  const JAWG_ESTILO_CLARO  = 'jawg-light';
  const JAWG_ESTILO_OSCURO = 'jawg-dark';

  /* ============================================================
     FETCH RESILIENTE: timeout + reintentos con backoff
     ============================================================ */
  async function fetchResiliente(url, opciones = {}, {
    timeoutMs = 12000,
    intentos = 3,
    reintentarCodigos = [408, 425, 429, 500, 502, 503, 504]
  } = {}) {
    let ultimoError = null;
    for (let intento = 0; intento < intentos; intento++) {
      const ctrl = new AbortController();
      const tid = setTimeout(() => ctrl.abort(), timeoutMs);
      try {
        const r = await fetch(url, { ...opciones, signal: ctrl.signal });
        clearTimeout(tid);
        if (r.ok) return r;
        if (!reintentarCodigos.includes(r.status)) {
          throw new Error(`HTTP ${r.status} — el servidor rechazó la petición`);
        }
        ultimoError = new Error(`HTTP ${r.status}`);
        console.warn(`⚠️ ${url} → HTTP ${r.status}, reintentando (${intento + 1}/${intentos})…`);
      } catch (e) {
        clearTimeout(tid);
        if (e.name === 'AbortError') ultimoError = new Error('Timeout: el servidor tardó demasiado');
        else ultimoError = e;
        console.warn(`⚠️ ${url} → ${ultimoError.message}, reintentando (${intento + 1}/${intentos})…`);
      }
      if (intento < intentos - 1) {
        const espera = 500 * Math.pow(2, intento) + Math.random() * 300;
        await new Promise(res => setTimeout(res, espera));
      }
    }
    throw ultimoError || new Error('No se pudo conectar con el servidor');
  }

  /* ---------- Caché local ---------- */
  const CACHE_KEY = 'tiempo_cache_v1';
  function guardarCache(key, data) {
    try {
      const cache = JSON.parse(localStorage.getItem(CACHE_KEY) || '{}');
      cache[key] = { data, ts: Date.now() };
      const entradas = Object.entries(cache).sort((a, b) => b[1].ts - a[1].ts).slice(0, 8);
      localStorage.setItem(CACHE_KEY, JSON.stringify(Object.fromEntries(entradas)));
    } catch (e) {}
  }
  function leerCache(key, maxEdadMs = 30 * 60 * 1000) {
    try {
      const cache = JSON.parse(localStorage.getItem(CACHE_KEY) || '{}');
      const e = cache[key];
      if (!e) return null;
      if (Date.now() - e.ts > maxEdadMs) return null;
      return { data: e.data, ts: e.ts };
    } catch { return null; }
  }

  /* ---------- Estado ---------- */
  const state = {
    lat: null, lon: null,
    lugar: 'Ubicación desconocida', region: '', pais: '',
    datos: null, cargando: false, error: null,
    avisoStale: null,
    tema: localStorage.getItem('tiempo_tema') || 'claro'
  };

  const radar = {
    map: null, baseLayer: null, radarLayer: null, marcador: null,
    frames: [], index: 0, playing: false, velocidad: 600, timer: null,
    host: 'https://tilecache.rainviewer.com',
    inicializado: false, error: null
  };

  /* ---------- Tema ---------- */
  function setTema(t) {
    state.tema = t;
    localStorage.setItem('tiempo_tema', t);
    document.documentElement.dataset.theme = t;
    const b = $('#btnTheme'); if (b) b.textContent = t === 'oscuro' ? '☀️' : '🌙';
    if (radar.map) {
      radar.map.removeLayer(radar.baseLayer);
      radar.baseLayer = crearBasemap();
      radar.baseLayer.addTo(radar.map);
      radar.baseLayer.bringToBack();
    }
  }

  /* ---------- WMO ---------- */
  const WMO = {
    0:{t:'Cielo despejado',i:'☀️',n:'🌙'}, 1:{t:'Mayormente despejado',i:'🌤️',n:'🌙'},
    2:{t:'Parcialmente nublado',i:'⛅',n:'☁️'}, 3:{t:'Nublado',i:'☁️',n:'☁️'},
    45:{t:'Niebla',i:'🌫️',n:'🌫️'}, 48:{t:'Niebla con escarcha',i:'🌫️',n:'🌫️'},
    51:{t:'Llovizna ligera',i:'🌦️',n:'🌦️'}, 53:{t:'Llovizna moderada',i:'🌦️',n:'🌦️'},
    55:{t:'Llovizna densa',i:'🌧️',n:'🌧️'}, 56:{t:'Llovizna helada',i:'🌧️',n:'🌧️'},
    57:{t:'Llovizna helada densa',i:'🌧️',n:'🌧️'}, 61:{t:'Lluvia ligera',i:'🌧️',n:'🌧️'},
    63:{t:'Lluvia moderada',i:'🌧️',n:'🌧️'}, 65:{t:'Lluvia fuerte',i:'🌧️',n:'🌧️'},
    66:{t:'Lluvia helada ligera',i:'🌧️',n:'🌧️'}, 67:{t:'Lluvia helada fuerte',i:'🌧️',n:'🌧️'},
    71:{t:'Nevada ligera',i:'🌨️',n:'🌨️'}, 73:{t:'Nevada moderada',i:'🌨️',n:'🌨️'},
    75:{t:'Nevada fuerte',i:'❄️',n:'❄️'}, 77:{t:'Granizo',i:'🌨️',n:'🌨️'},
    80:{t:'Chubascos ligeros',i:'🌦️',n:'🌦️'}, 81:{t:'Chubascos moderados',i:'🌧️',n:'🌧️'},
    82:{t:'Chubascos violentos',i:'⛈️',n:'⛈️'}, 85:{t:'Chubascos de nieve',i:'🌨️',n:'🌨️'},
    86:{t:'Chubascos de nieve fuertes',i:'❄️',n:'❄️'}, 95:{t:'Tormenta',i:'⛈️',n:'⛈️'},
    96:{t:'Tormenta con granizo',i:'⛈️',n:'⛈️'}, 99:{t:'Tormenta con granizo fuerte',i:'⛈️',n:'⛈️'}
  };
  function infoTiempo(code, esDia = true) {
    const w = WMO[code] || { t:'Desconocido', i:'❓', n:'❓' };
    return { txt: w.t, icon: esDia ? w.i : (w.n || w.i) };
  }
  function dirViento(deg) {
    if (deg == null) return '—';
    const d = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSO','SO','OSO','O','ONO','NO','NNO'];
    return d[Math.round(deg / 22.5) % 16];
  }
  function fmtHora(iso) {
    if (!iso) return '—';
    try { return new Date(iso).toLocaleTimeString('es-ES', { hour:'2-digit', minute:'2-digit' }); }
    catch { return String(iso).slice(11, 16); }
  }
  function fmtDiaCorto(iso) {
    const d = new Date(iso + 'T00:00:00');
    const hoy = new Date(hoyISO() + 'T00:00:00');
    const diff = Math.round((d - hoy) / 86400000);
    if (diff === 0) return 'Hoy';
    if (diff === 1) return 'Mañana';
    return d.toLocaleDateString('es-ES', { weekday: 'short' });
  }
  function formatearDuracion(s) {
    if (!s && s !== 0) return '—';
    const h = Math.floor(s / 3600), m = Math.round((s % 3600) / 60);
    return `${h}h ${m}m`;
  }

  /* ============================================================
     GEOLOCALIZACIÓN + reverse geocoding (Nominatim)
     ============================================================ */
  function geolocalizar() {
    if (!navigator.geolocation) {
      mostrarError('Tu navegador no soporta geolocalización', 'Usa el buscador de arriba.');
      return;
    }
    console.log('📍 Pidiendo ubicación...');
    state.cargando = true; state.error = null;
    render();

    navigator.geolocation.getCurrentPosition(
      async (pos) => {
        console.log('✅ Ubicación obtenida:', pos.coords.latitude, pos.coords.longitude);
        state.lat = pos.coords.latitude;
        state.lon = pos.coords.longitude;
        await reverseGeocode(state.lat, state.lon);
        await cargarTiempo();
      },
      (err) => {
        console.warn('❌ Error de geolocalización:', err);
        state.cargando = false;
        let msg = 'No se pudo obtener tu ubicación.';
        if (err.code === 1) msg = 'Permiso denegado. Actívalo en los ajustes del navegador o busca una ciudad.';
        else if (err.code === 2) msg = 'Ubicación no disponible. Comprueba tu conexión.';
        else if (err.code === 3) msg = 'Tiempo de espera agotado. Inténtalo de nuevo.';
        mostrarError('Sin acceso a la ubicación', msg);
      },
      { enableHighAccuracy: true, timeout: 12000, maximumAge: 60000 }
    );
  }

  async function reverseGeocode(lat, lon) {
    try {
      const url = `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&zoom=10&accept-language=es`;
      const r = await fetchResiliente(url, { headers: { 'Accept': 'application/json' } }, { intentos: 2, timeoutMs: 8000 });
      const d = await r.json();
      const a = d.address || {};
      state.lugar = a.city || a.town || a.village || a.municipality || a.county || d.name || 'Tu ubicación';
      state.region = a.state || a.region || '';
      state.pais = a.country || '';
      console.log('✅ Reverse geocoding OK:', state.lugar);
    } catch (e) {
      console.warn('⚠️ Reverse geocoding falló:', e.message);
      state.lugar = 'Tu ubicación';
      state.region = '';
      state.pais = '';
    }
  }

  /* ============================================================
     BUSCADOR
     ============================================================ */
  let buscadorTimer = null, sugerenciasActuales = [], indiceSugerencia = -1;

  async function buscarCiudades(q) {
    if (!q || q.length < 2) { cerrarSugerencias(); return; }
    try {
      const url = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=6&language=es&format=json`;
      const r = await fetchResiliente(url, {}, { intentos: 2, timeoutMs: 8000 });
      const d = await r.json();
      sugerenciasActuales = d.results || [];
      renderSugerencias();
    } catch (e) { console.warn('⚠️ Búsqueda falló:', e.message); }
  }

  function renderSugerencias() {
    const cont = $('#suggestions');
    if (!sugerenciasActuales.length) { cerrarSugerencias(); return; }
    cont.innerHTML = sugerenciasActuales.map((c, i) => `
      <div class="suggestion" data-i="${i}">
        <span class="s-icon">📍</span>
        <span class="s-name">${esc(c.name)}</span>
        ${c.admin1 ? `<span class="s-region">${esc(c.admin1)}</span>` : ''}
        <span class="s-country">${esc(c.country_code || '')}</span>
      </div>`).join('');
    cont.classList.add('open');
    indiceSugerencia = -1;
    cont.querySelectorAll('.suggestion').forEach(el => {
      el.onclick = () => seleccionarSugerencia(+el.dataset.i);
    });
  }

  function seleccionarSugerencia(i) {
    const c = sugerenciasActuales[i];
    if (!c) return;
    state.lat = c.latitude; state.lon = c.longitude;
    state.lugar = c.name;
    state.region = c.admin1 || '';
    state.pais = c.country || '';
    $('#search').value = '';
    cerrarSugerencias();
    cargarTiempo();
  }

  function cerrarSugerencias() {
    const c = $('#suggestions');
    if (c) { c.classList.remove('open'); c.innerHTML = ''; }
    indiceSugerencia = -1;
  }

  /* ============================================================
     CARGA DEL TIEMPO
     ============================================================ */
  async function cargarTiempo() {
    if (state.lat == null || state.lon == null) return;
    state.cargando = true; state.error = null; state.avisoStale = null;
    render();

    const cacheKey = `tiempo_${state.lat.toFixed(2)}_${state.lon.toFixed(2)}`;

    try {
      console.log('🌤️ Cargando tiempo para', state.lat, state.lon);
      const params = new URLSearchParams({
        latitude: state.lat,
        longitude: state.lon,
        current: 'temperature_2m,relative_humidity_2m,apparent_temperature,is_day,precipitation,rain,weather_code,cloud_cover,pressure_msl,wind_speed_10m,wind_direction_10m,wind_gusts_10m',
        daily: 'weather_code,temperature_2m_max,temperature_2m_min,apparent_temperature_max,apparent_temperature_min,sunrise,sunset,daylight_duration,sunshine_duration,uv_index_max,precipitation_sum,precipitation_probability_max,wind_speed_10m_max,wind_gusts_10m_max,wind_direction_10m_dominant',
        timezone: 'auto',
        forecast_days: '7'
      });
      const r = await fetchResiliente(`https://api.open-meteo.com/v1/forecast?${params}`);
      const data = await r.json();

      state.datos = data;
      state.cargando = false;
      guardarCache(cacheKey, data);
      console.log('✅ Tiempo cargado');
      render();
      mostrarRadarYArrancar();
    } catch (e) {
      console.error('❌ Error cargando tiempo:', e);
      const cache = leerCache(cacheKey, 6 * 60 * 60 * 1000);
      if (cache) {
        console.warn('📦 Usando caché antigua');
        state.datos = cache.data;
        state.cargando = false;
        state.avisoStale = `Sin conexión con el servicio meteorológico. Mostrando datos de ${new Date(cache.ts).toLocaleString('es-ES', { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' })}.`;
        render();
        mostrarRadarYArrancar();
      } else {
        state.cargando = false;
        state.error = e.message || 'Error desconocido';
        render();
      }
    }
  }

  /* ============================================================
     MAPA BASE — JAWG Maps
     ============================================================ */
  function crearBasemap() {
    const estilo = state.tema === 'oscuro' ? JAWG_ESTILO_OSCURO : JAWG_ESTILO_CLARO;
    return L.tileLayer(
      `https://tile.jawg.io/${estilo}/{z}/{x}/{y}{r}.png?access-token=${JAWG_TOKEN}`,
      {
        attribution: '&copy; <a href="https://www.jawg.io" target="_blank">Jawg Maps</a> | &copy; <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a>',
        maxZoom: 22,
        maxNativeZoom: 22,
        crossOrigin: true
      }
    );
  }

  /* ============================================================
     RADAR
     ============================================================ */
  function mostrarRadarYArrancar() {
    const card = $('#radar-card');
    if (!card) return;
    card.style.display = '';

    if (typeof L === 'undefined') {
      const st = $('#radar-status');
      if (st) { st.className = 'radar-status error'; st.innerHTML = '<span class="dot"></span> Mapa no disponible'; }
      return;
    }

    if (radar.inicializado) {
      radar.map.setView([state.lat, state.lon], radar.map.getZoom() || 8);
      actualizarMarcador();
      try { radar.map.invalidateSize(); } catch {}
      if (!radar.frames.length) {
        cargarFramesRadar().then(() => {
          if (radar.frames.length) aplicarFotograma(radar.index || 0);
        });
      }
      return;
    }

    try {
      console.log('🗺️ Creando mapa JAWG...');
      radar.map = L.map('radar-map', {
        center: [state.lat, state.lon],
        zoom: 8,
        minZoom: 3,
        maxZoom: 22,
        zoomControl: true,
        preferCanvas: true,
        worldCopyJump: true,
        wheelPxPerZoomLevel: 90,
        scrollWheelZoom: true,
        touchZoom: true,
        doubleClickZoom: true,
        boxZoom: true,
        keyboard: true
      });
      radar.map.setMaxZoom(22);

      radar.baseLayer = crearBasemap();
      radar.baseLayer.addTo(radar.map);

      // ---- Control personalizado: indicador de zoom ----
      const ZoomIndicator = L.Control.extend({
        options: { position: 'bottomright' },
        onAdd: function () {
          const div = L.DomUtil.create('div', 'leaflet-control-zoom-indicator');
          div.title = 'Nivel de zoom actual';
          div.innerHTML = '<span class="zi-icon">🔍</span><span class="zi-label">Zoom</span><span class="zi-value" id="zoom-value">' + radar.map.getZoom() + '</span>';
          L.DomEvent.disableClickPropagation(div);
          L.DomEvent.disableScrollPropagation(div);
          return div;
        }
      });
      radar.map.addControl(new ZoomIndicator());

      // Actualizar el número al cambiar el zoom
      radar.map.on('zoomend', () => {
        const el = document.getElementById('zoom-value');
        if (el) el.textContent = radar.map.getZoom();
      });

      actualizarMarcador();
      radar.inicializado = true;

      cargarFramesRadar().then(() => {
        if (!radar.frames.length) return;
        const lastPastIdx = radar.frames
          .map((f, i) => f.tipo === 'past' ? i : -1)
          .filter(i => i >= 0).pop();
        radar.index = lastPastIdx != null ? lastPastIdx : 0;
        aplicarFotograma(radar.index);
      });

      wireRadarControles();
      setTimeout(() => { try { radar.map.invalidateSize(); } catch {} }, 200);
      window.addEventListener('resize', () => { try { radar.map && radar.map.invalidateSize(); } catch {} });
    } catch (e) {
      console.error('❌ Error creando mapa:', e);
      const st = $('#radar-status');
      if (st) { st.className = 'radar-status error'; st.innerHTML = '<span class="dot"></span> Error: ' + esc(e.message); }
    }
  }

  function actualizarMarcador() {
    if (!radar.map || state.lat == null) return;
    if (radar.marcador) radar.map.removeLayer(radar.marcador);
    const icono = L.divIcon({
      className: '',
      html: '<div class="user-marker"></div>',
      iconSize: [18, 18], iconAnchor: [9, 9]
    });
    radar.marcador = L.marker([state.lat, state.lon], { icon: icono, interactive: false }).addTo(radar.map);
  }

  async function cargarFramesRadar() {
    const st = $('#radar-status');
    if (st) { st.className = 'radar-status cargando'; st.innerHTML = '<span class="dot"></span> Cargando radar…'; }

    const cache = leerCache('radar_frames', 5 * 60 * 1000);

    try {
      let data;
      if (cache) {
        console.log('📦 Radar: usando caché reciente');
        data = cache.data;
      } else {
        console.log('📡 Descargando frames de RainViewer...');
        const r = await fetchResiliente(
          'https://api.rainviewer.com/public/weather-maps.json',
          {},
          { intentos: 3, timeoutMs: 10000 }
        );
        data = await r.json();
        guardarCache('radar_frames', data);
      }

      radar.host = data.host || 'https://tilecache.rainviewer.com';
      const past = (data.radar?.past || []).map(f => ({ time: f.time, path: f.path, tipo: 'past' }));
      const nowcast = (data.radar?.nowcast || []).map(f => ({ time: f.time, path: f.path, tipo: 'nowcast' }));
      radar.frames = [...past, ...nowcast];
      radar.error = null;

      console.log('✅ Frames cargados:', past.length, 'pasado,', nowcast.length, 'previsión');

      const slider = $('#radar-slider');
      if (slider) {
        slider.min = 0;
        slider.max = Math.max(0, radar.frames.length - 1);
      }
      if (st) {
        st.className = 'radar-status';
        st.innerHTML = '<span class="dot"></span> En vivo · ' + new Date().toLocaleTimeString('es-ES', { hour:'2-digit', minute:'2-digit' });
      }
    } catch (e) {
      console.error('❌ Error cargando frames:', e);
      radar.error = e.message;
      if (st) {
        st.className = 'radar-status error';
        st.innerHTML = '<span class="dot"></span> Radar no disponible temporalmente';
      }
    }
  }

  function aplicarFotograma(i) {
    if (!radar.map || !radar.frames.length) return;
    const f = radar.frames[i];
    if (!f) return;

    if (radar.radarLayer) {
      try { radar.map.removeLayer(radar.radarLayer); } catch {}
      radar.radarLayer = null;
    }
    const url = `${radar.host}${f.path}/256/{z}/{x}/{y}/2/1_1.png`;
    radar.radarLayer = L.tileLayer(url, { tileSize: 256, opacity: 0.75, zIndex: 10 }).addTo(radar.map);

    const el = $('#radar-time');
    if (el) {
      const fecha = new Date(f.time * 1000);
      const diffMin = Math.round((fecha - Date.now()) / 60000);
      let etiqueta;
      if (diffMin === 0) etiqueta = 'ahora mismo';
      else if (diffMin > 0) etiqueta = `dentro de ${diffMin} min`;
      else etiqueta = `hace ${Math.abs(diffMin)} min`;
      const pref = f.tipo === 'nowcast' ? ' · previsión' : '';
      el.innerHTML = `${fecha.toLocaleTimeString('es-ES', { hour:'2-digit', minute:'2-digit' })}<span class="offset">${etiqueta}${pref}</span>`;
    }
    const slider = $('#radar-slider');
    if (slider) slider.value = radar.index;
  }

  function playRadar() {
    if (radar.playing || !radar.frames.length) return;
    radar.playing = true; actualizarBotonPlay();
    const paso = () => {
      if (!radar.playing) return;
      radar.index = (radar.index + 1) % radar.frames.length;
      aplicarFotograma(radar.index);
      radar.timer = setTimeout(paso, radar.velocidad);
    };
    paso();
  }
  function pauseRadar() {
    radar.playing = false; clearTimeout(radar.timer); actualizarBotonPlay();
  }
  function actualizarBotonPlay() {
    const b = $('#radar-play');
    if (b) b.textContent = radar.playing ? '⏸' : '▶';
  }
  function wireRadarControles() {
    const slider = $('#radar-slider');
    const play = $('#radar-play');
    const speeds = document.querySelectorAll('.radar-speed button');
    if (slider) slider.oninput = (e) => {
      pauseRadar();
      radar.index = parseInt(e.target.value, 10);
      aplicarFotograma(radar.index);
    };
    if (play) play.onclick = () => { radar.playing ? pauseRadar() : playRadar(); };
    speeds.forEach(b => b.onclick = () => {
      speeds.forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      radar.velocidad = parseInt(b.dataset.v, 10);
      if (radar.playing) { pauseRadar(); playRadar(); }
    });
  }

  /* ============================================================
     RENDER
     ============================================================ */
  function render() {
    const cont = $('#content');

    if (state.cargando && !state.datos) {
      cont.innerHTML = `<div class="state"><div class="spinner"></div><h3>Cargando el tiempo…</h3><p>Consultando datos para ${esc(state.lugar)}.</p></div>`;
      return;
    }
    if (state.error) {
      const esRed = /503|502|504|timeout|Failed to fetch|NetworkError/i.test(state.error);
      cont.innerHTML = `
        <div class="state">
          <div class="em">${esRed ? '📡' : '⚠️'}</div>
          <h3>${esRed ? 'Servicio no disponible' : 'Error'}</h3>
          <p>${esRed ? 'El servidor meteorológico está saturado en este momento. Vuelve a intentarlo en unos segundos.' : esc(state.error)}</p>
          <button class="btn btn-primary" onclick="location.reload()">Reintentar</button>
        </div>`;
      return;
    }
    if (!state.datos) {
      cont.innerHTML = `<div class="state"><div class="em">🌍</div><h3>¿Dónde quieres ver el tiempo?</h3><p>Pulsa <b>📍 Mi ubicación</b> o escribe una ciudad en el buscador.</p></div>`;
      return;
    }

    const d = state.datos;
    const cur = d.current;
    const daily = d.daily;
    const esDia = cur.is_day === 1;
    const tiempo = infoTiempo(cur.weather_code, esDia);

    const sunrise = daily.sunrise?.[0], sunset = daily.sunset?.[0];
    const daylight = daily.daylight_duration?.[0], sunshine = daily.sunshine_duration?.[0];

    let barLeft = 0, barWidth = 0;
    if (sunrise && sunset) {
      const ahora = new Date(), sr = new Date(sunrise), ss = new Date(sunset);
      const total = ss - sr;
      const transcurrido = Math.max(0, Math.min(total, ahora - sr));
      barLeft = (transcurrido / total) * 100;
      barWidth = esDia ? Math.min(100 - barLeft, 100) : 0;
    }

    const lluviaSemana = (daily.precipitation_sum || []).reduce((s, x) => s + (x || 0), 0);
    const diasConLluvia = (daily.precipitation_sum || []).filter(x => x > 0.5).length;
    const probMaxSemana = Math.max(...(daily.precipitation_probability_max || [0]));
    const tempMaxGlobal = Math.max(...(daily.temperature_2m_max || [0]));
    const tempMinGlobal = Math.min(...(daily.temperature_2m_min || [0]));
    const rangoTemp = Math.max(1, tempMaxGlobal - tempMinGlobal);

    const avisoHtml = state.avisoStale
      ? `<div class="banner-warn"><span class="ic">⚠️</span><div>${esc(state.avisoStale)}</div></div>`
      : '';

    cont.innerHTML = `
      ${avisoHtml}
      <div class="location-bar">
        <span class="loc-icon">📍</span>
        <div>
          <div class="loc-name">${esc(state.lugar)}</div>
          <div class="loc-coords">${esc(state.region)}${state.region && state.pais ? ' · ' : ''}${esc(state.pais)} &nbsp;·&nbsp; ${state.lat.toFixed(3)}, ${state.lon.toFixed(3)}</div>
        </div>
        <div class="loc-time">
          <div style="font-weight:600;color:var(--text)">${new Date().toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'})}</div>
          <div>${new Date().toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'})}</div>
        </div>
      </div>

      <div class="main-card">
        <div class="main-top">
          <div class="main-temp">${Math.round(cur.temperature_2m)}<span class="deg">°C</span></div>
          <div class="main-icon">${tiempo.icon}</div>
          <div class="main-info">
            <div class="main-desc">${esc(tiempo.txt)}</div>
            <div class="main-sub">Sensación ${Math.round(cur.apparent_temperature)}° · Máx ${Math.round(daily.temperature_2m_max[0])}° / Mín ${Math.round(daily.temperature_2m_min[0])}°</div>
          </div>
        </div>
        <div class="main-details">
          <div class="main-detail"><div class="d-label">💧 Humedad</div><div class="d-value">${cur.relative_humidity_2m}%</div></div>
          <div class="main-detail"><div class="d-label">💨 Viento</div><div class="d-value">${Math.round(cur.wind_speed_10m)} <span style="font-size:12px;font-weight:500">km/h</span></div><div class="d-sub">${dirViento(cur.wind_direction_10m)} · rachas ${Math.round(cur.wind_gusts_10m)} km/h</div></div>
          <div class="main-detail"><div class="d-label">🌧️ Lluvia ahora</div><div class="d-value">${(cur.precipitation||0).toFixed(1)} <span style="font-size:12px;font-weight:500">mm</span></div></div>
          <div class="main-detail"><div class="d-label">☁️ Nubes</div><div class="d-value">${cur.cloud_cover ?? '—'}%</div></div>
          <div class="main-detail"><div class="d-label">🌡️ Presión</div><div class="d-value">${Math.round(cur.pressure_msl)} <span style="font-size:12px;font-weight:500">hPa</span></div></div>
          <div class="main-detail"><div class="d-label">🔆 UV máx</div><div class="d-value">${daily.uv_index_max?.[0] ?? '—'}</div></div>
        </div>
      </div>

      <div class="sun-card">
        <div class="sun-title">☀️ El sol hoy</div>
        <div class="sun-row">
          <div class="sun-item"><div class="s-icon">🌅</div><div><div class="s-label">Amanecer</div><div class="s-value">${fmtHora(sunrise)}</div></div></div>
          <div class="sun-item"><div class="s-icon">🌇</div><div><div class="s-label">Atardecer</div><div class="s-value">${fmtHora(sunset)}</div></div></div>
          <div class="sun-item"><div class="s-icon">⏱️</div><div><div class="s-label">Duración día</div><div class="s-value">${formatearDuracion(daylight)}</div></div></div>
          <div class="sun-item"><div class="s-icon">☀️</div><div><div class="s-label">Sol directo</div><div class="s-value">${formatearDuracion(sunshine)}</div></div></div>
        </div>
        ${sunrise && sunset ? `
        <div class="day-bar"><div class="day-fill" style="left:${barLeft}%;width:${barWidth}%"></div></div>
        <div class="day-bar-labels"><span>${fmtHora(sunrise)}</span><span>${fmtHora(sunset)}</span></div>` : ''}
      </div>

      <div class="rain-summary">
        <div class="rain-stat">
          <div class="r-label">🌧️ Lluvia esta semana</div>
          <div class="r-value">${lluviaSemana.toFixed(1)} <span style="font-size:14px;font-weight:500">mm</span></div>
          <div class="r-sub">${diasConLluvia} día${diasConLluvia !== 1 ? 's' : ''} con lluvia</div>
        </div>
        <div class="rain-stat">
          <div class="r-label">📊 Probabilidad máx</div>
          <div class="r-value">${probMaxSemana}%</div>
          <div class="r-sub">en los próximos 7 días</div>
        </div>
      </div>

      <div class="forecast-card">
        <div class="forecast-title">📅 Previsión para 7 días</div>
        <div class="forecast-list">
          ${(daily.time || []).map((fecha, i) => {
            const info = infoTiempo(daily.weather_code[i], true);
            const tMax = daily.temperature_2m_max[i], tMin = daily.temperature_2m_min[i];
            const prob = daily.precipitation_probability_max[i] || 0;
            const esHoy = i === 0;
            const leftPct = ((tMin - tempMinGlobal) / rangoTemp) * 100;
            const widthPct = ((tMax - tMin) / rangoTemp) * 100;
            return `
              <div class="forecast-day" ${esHoy ? 'style="background:var(--primary-soft)"' : ''}>
                <div class="f-day">${fmtDiaCorto(fecha)}<small>${new Date(fecha + 'T00:00:00').toLocaleDateString('es-ES',{day:'numeric',month:'short'})}</small></div>
                <div class="f-icon" title="${esc(info.txt)}">${info.icon}</div>
                <div class="f-precip">${prob > 0 ? `💧 ${prob}%` : '<span style="opacity:.3">—</span>'}</div>
                <div class="f-temps">
                  <span class="f-min">${Math.round(tMin)}°</span>
                  <div class="f-bar"><div class="f-bar-fill" style="left:${leftPct}%;width:${Math.max(6, widthPct)}%"></div></div>
                  <span class="f-max">${Math.round(tMax)}°</span>
                </div>
              </div>`;
          }).join('')}
        </div>
      </div>
    `;
  }

  function mostrarError(titulo, msg) {
    state.cargando = false; state.error = msg;
    $('#content').innerHTML = `<div class="state"><div class="em">⚠️</div><h3>${esc(titulo)}</h3><p>${esc(msg)}</p><button class="btn btn-primary" onclick="location.reload()">Reintentar</button></div>`;
  }

  /* ---------- Wiring ---------- */
  function wire() {
    $('#btnTheme').onclick = () => setTema(state.tema === 'oscuro' ? 'claro' : 'oscuro');
    $('#btnGeo').onclick = () => geolocalizar();

    const input = $('#search');
    input.addEventListener('input', () => {
      clearTimeout(buscadorTimer);
      buscadorTimer = setTimeout(() => buscarCiudades(input.value.trim()), 280);
    });
    input.addEventListener('keydown', (e) => {
      const items = document.querySelectorAll('.suggestion');
      if (!items.length) return;
      if (e.key === 'ArrowDown') {
        e.preventDefault();
        indiceSugerencia = Math.min(indiceSugerencia + 1, items.length - 1);
        items.forEach((el, i) => el.classList.toggle('active', i === indiceSugerencia));
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        indiceSugerencia = Math.max(indiceSugerencia - 1, 0);
        items.forEach((el, i) => el.classList.toggle('active', i === indiceSugerencia));
      } else if (e.key === 'Enter') {
        e.preventDefault();
        if (indiceSugerencia >= 0) seleccionarSugerencia(indiceSugerencia);
        else if (sugerenciasActuales.length) seleccionarSugerencia(0);
      } else if (e.key === 'Escape') cerrarSugerencias();
    });
    input.addEventListener('blur', () => setTimeout(cerrarSugerencias, 200));
    document.addEventListener('click', (e) => {
      if (!e.target.closest('.search-input-wrap')) cerrarSugerencias();
    });
    document.addEventListener('visibilitychange', () => {
      if (document.hidden && radar.playing) pauseRadar();
    });
  }

  /* ---------- Init ---------- */
  function init() {
    setTema(state.tema);
    wire();
    render();

    // Aviso si el token de JAWG no se ha sustituido
    if (JAWG_TOKEN === 'TU_ACCESS_TOKEN_AQUI') {
      console.warn('⚠️ JAWG: no has configurado tu token. El mapa no cargará.');
    } else {
      console.log('✅ JAWG: token configurado');
    }

    if (typeof L === 'undefined') console.warn('⚠️ Leaflet no cargó');
    else console.log('✅ Leaflet cargado');

    if (navigator.geolocation) {
      setTimeout(() => {
        console.log('🎬 Geolocalización automática...');
        geolocalizar();
      }, 300);
    } else {
      mostrarError('Sin geolocalización', 'Tu navegador no soporta geolocalización. Usa el buscador.');
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
