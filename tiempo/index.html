<!DOCTYPE html>
<html lang="es" data-theme="claro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tiempo — Taller</title>

<!-- Leaflet CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

<style>
/* ============ RESET & VARIABLES ============ */
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f0f4f8; --surface:#ffffff; --surface-2:#eef2f7; --border:#dde3ec;
  --text:#151922; --text-2:#6b7280; --primary:#2563eb; --primary-h:#1d4ed8;
  --primary-soft:#e8f0fe; --success:#0f9d63; --success-soft:#e3f8ee;
  --warning:#d97706; --warning-soft:#fef4e3; --danger:#dc2626; --danger-soft:#fdeaea;
  --info:#0891b2; --info-soft:#e2f6fa;
  --radius:16px; --radius-sm:10px;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.05);
  --shadow-md:0 4px 14px rgba(16,24,40,.08);
  --shadow-lg:0 20px 50px rgba(16,24,40,.22);
}
[data-theme="oscuro"]{
  --bg:#0e1117; --surface:#171b23; --surface-2:#1f242e; --border:#2a313d;
  --text:#e8ebf0; --text-2:#9aa3b2; --primary:#4d84ff; --primary-h:#3b74f0;
  --primary-soft:#1c2740; --success:#2ecc8b; --success-soft:#123326;
  --warning:#f0a742; --warning-soft:#332512; --danger:#ff6b6b; --danger-soft:#3a1c1c;
  --info:#38bcd8; --info-soft:#123038;
}
html,body{min-height:100%}
body{
  font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg); color:var(--text); font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased; transition:background .25s,color .25s;
}
input,button{font-family:inherit;font-size:14px;color:inherit}
button{cursor:pointer;border:none;background:none}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:20px}

/* ============ LAYOUT ============ */
.page{max-width:960px;margin:0 auto;padding:22px 18px 60px}

.header{
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  margin-bottom:22px;
}
.header h1{
  font-size:22px;font-weight:750;letter-spacing:-.5px;
  display:flex;align-items:center;gap:9px;
}
.header h1 .icon{font-size:26px}
.header-actions{margin-left:auto;display:flex;gap:8px;align-items:center}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:9px 15px;border-radius:var(--radius-sm);font-weight:600;font-size:13.5px;
  background:var(--surface-2);color:var(--text);transition:.15s;white-space:nowrap;
  border:1px solid transparent;
}
.btn:hover{filter:brightness(.96)}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--primary);color:#fff;box-shadow:0 2px 8px rgba(37,99,235,.28)}
.btn-primary:hover{background:var(--primary-h);filter:none}
.btn-ghost{background:transparent;border:1px solid var(--border)}
.btn-ghost:hover{background:var(--surface-2);filter:none}
.btn-sm{padding:6px 10px;font-size:12.5px;border-radius:8px}
.btn-icon{padding:8px;width:36px;height:36px;border-radius:10px;background:transparent;color:var(--text-2);font-size:17px}
.btn-icon:hover{background:var(--surface-2);color:var(--text)}

/* ============ BARRA DE BÚSQUEDA ============ */
.search-bar{display:flex;gap:10px;margin-bottom:22px;flex-wrap:wrap}
.search-input-wrap{flex:1;min-width:200px;position:relative}
.search-input-wrap .ico{
  position:absolute;left:14px;top:50%;transform:translateY(-50%);
  color:var(--text-2);font-size:15px;pointer-events:none;
}
.search-input-wrap input{
  width:100%;padding:12px 16px 12px 42px;border-radius:var(--radius-sm);
  border:1px solid var(--border);background:var(--surface);outline:none;
  font-size:14.5px;transition:.15s;box-shadow:var(--shadow);
}
.search-input-wrap input:focus{
  border-color:var(--primary);
  box-shadow:0 0 0 3px var(--primary-soft);
}
.suggestions{
  position:absolute;top:calc(100% + 6px);left:0;right:0;
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);
  box-shadow:var(--shadow-lg);z-index:1000;max-height:280px;overflow-y:auto;
  display:none;
}
.suggestions.open{display:block}
.suggestion{
  padding:11px 15px;cursor:pointer;display:flex;align-items:center;gap:10px;
  border-bottom:1px solid var(--border);transition:.12s;
}
.suggestion:last-child{border-bottom:none}
.suggestion:hover,.suggestion.active{background:var(--primary-soft);color:var(--primary)}
.suggestion .s-icon{font-size:16px;opacity:.7}
.suggestion .s-name{font-weight:600;font-size:14px}
.suggestion .s-region{font-size:12px;color:var(--text-2);margin-left:4px}
.suggestion .s-country{font-size:11.5px;color:var(--text-2);margin-left:auto}

/* ============ ESTADOS ============ */
.state{text-align:center;padding:60px 20px;color:var(--text-2)}
.state .em{font-size:52px;margin-bottom:14px;opacity:.6}
.state h3{font-size:17px;color:var(--text);margin-bottom:6px;font-weight:650}
.state p{font-size:13.5px;max-width:400px;margin:0 auto 18px;line-height:1.6}
.spinner{
  width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--primary);
  border-radius:50%;animation:spin .9s linear infinite;margin:0 auto 16px;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ============ UBICACIÓN ============ */
.location-bar{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:11px 15px;margin-bottom:20px;box-shadow:var(--shadow);
}
.location-bar .loc-icon{font-size:19px}
.location-bar .loc-name{font-weight:650;font-size:15px}
.location-bar .loc-coords{font-size:12px;color:var(--text-2)}
.location-bar .loc-time{margin-left:auto;font-size:12.5px;color:var(--text-2);text-align:right}

/* ============ TARJETA PRINCIPAL ============ */
.main-card{
  background:linear-gradient(135deg, var(--primary) 0%, #7c3aed 100%);
  border-radius:var(--radius);padding:28px 26px;color:#fff;
  box-shadow:0 12px 30px rgba(37,99,235,.28);margin-bottom:20px;
  position:relative;overflow:hidden;
}
.main-card::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(circle at 85% 15%, rgba(255,255,255,.18), transparent 55%);
  pointer-events:none;
}
.main-top{display:flex;align-items:flex-start;gap:20px;position:relative}
.main-temp{
  font-size:72px;font-weight:200;line-height:1;letter-spacing:-4px;
  display:flex;align-items:flex-start;
}
.main-temp .deg{font-size:32px;font-weight:300;margin-top:6px}
.main-icon{font-size:56px;line-height:1;filter:drop-shadow(0 2px 6px rgba(0,0,0,.15))}
.main-info{flex:1;min-width:0}
.main-desc{font-size:17px;font-weight:600;letter-spacing:-.2px}
.main-sub{font-size:13px;opacity:.85;margin-top:3px}
.main-details{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
  gap:14px;margin-top:24px;position:relative;
}
.main-detail{
  background:rgba(255,255,255,.14);backdrop-filter:blur(6px);
  border-radius:12px;padding:11px 13px;
}
.main-detail .d-label{font-size:11.5px;opacity:.85;font-weight:500;display:flex;align-items:center;gap:5px}
.main-detail .d-value{font-size:17px;font-weight:700;margin-top:3px;letter-spacing:-.3px}
.main-detail .d-sub{font-size:11px;opacity:.75;margin-top:1px}

/* ============ SOL ============ */
.sun-card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:18px 20px;box-shadow:var(--shadow);margin-bottom:20px;
}
.sun-title{
  font-size:14px;font-weight:700;margin-bottom:16px;
  display:flex;align-items:center;gap:8px;
}
.sun-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.sun-item{display:flex;align-items:center;gap:10px;flex:1;min-width:120px}
.sun-item .s-icon{
  width:42px;height:42px;border-radius:12px;display:grid;place-items:center;
  font-size:20px;background:var(--surface-2);flex-shrink:0;
}
.sun-item .s-info{min-width:0}
.sun-item .s-label{font-size:11.5px;color:var(--text-2);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.sun-item .s-value{font-size:15.5px;font-weight:700;letter-spacing:-.2px;margin-top:1px}
.day-bar{
  margin-top:16px;height:10px;border-radius:10px;background:var(--surface-2);
  position:relative;overflow:hidden;
}
.day-bar .day-fill{
  position:absolute;top:0;bottom:0;border-radius:10px;
  background:linear-gradient(90deg,#fbbf24,#f97316,#8b5cf6);
  transition:left .5s,width .5s;
}
.day-bar-labels{
  display:flex;justify-content:space-between;font-size:11px;color:var(--text-2);
  margin-top:6px;
}

/* ============ RADAR DE LLUVIA ============ */
.radar-card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow);margin-bottom:20px;overflow:hidden;
}
.radar-header{
  padding:16px 20px 14px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
}
.radar-header h3{
  font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px;
}
.radar-header .radar-status{
  margin-left:auto;font-size:12px;color:var(--text-2);
  display:flex;align-items:center;gap:6px;
}
.radar-header .radar-status .dot{
  width:8px;height:8px;border-radius:50%;background:var(--success);
  animation:pulse 1.6s infinite;
}
.radar-header .radar-status.cargando .dot{background:var(--warning)}
.radar-header .radar-status.error .dot{background:var(--danger);animation:none}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

/* Mapa */
#radar-map{
  width:100%;height:420px;background:var(--surface-2);
  position:relative;
}
@media(max-width:640px){
  #radar-map{height:320px}
}

/* Ajustes de Leaflet a nuestro tema */
.leaflet-container{font-family:inherit;background:var(--surface-2)}
[data-theme="oscuro"] .leaflet-tile-container img{
  filter: brightness(.85) contrast(1.1);
}
.leaflet-control-attribution{
  background:rgba(255,255,255,.85) !important;
  color:#333 !important;
  font-size:10px !important;
}
[data-theme="oscuro"] .leaflet-control-attribution{
  background:rgba(23,27,35,.85) !important;
  color:#9aa3b2 !important;
}
[data-theme="oscuro"] .leaflet-control-attribution a{color:#4d84ff !important}

/* Controles de animación del radar */
.radar-controls{
  padding:14px 18px 16px;
  display:flex;flex-direction:column;gap:11px;
  background:var(--surface);
}
.radar-controls-row{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
}
.radar-play{
  width:42px;height:42px;border-radius:12px;
  background:var(--primary);color:#fff;font-size:17px;
  display:grid;place-items:center;flex-shrink:0;
  box-shadow:0 2px 8px rgba(37,99,235,.28);
  transition:.15s;
}
.radar-play:hover{background:var(--primary-h)}
.radar-play:active{transform:scale(.95)}

.radar-slider-wrap{
  flex:1;min-width:180px;position:relative;
}
.radar-slider{
  width:100%;height:6px;border-radius:6px;
  background:var(--surface-2);outline:none;
  -webkit-appearance:none;appearance:none;cursor:pointer;
  display:block;
}
.radar-slider::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;
  width:18px;height:18px;border-radius:50%;
  background:var(--primary);cursor:pointer;
  box-shadow:0 0 0 4px var(--primary-soft);
  transition:transform .12s;
}
.radar-slider::-webkit-slider-thumb:hover{transform:scale(1.1)}
.radar-slider::-moz-range-thumb{
  width:18px;height:18px;border-radius:50%;
  background:var(--primary);cursor:pointer;border:none;
  box-shadow:0 0 0 4px var(--primary-soft);
}

.radar-time{
  font-size:13.5px;font-weight:700;min-width:120px;text-align:right;
  font-variant-numeric:tabular-nums;
  color:var(--text);
}
.radar-time .offset{
  font-size:11.5px;font-weight:500;color:var(--text-2);
  display:block;margin-top:1px;
}

.radar-speed{
  display:flex;gap:2px;background:var(--surface-2);padding:3px;border-radius:9px;
  flex-shrink:0;
}
.radar-speed button{
  padding:5px 10px;border-radius:6px;font-size:12px;font-weight:600;
  color:var(--text-2);transition:.15s;
}
.radar-speed button:hover{color:var(--text)}
.radar-speed button.active{
  background:var(--surface);color:var(--primary);box-shadow:var(--shadow);
}

/* Leyenda */
.radar-legend{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  font-size:11.5px;color:var(--text-2);
  padding-top:6px;border-top:1px solid var(--border);
}
.radar-legend .legend-bar{
  height:10px;border-radius:6px;flex:1;min-width:120px;max-width:260px;
  background:linear-gradient(90deg,
    #a4f5fc 0%, #3bb0f7 18%, #0b46c8 35%,
    #3eeb2a 50%, #f7e641 65%, #f79e25 80%,
    #e63e30 92%, #b2146b 100%);
}
.radar-legend .legend-label{font-weight:600;color:var(--text)}

/* Marca de "tu ubicación" en el mapa */
.user-marker{
  width:18px;height:18px;border-radius:50%;
  background:var(--primary);border:3px solid #fff;
  box-shadow:0 0 0 6px rgba(37,99,235,.28);
  position:relative;
}
.user-marker::after{
  content:'';position:absolute;inset:-3px;
  border-radius:50%;background:var(--primary);
  animation:pulse-ring 2s infinite;
}
@keyframes pulse-ring{
  0%{transform:scale(1);opacity:.6}
  100%{transform:scale(2.4);opacity:0}
}

/* ============ PREVISIÓN 7 DÍAS ============ */
.forecast-card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:18px 20px;box-shadow:var(--shadow);margin-bottom:20px;
}
.forecast-title{
  font-size:14px;font-weight:700;margin-bottom:14px;
  display:flex;align-items:center;gap:8px;
}
.forecast-list{display:flex;flex-direction:column;gap:2px}
.forecast-day{
  display:flex;align-items:center;gap:14px;padding:11px 10px;border-radius:10px;
  transition:.12s;
}
.forecast-day:hover{background:var(--surface-2)}
.forecast-day .f-day{width:70px;font-weight:650;font-size:14px;flex-shrink:0}
.forecast-day .f-day small{display:block;font-size:11px;color:var(--text-2);font-weight:500}
.forecast-day .f-icon{font-size:26px;width:36px;text-align:center;flex-shrink:0}
.forecast-day .f-precip{
  width:60px;font-size:12.5px;color:var(--info);font-weight:600;flex-shrink:0;
  display:flex;align-items:center;gap:4px;
}
.forecast-day .f-temps{flex:1;display:flex;align-items:center;gap:10px;min-width:0}
.forecast-day .f-max{font-weight:700;font-size:15px;width:40px;text-align:right}
.forecast-day .f-min{color:var(--text-2);font-size:14px;width:40px;text-align:right}
.forecast-day .f-bar{
  flex:1;height:6px;border-radius:6px;background:var(--surface-2);
  position:relative;overflow:hidden;min-width:40px;max-width:160px;
}
.forecast-day .f-bar-fill{
  position:absolute;top:0;bottom:0;border-radius:6px;
  background:linear-gradient(90deg,#60a5fa,#fbbf24);
}

/* ============ LLUVIA SEMANAL ============ */
.rain-summary{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;
  margin-bottom:20px;
}
.rain-stat{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:14px 16px;box-shadow:var(--shadow);
}
.rain-stat .r-label{
  font-size:11.5px;color:var(--text-2);font-weight:600;text-transform:uppercase;
  letter-spacing:.4px;display:flex;align-items:center;gap:5px;
}
.rain-stat .r-value{font-size:22px;font-weight:750;letter-spacing:-.5px;margin-top:4px}
.rain-stat .r-sub{font-size:11.5px;color:var(--text-2);margin-top:2px}

/* ============ FOOTER ============ */
.footer{
  text-align:center;font-size:11.5px;color:var(--text-2);margin-top:30px;
  padding-top:18px;border-top:1px solid var(--border);
}
.footer a{color:var(--primary);text-decoration:none}

/* ============ RESPONSIVE ============ */
@media(max-width:640px){
  .page{padding:16px 12px 50px}
  .header h1{font-size:19px}
  .main-card{padding:22px 18px}
  .main-temp{font-size:56px}
  .main-icon{font-size:44px}
  .main-details{grid-template-columns:1fr 1fr;gap:10px}
  .forecast-day{gap:8px;padding:9px 6px}
  .forecast-day .f-day{width:56px;font-size:13px}
  .forecast-day .f-bar{display:none}
  .sun-item .s-value{font-size:14px}
  .radar-time{text-align:left;min-width:0}
  .radar-controls-row{gap:8px}
}
</style>
</head>
<body>
<div class="page">

  <header class="header">
    <h1><span class="icon">🌤️</span> El Tiempo</h1>
    <div class="header-actions">
      <button class="btn-icon" id="btnTheme" title="Cambiar tema">🌙</button>
      <button class="btn btn-ghost" id="btnGeo">📍 Mi ubicación</button>
    </div>
  </header>

  <div class="search-bar">
    <div class="search-input-wrap">
      <span class="ico">🔍</span>
      <input id="search" placeholder="Buscar ciudad, pueblo o código postal..." autocomplete="off">
      <div class="suggestions" id="suggestions"></div>
    </div>
  </div>

  <div id="content"></div>

  <div class="footer">
    Datos meteorológicos y radar por <a href="https://open-meteo.com" target="_blank" rel="noopener">Open-Meteo</a> y <a href="https://www.rainviewer.com" target="_blank" rel="noopener">RainViewer</a> · Gratis, sin clave API
  </div>
</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

(() => {

  const hoyISO = () => new Date().toISOString().slice(0, 10);

  /* ---------- Estado ---------- */
  const state = {
    lat: null, lon: null,
    lugar: 'Ubicación desconocida',
    region: '', pais: '',
    datos: null,
    cargando: false,

    tema: localStorage.getItem('tiempo_tema') || 'claro'
  };

  /* ---------- Estado del radar ---------- */
  const radar = {
    map: null,
    baseLayer: null,
    radarLayer: null,
    frames: [],           // [{ time, path, tipo: 'past' | 'nowcast' }]
    index: 0,
    playing: false,
    velocidad: 600,       // ms por fotograma
    timer: null,
    host: 'https://tilecache.rainviewer.com',
    cargado: false,
    error: null
  };

  /* ---------- Tema ---------- */
  function setTema(t) {
    state.tema = t;
    localStorage.setItem('tiempo_tema', t);
    document.documentElement.dataset.theme = t;
    const b = $('#btnTheme');
    if (b) b.textContent = t === 'oscuro' ? '☀️' : '🌙';

    // Cambiar basemap del radar si ya está inicializado
    if (radar.map) {
      radar.map.removeLayer(radar.baseLayer);
      radar.baseLayer = crearBasemap();
      radar.baseLayer.addTo(radar.map);
      radar.baseLayer.bringToBack();
    }
  }

  /* ---------- Códigos meteorológicos WMO ---------- */
  const WMO = {
    0:{txt:'Cielo despejado',icon:'☀️',night:'🌙'},
    1:{txt:'Mayormente despejado',icon:'🌤️',night:'🌙'},
    2:{txt:'Parcialmente nublado',icon:'⛅',night:'☁️'},
    3:{txt:'Nublado',icon:'☁️',night:'☁️'},
    45:{txt:'Niebla',icon:'🌫️',night:'🌫️'},
    48:{txt:'Niebla con escarcha',icon:'🌫️',night:'🌫️'},
    51:{txt:'Llovizna ligera',icon:'🌦️',night:'🌦️'},
    53:{txt:'Llovizna moderada',icon:'🌦️',night:'🌦️'},
    55:{txt:'Llovizna densa',icon:'🌧️',night:'🌧️'},
    56:{txt:'Llovizna helada ligera',icon:'🌧️',night:'🌧️'},

  };
  function infoTiempo(code, esDia = true) {
    const w = WMO[code] || { txt: 'Desconocido', icon: '❓', night: '❓' };
    return { txt: w.txt, icon: esDia ? w.icon : (w.night || w.icon) };
  }

  function dirViento(deg) {
    if (deg == null) return '—';
    const d = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSO','SO','OSO','O','ONO','NO','NNO'];
    return d[Math.round(deg / 22.5) % 16];
  }

  function fmtHora(iso) {
    if (!iso) return '—';
    try { return new Date(iso).toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' }); }
    catch { return iso.slice(11, 16); }
  }
  function fmtDiaCorto(iso) {
    const d = new Date(iso + 'T00:00:00');
    const hoy = new Date(hoyISO() + 'T00:00:00');
    const diff = Math.round((d - hoy) / 86400000);
    if (diff === 0) return 'Hoy';
    if (diff === 1) return 'Mañana';
    return d.toLocaleDateString('es-ES', { weekday: 'short' });
  }
  function formatearDuracion(segundos) {
    if (!segundos && segundos !== 0) return '—';
    const h = Math.floor(segundos / 3600);
    const m = Math.round((segundos % 3600) / 60);
    return `${h}h ${m}m`;
  }

  /* ============================================================
     GEOLOCALIZACIÓN
     ============================================================ */
  function geolocalizar() {
    if (!navigator.geolocation) {
      mostrarError('Tu navegador no soporta geolocalización', 'Busca una ciudad manualmente usando el buscador de arriba.');
      return;
    }
    state.cargando = true;
    state.error = null;
    render();

    navigator.geolocation.getCurrentPosition(
      async (pos) => {
        state.lat = pos.coords.latitude;
        state.lon = pos.coords.longitude;
        await reverseGeocode(state.lat, state.lon);
        await cargarTiempo();
      },
      (err) => {
        state.cargando = false;
        let msg = 'No se pudo obtener tu ubicación.';
        if (err.code === 1) msg = 'Permiso de ubicación denegado. Actívalo en los ajustes del navegador o busca una ciudad manualmente.';
        else if (err.code === 2) msg = 'Ubicación no disponible. Comprueba tu conexión.';
        else if (err.code === 3) msg = 'Se agotó el tiempo de espera. Inténtalo de nuevo.';
        mostrarError('Sin acceso a la ubicación', msg + ' También puedes usar el buscador de arriba.');
      },
      { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 }
    );
  }

  async function reverseGeocode(lat, lon) {
    try {
      const r2 = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=es`);
      if (r2.ok) {
        const d = await r2.json();
        state.lugar = d.city || d.locality || d.principalSubdivision || 'Tu ubicación';
        state.region = d.principalSubdivision || '';
        state.pais = d.countryName || '';
      } else {
        state.lugar = 'Tu ubicación';
      }
    } catch {
      state.lugar = 'Tu ubicación';
    }
  }

  /* ============================================================
     BUSCADOR
     ============================================================ */
  let buscadorTimer = null;
  let sugerenciasActuales = [];
  let indiceSugerencia = -1;

  async function buscarCiudades(q) {
    if (!q || q.length < 2) { cerrarSugerencias(); return; }
    try {
      const r = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=6&language=es&format=json`);
      if (!r.ok) return;
      const d = await r.json();
      sugerenciasActuales = d.results || [];
      renderSugerencias();
    } catch (e) { console.warn(e); }
  }

  function renderSugerencias() {
    const cont = $('#suggestions');
    if (!sugerenciasActuales.length) { cerrarSugerencias(); return; }
    cont.innerHTML = sugerenciasActuales.map((c, i) => {
      return `
        <div class="suggestion" data-i="${i}">
          <span class="s-icon">📍</span>
          <span class="s-name">${esc(c.name)}</span>
          ${c.admin1 ? `<span class="s-region">${esc(c.admin1)}</span>` : ''}
          <span class="s-country">${esc(c.country_code || '')}</span>
        </div>`;
    }).join('');
    cont.classList.add('open');
    indiceSugerencia = -1;
    cont.querySelectorAll('.suggestion').forEach(el => {
      el.onclick = () => seleccionarSugerencia(+el.dataset.i);
    });
  }

  function seleccionarSugerencia(i) {
    const c = sugerenciasActuales[i];
    if (!c) return;
    state.lat = c.latitude;
    state.lon = c.longitude;
    state.lugar = c.name;
    state.region = c.admin1 || '';
    state.pais = c.country || '';
    $('#search').value = '';
    cerrarSugerencias();
    cargarTiempo();
  }

  function cerrarSugerencias() {
    const c = $('#suggestions');
    if (c) { c.classList.remove('open'); c.innerHTML = ''; }
    indiceSugerencia = -1;
  }

  /* ============================================================
     CARGA DEL TIEMPO
     ============================================================ */
  async function cargarTiempo() {
    if (state.lat == null || state.lon == null) return;
    state.cargando = true;
    state.error = null;
    render();

    try {
      const params = new URLSearchParams({
        latitude: state.lat,
        longitude: state.lon,
        current: [
          'temperature_2m','relative_humidity_2m','apparent_temperature','is_day',
          'precipitation','rain','weather_code','cloud_cover','pressure_msl',
          'wind_speed_10m','wind_direction_10m','wind_gusts_10m'
        ].join(','),
        daily: [
          'weather_code','temperature_2m_max','temperature_2m_min',
          'apparent_temperature_max','apparent_temperature_min',
          'sunrise','sunset','daylight_duration','sunshine_duration','uv_index_max',
          'precipitation_sum','rain_sum','showers_sum','snowfall_sum',
          'precipitation_hours','precipitation_probability_max',
          'wind_speed_10m_max','wind_gusts_10m_max','wind_direction_10m_dominant'
        ].join(','),
        timezone: 'auto',
        forecast_days: '7',
        temperature_unit: 'celsius',
        wind_speed_unit: 'kmh',
        precipitation_unit: 'mm'
      });

      const r = await fetch(`https://api.open-meteo.com/v1/forecast?${params}`);
      if (!r.ok) throw new Error('Error al consultar el tiempo (' + r.status + ')');
      state.datos = await r.json();
      state.cargando = false;
      render();
      // Una vez pintado el HTML, inicializar/actualizar el radar
      initRadar();
    } catch (e) {
      state.cargando = false;
      state.error = e.message || 'Error desconocido';
      render();
    }
  }

  /* ============================================================
     RADAR DE LLUVIA (RainViewer + Leaflet)
     ============================================================ */

  function crearBasemap() {
    // Usamos CARTO para que combine con el tema claro/oscuro
    if (state.tema === 'oscuro') {
      return L.tileLayer(
        'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',
        {
          attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a> &copy; <a href="https://carto.com/attributions">CARTO</a>',
          subdomains: 'abcd',
          maxZoom: 19
        }
      );
    }
    return L.tileLayer(
      'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',
      {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a> &copy; <a href="https://carto.com/attributions">CARTO</a>',
        subdomains: 'abcd',
        maxZoom: 19
      }
    );
  }

  async function initRadar() {
    const mapEl = document.getElementById('radar-map');
    if (!mapEl || state.lat == null || state.lon == null) return;

    // Si ya estaba creado, solo recentrar
    if (radar.map) {
      radar.map.setView([state.lat, state.lon], radar.map.getZoom() || 8);
      actualizarMarcadorUsuario();
      return;
    }

    // 1. Crear mapa
    radar.map = L.map('radar-map', {
      center: [state.lat, state.lon],
      zoom: 8,
      zoomControl: true,
      attributionControl: true,
      preferCanvas: true
    });

    // 2. Basemap
    radar.baseLayer = crearBasemap();
    radar.baseLayer.addTo(radar.map);

    // 3. Marcador de usuario
    actualizarMarcadorUsuario();

    // 4. Cargar frames de RainViewer
    await cargarFramesRadar();

    // 5. Pintar el fotograma actual
    aplicarFotograma(radar.index);

    // 6. Reajustar tamaño por si el contenedor cambió
    setTimeout(() => { try { radar.map.invalidateSize(); } catch {} }, 150);
  }

  let marcadorUsuario = null;
  function actualizarMarcadorUsuario() {
    if (!radar.map || state.lat == null) return;
    if (marcadorUsuario) radar.map.removeLayer(marcadorUsuario);
    const icono = L.divIcon({
      className: '',
      html: '<div class="user-marker"></div>',
      iconSize: [18, 18],
      iconAnchor: [9, 9]
    });
    marcadorUsuario = L.marker([state.lat, state.lon], { icon: icono, interactive: false })
      .addTo(radar.map);
  }

  async function cargarFramesRadar() {
    const status = document.getElementById('radar-status');
    if (status) { status.className = 'radar-status cargando'; status.innerHTML = '<span class="dot"></span> Cargando radar…'; }

    try {
      const r = await fetch('https://api.rainviewer.com/public/weather-maps.json');
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const data = await r.json();

      radar.host = data.host || 'https://tilecache.rainviewer.com';
      const past = (data.radar && data.radar.past) || [];
      const nowcast = (data.radar && data.radar.nowcast) || [];

      // Normalizar
      radar.frames = [
        ...past.map(f => ({ time: f.time, path: f.path, tipo: 'past' })),
        ...nowcast.map(f => ({ time: f.time, path: f.path, tipo: 'nowcast' }))
      ];

      // Empezar por el último fotograma del pasado (lo más reciente)
      radar.index = past.length > 0 ? past.length - 1 : 0;
      radar.cargado = true;
      radar.error = null;

      // Actualizar el slider con el rango correcto
      const slider = document.getElementById('radar-slider');
      if (slider) {
        slider.min = 0;
        slider.max = Math.max(0, radar.frames.length - 1);
        slider.value = radar.index;
      }

      if (status) {
        status.className = 'radar-status';
        const ahora = new Date();
        status.innerHTML = '<span class="dot"></span> Radar en vivo · ' + ahora.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
      }
    } catch (e) {
      console.error('Error cargando radar:', e);
      radar.error = e.message;
      if (status) {
        status.className = 'radar-status error';
        status.innerHTML = '<span class="dot"></span> Radar no disponible';
      }
    }
  }

  function aplicarFotograma(i) {
    if (!radar.map || !radar.frames.length) return;
    const f = radar.frames[i];
    if (!f) return;

    // Eliminar capa anterior
    if (radar.radarLayer) {
      try { radar.map.removeLayer(radar.radarLayer); } catch {}
    }

    // Crear nueva capa con el timestamp del fotograma
    // Formato RainViewer: /v2/radar/{time}/256/{z}/{x}/{y}/{color}/{options}.png
    // color 2 = "Universal Blue", options 1_1 = smooth + snow
    const url = `${radar.host}${f.path}/256/{z}/{x}/{y}/2/1_1.png`;
    radar.radarLayer = L.tileLayer(url, {
      tileSize: 256,
      opacity: 0.75,
      zIndex: 10,
      attribution: ''
    });
    radar.radarLayer.addTo(radar.map);

    // Actualizar UI: hora y etiqueta
    actualizarHoraRadar(f);
  }

  function actualizarHoraRadar(f) {
    const el = document.getElementById('radar-time');
    if (!el) return;

    const fecha = new Date(f.time * 1000);
    const ahora = new Date();
    const diffMin = Math.round((fecha - ahora) / 60000);

    let etiqueta;
    if (diffMin === 0) etiqueta = 'ahora mismo';
    else if (diffMin > 0) etiqueta = `dentro de ${diffMin} min`;
    else etiqueta = `hace ${Math.abs(diffMin)} min`;

    // Marcar si es previsión (nowcast)
    const prefiere = f.tipo === 'nowcast' ? ' · previsión' : '';

    el.innerHTML = `
      ${fecha.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' })}
      <span class="offset">${etiqueta}${prefiere}</span>
    `;

    // Actualizar slider
    const slider = document.getElementById('radar-slider');
    if (slider) slider.value = radar.index;
  }

  function playRadar() {
    if (radar.playing) return;
    if (!radar.frames.length) return;
    radar.playing = true;
    actualizarBotonPlay();

    const avanzar = () => {
      if (!radar.playing) return;
      radar.index = (radar.index + 1) % radar.frames.length;
      aplicarFotograma(radar.index);
      radar.timer = setTimeout(avanzar, radar.velocidad);
    };
    avanzar();
  }

  function pauseRadar() {
    radar.playing = false;
    clearTimeout(radar.timer);
    actualizarBotonPlay();
  }

  function actualizarBotonPlay() {
    const b = document.getElementById('radar-play');
    if (b) b.textContent = radar.playing ? '⏸' : '▶';
  }

      <div class="rain-summary">
        <div class="rain-stat">
          <div class="r-label">🌧️ Lluvia esta semana</div>
          <div class="r-value">${lluviaSemana.toFixed(1)} <span style="font-size:14px;font-weight:500">mm</span></div>
          <div class="r-sub">${diasConLluvia} día${diasConLluvia !== 1 ? 's' : ''} con lluvia</div>
        </div>
        <div class="rain-stat">
          <div class="r-label">📊 Probabilidad máx</div>
          <div class="r-value">${probMaxSemana}%</div>
          <div class="r-sub">en los próximos 7 días</div>
        </div>
      </div>

      <!-- PREVISIÓN 7 DÍAS -->
      <div class="forecast-card">
        <div class="forecast-title">📅 Previsión para 7 días</div>
        <div class="forecast-list">
          ${(daily.time || []).map((fecha, i) => {
            const code = daily.weather_code[i];
            const info = infoTiempo(code, true);
            const tMax = daily.temperature_2m_max[i];
            const tMin = daily.temperature_2m_min[i];
            const prob = daily.precipitation_probability_max[i] || 0;
            const esHoy = i === 0;
            const leftPct = ((tMin - tempMinGlobal) / rangoTemp) * 100;
            const widthPct = ((tMax - tMin) / rangoTemp) * 100;
            return `
              <div class="forecast-day" ${esHoy ? 'style="background:var(--primary-soft)"' : ''}>
                <div class="f-day">
                  ${fmtDiaCorto(fecha)}
                  <small>${new Date(fecha + 'T00:00:00').toLocaleDateString('es-ES', { day: 'numeric', month: 'short' })}</small>
                </div>
                <div class="f-icon" title="${esc(info.txt)}">${info.icon}</div>
                <div class="f-precip" title="Probabilidad de lluvia">
                  ${prob > 0 ? `💧 ${prob}%` : '<span style="opacity:.3">—</span>'}
                </div>
                <div class="f-temps">
                  <span class="f-min">${Math.round(tMin)}°</span>
                  <div class="f-bar">
                    <div class="f-bar-fill" style="left:${leftPct}%;width:${Math.max(6, widthPct)}%"></div>
                  </div>
                  <span class="f-max">${Math.round(tMax)}°</span>
                </div>
              </div>`;
          }).join('')}
        </div>
      </div>
    `;

    // Wiring del radar (después de que exista el DOM)
    wireRadar();
  }

  /* ============================================================
     WIRING DEL RADAR
     ============================================================ */
  function wireRadar() {
    const slider = document.getElementById('radar-slider');
    const play = document.getElementById('radar-play');
    const speeds = document.querySelectorAll('.radar-speed button');

    if (slider) {
      slider.oninput = (e) => {
        pauseRadar();
        radar.index = parseInt(e.target.value, 10);
        aplicarFotograma(radar.index);
      };
    }
    if (play) {
      play.onclick = () => { radar.playing ? pauseRadar() : playRadar(); };
    }
    speeds.forEach(b => {
      b.onclick = () => {
        speeds.forEach(x => x.classList.remove('active'));
        b.classList.add('active');
        radar.velocidad = parseInt(b.dataset.v, 10);
        if (radar.playing) { pauseRadar(); playRadar(); }
      };
    });

    // Si ya había mapa creado y ahora se cambió de ciudad,
    // recentramos y volvemos a cargar el radar.
    if (radar.map) {
      radar.map.setView([state.lat, state.lon], radar.map.getZoom() || 8);
      actualizarMarcadorUsuario();
      // Recargar solo si el mapa ya no tiene la capa radar
      if (radar.radarLayer && radar.frames.length) {
        aplicarFotograma(radar.index);
      } else {
        cargarFramesRadar().then(() => aplicarFotograma(radar.index));
      }
    } else {
      // Primera vez: lo llama initRadar() al final de render()
    }
  }

  function mostrarError(titulo, msg) {
    $('#content').innerHTML = `
      <div class="state">
        <div class="em">⚠️</div>
        <h3>${esc(titulo)}</h3>
        <p>${esc(msg)}</p>
        <button class="btn btn-primary" onclick="location.reload()">Reintentar</button>
      </div>`;
  }

  /* ============================================================
     WIRING GENERAL
     ============================================================ */
  function wire() {
    $('#btnTheme').onclick = () => setTema(state.tema === 'oscuro' ? 'claro' : 'oscuro');
    $('#btnGeo').onclick = () => geolocalizar();

    const input = $('#search');
    input.addEventListener('input', () => {
      clearTimeout(buscadorTimer);
      buscadorTimer = setTimeout(() => buscarCiudades(input.value.trim()), 280);
    });
    input.addEventListener('keydown', (e) => {
      const items = document.querySelectorAll('.suggestion');
      if (!items.length) return;
      if (e.key === 'ArrowDown') {
        e.preventDefault();
        indiceSugerencia = Math.min(indiceSugerencia + 1, items.length - 1);
        items.forEach((el, i) => el.classList.toggle('active', i === indiceSugerencia));
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        indiceSugerencia = Math.max(indiceSugerencia - 1, 0);
        items.forEach((el, i) => el.classList.toggle('active', i === indiceSugerencia));
      } else if (e.key === 'Enter') {
        e.preventDefault();
        if (indiceSugerencia >= 0) seleccionarSugerencia(indiceSugerencia);
        else if (sugerenciasActuales.length) seleccionarSugerencia(0);
      } else if (e.key === 'Escape') {
        cerrarSugerencias();
      }
    });
    input.addEventListener('blur', () => setTimeout(cerrarSugerencias, 200));
    document.addEventListener('click', (e) => {
      if (!e.target.closest('.search-input-wrap')) cerrarSugerencias();
    });

    // Pausar radar si cambiamos de pestaña
    document.addEventListener('visibilitychange', () => {
      if (document.hidden && radar.playing) pauseRadar();
    });
  }

  /* ============================================================
     INICIALIZACIÓN
     ============================================================ */
  function init() {
    setTema(state.tema);
    wire();
    render();
    if (navigator.geolocation) {
      navigator.permissions?.query({ name: 'geolocation' }).then(p => {
        if (p.state === 'granted') geolocalizar();
      }).catch(() => {});
    }
  }

  document.addEventListener('DOMContentLoaded', init);
})();
</script>
</body>
</html>
