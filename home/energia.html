  <!-- ===== GRÁFICA DETALLADA ===== -->
  <div class="section-title">Detalle de energía</div>
  <div class="card chart-det-card" style="grid-column:span 3;min-width:320px">
    <div class="card-head" style="align-items:center;flex-wrap:wrap;gap:10px">
      <div>
        <div class="card-name">Balance energético detallado</div>
        <div class="card-sub">Solar · Casa · Coche · Red (pasa el ratón para ver valores)</div>
      </div>
      <div class="range-btns">
        <button class="range-btn active" data-rango="24h" onclick="setRango('24h')">24 h</button>
        <button class="range-btn" data-rango="7d" onclick="setRango('7d')">7 días</button>
      </div>
    </div>

    <div class="chart-det-wrap">
      <div class="chart-det-svg-wrap">
        <svg id="chart-det" class="chart-det" viewBox="0 0 900 340" preserveAspectRatio="none">
          <defs>
            <linearGradient id="gDetSolar" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#ffc107" stop-opacity=".35"/>
              <stop offset="100%" stop-color="#ffc107" stop-opacity="0"/>
            </linearGradient>
          </defs>
          <g id="chart-det-grid"></g>
          <path id="det-area-solar" fill="url(#gDetSolar)"/>
          <path id="det-line-solar" class="chart-line solar"/>
          <path id="det-line-casa" class="chart-line casa"/>
          <path id="det-line-coche" class="chart-line coche"/>
          <path id="det-line-red-exp" class="chart-line red-exp"/>
          <path id="det-line-red-imp" class="chart-line red-imp"/>
          <g id="chart-det-hover" style="display:none">
            <line id="det-cross" class="crosshair"/>
            <circle id="det-dot-solar" class="hover-dot" fill="#ffc107" r="5"/>
            <circle id="det-dot-casa"  class="hover-dot" fill="#4fc3f7" r="5"/>
            <circle id="det-dot-coche" class="hover-dot" fill="#b388ff" r="5"/>
            <circle id="det-dot-red"   class="hover-dot" fill="#4caf50" r="5"/>
          </g>
        </svg>
        <div id="chart-det-tooltip" class="chart-tooltip"></div>
      </div>

      <div class="chart-det-legend">
        <span><i class="dot" style="background:#ffc107"></i> Solar</span>
        <span><i class="dot" style="background:#4fc3f7"></i> Casa</span>
        <span><i class="dot" style="background:#b388ff"></i> Coche</span>
        <span><i class="dot" style="background:#4caf50"></i> Red · export</span>
        <span><i class="dot" style="background:#ef5350"></i> Red · import</span>
      </div>

      <div class="chart-det-stats" id="chart-det-stats"></div>
    </div>
  </div>
